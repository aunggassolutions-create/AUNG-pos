<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0B1F3A">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <title>AUNG Gas Solutions POS v24</title>
  <style>
    :root {
      --navy: #0B1F3A;
      --navy-2: #15345E;
      --org: #E86A12;
      --org-soft: #FFE9D6;
      --bg: #F4F6F9;
      --card: #FFFFFF;
      --ln: #D5DBE4;
      --red: #B3261E;
      --red-bg: #FDE7E5;
      --ok: #1B7F3B;
      --ok-bg: #E3F4E8;
      --warn-bg: #FFF3E8;
      --info-bg: #E8EEF7;
      --mut: #5A6B82;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--navy);
      font-family: "Noto Sans Myanmar", "Myanmar Text", system-ui, -apple-system, sans-serif;
      line-height: 1.65;
      padding-bottom: 84px;
      overflow-x: hidden;
    }
    #splash {
      position: fixed;
      inset: 0;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity .4s ease, visibility .4s ease;
    }
    #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    header {
      background: var(--navy);
      color: #FFFFFF;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 20;
      box-shadow: 0 2px 6px rgba(11, 31, 58, .15);
    }
    header .brand { font-size: 16.5px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    header .brand span.acc { color: #FF8B38; }
    header .hdr-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .lang-btn {
      background: var(--navy-2);
      color: #FFFFFF;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 700;
      min-height: 28px;
      cursor: pointer;
    }
    #net {
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 12px;
      background: var(--ok);
      color: #fff;
      font-weight: 600;
    }
    #net.off { background: var(--org); }
    main {
      padding: 12px;
      max-width: 780px;
      margin: auto;
    }
    h2 { font-size: 16.5px; margin: 14px 0 6px; color: var(--navy); }
    .card {
      background: var(--card);
      border: 1px solid var(--ln);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(11, 31, 58, .04);
    }
    .card.kpi-box { border-left: 4px solid var(--navy); }
    .card.kpi-box.org { border-left-color: var(--org); }
    .card.kpi-box.ok { border-left-color: var(--ok); }
    .card.kpi-box.warn { border-left-color: var(--red); }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }
    @media (min-width: 640px) {
      .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .kpi-val { font-size: 16px; font-weight: 700; margin-top: 2px; word-break: break-word; }
    label { display: block; font-size: 13.5px; margin-top: 8px; font-weight: 600; color: var(--navy); }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      font: inherit;
      border: 1px solid var(--ln);
      border-radius: 8px;
      background: #FFFFFF;
      color: var(--navy);
      margin-top: 3px;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
    .row > * { flex: 1 1 130px; min-width: 0; }
    button {
      font: inherit;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--navy);
      color: #FFFFFF;
      cursor: pointer;
      min-height: 42px;
      font-weight: 600;
    }
    button.o {
      background: var(--org);
      color: #FFFFFF;
      font-weight: 700;
      width: 100%;
      margin-top: 10px;
      padding: 12px 14px;
    }
    button.g {
      background: #FFFFFF;
      color: var(--red);
      border: 1px solid var(--red);
      padding: 6px 10px;
      font-size: 13px;
      min-height: 36px;
    }
    button.n {
      background: #FFFFFF;
      color: var(--navy);
      border: 1px solid var(--navy);
      padding: 7px 11px;
      font-size: 13px;
      min-height: 36px;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .sub-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .sub-tabs button { flex: 1 1 100px; padding: 8px 6px; font-size: 12.5px; min-height: 38px; background: #E8EEF7; color: var(--navy); border: 1px solid var(--ln); }
    .sub-tabs button.on { background: var(--navy); color: #FFFFFF; border-color: var(--navy); }
    .li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--ln);
    }
    .li:last-child { border-bottom: 0; }
    .tag {
      font-size: 11.5px;
      background: var(--org-soft);
      color: #9A4308;
      border-radius: 5px;
      padding: 1px 6px;
      margin-left: 5px;
      display: inline-block;
      font-weight: 700;
    }
    .tag.b { background: var(--info-bg); color: var(--navy); }
    .tag.g { background: var(--ok-bg); color: var(--ok); }
    .tag.r { background: var(--red-bg); color: var(--red); }
    .tot { font-size: 19px; font-weight: 700; text-align: right; margin-top: 8px; color: var(--navy); }
    .void { text-decoration: line-through; opacity: .55; }
    .msg {
      padding: 10px 12px;
      border-radius: 8px;
      margin: 8px 0;
      font-size: 13.5px;
      white-space: pre-line;
      font-weight: 600;
    }
    .msg.e { background: var(--red-bg); color: var(--red); border: 1px solid #F5C2BE; }
    .msg.k { background: var(--ok-bg); color: var(--ok); border: 1px solid #B7E4C4; }
    .msg.w { background: var(--warn-bg); color: #9A4308; border: 1px solid #F7CFA8; }
    .msg.i { background: var(--info-bg); color: var(--navy); border: 1px solid #C6D5EC; }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: #FFFFFF;
      border-top: 2px solid var(--navy);
      overflow-x: auto;
      z-index: 25;
    }
    nav button {
      flex: 0 0 auto;
      min-width: 22vw;
      background: #FFFFFF;
      color: var(--navy);
      border-radius: 0;
      padding: 12px 8px;
      font-weight: 700;
      font-size: 12.5px;
      white-space: nowrap;
      min-height: 52px;
    }
    @media (min-width: 720px) {
      nav button { min-width: auto; flex: 1 1 0; }
    }
    nav button.on { background: var(--org); color: #FFFFFF; }
    small { color: var(--mut); }
    .tbl-wrap { width: 100%; overflow-x: auto; }
    .st-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
    .st-tbl th, .st-tbl td { border: 1px solid var(--ln); padding: 6px; text-align: right; }
    .st-tbl th:first-child, .st-tbl td:first-child { text-align: left; }
    .st-tbl th { background: #F4F6F9; color: var(--navy); font-weight: 700; }
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(11, 31, 58, .68);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 80;
    }
    .modal-box {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, .28);
      max-height: 90vh;
      overflow-y: auto;
    }
    #rcpt { display: none; }
    @media print {
      @page { size: 80mm auto; margin: 3mm; }
      body { background: #FFFFFF; padding: 0; }
      header, main, nav, #splash, .modal-bg { display: none !important; }
      #rcpt { display: block; width: 72mm; color: #000; line-height: 1.5; font-size: 12px; }
      #rcpt .c { text-align: center; }
      #rcpt .r { display: flex; justify-content: space-between; gap: 8px; }
      #rcpt .r.b { font-weight: 700; }
      #rcpt .r span:last-child { white-space: nowrap; }
      #rcpt .big { font-size: 1.4em; font-weight: 700; }
      #rcpt .dd { border-top: 2px dashed #000; margin: 8px 0; }
      #rcpt .ss { border-top: 3px solid #000; margin: 8px 0 4px; }
      #rcpt .it { margin: 6px 0; }
      #rcpt .nm { font-weight: 700; }
      #rcpt .tt { font-size: 1.3em; font-weight: 700; }
      #rcpt .ft { margin-top: 6px; }
    }
  </style>
</head>
<body>

  <!-- Branded Splash Screen -->
  <div id="splash">
    <svg width="260" height="125" viewBox="0 0 320 155" xmlns="http://www.w3.org/2000/svg" aria-label="AUNG Gas Solutions">
      <text x="160" y="88" text-anchor="middle" font-family="Impact,'Arial Black',system-ui,sans-serif" font-weight="900" font-size="94" letter-spacing="2" fill="#0B1F3A">AUNG</text>
      <text x="160" y="135" text-anchor="middle" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="40" letter-spacing="-0.5" fill="#E86A12">Gas Solutions</text>
    </svg>
    <small style="margin-top:6px;font-weight:700;color:#0B1F3A">POS v24 · feature/aung-pos-v24</small>
  </div>

  <!-- Top Navigation & Language Switcher -->
  <header>
    <div class="brand">
      <span>AUNG <span class="acc">Gas Solutions</span></span>
      <span class="tag b" id="roleBadge">OWNER</span>
    </div>
    <div class="hdr-right">
      <button class="lang-btn" id="langBtn" title="Switch Myanmar / English">MM / EN</button>
      <span id="net"></span>
    </div>
  </header>

  <main id="app"></main>

  <!-- 8-Tab Bottom Bar Preserving v23 Flow + P&L + Test Suite -->
  <nav>
    <button id="t1">ရောင်းချမှု</button>
    <button id="t2">ပစ္စည်းများ</button>
    <button id="t3">Gas စာရင်း</button>
    <button id="t6">Oxygen</button>
    <button id="t4">ဖောက်သည်</button>
    <button id="t7">စရိတ်/ငွေဝင်</button>
    <button id="t8">စာရင်းချုပ်</button>
    <button id="t5">ဒေတာ & Test</button>
  </nav>

  <div id="rcpt"></div>

  <script>
    setTimeout(() => {
      const sp = document.getElementById('splash');
      if (sp) sp.classList.add('hide');
    }, 850);

    // =========================================================================
    // 1. CONSTANTS, LANGUAGE DICTIONARY & DOMAIN CONFIGURATION
    // =========================================================================
    const APP_VER = 'v24.1.0-feature/aung-pos-v24';
    const DEVICE_ID = (() => {
      try {
        let id = localStorage.getItem('aung_pos_dev_id');
        if (!id) {
          id = 'dev-' + (crypto.randomUUID ? crypto.randomUUID().slice(0, 8) : Math.random().toString(36).slice(2, 10));
          localStorage.setItem('aung_pos_dev_id', id);
        }
        return id;
      } catch (e) { return 'dev-local'; }
    })();

    let lang = 'my';
    const I18N = {
      my: {
        tabs: ['ရောင်းချမှု', 'ပစ္စည်းများ', 'Gas စာရင်း', 'Oxygen', 'ဖောက်သည်', 'စရိတ်/ငွေဝင်', 'စာရင်းချုပ်', 'ဒေတာ & Test'],
        online: 'အွန်လိုင်း',
        offline: 'အော့ဖ်လိုင်း',
        lastBackup: 'နောက်ဆုံး Backup အချိန်',
        neverBackup: 'မရှိသေးပါ (Backup ဖိုင်ထုတ်ရန် လိုအပ်ပါသည်)'
      },
      en: {
        tabs: ['Sales', 'Products', 'Gas Ledger', 'Oxygen', 'Customers', 'Cash & Exp', 'Summary & P&L', 'Data & Tests'],
        online: 'Online',
        offline: 'Offline',
        lastBackup: 'Last Backup Time',
        neverBackup: 'None yet (Export recommended)'
      }
    };
    const tr = k => (I18N[lang] && I18N[lang][k]) || I18N.my[k] || k;

    const $ = s => document.querySelector(s);
    const h = (t, a = {}, ...c) => {
      const e = document.createElement(t);
      for (const k in a) {
        if (k === 'class') e.className = a[k];
        else if (k.startsWith('on')) e[k] = a[k];
        else if (a[k] !== null && a[k] !== undefined) e.setAttribute(k, a[k]);
      }
      c.flat().forEach(x => {
        if (x !== null && x !== undefined && x !== '') e.append(x);
      });
      return e;
    };
    const money = n => Math.round(Number(n) || 0).toLocaleString('en-US') + (lang === 'en' ? ' MMK' : ' ကျပ်');
    const r2 = x => Math.round((Number(x) || 0) * 100) / 100;
    const uuid = () => (crypto.randomUUID ? crypto.randomUUID() : ('id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 9)));
    const pad = n => String(n).padStart(2, '0');
    const dkey = t => {
      const d = new Date(t);
      return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    };
    const ymkey = t => dkey(t).slice(0, 7);
    const dbounds = k => {
      const [y, m, d] = k.split('-').map(Number);
      return [new Date(y, m - 1, d, 0, 0, 0, 0).getTime(), new Date(y, m - 1, d, 23, 59, 59, 999).getTime()];
    };
    const mbounds = ym => {
      const [y, m] = ym.split('-').map(Number);
      return [new Date(y, m - 1, 1, 0, 0, 0, 0).getTime(), new Date(y, m, 0, 23, 59, 59, 999).getTime()];
    };
    const daysInMonth = (y, m) => new Date(y, m, 0).getDate();
    const tm = t => new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    const sd_ = t => new Date(t).toLocaleDateString('en-GB') + ' ' + tm(t);

    // Supplier Capacities (Authoritative)
    const AGENTS = {
      'TT Gas':   { kg: 48, viss: 28.5 },
      'NGN':      { kg: 48, viss: 28.5 },
      'Easy Gas': { kg: 50, viss: 30.0 }
    };

    // Four Separate Oxygen Types (Never merged; never matched by product-name regex)
    const O2_TYPES = {
      '40L_FACTORY':  { id: '40L_FACTORY',  labelMy: '40L (စက်ရုံအိုး)',     labelEn: '40L Factory',  ownership: 'factory', defaultRate: 19500 },
      '47L_FACTORY':  { id: '47L_FACTORY',  labelMy: '47L (စက်ရုံအိုး)',     labelEn: '47L Factory',  ownership: 'factory', defaultRate: 23500 },
      '40L_OWN':      { id: '40L_OWN',      labelMy: '40L (အပိုင်)',         labelEn: '40L Shop-Own', ownership: 'shop',    defaultRate: 19500 },
      'OVER_40L_OWN': { id: 'OVER_40L_OWN', labelMy: 'Over 40L (အပိုင်)',    labelEn: 'Over 40L Own', ownership: 'shop',    defaultRate: 25000 }
    };
    const o2Label = tid => {
      const x = O2_TYPES[tid];
      return x ? (lang === 'en' ? x.labelEn : x.labelMy) : tid;
    };

    // Site & Business Payment Terms
    const SITE_TERMS = {
      'immediate':   { labelMy: 'လက်ငင်းရှင်း',       labelEn: 'Immediate' },
      'next_return': { labelMy: 'ခေါက်ပြန်ရှင်း',      labelEn: 'Next Return' },
      '15_days':     { labelMy: '၁၅ ရက်တစ်ခါရှင်း',   labelEn: 'Every 15 Days' },
      'month_end':   { labelMy: 'လကုန်ရှင်း',         labelEn: 'Month-End' }
    };
    const termLabel = k => {
      const x = SITE_TERMS[k];
      return x ? (lang === 'en' ? x.labelEn : x.labelMy) : k;
    };

    const CATS = ['LPG ဓာတ်ငွေ့', 'LPG အိုး/ဗူး', 'အောက်ဆီဂျင်', 'မီးဖို', 'Regulator/Valve', 'ဆက်စပ်ပစ္စည်း'];
    const UNITS = ['ခု', 'ဗူး', 'အိုး', 'kg', 'viss'];
    const PAY = {
      cash: 'ငွေသား (Cash)',
      kpay: 'KPay',
      wave: 'Wave Pay',
      aya: 'AyA Pay',
      credit: 'ကြွေး / Site Term',
      pending: 'COD (ပို့ပြီးငွေချေ)',
      dropoff: 'Drop-off (ထားခဲ့ဗူး/အိုး)'
    };
    const ECAT = {
      factory: 'စက်ရုံ / ကုန်ပစ္စည်းဝယ်စရိတ်',
      shop: 'ဆိုင်အသုံးစရိတ်',
      transport: 'သယ်ယူပို့ဆောင်စရိတ်',
      owner: 'အိမ်အသုံးစရိတ် / လစာ',
      savings: 'စုငွေ (Savings)',
      rent: 'ဆိုင်ခန်းလခ (Cash Rent)',
      other: 'အထွေထွေ စရိတ်'
    };
    const MTH = ['cash', 'kpay', 'wave', 'aya'];
    const STORES = ['products', 'sales', 'gasEv', 'pays', 'stk', 'cf', 'meta'];

    const SAMPLE = [
      ['Gas (ပိဿာ)', 'LPG ဓာတ်ငွေ့', 'viss', null, 'viss'],
      ['Gas ဗူးဖြည့်', 'LPG ဓာတ်ငွေ့', 'ဗူး', null, 'can'],
      ['40L O2 (စက်ရုံအိုး)', 'အောက်ဆီဂျင်', 'အိုး', '40L_FACTORY', null],
      ['47L O2 (စက်ရုံအိုး)', 'အောက်ဆီဂျင်', 'အိုး', '47L_FACTORY', null],
      ['40L O2 (အပိုင်)', 'အောက်ဆီဂျင်', 'အိုး', '40L_OWN', null],
      ['Over 40L O2 (အပိုင်)', 'အောက်ဆီဂျင်', 'အိုး', 'OVER_40L_OWN', null],
      ['EFF ဗူးသစ်', 'LPG အိုး/ဗူး', 'ဗူး', null, null],
      ['15kg (Thailand)', 'LPG အိုး/ဗူး', 'အိုး', null, null],
      ['Rinnai RI-522A', 'မီးဖို', 'ခု', null, null],
      ['YAMATO L.P.G Regulator', 'Regulator/Valve', 'ခု', null, null],
      ['YAMATO O2 Regulator', 'Regulator/Valve', 'ခု', null, null]
    ];

    // =========================================================================
    // 2. INDEXEDDB ENGINE (SCHEMA v4 PRESERVED + ISOLATED TEST DB SUPPORT)
    // =========================================================================
    let activeDbName = 'aung-gas-pos';
    let db;

    function openDb(name = activeDbName) {
      return new Promise((ok, no) => {
        const req = indexedDB.open(name, 4);
        req.onupgradeneeded = () => {
          const d = req.result;
          STORES.forEach(n => {
            if (!d.objectStoreNames.contains(n)) {
              d.createObjectStore(n, { keyPath: n === 'meta' ? 'k' : 'id' });
            }
          });
        };
        req.onsuccess = () => ok(req.result);
        req.onerror = () => no(req.error);
      });
    }

    function run(storeNames, mode, fn) {
      return new Promise((ok, no) => {
        const tx = db.transaction(storeNames, mode);
        let result;
        tx.oncomplete = () => ok(result);
        tx.onabort = () => no(tx.error || new Error('TX_ABORTED'));
        tx.onerror = () => no(tx.error || new Error('TX_ERROR'));
        try {
          result = fn(tx);
        } catch (err) {
          try { tx.abort(); } catch (e) {}
          no(err);
        }
      });
    }
    const all = s => new Promise((ok, no) => {
      const q = db.transaction(s).objectStore(s).getAll();
      q.onsuccess = () => ok(q.result || []);
      q.onerror = () => no(q.error);
    });
    const add = (s, o) => run(s, 'readwrite', t => t.objectStore(s).add(o));
    const put = (s, o) => run(s, 'readwrite', t => t.objectStore(s).put(o));

    // =========================================================================
    // 3. IN-MEMORY STATE, MODALS & PBKDF2 SECURITY / STAFF PERMISSIONS
    // =========================================================================
    let cf = [], bk = null, stk = [], rc = { head: '', foot: '', size: 3 }, pays = [], gasEv = [], metaList = [];
    let cfg = {
      usable: 28.5, cans: 7, nominal: 29.3, low: 2, lowO2: 20,
      canMin: 197, canMax: 203,
      motherCapL: 55, motherCapConfirmed: false,
      motherFillCost: 25000,
      pbkdf2Iter: 600000,
      o2Rates: { '40L_FACTORY': 19500, '47L_FACTORY': 23500, '40L_OWN': 19500, 'OVER_40L_OWN': 25000 },
      dashWidgets: { pnl: true, gas: true, o2: true, debt: true, fac: true, backup: true }
    };

    // PBKDF2-HMAC-SHA256 Crypto Helpers
    const PBKDF2_DEFAULT_ITER = 600000;
    let pinAuthInFlight = false;

    const bufToHex = buf => Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    const hexToBuf = hex => new Uint8Array((hex.match(/.{1,2}/g) || []).map(b => parseInt(b, 16)));
    const genSaltHex = () => {
      const b = new Uint8Array(16);
      crypto.getRandomValues(b);
      return bufToHex(b);
    };
    const genRecoveryCode = () => {
      const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
      const r = new Uint8Array(8);
      crypto.getRandomValues(r);
      const s = Array.from(r).map(x => chars[x % chars.length]).join('');
      return 'AUNG-' + s.slice(0, 4) + '-' + s.slice(4, 8);
    };

    async function derivePbkdf2Hex(secret, saltHex, iterations = PBKDF2_DEFAULT_ITER) {
      const enc = new TextEncoder();
      const keyMat = await crypto.subtle.importKey('raw', enc.encode(String(secret).trim()), { name: 'PBKDF2' }, false, ['deriveBits']);
      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: hexToBuf(saltHex), iterations, hash: 'SHA-256' }, keyMat, 256);
      return bufToHex(bits);
    }

    async function benchmarkPbkdf2(iters = PBKDF2_DEFAULT_ITER) {
      const salt = genSaltHex();
      const t0 = performance.now();
      await derivePbkdf2Hex('123456', salt, iters);
      return Math.round(performance.now() - t0);
    }

    async function requireOwnerPin(actionLabel) {
      if (!ownerAuth || !ownerAuth.pinHashHex) {
        const created = await setupOwnerPinModal(false);
        if (!created) return false;
      }
      return new Promise(res => {
        const bg = h('div', { class: 'modal-bg' });
        const pinIn = h('input', { type: 'password', inputmode: 'numeric', placeholder: 'Owner PIN ရိုက်ထည့်ပါ' });
        const msg = h('div');

        const checkLock = () => {
          const now = Date.now();
          if (ownerAuth.lockUntil && now < ownerAuth.lockUntil) {
            const sec = Math.ceil((ownerAuth.lockUntil - now) / 1000);
            note(msg, 'PIN မှားယွင်းမှု များနေသဖြင့် ' + sec + ' စက္ကန့် စောင့်ပါ။');
            return true;
          }
          return false;
        };
        checkLock();

        const verifyBtn = h('button', {
          class: 'o',
          onclick: async () => {
            if (pinAuthInFlight) return;
            if (checkLock()) return;
            const val = pinIn.value.trim();
            if (!val) return note(msg, 'PIN ထည့်ပါ။');
            pinAuthInFlight = true;
            verifyBtn.disabled = true;
            verifyBtn.textContent = 'Verifying...';
            try {
              const hHex = await derivePbkdf2Hex(val, ownerAuth.pinSaltHex, ownerAuth.iter || PBKDF2_DEFAULT_ITER);
              if (hHex === ownerAuth.pinHashHex) {
                await put('meta', { k: 'owner_auth', v: { ...ownerAuth, failedAttempts: 0, lockUntil: 0 } });
                await reload();
                bg.remove();
                res(true);
              } else {
                const fails = (ownerAuth.failedAttempts || 0) + 1;
                let waitMs = 0;
                if (fails === 4) waitMs = 30000;
                else if (fails === 5) waitMs = 300000;
                else if (fails >= 6) waitMs = 900000;
                const upd = { ...ownerAuth, failedAttempts: fails, lockUntil: waitMs ? Date.now() + waitMs : 0 };
                await run('meta', 'readwrite', t => {
                  t.objectStore('meta').put({ k: 'owner_auth', v: upd });
                  t.objectStore('meta').put({ k: 'pin_audit_' + uuid(), v: { eventType: 'PIN_FAIL', detail: 'fails=' + fails + ' act=' + actionLabel, at: Date.now(), deviceId: DEVICE_ID } });
                });
                await reload();
                pinIn.value = '';
                note(msg, 'PIN မှားယွင်းနေပါသည် (အကြိမ် ' + fails + ')' + (waitMs ? ' — ' + Math.round(waitMs / 1000) + 's lock' : ''));
              }
            } finally {
              pinAuthInFlight = false;
              verifyBtn.disabled = false;
              verifyBtn.textContent = 'အတည်ပြုမည်';
            }
          }
        }, 'အတည်ပြုမည်');

        const recBtn = h('button', {
          class: 'n',
          style: 'width:100%;margin-top:8px',
          onclick: async () => {
            if (pinAuthInFlight) return;
            const code = await uiPrompt('တစ်ခါသုံး Recovery Code (AUNG-XXXX-XXXX) ထည့်ပါ', '', 'text', 'AUNG-XXXX-XXXX');
            if (!code) return;
            pinAuthInFlight = true;
            try {
              const rHash = await derivePbkdf2Hex(code.trim().toUpperCase(), ownerAuth.recoverySaltHex, ownerAuth.iter || PBKDF2_DEFAULT_ITER);
              if (rHash !== ownerAuth.recoveryHashHex) {
                await logPinAudit('RECOVERY_REJECTED', 'invalid_or_used_code');
                await reload();
                return note(msg, 'Recovery Code မှားယွင်းနေပါသည် သို့မဟုတ် အသုံးပြုပြီးသား Code ဖြစ်ပါသည်။');
              }
              await logPinAudit('RECOVERY_USED_AND_ROTATED', 'one_time_code_consumed');
              await reload();
              bg.remove();
              const ok = await setupOwnerPinModal(true);
              res(ok);
            } finally {
              pinAuthInFlight = false;
            }
          }
        }, 'Recovery Code ဖြင့် PIN အသစ်ပြောင်းမည် (One-Time Use & Rotate)');

        bg.append(h('div', { class: 'modal-box' },

    async function toggleMonthLock(ym, shouldLock) {
      const pinOk = await requireOwnerPin(shouldLock ? ('Lock Month ' + ym) : ('Reopen Locked Month ' + ym));
      if (!pinOk) return false;
      const reason = ((await uiPrompt(shouldLock ? (ym + ' လပိတ် မှတ်ချက်') : (ym + ' ပြန်ဖွင့်ရသည့် အကြောင်းရင်း (မဖြစ်မနေထည့်ပါ)'))) || '').trim();

        return false;
      }
      const nextLocked = shouldLock
        ? Array.from(new Set([...lockedMonths, ym]))
        : lockedMonths.filter(x => x !== ym);
      const auditEntry = {
        id: uuid(),
        type: shouldLock ? 'period_reclose_log' : 'period_reopen_log',
        targetMonth: ym,
        ownerId: 'OWNER',
        reason: reason || (shouldLock ? 'Closed & locked' : ''),
        at: Date.now(),
        deviceId: DEVICE_ID

      await run(['meta', 'cf'], 'readwrite', t => {
        t.objectStore('meta').put({ k: 'locked_months', v: nextLocked });

      });
      await reload();
      return true;

    // =========================================================================
    // 5. SNAPSHOTS, VERIFIED BACKUP EXPORT, CANONICAL CONFLICTS & RESTORE
    // =========================================================================
    function canonicalize(v) {
      if (v === null || typeof v !== 'object') return Object.is(v, -0) ? 0 : v;
      if (Array.isArray(v)) return v.map(canonicalize);
      const out = {};
      Object.keys(v).sort().forEach(k => {
        if (v[k] !== undefined) out[k] = canonicalize(v[k]);
      });
      return out;
    }
    const canonicalJson = v => JSON.stringify(canonicalize(v));

    async function sha256Text(txt) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
      return bufToHex(buf);
    }

    async function dumpAll() {
      const o = {};
      for (const n of STORES) o[n] = await all(n);
      o.meta = o.meta.filter(x => !x.k.startsWith('auto_snapshot_'));
      return {
        app: 'aung-gas-pos',
        version: APP_VER,
        schema: 4,
        exportedAt: new Date().toISOString(),
        deviceId: DEVICE_ID,
        data: o
      };
    }

    async function saveRollingSnapshot(tag = 'daily_auto') {
      const snap = await dumpAll();
      const ptr = ((getMeta('auto_snapshot_ptr') || 0) % 3) + 1;
      await run('meta', 'readwrite', t => {
        t.objectStore('meta').put({ k: 'auto_snapshot_' + ptr, v: { slot: ptr, tag, at: Date.now(), payload: snap } });
        t.objectStore('meta').put({ k: 'auto_snapshot_ptr', v: ptr });
        t.objectStore('meta').put({ k: 'last_auto_backup_at', v: Date.now() });
      });
    }

    async function exportExternalBackup(confirmExternalSaved = true) {
      const dump = await dumpAll();
      const jsonStr = JSON.stringify(dump);
      const parsed = JSON.parse(jsonStr);
      if (!parsed || parsed.app !== 'aung-gas-pos') throw new Error('JSON parse verification failed');
      const digest = await sha256Text(jsonStr);
      const fname = 'aung-pos-v24-' + dkey(Date.now()) + '-' + new Date().toTimeString().slice(0, 5).replace(':', '') + '.json';
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = h('a', { href: url, download: fname });
      document.body.append(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);

      const now = Date.now();
      await run('meta', 'readwrite', t => {
        t.objectStore('meta').put({ k: 'lastBackup', v: now });
        t.objectStore('meta').put({
          k: 'last_verified_export',
          v: { fname, sha256: digest, bytes: jsonStr.length, verifiedAt: now, confirmedByUser: !!confirmExternalSaved }
        });
      });
      await reload();
      return { fname, sha256: digest, verifiedAt: now };
    }

    const checkBk = d => {
      if (!d || d.app !== 'aung-gas-pos' || !d.data || typeof d.data !== 'object') return 'Valid AUNG POS backup JSON မဟုတ်ပါ။';
      if (!(d.schema <= 4)) return 'Unsupported newer schema version.';
      for (const n of STORES) {
        const arr = d.data[n];
        if (arr === undefined) continue;
        if (!Array.isArray(arr)) return n + ' store data is invalid.';
        for (const r of arr) {
          if (!r || typeof r !== 'object' || typeof (n === 'meta' ? r.k : r.id) !== 'string') return n + ' record missing string key/id.';
          if (n === 'sales' && (typeof r.at !== 'number' || !Array.isArray(r.lines))) return 'Invalid sales record format.';
          if (n === 'pays' && !Number.isFinite(r.amount)) return 'Invalid payment amount in pays.';
          if (n === 'cf' && ['exp', 'ob', 'bal', 'loan', 'xfer', 'gas_ret', 'cyl_compensation', 'fac_refund_in'].includes(r.type) && !Number.isFinite(r.amt)) {
            return 'Invalid numeric amount in cf store.';
          }
        }
      }
      return null;
    };

    const recordDateKey = (store, r) => {
      if (store === 'sales' || store === 'pays') return r.at ? dkey(r.at) : null;
      if (store === 'cf' || store === 'stk' || store === 'gasEv') return r.date || (r.at ? dkey(r.at) : null);
      return null;
    };

    async function importAll(d, fresh = false) {
      await saveRollingSnapshot('pre_restore');

      const existing = {};
      for (const n of STORES) existing[n] = await all(n);
      const conflicts = [...(getMeta('restore_conflicts') || [])];
      const stats = { added: 0, same: 0, conflicts: 0, lockedQuarantined: 0 };
      const writeOps = [];

      for (const n of STORES) {
        const list = d.data[n] || [];
        const map = new Map(existing[n].map(x => [n === 'meta' ? x.k : x.id, x]));
        for (const r of list) {
          const rid = n === 'meta' ? r.k : r.id;
          if (n === 'meta' && (rid === 'owner_auth' || rid.startsWith('pin_audit_') || rid.startsWith('auto_snapshot_') || rid.startsWith('arc_') || rid.startsWith('caud_'))) {
            continue;
          }
          const dk = recordDateKey(n, r);
          const locked = dk && isMonthLocked(dk);
          const localRec = map.get(rid);

          if (locked) {
            if (!localRec || canonicalJson(localRec) !== canonicalJson(r)) {
              conflicts.push({
                conflictId: uuid(),
                store: n,
                recordId: rid,
                reason: 'LOCKED_MONTH',
                lockedMonth: dk.slice(0, 7),
                localRecord: localRec || null,
                incomingRecord: r,
                detectedAt: Date.now(),
                status: 'pending'
              });
              stats.lockedQuarantined++;
            } else {
              stats.same++;
            }
            continue;
          }

          if (!localRec) {
            writeOps.push({ store: n, record: r });
            stats.added++;
          } else if (canonicalJson(localRec) === canonicalJson(r)) {
            stats.same++;
          } else {
            conflicts.push({
              conflictId: uuid(),
              store: n,
              recordId: rid,
              reason: 'CONTENT_CONFLICT',
              lockedMonth: null,
              localRecord: localRec,
              incomingRecord: r,
              detectedAt: Date.now(),
              status: 'pending'
            });
            stats.conflicts++;
          }
        }
      }

      await run(STORES, 'readwrite', t => {
        if (fresh) t.objectStore('products').clear();
        writeOps.forEach(op => t.objectStore(op.store).put(op.record));
        t.objectStore('meta').put({ k: 'restore_conflicts', v: conflicts });
      });
      await rebuildConflictIndex();
      return stats;
    }

    async function resolveConflict(conflictId, decision, noteTxt = '') {
      const list = getMeta('restore_conflicts') || [];
      const idx = list.findIndex(c => c.conflictId === conflictId);
      if (idx < 0) throw new Error('Conflict not found');
      const c = list[idx];
      if (c.status !== 'pending') throw new Error('Conflict already resolved (pending -> resolved is single-transition only)');
      if (c.lockedMonth && isMonthLocked(c.lockedMonth)) {
        throw new Error('Target month ' + c.lockedMonth + ' is locked. Reopen month with Owner PIN & reason first.');
      }

      const ok = await requireOwnerPin('Resolve Conflict (' + c.store + '::' + c.recordId.slice(-8) + ')');
      if (!ok) return false;

      const now = Date.now();
      const nextList = [...list];
      nextList[idx] = { ...c, status: 'resolved', decision, resolvedAt: now, note: noteTxt };

      await run([c.store, 'meta'], 'readwrite', t => {
        const mOs = t.objectStore('meta');
        if (decision === 'ACCEPT_BACKUP') {
          if (c.localRecord) {
            mOs.put({
              k: 'arc_' + conflictId,
              v: { conflictId, store: c.store, recordId: c.recordId, archivedRecord: c.localRecord, archivedAt: now }
            });
          }
          t.objectStore(c.store).put(c.incomingRecord);
        }
        mOs.put({ k: 'restore_conflicts', v: nextList });
        mOs.put({
          k: 'caud_' + uuid(),
          v: { conflictId, store: c.store, recordId: c.recordId, decision, ownerId: 'OWNER', resolvedAt: now, note: noteTxt, deviceId: DEVICE_ID }
        });
      });
      await rebuildConflictIndex();
      await reload();
      return true;
    }

    async function rebuildConflictIndex() {
      const allM = await all('meta');
      const arcSet = new Set(allM.filter(x => x.k.startsWith('arc_')).map(x => x.k));
      const confs = (allM.find(x => x.k === 'restore_conflicts') || {}).v || [];
      const idx = confs
        .filter(c => c.status === 'resolved' && c.decision === 'ACCEPT_BACKUP' && arcSet.has('arc_' + c.conflictId))
        .map(c => ({ conflictId: c.conflictId, arcKey: 'arc_' + c.conflictId, resolvedAt: c.resolvedAt }));
      await put('meta', { k: 'conflict_archive_index', v: idx });
    }

    async function pruneOldArchivesIfVerified() {
      const expInfo = getMeta('last_verified_export');
      if (!expInfo || !expInfo.sha256 || !expInfo.confirmedByUser) {
        return { pruned: 0, blockedReason: 'Verified external export & Owner confirmation required before pruning archives.' };
      }
      const cutoff = Date.now() - 90 * 86400000;
      const allM = await all('meta');
      const oldArcs = allM.filter(x => x.k.startsWith('arc_') && x.v && x.v.archivedAt && x.v.archivedAt < cutoff);
      if (!oldArcs.length) return { pruned: 0, blockedReason: null };
      await run('meta', 'readwrite', t => {
        oldArcs.forEach(a => t.objectStore('meta').delete(a.k));
      });
      await rebuildConflictIndex();
      await reload();
      return { pruned: oldArcs.length, blockedReason: null };
    }

    // =========================================================================
    // 6. RELOAD & IDEMPOTENT V24 MIGRATION
    // =========================================================================
    async function reload() {
      metaList = await all('meta');

      if (mCfg) cfg = { ...cfg, ...mCfg, o2Rates: { ...cfg.o2Rates, ...(mCfg.o2Rates || {}) }, dashWidgets: { ...cfg.dashWidgets, ...(mCfg.dashWidgets || {}) } };
      if (mRcpt) rc = mRcpt;
      if (Array.isArray(mRent) && mRent.length) rentSchedule = mRent;
      lockedMonths = Array.isArray(mLock) ? mLock : [];
      ownerAuth = mAuth || null;

    }

    async function seedAndMigrate() {
      const seeded = await new Promise(ok => {

        q.onsuccess = () => ok(q.result);

          if (!ps.some(p => p.gas === 'can')) t.objectStore('products').add({ id: uuid(), name: 'Gas ဗူးဖြည့်', cat: 'LPG ဓာတ်ငွေ့', unit: 'ဗူး', gas: 'can', sample: false, at: Date.now() });
          if (!getMeta('rent_schedule')) t.objectStore('meta').put({ k: 'rent_schedule', v: rentSchedule });

    // =========================================================================
    // 7. V23 GAS DUAL-SLOT ENGINE + V24 ACTUAL WEIGHT & VARIANCE RECONCILIATION
    // =========================================================================
    const agOf = e => e.agent || 'TT Gas';
    const capOf = e => Number(e.cap) || ((AGENTS[agOf(e)] || {}).viss) || cfg.usable;
    const liveCyls = () => gasEv.filter(e => e.type === 'cyl' && !e.closed).sort((a, b) => a.at - b.at);
    const liveRole = r => liveCyls().find(e => (e.role || 'viss') === r);

    function soldSince(t, role) {
      let n = 0;
      sales.forEach(x => {
        if (!x.voided && x.at >= t && !x.hist) {
          x.lines.forEach(l => {
            if (role === 'can' && l.gasRole === 'can') n += (Number(l.qty) || 0);
            else if (role !== 'can' && l.gasViss > 0 && l.gasRole !== 'can') n += (Number(l.gasViss) || 0);
          });
        }
      });
      return n;
    }

    function cylBal(c) {
      const role = c.role || 'viss';
      const used = soldSince(c.at, role);
      const isCan = role === 'can';
      const unitTot = isCan ? capOf(c) * (cfg.cans || 7) : capOf(c);
      const b = unitTot - used + (Number(c.adj) || 0);
      return Math.max(b, 0);
    }

    function agentCounts(ag) {
      let full = 0, emp = 0;
      gasEv.forEach(e => {
        if (e.voided || agOf(e) !== ag) return;
        if (e.type === 'recv') full += (Number(e.qty) || 0);
        else if (e.type === 'ret') emp -= (Number(e.qty) || 0);
        else if (e.type === 'eswap') { full += (Number(e.qty) || 0); emp -= (Number(e.qty) || 0); }
        else if (e.type === 'cyl') { full -= 1; if (e.closed && !e.partialRet) emp += 1; }
        else if (e.type === 'ecount') emp = (Number(e.qty) || 0);
      });
      const openV = liveCyls().filter(c => agOf(c) === ag && (c.role || 'viss') === 'viss').length;
      const openC = liveCyls().filter(c => agOf(c) === ag && c.role === 'can').length;
      return { full: Math.max(full, 0), emp: Math.max(emp, 0), openV, openC };
    }

    function gasStockViss() {
      let fullV = 0;
      Object.keys(AGENTS).forEach(ag => {
        fullV += agentCounts(ag).full * AGENTS[ag].viss;
      });
      const partV = liveCyls().filter(c => (c.role || 'viss') === 'viss').reduce((a, c) => a + cylBal(c), 0);
      const buyBackV = gasInventorySummary().buyBackRemainingViss;
      return { fullV, partV, buyBackV, totalGroundV: fullV + partV + buyBackV };
    }

    function askSwap(role, titleTxt) {
      return new Promise(res => {
        const bg = h('div', { class: 'modal-bg' });
        const agSel = h('select', {}, Object.keys(AGENTS).map(k => {
          const cnt = agentCounts(k);
          return h('option', { value: k }, k + ' (Full: ' + cnt.full + ' · ' + AGENTS[k].viss + ' viss)');
        }));
        const cur = liveRole(role);
        const keepChk = h('input', { type: 'checkbox', style: 'width:auto;margin-right:8px' });
        const box = h('div', { class: 'modal-box' },
          h('b', { style: 'font-size:16px' }, titleTxt),
          cur ? h('div', { class: 'msg i' }, 'လက်ရှိဖွင့်ထားသောအိုး: ' + agOf(cur) + ' (ကျန် ' + r2(cylBal(cur)) + (role === 'can' ? ' ဗူး' : ' viss') + ')') : '',
          h('label', {}, 'အိုးအသစ် ဖွင့်မည့် Supplier'), agSel,
          cur ? h('label', { style: 'display:flex;align-items:center;margin-top:10px' }, keepChk, 'လက်ရှိအိုး မကုန်သေးပါ (Partial အဖြစ် ခဏဖယ်ထားမည်)') : '',
          h('div', { class: 'row', style: 'margin-top:12px' },
            h('button', { class: 'n', onclick: () => { bg.remove(); res(null); } }, 'Cancel'),
            h('button', { class: 'o', style: 'margin-top:0', onclick: () => { bg.remove(); res({ agent: agSel.value, keepOld: keepChk.checked }); } }, 'အိုးအသစ်ဖွင့်မည်')
          )
        );
        bg.append(box);
        document.body.append(bg);
      });
    }

    // Supplier-specific latest purchase price, applied date, weight variance & buy-back cost basis
    function gasInventorySummary() {
      const suppliers = {};
      Object.keys(AGENTS).forEach(ag => {
        const nomPerCyl = AGENTS[ag].viss;
        const intakes = gasEv
          .filter(e => (e.type === 'recv' || e.type === 'eswap') && !e.voided && e.agent === ag)
          .sort((a, b) => b.at - a.at);
        const latestPriced = intakes.find(e => Number.isFinite(e.cost) && e.cost > 0);
        const latestCylPrice = latestPriced ? latestPriced.cost : null;
        const latestVissRate = latestCylPrice ? (latestCylPrice / nomPerCyl) : null;

        let totalNominalViss = 0;
        let totalActualViss = 0;
        let varianceViss = 0;
        let varianceCostMmk = 0;

        intakes.forEach(e => {
          const nV = Number.isFinite(e.nominalViss) ? e.nominalViss : ((e.qty || 0) * nomPerCyl);
          const aV = Number.isFinite(e.actualViss) ? e.actualViss : nV;
          const shortV = Math.max(nV - aV, 0);
          const rate = (Number.isFinite(e.cost) && e.cost > 0) ? (e.cost / nomPerCyl) : (latestVissRate || 0);
          totalNominalViss += nV;
          totalActualViss += aV;
          varianceViss -= shortV;
          varianceCostMmk += shortV * rate;
        });

        suppliers[ag] = {
          agent: ag,
          nomPerCyl,
          latestCylPrice,
          latestVissRate,
          effectiveDate: latestPriced ? dkey(latestPriced.at) : null,
          totalNominalViss,
          totalActualViss,
          varianceViss,
          varianceCostMmk
        };
      });

      const buyBacks = gasEv.filter(e => e.type === 'gas_ret' && !e.voided);
      const buyBackTotalViss = buyBacks.reduce((a, e) => a + (Number(e.viss) || 0), 0);
      const buyBackTotalCost = buyBacks.reduce((a, e) => a + (Number(e.buyBackCost) || 0), 0);
      let buyBackSoldViss = 0;
      sales.forEach(s => {
        if (!s.voided) s.lines.forEach(l => { if (l.isBuyBackStock && l.gasViss > 0) buyBackSoldViss += l.gasViss; });
      });
      const buyBackRemainingViss = Math.max(buyBackTotalViss - buyBackSoldViss, 0);
      const buyBackRatePerViss = buyBackTotalViss > 0 ? (buyBackTotalCost / buyBackTotalViss) : null;

      return { suppliers, buyBackTotalViss, buyBackTotalCost, buyBackRemainingViss, buyBackRatePerViss };
    }

    // =========================================================================
    // 8. OXYGEN 4-TYPE MATRIX, CUSTOMERS, RENT & P&L CALCULATIONS
    // =========================================================================
    const payOf = s => s.pay || 'cash';
    const lineGrossAmt = l => l.foc ? 0 : (Number(l.qty) || 0) * (Number(l.price) || 0);
    const stotal = s => Math.max(s.lines.reduce((a, l) => a + lineGrossAmt(l), 0) - (Number(s.discount) || 0), 0);
    const partsOf = s => s.parts || [{ m: payOf(s), a: stotal(s) }];
    const payLabel = s => {
      const P = partsOf(s);
      return P.map(x => (PAY[x.m] || x.m) + (P.length > 1 ? ' ' + money(x.a) : '')).join(' + ');
    };
    const creditOf = s => partsOf(s).filter(x => x.m === 'credit' || x.m === 'pending').reduce((a, x) => a + x.a, 0);

    const isO2DropoffAwaitingPickup = s => !s.voided && !!s.isO2Dropoff && !s.pickedUpAt;
    const isGeneralDropoffUnpaid = s => !s.voided && !s.isO2Dropoff && partsOf(s).some(x => x.m === 'dropoff') && !s.settledTodayAt;
    const isDeferredUnrecognized = s => isO2DropoffAwaitingPickup(s) || isGeneralDropoffUnpaid(s);

    const saleRevenueDateKey = s => {
      if (s.voided || isDeferredUnrecognized(s)) return null;
      if (s.isO2Dropoff && s.pickedUpAt) return dkey(s.pickedUpAt);
      if (s.settledTodayAt) return dkey(s.settledTodayAt);
      return dkey(s.at);
    };

    const ck = n => String(n || '').trim().toLowerCase();

    function custO2Custody(custKey, o2type) {
      return cf
        .filter(e => e.type === 'o2cust' && !e.voided && ck(e.cust) === custKey && (!o2type || e.o2type === o2type))
        .reduce((a, e) => a + (Number(e.qtyDelta) || 0), 0);
    }

    function o2StockMatrix() {
      const mat = {};
      Object.values(O2_TYPES).forEach(t => {
        const rate = (cfg.o2Rates && cfg.o2Rates[t.id]) || t.defaultRate;
        mat[t.id] = { ...t, rate, full: 0, empty: 0, atCustomer: 0, atFactory: 0, payable: 0 };
      });

      const evs = [...stk].sort((a, b) => a.at - b.at);
      Object.keys(mat).forEach(tid => {
        const lastFullSet = evs.filter(e => e.type === 'o2_stock_set' && e.o2type === tid && e.target === 'full').slice(-1)[0];
        const lastEmptySet = evs.filter(e => e.type === 'o2_stock_set' && e.o2type === tid && e.target === 'empty').slice(-1)[0];
        let full = lastFullSet ? lastFullSet.newQty : 0;
        let empty = lastEmptySet ? lastEmptySet.newQty : 0;
        let atFac = 0;

        evs.forEach(e => {
          if (e.voided || e.o2type !== tid) return;
          if (e.type === 'o2_mov') {
            if (!lastFullSet || e.at > lastFullSet.at) {
              if (e.locationFrom === 'SHOP_FULL') full -= e.qty;
              if (e.locationTo === 'SHOP_FULL') full += e.qty;
            }
            if (!lastEmptySet || e.at > lastEmptySet.at) {
              if (e.locationFrom === 'SHOP_EMPTY') empty -= e.qty;
              if (e.locationTo === 'SHOP_EMPTY') empty += e.qty;
            }
            if (e.locationFrom === 'AT_FACTORY') atFac -= e.qty;
            if (e.locationTo === 'AT_FACTORY') atFac += e.qty;
          } else if (e.type === 'o2_fac_recv') {
            if (!lastFullSet || e.at > lastFullSet.at) full += e.qty;
            atFac = Math.max(atFac - e.qty, 0);
            mat[tid].payable += Math.max((e.totalAmt || 0) - (e.paidAmt || 0), 0);
          } else if (e.type === 'o2_fac_send') {
            if (!lastEmptySet || e.at > lastEmptySet.at) empty -= e.qty;
            atFac += e.qty;
          }
        });
        mat[tid].full = full;
        mat[tid].empty = empty;
        mat[tid].atFactory = atFac;
      });

      cf.filter(e => e.type === 'o2cust' && !e.voided).forEach(e => {
        if (mat[e.o2type]) mat[e.o2type].atCustomer += (Number(e.qtyDelta) || 0);
      });
      return mat;
    }

    function motherCylStatus() {
      const capL = Number(cfg.motherCapL) || 55;
      const fillCost = (cfg.o2Rates && cfg.o2Rates.OVER_40L_OWN) || 25000;
      const active = stk.filter(e => e.type === 'o2_mother' && !e.closed).sort((a, b) => a.at - b.at)[0] || null;
      if (!active) return { active: null, capL, remL: 0, costPerL: fillCost / capL };
      const usedL = stk
        .filter(e => e.type === 'o2_mother_fill' && !e.voided && e.motherId === active.id)
        .reduce((a, e) => a + (Number(e.liters) || 0), 0);
      const cL = Number(active.capL) || capL;
      const fC = Number(active.fillCost) || fillCost;
      return { active, capL: cL, remL: Math.max(cL - usedL, 0), costPerL: fC / cL };
    }

    function customers() {
      const map = {};
      const get = n => {
        const k = ck(n);
        return map[k] = map[k] || { key: k, name: String(n).trim(), phone: '', cr: 0, pd: 0, compCr: 0, compPd: 0 };
      };
      cf.filter(e => e.type === 'cust' && !e.mergedInto).sort((a, b) => a.at - b.at).forEach(e => {
        const c = get(e.name);
        if (e.phone !== undefined) c.phone = e.phone;
      });
      sales.filter(s => !s.voided && !isDeferredUnrecognized(s) && s.cust).forEach(s => {
        get(s.cust).cr += creditOf(s);
      });
      cf.filter(e => e.type === 'ob' && !e.voided).forEach(e => {
        get(e.cust).cr += (Number(e.amt) || 0);
      });
      pays.filter(p => !p.voided).forEach(p => {
        if (p.isCompensation) get(p.cust).compPd += (Number(p.amount) || 0);
        else get(p.cust).pd += (Number(p.amount) || 0);
      });
      cf.filter(e => e.type === 'cyl_compensation' && !e.voided).forEach(e => {
        get(e.cust).compCr += (Number(e.amt) || 0);
      });
      return Object.values(map).map(c => ({
        ...c,
        bal: c.cr - c.pd,
        compBal: c.compCr - c.compPd
      }));
    }

    function unpaidInvoices(custKey) {
      const invs = sales
        .filter(s => !s.voided && !isDeferredUnrecognized(s) && ck(s.cust) === custKey && creditOf(s) > 0)
        .sort((a, b) => a.at - b.at);
      const paidMap = {};
      pays.filter(p => !p.voided && !p.isCompensation && ck(p.cust) === custKey).forEach(p => {
        (p.allocations || []).forEach(al => {
          paidMap[al.saleId] = (paidMap[al.saleId] || 0) + (Number(al.appliedAmt) || 0);
        });
      });
      return invs.map(s => {
        const dueTotal = creditOf(s);
        const paid = paidMap[s.id] || 0;
        return { sale: s, dueTotal, paid, rem: Math.max(dueTotal - paid, 0) };
      }).filter(x => x.rem > 0.5);
    }

    function getRentForPeriod(periodKey, isMonthly) {
      const ym = periodKey.slice(0, 7);
      const entry = rentSchedule.find(r => ym >= r.from && ym <= r.to);
      if (!entry || !(Number(entry.monthlyRent) > 0)) {
        return {
          confirmed: false,
          allocatedRent: 0,
          monthlyRent: 0,
          daysInMonth: null,
          warning: ym >= '2027-01' ? '2027 Rent Unconfirmed' : 'Rent Schedule Unconfirmed'
        };
      }
      const mRent = Number(entry.monthlyRent);
      if (isMonthly) {
        return { confirmed: true, allocatedRent: mRent, monthlyRent: mRent, daysInMonth: null, warning: null };
      }
      const [y, m] = ym.split('-').map(Number);
      const dim = daysInMonth(y, m);
      return { confirmed: true, allocatedRent: mRent / dim, monthlyRent: mRent, daysInMonth: dim, warning: null };
    }

    function calcPnL(periodKey, isMonthly) {
      const [a, b] = isMonthly ? mbounds(periodKey) : dbounds(periodKey);
      const gInfo = gasInventorySummary();
      const supplierList = Object.values(gInfo.suppliers).filter(x => x.latestVissRate > 0);
      const defaultRate = supplierList.length ? supplierList[0].latestVissRate : null;

      let grossRevenue = 0;
      let gasCogs = 0;
      let o2Cogs = 0;
      let prodCogs = 0;
      let focCogs = 0;
      let missingCostCount = 0;
      let estimatedGasCount = 0;
      const appliedGasMeta = new Set();

      sales.forEach(s => {
        if (s.voided) return;
        const revDk = saleRevenueDateKey(s);
        if (!revDk) return;
        const revTs = dbounds(revDk)[0] + 43200000;
        if (revTs < a || revTs > b) return;

        s.lines.forEach(l => {
          if (!l.foc) grossRevenue += (Number(l.qty) || 0) * (Number(l.price) || 0);

          if (l.gasViss > 0) {
            if (l.isBuyBackStock && gInfo.buyBackRatePerViss !== null) {
              const c = l.gasViss * gInfo.buyBackRatePerViss;
              if (l.foc) focCogs += c; else gasCogs += c;
              appliedGasMeta.add('Buy-Back Basis ' + Math.round(gInfo.buyBackRatePerViss).toLocaleString() + '/viss');
            } else if (l.agent && gInfo.suppliers[l.agent] && gInfo.suppliers[l.agent].latestVissRate > 0) {
              const sup = gInfo.suppliers[l.agent];
              const c = l.gasViss * sup.latestVissRate;
              if (l.foc) focCogs += c; else gasCogs += c;
              appliedGasMeta.add(sup.agent + ': ' + Math.round(sup.latestVissRate).toLocaleString() + '/viss (intake ' + (sup.effectiveDate || '-') + ')');
            } else if (defaultRate > 0) {
              const c = l.gasViss * defaultRate;
              if (l.foc) focCogs += c; else gasCogs += c;
              estimatedGasCount++;
              appliedGasMeta.add('Estimated ' + Math.round(defaultRate).toLocaleString() + '/viss (Unknown Supplier)');
            } else {
              missingCostCount++;
            }
          } else if (l.o2type && O2_TYPES[l.o2type]) {
            const rate = (cfg.o2Rates && cfg.o2Rates[l.o2type]) || O2_TYPES[l.o2type].defaultRate;
            const c = (Number(l.qty) || 0) * rate;
            if (l.foc) focCogs += c; else o2Cogs += c;
          } else if (l.motherFillLiters > 0) {
            const c = Number(l.costAtSale) || 0;
            if (l.foc) focCogs += c; else o2Cogs += c;
          } else {
            if (l.costMissing || l.costAtSale === null || l.costAtSale === undefined) {
              missingCostCount++;
            } else {
              if (l.foc) focCogs += Number(l.costAtSale); else prodCogs += Number(l.costAtSale);
            }
          }
        });
        if (s.discount > 0) grossRevenue = Math.max(grossRevenue - Number(s.discount), 0);
      });

      const weightVarianceExpense = Object.values(gInfo.suppliers).reduce((sum, sup) => {
        const pEvs = gasEv.filter(e => (e.type === 'recv' || e.type === 'eswap') && !e.voided && e.agent === sup.agent && e.at >= a && e.at <= b);
        return sum + pEvs.reduce((acc, e) => {
          const nV = Number.isFinite(e.nominalViss) ? e.nominalViss : ((e.qty || 0) * sup.nomPerCyl);
          const aV = Number.isFinite(e.actualViss) ? e.actualViss : nV;
          const shortV = Math.max(nV - aV, 0);
          const rate = (Number.isFinite(e.cost) && e.cost > 0) ? (e.cost / sup.nomPerCyl) : (sup.latestVissRate || 0);
          return acc + shortV * rate;
        }, 0);
      }, 0);

      let opEx = 0;
      cf.filter(e => e.type === 'exp' && !e.voided && e.at >= a && e.at <= b).forEach(e => {
        if (e.cat === 'savings' || e.cat === 'rent' || e.isRentPayment || e.isO2Settlement) return;
        opEx += (Number(e.amt) || 0);
      });

      const rentInfo = getRentForPeriod(periodKey, isMonthly);
      const totalCogs = gasCogs + o2Cogs + prodCogs + focCogs;
      const grossProfit = grossRevenue - totalCogs;
      const netProfit = grossProfit - opEx - weightVarianceExpense - rentInfo.allocatedRent;

      return {
        grossRevenue, gasCogs, o2Cogs, prodCogs, focCogs, totalCogs,
        grossProfit, opEx, weightVarianceExpense, rentInfo, netProfit,
        missingCostCount, estimatedGasCount,
        appliedGasMeta: Array.from(appliedGasMeta),
        buyBackOutflow: gasEv.filter(e => e.type === 'gas_ret' && !e.voided && e.at >= a && e.at <= b).reduce((s, e) => s + (Number(e.buyBackCost) || 0), 0)
      };
    }

    function flows(method, a, b) {
      let i = 0, o = 0;
      sales.forEach(s => {
        if (s.voided || isDeferredUnrecognized(s)) return;
        const effTs = s.pickedUpAt || s.settledTodayAt || s.at;
        if (effTs >= a && effTs <= b) {
          partsOf(s).forEach(x => { if (x.m === method) i += (Number(x.a) || 0); });
        }
      });
      pays.filter(p => !p.voided && p.method === method && p.at >= a && p.at <= b).forEach(p => {
        i += (Number(p.amount) || 0);
      });
      cf.filter(e => e.type === 'exp' && !e.voided && e.m === method && e.at >= a && e.at <= b).forEach(e => {
        o += (Number(e.amt) || 0);
      });
      gasEv.filter(e => e.type === 'gas_ret' && !e.voided && e.m === method && e.at >= a && e.at <= b).forEach(e => {
        o += (Number(e.buyBackCost) || 0);
      });
      cf.filter(e => e.type === 'fac_refund_in' && !e.voided && e.m === method && e.at >= a && e.at <= b).forEach(e => {
        i += (Number(e.amt) || 0);
      });
      cf.filter(e => e.type === 'loan' && !e.voided).forEach(e => {
        if (e.m === method && e.at >= a && e.at <= b) i += (Number(e.amt) || 0);
        if (e.repaid && e.repaidMethod === method && e.repaidAt >= a && e.repaidAt <= b) o += (Number(e.amt) || 0);
      });
      cf.filter(e => e.type === 'xfer' && !e.voided).forEach(e => {
        if (e.to === method && e.at >= a && e.at <= b) i += (Number(e.amt) || 0);
        if (e.from === method && e.at >= a && e.at <= b) o += (Number(e.amt) || 0);
      });
      return { i, o };
    }

    function opening(method, k) {
      const R = cf.filter(e => e.type === 'bal' && e.method === method);
      const op = R.filter(r => r.kind === 'open' && r.date === k).sort((a, b) => b.at - a.at)[0];
      if (op) return Number(op.amt) || 0;
      const cl = R.filter(r => r.kind === 'close' && r.date < k).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.at - a.at)[0];
      if (!cl) return null;
      const f = flows(method, dbounds(cl.date)[1] + 1, dbounds(k)[0] - 1);
      return (Number(cl.amt) || 0) + f.i - f.o;
    }

    function stockOf(p) {
      const c = stk.filter(e => e.pid === p.id && e.type === 'count').sort((a, b) => b.at - a.at)[0];
      if (!c) return null;
      let n = Number(c.qty) || 0;
      stk.forEach(e => { if (e.pid === p.id && e.at > c.at && (e.type === 'buy' || e.type === 'ret')) n += (Number(e.qty) || 0); });
      sales.forEach(x => { if (!x.voided && x.at > c.at) x.lines.forEach(l => { if (l.pid === p.id) n -= (Number(l.qty) || 0); }); });
      return n;
    }

    function viewSale() {
      const app = $('#app');
      app.replaceChildren();

      const dl = h('datalist', { id: 'pl' }, products.map(p => h('option', { value: p.name })));
      const cl = h('datalist', { id: 'cl' }, customers().map(c => h('option', { value: c.name })));
      const pn = h('input', { list: 'pl', placeholder: 'ပစ္စည်းနာမည် ရိုက်ပါ / ရွေးပါ', autocomplete: 'off' });
      const qty = h('input', { type: 'number', inputmode: 'decimal', step: 'any', min: '0', placeholder: 'ပမာဏ' });
      const un = h('select', {}, UNITS.map(u => h('option', { value: u }, u)));
      const pr = h('input', { type: 'number', inputmode: 'numeric', min: '0', placeholder: 'ဈေးနှုန်း (ကျပ်)' });
      const foc = h('input', { type: 'checkbox', style: 'width:auto;margin-right:8px' });

      const o2ModeSel = h('select', {},
        h('option', { value: 'counter_swap' }, 'Counter Exchange (အခွံ ၁:၁ တူညီသော Type/Ownership လဲမည်)'),
        h('option', { value: 'site_deliver_keep' }, 'Site Delivery — Keep (အိုးထားခဲ့ · Customer Custody +)'),
        h('option', { value: 'site_deliver_swap' }, 'Site Delivery — Swap (Site မှာ အခွံချက်ချင်းလဲမည်)'),
        h('option', { value: 'o2_dropoff_pickup' }, 'O2 Drop-off ("Filled – Awaiting Pickup" · လာယူမှ Rev/COGS)')
      );
      const o2Wrap = h('div', { style: 'display:none' }, h('label', {}, 'Oxygen Movement Mode'), o2ModeSel);

      pn.onchange = () => {
        const p = products.find(x => x.name === pn.value.trim());
        if (p) {
          un.value = p.unit;
          if (p.sellPrice > 0 && !pr.value) pr.value = p.sellPrice;
          o2Wrap.style.display = (p.o2type && O2_TYPES[p.o2type]) ? 'block' : 'none';
        } else {
          o2Wrap.style.display = 'none';
        }
      };

      const pay = h('select', {}, Object.entries(PAY).map(([k, v]) => h('option', { value: k }, v)));
      const siteTermSel = h('select', {}, Object.entries(SITE_TERMS).map(([k, v]) => h('option', { value: k }, lang === 'en' ? v.labelEn : v.labelMy)));
      const siteTermWrap = h('div', { style: 'display:none' }, h('label', {}, 'Site Payment Term'), siteTermSel);
      const cust = h('input', { list: 'cl', placeholder: 'Customer Name (COD / Credit / Site / Custody)', autocomplete: 'off', style: 'margin-top:8px' });
      const tagIn = h('input', { placeholder: 'Tag / Token (Drop-off)', autocomplete: 'off', style: 'margin-top:8px;display:none' });
      const discIn = h('input', { type: 'number', inputmode: 'numeric', min: '0', placeholder: 'Discount (ကျပ် — 2% ကျော်လျှင် Owner PIN လို)' });
      const dIn = h('input', { type: 'date', max: dkey(Date.now()), value: dkey(Date.now()) });

      pay.onchange = () => {
        siteTermWrap.style.display = (pay.value === 'credit') ? 'block' : 'none';
        tagIn.style.display = (pay.value === 'dropoff') ? 'block' : 'none';
      };

      const msg = h('div'), list = h('div'), tot = h('div', { class: 'tot' });
      const saveBtn = h('button', { class: 'o' }, 'ရောင်းချမှု သိမ်းမည်');

      const draw = () => {
        const sub = lines.reduce((s, l) => s + lineGrossAmt(l), 0);
        const dAmt = parseFloat(discIn.value) || 0;
        list.replaceChildren(...lines.map((l, i) => h('div', { class: 'li' },
          h('span', {},
            l.name + ' × ' + l.qty + ' ' + l.unit,
            l.o2type ? h('span', { class: 'tag b' }, o2Label(l.o2type) + ' · ' + l.o2Movement) : '',
            l.foc ? h('span', { class: 'tag' }, 'FOC') : ''
          ),
          h('span', {},
            money(lineGrossAmt(l)) + ' ',
            h('button', { class: 'g', onclick: () => { lines.splice(i, 1); draw(); } }, 'ဖယ်')
          )
        )));
        tot.textContent = 'စုစုပေါင်း ' + money(Math.max(sub - dAmt, 0));
        saveBtn.disabled = !lines.length;
      };
      discIn.oninput = draw;

      const addLine = async () => {
        const p = products.find(x => x.name === pn.value.trim());
        const q = parseFloat(qty.value);
        const pc = parseFloat(pr.value);
        const f = foc.checked;

        if (!p) return note(msg, 'ပစ္စည်းစာရင်းထဲမှ ပစ္စည်းကို ရွေးပါ။');
        if (!(q > 0)) return note(msg, 'ပမာဏကို 0 ထက်ကြီးအောင် ထည့်ပါ။');
        if (!f && (isNaN(pc) || pc < 0)) return note(msg, 'ဈေးနှုန်း ထည့်ပါ (FOC ဆိုလျှင် အမှန်ခြစ်ပါ)။');

        let o2Mov = null;
        if (p.o2type && O2_TYPES[p.o2type]) {
          o2Mov = o2ModeSel.value;
          const mat = o2StockMatrix()[p.o2type];
          const inCart = lines.filter(l => l.o2type === p.o2type).reduce((a, l) => a + l.qty, 0);
          if (mat.full < (q + inCart)) {
            return note(msg, '⛔ ' + o2Label(p.o2type) + ' Full Stock (' + mat.full + ') မလုံလောက်ပါ (Negative Stock ကာကွယ်ထားပါသည်)။');
          }
          if (o2Mov === 'o2_dropoff_pickup') pay.value = 'dropoff';
        } else if (!p.gas) {
          const st = stockOf(p);
          if (st !== null && q > st && !(await uiConfirm('"' + p.name + '" လက်ကျန် ' + r2(st) + ' ' + p.unit + ' ရှိသည်။ ဆက်ထည့်မလား?'))) return;
        }

        const gInfo = gasInventorySummary();
        const gViss = p.gas ? (p.gas === 'viss' ? q : q / (cfg.cans || 7)) : 0;
        const liveCyl = p.gas ? liveRole(p.gas) : null;
        const ag = liveCyl ? agOf(liveCyl) : null;
        const isBuyBackStock = !!(p.gas && !ag && gInfo.buyBackRatePerViss !== null && gInfo.buyBackRemainingViss > 0);

        lines.push({
          pid: p.id,
          name: p.name,
          qty: q,
          unit: un.value,
          price: isNaN(pc) ? 0 : pc,
          foc: f,
          gasViss: gViss,
          gasRole: p.gas || null,
          cylId: liveCyl ? liveCyl.id : null,
          agent: ag,
          isBuyBackStock,
          o2type: p.o2type || null,
          ownership: p.o2type ? O2_TYPES[p.o2type].ownership : null,
          o2Movement: o2Mov
        });

        pn.value = qty.value = pr.value = '';
        foc.checked = false;
        o2Wrap.style.display = 'none';
        msg.replaceChildren();
        draw();
      };

      saveBtn.onclick = async () => {
        if (saving || !lines.length) return;
        const targetDate = dIn.value || dkey(Date.now());
        if (!(await guardMonthUnlocked(targetDate, 'အရောင်း မှတ်တမ်း သိမ်းဆည်းခြင်း'))) return;

        const sub = lines.reduce((s, l) => s + lineGrossAmt(l), 0);
        const dAmt = parseFloat(discIn.value) || 0;
        if (dAmt > 0 && sub > 0 && (dAmt / sub) > 0.02) {
          const ok = await requireOwnerPin('Discount 2% ကျော်လွန်ခွင့် (' + money(dAmt) + ')');
          if (!ok) return;
        }

        const pm = pay.value;
        const cName = cust.value.trim();
        const tg = tagIn.value.trim();
        if ((pm === 'credit' || pm === 'pending') && !cName) return note(msg, 'COD / Credit / Site အတွက် Customer Name ထည့်ပါ။');
        if (lines.some(l => l.o2Movement === 'site_deliver_keep') && !cName) return note(msg, 'Site Delivery (Keep) အတွက် Customer Name ထည့်ပါ။');

        saving = true;
        saveBtn.disabled = true;
        try {
          const now = Date.now();
          const saleTs = targetDate === dkey(now) ? now : dbounds(targetDate)[0] + 43200000;
          const total = Math.max(sub - dAmt, 0);
          const isO2Drop = lines.some(l => l.o2Movement === 'o2_dropoff_pickup');

          const prodMap = new Map(products.map(x => [x.id, x]));
          const committedLines = lines.map((l, idx) => {
            const pRec = prodMap.get(l.pid);
            let costAtSale = null;
            let costMissing = false;
            if (!l.gasViss && !l.o2type) {
              if (pRec && Number.isFinite(pRec.buyPrice) && pRec.buyPrice > 0) {
                costAtSale = (Number(l.qty) || 0) * pRec.buyPrice;
              } else {
                costMissing = true;
              }
            }
            return { ...l, lineId: saleId + ':' + idx, costAtSale, costMissing };
          });

          const saleObj = {
            id: saleId,
            at: saleTs,
            pay: pm,
            parts: [{ m: pm, a: total }],
            cust: cName || null,
            tag: tg || null,
            term: pm === 'credit' ? siteTermSel.value : 'immediate',
            discount: dAmt,
            isO2Dropoff: isO2Drop,
            pickedUpAt: null,
            lines: committedLines,
            total,
            voided: false,
            rev: 1,
            updatedAt: now,
            deviceId: DEVICE_ID
          };

          await run(['sales', 'stk', 'cf'], 'readwrite', t => {
            t.objectStore('sales').add(saleObj);
            committedLines.forEach(l => {
              if (l.o2type && O2_TYPES[l.o2type]) {
                const own = O2_TYPES[l.o2type].ownership;
                if (l.o2Movement === 'counter_swap' || l.o2Movement === 'site_deliver_swap') {
                  t.objectStore('stk').add({
                    id: uuid(), movementId: uuid(), saleLineId: l.lineId,
                    type: 'o2_mov', o2type: l.o2type, ownership: own,
                    movementType: l.o2Movement, locationFrom: 'SHOP_FULL', locationTo: 'AT_CUSTOMER',
                    qty: l.qty, at: saleTs
                  });
                  t.objectStore('stk').add({
                    id: uuid(), movementId: uuid(), saleLineId: l.lineId,
                    type: 'o2_mov', o2type: l.o2type, ownership: own,
                    movementType: l.o2Movement, locationFrom: 'AT_CUSTOMER', locationTo: 'SHOP_EMPTY',
                    qty: l.qty, at: saleTs
                  });
                } else {
                  t.objectStore('stk').add({
                    id: uuid(), movementId: uuid(), saleLineId: l.lineId,
                    type: 'o2_mov', o2type: l.o2type, ownership: own,
                    movementType: l.o2Movement, locationFrom: 'SHOP_FULL', locationTo: 'AT_CUSTOMER',
                    qty: l.qty, at: saleTs
                  });
                  if (cName && l.o2Movement !== 'o2_dropoff_pickup') {
                    t.objectStore('cf').add({
                      id: uuid(), movementId: uuid(), saleLineId: l.lineId,
                      type: 'o2cust', cust: cName, o2type: l.o2type, ownership: own,
                      qtyDelta: l.qty, at: saleTs
                    });
                  }
                }
              }
            });
          });

          lines = [];
          saleId = uuid();
          discIn.value = '';
          cust.value = '';
          tagIn.value = '';
          await reload();
          note(msg, 'အရောင်းမှတ်တမ်း သိမ်းပြီးပါပြီ (costAtSale snapshot saved)။', true);
        } catch (e) {
          note(msg, 'Error (Rolled back): ' + (e && e.message || e));
        } finally {
          saving = false;
          draw();
          drawToday();
        }
      };

      const awaitingPickup = sales.filter(isO2DropoffAwaitingPickup);
      const dropCard = awaitingPickup.length ? h('div', { class: 'card', style: 'border:2px solid var(--org);background:#FFFDF9' },
        h('b', { style: 'color:#9A4308' }, 'Filled – Awaiting Pickup (' + awaitingPickup.length + ')'),
        h('small', {}, 'ဖောက်သည် လာယူချိန်မှသာ Revenue & COGS အသိအမှတ်ပြုမည်။ ငွေချေမှုကို သီးခြားမှတ်တမ်းတင်မည်။'),
        ...awaitingPickup.map(s => h('div', { class: 'li', style: 'flex-wrap:wrap' },
          h('span', {}, (s.cust || s.tag || 'Drop-off') + ' · ' + s.lines.map(l => l.name + '×' + l.qty).join(', ') + ' · ' + money(s.total)),
          h('button', {
            style: 'padding:5px 10px;font-size:12.5px',
            onclick: async () => {
              const pDate = await uiPrompt('လာယူသည့် ရက်စွဲ (YYYY-MM-DD)', dkey(Date.now()));
              if (!pDate) return;
              if (!(await guardMonthUnlocked(pDate, 'O2 Drop-off Pickup Recognition'))) return;
              const pickupTs = dbounds(pDate)[0] + 43200000;
              const paidNow = await uiConfirm('ယခုလာယူချိန်တွင် ငွေရှင်းပြီးပါသလား?\n(OK = ယခုပေးချေပြီး / Cancel = နောက်မှရှင်းမည် - Customer Receivable မှတ်မည်)', 'ငွေရှင်းပြီး', 'နောက်မှရှင်းမည်');
              let payCh = 'credit';
              if (paidNow) {
                const c = await uiPrompt('ငွေပေးချေမှု 1=ငွေသား 2=KPay 3=Wave 4=AyA', '1', 'number');
                payCh = { '1': 'cash', '2': 'kpay', '3': 'wave', '4': 'aya' }[String(c || '').trim()] || 'cash';
              }
              await run(['sales', 'cf'], 'readwrite', t => {
                t.objectStore('sales').put({ ...s, pickedUpAt: pickupTs, pay: payCh, parts: [{ m: payCh, a: s.total }] });
                if (s.cust) {
                  s.lines.forEach(l => {
                    if (l.o2type) {
                      t.objectStore('cf').add({
                        id: uuid(), movementId: uuid(), saleLineId: l.lineId,
                        type: 'o2cust', cust: s.cust, o2type: l.o2type, ownership: l.ownership,
                        qtyDelta: l.qty, at: pickupTs
                      });
                    }
                  });
                }
              });
              await reload();
              viewSale();
            }
          }, 'လာယူပြီ (Pickup)')
        ))
      ) : '';

      const todayList = h('div');
      const drawToday = () => {
        const t0 = dbounds(dkey(Date.now()))[0];
        const ts = sales.filter(s => (saleRevenueDateKey(s) === dkey(Date.now())) || (s.at >= t0 && !isDeferredUnrecognized(s)));
        const dayRev = sales.filter(s => !s.voided && saleRevenueDateKey(s) === dkey(Date.now())).reduce((a, s) => a + s.total, 0);
        todayList.replaceChildren(
          h('h2', {}, 'ယနေ့ Recognized Sales: ' + money(dayRev)),
          h('div', { class: 'card' }, ts.length ? ts.map(s => h('div', { class: 'li' },
            h('span', { class: s.voided ? 'void' : '' },
              tm(s.pickedUpAt || s.at) + ' · ' + s.lines.map(l => l.name + '×' + l.qty).join(', ') + ' · ' + payLabel(s) + (s.cust ? ' (' + s.cust + ')' : '')
            ),
            h('span', {},
              h('b', { class: s.voided ? 'void' : '' }, money(s.total)), ' ',
              !s.voided ? h('button', {
                class: 'g',
                onclick: async () => {
                  const dk = dkey(s.at);
                  if (!(await guardMonthUnlocked(dk, 'Void Sale'))) return;
                  const ok = await requireOwnerPin('Void Sale #' + s.id.slice(-6));
                  if (!ok) return;
                  const now = Date.now();
                  await run(['sales', 'stk', 'cf'], 'readwrite', t => {
                    t.objectStore('sales').put({ ...s, voided: true, voidedAt: now });
                    stk.filter(e => e.saleLineId && e.saleLineId.startsWith(s.id + ':')).forEach(e => t.objectStore('stk').put({ ...e, voided: true }));
                    cf.filter(e => e.saleLineId && e.saleLineId.startsWith(s.id + ':')).forEach(e => t.objectStore('cf').put({ ...e, voided: true }));
                  });
                  await reload();
                  drawToday();
                }
              }, 'Void') : ''
            )
          )) : h('small', {}, 'ယနေ့ အရောင်း မရှိသေးပါ။'))
        );
      };

      app.append(
        dl, cl,
        buildOwnerDashboard(),
        dropCard,
        h('div', { class: 'card' },
          h('label', {}, 'ပစ္စည်း (Product)'), pn,
          o2Wrap,
          h('div', { class: 'row' },
            h('div', {}, h('label', {}, 'ပမာဏ (Qty)'), qty),
            h('div', {}, h('label', {}, 'ယူနစ် (Unit)'), un)
          ),
          h('label', {}, 'ဈေးနှုန်း (Price)'), pr,
          h('label', { style: 'display:flex;align-items:center' }, foc, 'FOC (Revenue = 0, COGS တွက်မည်)'),
          h('button', { class: 'o', style: 'background:var(--navy)', onclick: addLine }, 'စာရင်းထဲ ထည့်မည် (Add)')
        ),
        msg,
        h('div', { class: 'card' },
          list, tot,
          h('label', {}, 'ရက်စွဲ (Date)'), dIn,
          h('label', {}, 'ပေးချေမှု (Payment)'), pay,
          siteTermWrap, cust, tagIn,
          h('label', {}, 'Discount (ကျပ်)'), discIn,
          saveBtn
        ),
        todayList
      );
      draw();
      drawToday();
    }

    // =========================================================================
    // 10. VIEW 2: PRODUCTS (EXPLICIT O2TYPE & BUY PRICE FOR COMMIT SNAPSHOT)
    // =========================================================================
    function viewProducts() {
      const app = $('#app');
      app.replaceChildren();
      const msg = h('div');
      const nn = h('input', { placeholder: 'ပစ္စည်းနာမည်' });
      const nc = h('select', {}, CATS.map(c => h('option', { value: c }, c)));
      const nu = h('select', {}, UNITS.map(u => h('option', { value: u }, u)));
      const no2 = h('select', {},
        h('option', { value: '' }, '-- Oxygen Type (အောက်ဆီဂျင်ဆိုလျှင် ၄ မျိုးမှ ရွေးပါ) --'),
        ...Object.values(O2_TYPES).map(t => h('option', { value: t.id }, o2Label(t.id) + ' [' + t.ownership + ']'))
      );
      const bp = h('input', { type: 'number', inputmode: 'numeric', placeholder: 'Buy Price / အရင်းဈေး' });
