          const dk = dateIn.value;
          const effAt = stampAt(dk);
          if (!(await guardMonthLock(effAt, msg))) return;

          const pm = paySel.value;
          const totalBill = ((df40 + df47 + down40) * o2Pr) + (dgasViss * gPr);
          const existingCust = customers().find(x => x.key === ck(siteName));
          const canonicalSite = existingCust ? existingCust.name : siteName;
          const isBackdate = isPast(dk);

          const gasDesc = (dgas > 0 || dgasViss > 0) ? (', Gas(' + dgas + ' လုံး / ' + r2(dgasViss) + ' viss)') : '';
          const confirmMsg = 'O2 Delivery မှတ်တမ်းတင်မည် (' + canonicalSite + ' · ' + fmtLogDate(dk) + ')\n' +
            '• အပြည့်ပို့: စက်ရုံ40L(' + df40 + '), စက်ရုံ47L(' + df47 + '), အပိုင်40L(' + down40 + ')' + gasDesc + '\n' +
            '• အခွံပြန်ယူ: စက်ရုံ40L(' + ef40 + '), စက်ရုံ47L(' + ef47 + '), အပိုင်40L(' + eown40 + ')' + (egas > 0 ? ', Gas(' + egas + ' လုံး)' : '') +
            (totalBill > 0 ? '\n• ကျသင့်ငွေ: ' + money(totalBill) + ' → ' + (pm === 'credit' ? 'အကြွေးစာရင်းထဲ တန်းဝင်မည်' : PAY[pm] + ' အရောင်းစာရင်းထဲ တန်းဝင်မည်') : '\n• ကျသင့်ငွေ: 0 ကျပ် (အိုးလက်ကျန်သက်သက် မှတ်ပါမည်)');

          if (!(await uiConfirm(confirmMsg))) return;
          saveDelivBtn.disabled = true;

          try {
            const pend = { g: {}, o: {} }, ov = { closed: {}, added: [], ops: [] };
            let gasAlloc = null;
            if (dgasViss > 0 && !isBackdate) {
              gasAlloc = await allocLine('gas', { gasRole: 'viss', gasViss: dgasViss }, pend.g, ov);
            }

            const delivId = uuid();
            const linkedSaleId = totalBill > 0 ? uuid() : null;
            const saleLines = [];
            if (df40 > 0) saleLines.push({ name: '40L O2 (စက်ရုံအိုး - Delivery)', qty: df40, unit: 'အိုး', price: o2Pr, foc: o2Pr === 0 });
            if (df47 > 0) saleLines.push({ name: '47L O2 (စက်ရုံအိုး - Delivery)', qty: df47, unit: 'အိုး', price: o2Pr, foc: o2Pr === 0 });
            if (down40 > 0) saleLines.push({ name: '40L O2 (အပိုင်အိုး - Delivery)', qty: down40, unit: 'အိုး', price: o2Pr, foc: o2Pr === 0 });
            if (dgasViss > 0) {
              saleLines.push({
                name: 'Gas (Delivery' + (dgas > 0 ? ' · ' + dgas + ' လုံး' : '') + ')',
                qty: dgasViss, unit: 'viss', price: gPr, foc: gPr === 0,
                gasViss: dgasViss, gasRole: 'viss',
                alloc: gasAlloc,
                cylId: gasAlloc && gasAlloc[0] ? gasAlloc[0].cyl : null
              });
            }

            await run(['cf', 'sales', 'gasEv'], 'readwrite', t => {
              const cfStore = t.objectStore('cf');
              if (!existingCust) {
                cfStore.add({ id: uuid(), at: effAt, type: 'cust', name: canonicalSite, phone: '' });
              }
              cfStore.add({
                id: delivId, at: effAt, type: 'o2site', site: canonicalSite,
                del40Fac: df40, del47Fac: df47, del40Own: down40,
                delGas: dgas, delGasViss: dgasViss,
                emp40Fac: ef40, emp47Fac: ef47, emp40Own: eown40, empGas: egas,
                o2Price: o2Pr, gasPrice: gPr, totalBill, pay: totalBill > 0 ? pm : 'none',
                saleId: linkedSaleId, note: noteIn.value.trim()
              });
              if (linkedSaleId && saleLines.length) {
                t.objectStore('sales').add({
                  id: linkedSaleId, at: effAt, hist: isBackdate, pay: pm,
                  parts: [{ m: pm, a: totalBill }],
                  cust: canonicalSite, tag: 'O2 Delivery',
                  lines: saleLines, total: totalBill
                });
              }
              ov.ops.forEach(o => { if (o.st === 'gasEv') t.objectStore('gasEv')[o.k](o.obj); });
            });

            selectedSiteKey = ck(canonicalSite);
            await reload();
            viewO2Delivery();
            note(msg, canonicalSite + ' Delivery မှတ်တမ်း သိမ်းဆည်းပြီးပါပြီ' + (totalBill > 0 ? ' (' + (pm === 'credit' ? 'အကြွေးစာရင်းထဲ ထည့်ပြီး' : PAY[pm] + ' အရောင်းထဲ ထည့်ပြီး') + ')' : ' (0 ကျပ်)') + '။', 1);
          } catch (err) {
            saveDelivBtn.disabled = false;
            if (err && err.message === 'CANCELLED') note(msg, 'ပယ်ဖျက်လိုက်ပါသည်။');
            else note(msg, 'မသိမ်းနိုင်ပါ: ' + (err && err.message || err));
          }
        }
      }, '✔ O2 Delivery မှတ်မည်');

      const totAll40Fac = sites.reduce((a, s) => a + s.f40, 0);
      const totAll47Fac = sites.reduce((a, s) => a + s.f47, 0);
      const totAll40Own = sites.reduce((a, s) => a + s.own40, 0);
      const totAllGas = sites.reduce((a, s) => a + s.gas, 0);

      const siteSummaryCard = h('div', { class: 'card', style: 'border:2px solid var(--navy)' },
        h('div', { style: 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px' },
          h('b', { style: 'font-size:15.5px' }, 'ဆိုဒ်အလိုက် အိုးလက်ကျန် စာရင်းချုပ် (' + sites.length + ' ဆိုဒ်)'),
          h('button', {
            class: 'n',
            style: 'padding:5px 10px;font-size:12.5px;font-weight:700;border-color:var(--org);color:#9A4308',
            onclick: () => openSiteOpeningModal('', async canon => {
              selectedSiteKey = ck(canon);
              await reload();
              viewO2Delivery();
            })
          }, '+ ဆိုဒ် အဖွင့်လက်ကျန် ထည့်မည်')
        ),
        h('div', { style: 'margin:4px 0' },
          h('small', {}, 'စုစုပေါင်း: စက်ရုံ40L (' + totAll40Fac + ') · စက်ရုံ47L (' + totAll47Fac + ') · အပိုင်40L (' + totAll40Own + ') · Gas (' + totAllGas + ' လုံး)')
        ),
        sites.length ? h('div', { style: 'overflow-x:auto' },
          h('table', { class: 'log-tbl' },
            h('thead', {}, h('tr', {},
              h('th', {}, 'ဆိုဒ် / ဖောက်သည်'),
              h('th', {}, 'စက်ရုံ 40L'),
              h('th', {}, 'စက်ရုံ 47L'),
              h('th', {}, 'အပိုင် 40L'),
              h('th', {}, 'O2 ပေါင်း'),
              h('th', {}, 'Gas အလုံး'),
              h('th', {}, 'ဇယား')
            )),
            h('tbody', {}, ...sites.map(s => {
              const o2Sum = s.f40 + s.f47 + s.own40;
              const isSel = selectedSiteKey === s.key;
              return h('tr', { style: isSel ? 'background:#FFF3E8' : '' },
                h('td', { class: 'dt-col' }, s.name),
                h('td', { style: 'font-weight:700' }, s.f40),
                h('td', { style: 'font-weight:700' }, s.f47),
                h('td', { style: 'font-weight:700;color:var(--org)' }, s.own40),
                h('td', { class: 'stk-col' }, o2Sum),
                h('td', {}, s.gas),
                h('td', {}, h('button', {
                  class: isSel ? '' : 'n',
                  style: 'padding:2px 8px;font-size:11.5px;min-height:26px',
                  onclick: () => { selectedSiteKey = isSel ? '' : s.key; viewO2Delivery(); }
                }, isSel ? 'ကြည့်နေသည်' : 'ကြည့်ရန်'))
              );
            }))
          )
        ) : h('div', { style: 'margin-top:6px' }, h('small', {}, 'ဆိုဒ်ပို့စာရင်း မရှိသေးပါ။ အပေါ်က "+ ဆိုဒ် အဖွင့်လက်ကျန် ထည့်မည်" သို့မဟုတ် အောက်တွင် စတင်ထည့်သွင်းပါ။'))
      );

      const activeSite = selectedSiteKey ? siteMap.get(selectedSiteKey) : (sites[0] || null);
      let siteLedgerCard = '';
      if (activeSite) {
        const siteSel = h('select', {
          style: 'width:auto;padding:5px 8px;font-weight:700',
          onchange: e => { selectedSiteKey = e.target.value; viewO2Delivery(); }
        }, ...sites.map(s => h('option', { value: s.key, selected: s.key === activeSite.key }, s.name)));

        const editSiteObBtn = h('button', {
          class: 'n',
          style: 'padding:4px 8px;font-size:12px',
          onclick: () => openSiteOpeningModal(activeSite.name, async canon => {
            selectedSiteKey = ck(canon);
            await reload();
            viewO2Delivery();
          })
        }, 'အဖွင့်လက်ကျန် ပြင်မည်');

        siteLedgerCard = h('div', { class: 'card', style: 'border:2px solid var(--org)' },
          h('div', { style: 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px' },
            h('b', { style: 'font-size:15.5px' }, 'ဆိုဒ်မှတ်တမ်းဇယား: ' + activeSite.name),
            h('div', { style: 'display:flex;gap:6px;align-items:center;flex-wrap:wrap' }, editSiteObBtn, siteSel)
          ),
          h('div', { style: 'overflow-x:auto' },
            h('table', { class: 'log-tbl' },
              h('thead', {},
                h('tr', {},
                  h('th', { rowspan: '2' }, 'ရက်စွဲ'),
                  h('th', { colspan: '4' }, 'အပြည့်ပို့ (Delivered)'),
                  h('th', { colspan: '4' }, 'အခွံပြန်ယူ (Empty)'),
                  h('th', { colspan: '4' }, 'ဆိုဒ်လက်ကျန် (Balance)'),
                  h('th', { rowspan: '2' }, 'ငွေရှင်းမှု / မှတ်ချက်')
                ),
                h('tr', { class: 'sub-h' },
                  h('th', {}, '40Lစက်'), h('th', {}, '47Lစက်'), h('th', {}, '40Lပိုင်'), h('th', {}, 'Gas (လုံး/viss)'),
                  h('th', {}, '40Lစက်'), h('th', {}, '47Lစက်'), h('th', {}, '40Lပိုင်'), h('th', {}, 'Gas'),
                  h('th', {}, '40Lစက်'), h('th', {}, '47Lစက်'), h('th', {}, '40Lပိုင်'), h('th', {}, 'Gas')
                )
              ),
              h('tbody', {},
                ...activeSite.entries.map(r => {
                  const bill = Number(r.totalBill) || 0;
                  const gasDelLabel = r.isOpening
                    ? (r.delGas || '')
                    : (r.delGas || r.delGasViss)
                      ? ((r.delGas || 0) + '/' + r2(r.delGasViss || 0))
                      : '';
                  const payTag = r.isOpening
                    ? h('span', { class: 'tag navy' }, 'အဖွင့်လက်ကျန် (0 ကျပ်)')
                    : bill <= 0
                      ? h('small', {}, r.note || '0 ကျပ်')
                      : r.pay === 'credit'
                        ? h('span', { class: 'tag red' }, 'အကြွေး ' + money(bill))
                        : h('span', { class: 'tag ok' }, (PAY[r.pay] || r.pay) + ' ' + money(bill));
                  return h('tr', { style: r.isOpening ? 'background:#F4F6F9' : '' },
                    h('td', { class: 'dt-col' }, fmtLogDate(dkey(r.at))),
                    h('td', { style: 'color:var(--ok);font-weight:700' }, r.del40Fac || ''),
                    h('td', { style: 'color:var(--ok);font-weight:700' }, r.del47Fac || ''),
                    h('td', { style: 'color:var(--ok);font-weight:700' }, r.del40Own || ''),
                    h('td', { style: 'color:var(--ok);font-weight:700;white-space:nowrap' }, gasDelLabel),
                    h('td', {}, r.emp40Fac || ''),
                    h('td', {}, r.emp47Fac || ''),
                    h('td', {}, r.emp40Own || ''),
                    h('td', {}, r.empGas || ''),
                    h('td', { class: 'stk-col' }, r.bal40Fac),
                    h('td', { class: 'stk-col' }, r.bal47Fac),
                    h('td', { class: 'stk-col' }, r.bal40Own),
                    h('td', { class: 'stk-col' }, r.balGas),
                    h('td', { class: 'rem-col' },
                      payTag,
                      r.note && !r.isOpening ? h('div', {}, h('small', {}, r.note)) : '',
                      h('button', {
                        class: 'g',
                        style: 'padding:1px 6px;font-size:11px;min-height:24px;float:right',
                        onclick: async () => {
                          if (!(await guardMonthLock(r.at, msg))) return;
                          if (!(await uiConfirm('ဒီမှတ်တမ်းကို ဖျက်မလား? (ချိတ်ဆက်ထားသော အရောင်း/အကြွေးကိုပါ ပယ်ဖျက်ပါမည်)'))) return;
                          await run(['cf', 'sales'], 'readwrite', t => {
                            t.objectStore('cf').delete(r.id);
                            if (r.saleId) {
                              const linked = sales.find(s => s.id === r.saleId);
                              if (linked) t.objectStore('sales').put({ ...linked, voided: true, voidedAt: Date.now() });
                            }
                          });
                          await reload();
                          viewO2Delivery();
                        }
                      }, '×')
                    )
                  );
                }),
                h('tr', { style: 'background:#E8EEF7;font-weight:700' },
                  h('td', { class: 'dt-col' }, 'လက်ရှိကျန်'),
                  h('td', { colspan: '4' }, 'O2 စုစုပေါင်း: ' + (activeSite.f40 + activeSite.f47 + activeSite.own40) + ' လုံး'),
                  h('td', { colspan: '4' }, ''),
                  h('td', { class: 'stk-col' }, activeSite.f40),
                  h('td', { class: 'stk-col' }, activeSite.f47),
                  h('td', { class: 'stk-col' }, activeSite.own40),
                  h('td', { class: 'stk-col' }, activeSite.gas),
                  h('td', { class: 'rem-col' }, 'လက်ကျန်')
                )
              )
            )
          )
        );
      }

      app.append(
        siteList,
        siteSummaryCard,
        msg,
        h('div', { class: 'card' },
          h('b', { style: 'font-size:15.5px' }, '+ ဆိုဒ်ပို့စာရင်း အသစ်ထည့်ရန် (O2 Delivery)'),
          h('div', { class: 'row' },
            h('div', {}, h('label', {}, 'ရက်စွဲ (Date)'), dateIn),
            h('div', {}, h('label', {}, 'ဆိုဒ် / ဖောက်သည်အမည်'), siteIn)
          ),
          h('div', { style: 'margin-top:8px;padding:8px;background:#F4F6F9;border-radius:7px' },
            h('b', { style: 'font-size:13.5px;color:var(--ok)' }, '၁။ အပြည့်ပို့ (Delivered Full)'),
            h('div', { class: 'row' },
              h('div', {}, h('label', {}, 'စက်ရုံ 40L'), d40FacIn),
              h('div', {}, h('label', {}, 'စက်ရုံ 47L'), d47FacIn),
              h('div', {}, h('label', {}, 'အပိုင် 40L'), d40OwnIn)
            ),
            h('div', { class: 'row' },
              h('div', {}, h('label', {}, 'Gas အိုး အလုံးရေ (Cyls)'), dGasIn),
              h('div', {}, h('label', {}, 'Gas ပိဿာ (Viss — ဥပမာ 5, 10)'), dGasVissIn)
            )
          ),
          h('div', { style: 'margin-top:8px;padding:8px;background:#F8FAFC;border:1px solid var(--ln);border-radius:7px' },
            h('b', { style: 'font-size:13.5px' }, '၂။ အခွံပြန်ယူ (Empty Picked Up)'),
            h('div', { class: 'row' },
              h('div', {}, h('label', {}, 'စက်ရုံ 40L အခွံ'), e40FacIn),
              h('div', {}, h('label', {}, 'စက်ရုံ 47L အခွံ'), e47FacIn),
              h('div', {}, h('label', {}, 'အပိုင် 40L အခွံ'), e40OwnIn),
              h('div', {}, h('label', {}, 'Gas အခွံ (အလုံး)'), eGasIn)
            )
          ),
          h('div', { class: 'row' },
            h('div', {}, h('label', {}, 'O2 တစ်လုံးဈေး (ပုံသေ 25,000)'), o2PriceIn),
            h('div', {}, h('label', {}, 'Gas ၁ ပိဿာဈေး (0 ထည့်နိုင်သည်)'), gasPriceIn)
          ),
          h('label', {}, 'ငွေရှင်းမှု အခြေအနေ (အကြွေး / အရောင်း တန်းဝင်)'),
          paySel,
          h('label', {}, 'လက်မှတ် / မှတ်ချက်'),
          noteIn,
          totPreview,
          saveDelivBtn
        ),
        siteLedgerCard
      );
    }

    // =========================================================================
    // 10. NAVIGATION, BOOT & SERVICE WORKER (v24-s13)
    // =========================================================================
    const VIEWS = {
      1: viewSale,
      2: viewProducts,
      3: viewGas,
      4: viewCust,
      5: viewData,
      6: viewOxy,
      7: viewExp,
      8: viewReport,
      9: viewO2Delivery
    };
    const show = n => {
      tab = n;
      for (let i = 1; i <= 9; i++) {
        const b = $('#t' + i);
        if (b) b.className = i == n ? 'on' : '';
      }
      try { $('#t' + n).scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {}
      VIEWS[n]();
    };
    for (let i = 1; i <= 9; i++) {
      const b = $('#t' + i);
      if (b) b.onclick = () => show(i);
    }
    const net = () => {
      const e = $('#net');
      if (!e) return;
      e.textContent = navigator.onLine ? 'အွန်လိုင်း' : 'အော့ဖ်လိုင်း (ဆက်သုံးနိုင်)';
      e.className = navigator.onLine ? '' : 'off';
      if (navigator.onLine) scheduleAutoSync();
    };
    addEventListener('online', net);
    addEventListener('offline', net);
    net();

    async function bootApp() {
      try {
        db = await open();
        await seed();
        await ensureGas();
        await fixUnits();
        await reload();
        await runAutoDailySnapshot();
        show(1);
        hideSplash();
        if (navigator.onLine && getSyncUrl()) {
          runCloudSync({ silent: true, pushOnly: false });
        }
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
          navigator.serviceWorker.register('sw.js?v=24s13').catch(() => {});
        }
      } catch (e) {
        hideSplash();
        $('#app').append(h('div', { class: 'msg e' }, 'ဖုန်းထဲ သိမ်းဆည်းမှု မဖွင့်နိုင်ပါ: ' + (e && e.message || e) + '။ Private/Incognito မဟုတ်တဲ့ Chrome မှာ ဖွင့်ပါ။'));
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', bootApp);
    } else {
      bootApp();
    }
  </script>
</body>
</html>
