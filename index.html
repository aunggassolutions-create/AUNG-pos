<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#334155">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <title>AUNG Gas Solutions POS v24</title>
  <style>
    :root {
      --grey: #334155;
      --grey-dark: #1E293B;
      --grey-mid: #475569;
      --org: #EA580C;
      --org-soft: #FFEDD5;
      --bg: #F3F4F6;
      --card: #FFFFFF;
      --ln: #D1D5DB;
      --red: #B91C1C;
      --red-bg: #FEE2E2;
      --ok: #15803D;
      --ok-bg: #DCFCE7;
      --warn-bg: #FFF7ED;
      --info-bg: #E5E7EB;
      --mut: #6B7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--grey-dark);
      font-family: "Noto Sans Myanmar", "Myanmar Text", system-ui, -apple-system, sans-serif;
      line-height: 1.6;
      padding-bottom: 84px;
      overflow-x: hidden;
    }
    #splash {
      position: fixed;
      inset: 0;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity .35s ease, visibility .35s ease;
    }
    #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    header {
      background: var(--grey-dark);
      color: #FFFFFF;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 3px solid var(--org);
      box-shadow: 0 2px 6px rgba(31, 41, 55, .18);
    }
    header .brand { font-size: 16px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    header .brand span.acc { color: #FB923C; }
    header .hdr-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .lang-btn {
      background: var(--grey-mid);
      color: #FFFFFF;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 700;
      min-height: 28px;
      cursor: pointer;
    }
    #net {
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 12px;
      background: var(--ok);
      color: #fff;
      font-weight: 600;
    }
    #net.off { background: var(--org); }
    main { padding: 12px; max-width: 780px; margin: auto; }
    h2 { font-size: 16px; margin: 12px 0 6px; color: var(--grey-dark); }
    .card {
      background: var(--card);
      border: 1px solid var(--ln);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(31, 41, 55, .05);
    }
    .card.kpi-box { border-left: 4px solid var(--grey); }
    .card.kpi-box.org { border-left-color: var(--org); }
    .card.kpi-box.ok { border-left-color: var(--ok); }
    .card.kpi-box.warn { border-left-color: var(--red); }
    .kpi-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 10px; }
    @media (min-width: 640px) { .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    .kpi-val { font-size: 15px; font-weight: 700; margin-top: 2px; word-break: break-word; }
    label { display: block; font-size: 13px; margin-top: 8px; font-weight: 600; color: var(--grey-dark); }
    input, select, textarea {
      width: 100%;
      padding: 9px 10px;
      font: inherit;
      border: 1px solid var(--ln);
      border-radius: 8px;
      background: #FFFFFF;
      color: var(--grey-dark);
      margin-top: 3px;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
    .row > * { flex: 1 1 130px; min-width: 0; }
    button {
      font: inherit;
      border: 0;
      border-radius: 8px;
      padding: 9px 12px;
      background: var(--grey);
      color: #FFFFFF;
      cursor: pointer;
      min-height: 40px;
      font-weight: 600;
    }
    button.o { background: var(--org); color: #FFFFFF; font-weight: 700; width: 100%; margin-top: 10px; padding: 11px 14px; }
    button.g { background: #FFFFFF; color: var(--red); border: 1px solid var(--red); padding: 6px 10px; font-size: 12.5px; min-height: 34px; }
    button.n { background: #FFFFFF; color: var(--grey-dark); border: 1px solid var(--grey); padding: 7px 10px; font-size: 12.5px; min-height: 35px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .sub-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .sub-tabs button { flex: 1 1 90px; padding: 8px 6px; font-size: 12.5px; min-height: 36px; background: #E5E7EB; color: var(--grey-dark); border: 1px solid var(--ln); }
    .sub-tabs button.on { background: var(--grey-dark); color: #FFFFFF; border-color: var(--grey-dark); }
    .li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--ln); }
    .li:last-child { border-bottom: 0; }
    .tag { font-size: 11px; background: var(--org-soft); color: #9A3412; border-radius: 5px; padding: 1px 6px; margin-left: 4px; display: inline-block; font-weight: 700; }
    .tag.b { background: var(--info-bg); color: var(--grey-dark); }
    .tag.g { background: var(--ok-bg); color: var(--ok); }
    .tag.r { background: var(--red-bg); color: var(--red); }
    .tot { font-size: 18px; font-weight: 700; text-align: right; margin-top: 8px; color: var(--grey-dark); }
    .void { text-decoration: line-through; opacity: .55; }
    .msg { padding: 9px 11px; border-radius: 8px; margin: 8px 0; font-size: 13px; white-space: pre-line; font-weight: 600; }
    .msg.e { background: var(--red-bg); color: var(--red); border: 1px solid #FCA5A5; }
    .msg.k { background: var(--ok-bg); color: var(--ok); border: 1px solid #86EFAC; }
    .msg.w { background: var(--warn-bg); color: #9A3412; border: 1px solid #FDBA74; }
    .msg.i { background: var(--info-bg); color: var(--grey-dark); border: 1px solid #D1D5DB; }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: #FFFFFF;
      border-top: 2px solid var(--grey-dark);
      overflow-x: auto;
      z-index: 25;
    }
    nav button {
      flex: 0 0 auto;
      min-width: 22vw;
      background: #FFFFFF;
      color: var(--grey-dark);
      border-radius: 0;
      padding: 11px 6px;
      font-weight: 700;
      font-size: 12px;
      white-space: nowrap;
      min-height: 50px;
    }
    @media (min-width: 720px) { nav button { min-width: auto; flex: 1 1 0; } }
    nav button.on { background: var(--org); color: #FFFFFF; }
    small { color: var(--mut); }
    .tbl-wrap { width: 100%; overflow-x: auto; }
    .st-tbl { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
    .st-tbl th, .st-tbl td { border: 1px solid var(--ln); padding: 6px; text-align: right; }
    .st-tbl th:first-child, .st-tbl td:first-child { text-align: left; }
    .st-tbl th { background: #F3F4F6; color: var(--grey-dark); font-weight: 700; }
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(31, 41, 55, .72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 80;
    }
    .modal-box {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, .28);
      max-height: 90vh;
      overflow-y: auto;
    }
    #rcpt { display: none; }
    @media print {
      @page { size: 80mm auto; margin: 3mm; }
      body { background: #FFFFFF; padding: 0; margin: 0; }
      header, main, nav, #splash, .modal-bg { display: none !important; }
      #rcpt {
        display: block;
        width: 72mm;
        margin: 0 auto;
        color: #000000;
        font-family: "Noto Sans Myanmar", "Myanmar Text", monospace, sans-serif;
        line-height: 1.48;
        font-size: 12px;
      }
      #rcpt .c { text-align: center; }
      #rcpt .r { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
      #rcpt .r.b { font-weight: 700; }
      #rcpt .r span:last-child { white-space: nowrap; }
      #rcpt .big { font-size: 1.42em; font-weight: 900; letter-spacing: 0.5px; }
      #rcpt .dd { border-top: 1.5px dashed #000; margin: 7px 0; }
      #rcpt .ss { border-top: 2.5px solid #000; margin: 7px 0 4px; }
      #rcpt .it { margin: 5px 0; }
      #rcpt .nm { font-weight: 700; }
      #rcpt .tt { font-size: 1.32em; font-weight: 800; }
      #rcpt .ft { margin-top: 8px; text-align: center; font-size: 11px; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <svg width="240" height="115" viewBox="0 0 320 155" xmlns="http://www.w3.org/2000/svg" aria-label="AUNG Gas Solutions">
      <text x="160" y="88" text-anchor="middle" font-family="Impact,'Arial Black',system-ui,sans-serif" font-weight="900" font-size="94" letter-spacing="2" fill="#334155">AUNG</text>
      <text x="160" y="135" text-anchor="middle" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="40" letter-spacing="-0.5" fill="#EA580C">Gas Solutions</text>
    </svg>
    <small style="margin-top:4px;font-weight:700;color:#334155">POS v24 · Offline Ready</small>
  </div>

  <header>
    <div class="brand">
      <span>AUNG <span class="acc">Gas Solutions</span></span>
      <span class="tag b" id="roleBadge">OWNER</span>
    </div>
    <div class="hdr-right">
      <button class="lang-btn" id="langBtn">MM / EN</button>
      <span id="net"></span>
    </div>
  </header>

  <main id="app"></main>

  <nav>
    <button id="t1">ရောင်းချမှု</button>
    <button id="t2">ပစ္စည်းများ</button>
    <button id="t3">Gas စာရင်း</button>
    <button id="t6">Oxygen</button>
    <button id="t4">ဖောက်သည်</button>
    <button id="t7">စရိတ်/ချေးငွေ</button>
    <button id="t8">စာရင်းချုပ်</button>
    <button id="t5">ဒေတာ</button>
  </nav>

  <div id="rcpt"></div>

  <script>
    // =========================================================================
    // 1. GLOBAL ERROR GUARD & UTILITIES
    // =========================================================================
    window.onerror = function(msg) {
      const app = document.getElementById('app');
      if (app && !app.innerHTML.trim()) {
        app.innerHTML = '<div class="msg e">Error: ' + String(msg) + '</div>';
      }
    };
    setTimeout(() => {
      const sp = document.getElementById('splash');
      if (sp) sp.classList.add('hide');
    }, 650);

    const $ = s => document.querySelector(s);
    const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
    const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    const money = n => (Math.round(Number(n) || 0)).toLocaleString() + ' MMK';
    const dkey = t => {
      const d = new Date(t || Date.now());
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return y + '-' + m + '-' + day;
    };
    const mkey = t => dkey(t).slice(0, 7);
    const ddisp = dk => {
      if (!dk) return '';
      const p = String(dk).split('-');
      return p.length === 3 ? (p[1] + '/' + p[2] + '/' + p[0]) : dk;
    };
    const tm = t => {
      const d = new Date(t || Date.now());
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    };
    const sd_ = t => t ? (dkey(t) + ' ' + tm(t)) : '';
    const ck = name => String(name || '').trim().toLowerCase().replace(/\s+/g, ' ');
    const parseDateTs = dk => {
      if (!dk) return Date.now();
      const parts = String(dk).split('-').map(Number);
      if (parts.length !== 3) return Date.now();
      return new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0).getTime();
    };

    function h(tag, attrs, ...children) {
      const el = document.createElement(tag);
      if (attrs) {
        for (const [k, v] of Object.entries(attrs)) {
          if (v == null || v === false) continue;
          if (k === 'class') el.className = v;
          else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2).toLowerCase(), v);
          else if (k === 'checked' || k === 'disabled' || k === 'selected') el[k] = Boolean(v);
          else el.setAttribute(k, String(v));
        }
      }
      for (const ch of children.flat()) {
        if (ch == null || ch === false) continue;
        el.appendChild(typeof ch === 'object' ? ch : document.createTextNode(String(ch)));
      }
      return el;
    }

    function uiAlert(msg, title) {
      return new Promise(resolve => {
        const bg = h('div', { class: 'modal-bg' },
          h('div', { class: 'modal-box' },
            h('b', { style: 'font-size:15.5px' }, title || 'AUNG Gas Solutions'),
            h('div', { style: 'margin:10px 0;white-space:pre-line;font-size:13.5px' }, String(msg)),
            h('button', { class: 'o', onclick: () => { bg.remove(); resolve(); } }, 'အိုကေ (OK)')
          )
        );
        document.body.appendChild(bg);
      });
    }

    function uiConfirm(msg, title) {
      return new Promise(resolve => {
        const bg = h('div', { class: 'modal-bg' },
          h('div', { class: 'modal-box' },
            h('b', { style: 'font-size:15.5px' }, title || 'အတည်ပြုပါ (Confirm)'),
            h('div', { style: 'margin:10px 0;white-space:pre-line;font-size:13.5px' }, String(msg)),
            h('div', { class: 'row' },
              h('button', { class: 'n', onclick: () => { bg.remove(); resolve(false); } }, 'မလုပ်ပါ'),
              h('button', { class: 'o', style: 'margin-top:0', onclick: () => { bg.remove(); resolve(true); } }, 'အတည်ပြုမည်')
            )
          )
        );
        document.body.appendChild(bg);
      });
    }

    // =========================================================================
    // 2. INDEXEDDB SAFE MULTI-VERSION UPGRADE (PRESERVING EXISTING v23 DATA)
    // =========================================================================
    const DB_NAME = 'aung-gas-pos';
    const ALL_STORES = [
      'products', 'sales', 'stk', 'cf', 'ob', 'meta',
      'o2cust', 'o2move', 'facbill', 'facsettle', 'comp',
      'locked_months', 'period_reopen_log', 'conflict_queue'
    ];
    let db = null;

    function openDB() {
      return new Promise((resolve, reject) => {
        const probe = indexedDB.open(DB_NAME);
        probe.onerror = () => reject(probe.error);
        probe.onsuccess = () => {
          const curDb = probe.result;
          const curVer = curDb.version || 4;
          const missing = ALL_STORES.filter(s => !curDb.objectStoreNames.contains(s));
          if (missing.length === 0) {
            db = curDb;
            resolve(db);
            return;
          }
          curDb.close();
          const nextVer = curVer + 1;
          const req = indexedDB.open(DB_NAME, nextVer);
          req.onerror = () => reject(req.error);
          req.onupgradeneeded = e => {
            const udb = e.target.result;
            ALL_STORES.forEach(s => {
              if (!udb.objectStoreNames.contains(s)) {
                udb.createObjectStore(s, { keyPath: 'id' });
              }
            });
          };
          req.onsuccess = () => {
            db = req.result;
            resolve(db);
          };
        };
      });
    }

    function getAllSafe(store) {
      return new Promise(resolve => {
        if (!db || !db.objectStoreNames.contains(store)) return resolve([]);
        try {
          const tx = db.transaction([store], 'readonly');
          const req = tx.objectStore(store).getAll();
          req.onsuccess = () => resolve(req.result || []);
          req.onerror = () => resolve([]);
        } catch (e) {
          resolve([]);
        }
      });
    }

    function putRec(store, obj) {
      return new Promise((resolve, reject) => {
        if (!db || !db.objectStoreNames.contains(store)) return resolve();
        const tx = db.transaction([store], 'readwrite');
        tx.objectStore(store).put(obj);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    function txWrite(storeNames, fn) {
      return new Promise((resolve, reject) => {
        const valid = [...new Set(storeNames)].filter(s => db && db.objectStoreNames.contains(s));
        if (!valid.length) return resolve();
        const tx = db.transaction(valid, 'readwrite');
        const stores = {};
        valid.forEach(s => { stores[s] = tx.objectStore(s); });
        try {
          fn(stores);
        } catch (err) {
          tx.abort();
          return reject(err);
        }
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error || new Error('Transaction failed'));
        tx.onabort = () => reject(tx.error || new Error('Transaction aborted'));
      });
    }

    // =========================================================================
    // 3. STATE, CONSTANTS & DOMAIN RULES
    // =========================================================================
    const AGENTS = {
      'TT Gas': { kg: 48, viss: 28.5 },
      'NGN': { kg: 48, viss: 28.5 },
      'Easy Gas': { kg: 50, viss: 30.0 }
    };

    const O2_TYPES = {
      '40L_FACTORY': { id: '40L_FACTORY', label: '40L စက်ရုံအိုး', ownership: 'factory', fillCost: 19500 },
      '47L_FACTORY': { id: '47L_FACTORY', label: '47L စက်ရုံအိုး', ownership: 'factory', fillCost: 23500 },
      '40L_OWN': { id: '40L_OWN', label: '40L အပိုင်', ownership: 'shop', fillCost: 19500 },
      'OVER_40L_OWN': { id: 'OVER_40L_OWN', label: 'Over 40L အပိုင်', ownership: 'shop', fillCost: 25000 }
    };

    let products = [], sales = [], stk = [], cf = [], ob = [], meta = [];
    let o2cust = [], o2move = [], facbill = [], facsettle = [], comp = [];
    let locked_months = [], period_reopen_log = [], conflict_queue = [];

    let tab = 1;
    let repTab = 1;
    let expSubTab = 1;
    let o2SubTab = 1;
    let cart = [];
    let lang = 'my';
    let bk = null;
    let rc = {
      head: 'သာကေတ၊ ရန်ကုန်မြို့\nLPG ဓာတ်ငွေ့ နှင့် အောက်ဆီဂျင် ရောင်းဝယ်ရေး',
      foot: 'ဝယ်ယူအားပေးမှုကို ကျေးဇူးတင်ပါသည်။',
      size: 3
    };
    let cfg = { motherCap: 55, motherConfirmed: false, rent2026: 750000, rent2027: null };

    function getMeta(id) {
      const f = meta.find(x => x.id === id);
      return f ? f.val : null;
    }
    async function setMeta(id, val) {
      const rec = { id, val, updatedAt: Date.now() };
      const idx = meta.findIndex(x => x.id === id);
      if (idx >= 0) meta[idx] = rec; else meta.push(rec);
      await putRec('meta', rec);
    }

    function tr(k) {
      const dict = {
        my: { lastBackup: 'နောက်ဆုံး Backup အချိန်', neverBackup: 'မပြုလုပ်ရသေးပါ' },
        en: { lastBackup: 'Last Backup Time', neverBackup: 'Not yet backed up' }
      };
      return (dict[lang] && dict[lang][k]) || k;
    }

    function isMonthLocked(mk) {
      const f = locked_months.find(x => x.id === mk);
      return Boolean(f && f.locked);
    }

    function checkLockOrThrow(tsOrDateKey) {
      const mk = String(tsOrDateKey).length === 7 ? tsOrDateKey : mkey(tsOrDateKey);
      if (isMonthLocked(mk)) {
        throw new Error('Month Hard Lock: ' + mk + ' လကို စာရင်းပိတ်ထားပါသည်။ ပြင်ဆင်လိုပါက ဒေတာ Tab မှ Reopen အရင်လုပ်ပါ။');
      }
    }

    // =========================================================================
    // 4. GAS INVENTORY, SUPPLIER LATEST COST, WEIGHT VARIANCE & BUY-BACK
    // =========================================================================
    function gasLatestSupplierPrices() {
      const res = {};
      Object.keys(AGENTS).forEach(ag => {
        const intakes = stk
          .filter(x => !x.voided && x.type === 'gasin' && x.agent === ag && (Number(x.cost) || 0) > 0)
          .sort((a, b) => (b.at || 0) - (a.at || 0));
        if (intakes.length) {
          const latest = intakes[0];
          const nom = AGENTS[ag].viss;
          const cyls = Math.max(Number(latest.cyls) || 1, 1);
          const costPerCyl = (Number(latest.cost) || 0) / cyls;
          res[ag] = {
            agent: ag,
            perViss: costPerCyl / nom,
            costPerCyl,
            effectiveDate: dkey(latest.at),
            confirmed: true
          };
        } else {
          res[ag] = { agent: ag, perViss: 3000, costPerCyl: 3000 * AGENTS[ag].viss, effectiveDate: null, confirmed: false };
        }
      });
      return res;
    }

    function gasStockState(upToDateKey) {
      const endTs = upToDateKey ? (parseDateTs(upToDateKey) + 43199999) : Infinity;
      const byAgent = {
        'TT Gas': { full: 0, empty: 0, viss: 0 },
        'NGN': { full: 0, empty: 0, viss: 0 },
        'Easy Gas': { full: 0, empty: 0, viss: 0 }
      };
      let slotViss = { agent: 'TT Gas', rem: 0, cylOpen: false };
      let slotCan = { agent: 'TT Gas', rem: 0, cylOpen: false, cans: 0 };
      let buyBackViss = 0;
      let buyBackValue = 0;

      const events = [
        ...stk.filter(x => !x.voided && (x.at || 0) <= endTs).map(x => ({ kind: 'stk', at: x.at || 0, d: x })),
        ...sales.filter(s => !s.voided && (s.at || 0) <= endTs).map(s => ({ kind: 'sale', at: s.at || 0, d: s }))
      ].sort((a, b) => a.at - b.at);

      for (const ev of events) {
        if (ev.kind === 'stk') {
          const x = ev.d;
          const ag = byAgent[x.agent] ? x.agent : 'TT Gas';
          const nom = AGENTS[ag].viss;
          if (x.type === 'gasopen') {
            Object.keys(byAgent).forEach(k => {
              byAgent[k].full = Number(x['full_' + k]) || 0;
              byAgent[k].empty = Number(x['empty_' + k]) || 0;
              byAgent[k].viss = byAgent[k].full * AGENTS[k].viss;
            });
            slotViss = { agent: x.vissAgent || 'TT Gas', rem: Number(x.vissRem) || 0, cylOpen: (Number(x.vissRem) || 0) > 0 };
            slotCan = { agent: x.canAgent || 'TT Gas', rem: Number(x.canRem) || 0, cylOpen: (Number(x.canRem) || 0) > 0, cans: Number(x.cans) || 0 };
          } else if (x.type === 'gasin') {
            const c = Number(x.cyls) || 0;
            const actualV = Number(x.actualViss) > 0 ? Number(x.actualViss) : (c * nom);
            byAgent[ag].full += c;
            byAgent[ag].empty = Math.max(0, byAgent[ag].empty - (Number(x.emptyReturned) || 0));
            byAgent[ag].viss += actualV;
          } else if (x.type === 'gasswap') {
            const slot = x.slot === 'can' ? slotCan : slotViss;
            if (byAgent[ag].full > 0) {
              byAgent[ag].full -= 1;
              byAgent[ag].empty += 1;
            }
            slot.agent = ag;
            slot.rem = r2(slot.rem + nom);
            slot.cylOpen = true;
          } else if (x.type === 'gasadj') {
            const slot = x.slot === 'can' ? slotCan : slotViss;
            slot.rem = Math.max(0, Number(x.newRem) || 0);
          } else if (x.type === 'gascanfill') {
            const usedV = Number(x.usedViss) || 0;
            const cMade = Number(x.cansMade) || 0;
            slotCan.rem = Math.max(0, r2(slotCan.rem - usedV));
            slotCan.cans += cMade;
          } else if (x.type === 'gasret') {
            const rv = Number(x.viss) || 0;
            const rcCost = Number(x.cost) || 0;
            buyBackViss = r2(buyBackViss + rv);
            buyBackValue += rcCost;
          }
        } else {
          const s = ev.d;
          for (const l of (s.lines || [])) {
            const gv = Number(l.gasViss) || 0;
            if (gv > 0) {
              let need = gv;
              if (buyBackViss > 0) {
                const takeBb = Math.min(buyBackViss, need);
                const avgBb = buyBackViss > 0 ? (buyBackValue / buyBackViss) : 0;
                buyBackViss = r2(buyBackViss - takeBb);
                buyBackValue = Math.max(0, buyBackValue - takeBb * avgBb);
                need = r2(need - takeBb);
              }
              if (need > 0) {
                slotViss.rem = Math.max(0, r2(slotViss.rem - need));
                const ag = slotViss.agent || 'TT Gas';
                byAgent[ag].viss = Math.max(0, r2(byAgent[ag].viss - need));
              }
            }
            if (l.isGasCan) {
              slotCan.cans = Math.max(0, slotCan.cans - (Number(l.qty) || 0));
            }
          }
        }
      }

      const fullTotal = Object.values(byAgent).reduce((a, b) => a + b.full, 0);
      const emptyTotal = Object.values(byAgent).reduce((a, b) => a + b.empty, 0);
      const fullVissTotal = Object.keys(byAgent).reduce((a, k) => a + byAgent[k].full * AGENTS[k].viss, 0);
      const totalGroundV = r2(fullVissTotal + slotViss.rem + slotCan.rem + buyBackViss);

      return {
        byAgent,
        slotViss,
        slotCan,
        buyBackViss,
        buyBackValue,
        fullTotal,
        emptyTotal,
        totalGroundV
      };
    }

    function dailyGasReconcile(dk) {
      const prevTs = parseDateTs(dk) - 86400000;
      const prevDk = dkey(prevTs);
      const savedOpen = stk.find(x => !x.voided && x.type === 'gasdayopen' && dkey(x.at) === dk);
      const prevGround = gasStockState(prevDk).totalGroundV;
      const openV = savedOpen ? Number(savedOpen.openViss) : prevGround;

      const dayIntakes = stk.filter(x => !x.voided && x.type === 'gasin' && dkey(x.at) === dk);
      const inParts = [];
      let inV = 0;
      dayIntakes.forEach(x => {
        const nom = (AGENTS[x.agent] || AGENTS['TT Gas']).viss;
        const c = Number(x.cyls) || 0;
        const v = Number(x.actualViss) > 0 ? Number(x.actualViss) : c * nom;
        inV = r2(inV + v);
        inParts.push(x.agent + ' ' + c + ' × ' + nom + ' = ' + r2(v));
      });

      const dayBuyBacks = stk.filter(x => !x.voided && x.type === 'gasret' && dkey(x.at) === dk);
      const bbV = r2(dayBuyBacks.reduce((a, x) => a + (Number(x.viss) || 0), 0));

      let soldV = 0;
      sales.filter(s => !s.voided && dkey(s.at) === dk).forEach(s => {
        (s.lines || []).forEach(l => {
          if (Number(l.gasViss) > 0) soldV = r2(soldV + Number(l.gasViss));
        });
      });

      const dayCanSwaps = stk.filter(x => !x.voided && x.type === 'gasswap' && x.slot === 'can' && dkey(x.at) === dk);
      let canSwapV = 0;
      const canSwapParts = [];
      dayCanSwaps.forEach(x => {
        const nom = (AGENTS[x.agent] || AGENTS['TT Gas']).viss;
        canSwapV = r2(canSwapV + nom);
        canSwapParts.push(x.agent + ' (' + nom + ' viss)');
      });

      const bookV = r2(openV + inV + bbV - soldV - canSwapV);
      const ground = gasStockState(dk);
      const diffV = r2(ground.totalGroundV - bookV);

      return {
        openV,
        inV,
        inText: inParts.join(', '),
        bbV,
        soldV,
        canSwapV,
        canSwapText: canSwapParts.join(', '),
        bookV,
        ground,
        diffV
      };
    }

    // =========================================================================
    // 5. OXYGEN 4-TYPE INVENTORY, PICKUP VS PAYMENT, MOTHER CYL & COMPENSATION
    // =========================================================================
    function o2Label(t) {
      return (O2_TYPES[t] && O2_TYPES[t].label) || t;
    }

    function o2StockMatrix() {
      const mat = {};
      Object.values(O2_TYPES).forEach(t => {
        mat[t.id] = { ...t, full: 0, empty: 0, custody: 0, payable: 0, waitingPickup: 0 };
      });
      o2move.filter(m => !m.voided).forEach(m => {
        const t = mat[m.o2type];
        if (!t) return;
        const q = Number(m.qty) || 0;
        if (m.movementType === 'baseline') {
          t.full += Number(m.full) || 0;
          t.empty += Number(m.empty) || 0;
        } else if (m.movementType === 'counter_swap') {
          t.full -= q;
          t.empty += q;
        } else if (m.movementType === 'site_keep') {
          t.full -= q;
          t.custody += q;
        } else if (m.movementType === 'site_swap') {
          t.full -= q;
          t.empty += q;
        } else if (m.movementType === 'cust_return') {
          t.custody -= q;
          t.empty += q;
        } else if (m.movementType === 'fac_send_empty') {
          t.empty -= q;
        } else if (m.movementType === 'fac_recv_full') {
          t.full += q;
        } else if (m.movementType === 'cyl_lost_retire') {
          t.custody -= q;
        }
      });
      sales.filter(s => !s.voided && s.isO2Dropoff && !s.pickedUpAt).forEach(s => {
        (s.lines || []).forEach(l => {
          if (l.o2type && mat[l.o2type]) mat[l.o2type].waitingPickup += Number(l.qty) || 0;
        });
      });
      facbill.filter(b => !b.voided).forEach(b => {
        const t = mat[b.o2type];
        if (!t) return;
        const paid = facsettle.filter(x => !x.voided && x.billId === b.id).reduce((a, x) => a + (Number(x.amt) || 0), 0);
        t.payable += Math.max(0, (Number(b.total) || 0) - paid);
      });
      return mat;
    }

    function custO2Custody(cKey, o2type) {
      let c = 0;
      o2move.filter(m => !m.voided && ck(m.cust) === cKey && m.o2type === o2type).forEach(m => {
        const q = Number(m.qty) || 0;
        if (m.movementType === 'site_keep') c += q;
        else if (m.movementType === 'cust_return' || m.movementType === 'cyl_lost_retire') c -= q;
      });
      return Math.max(0, c);
    }

    // =========================================================================
    // 6. CUSTOMERS, CASH FLOW (v23 EXACT) & P&L ENGINE
    // =========================================================================
    function customers() {
      const map = new Map();
      const ensure = name => {
        const raw = String(name || '').trim();
        if (!raw) return null;
        const key = ck(raw);
        if (!map.has(key)) {
          map.set(key, { key, name: raw, bal: 0, compBal: 0, tx: [] });
        }
        return map.get(key);
      };

      ob.filter(x => !x.voided).forEach(x => {
        const c = ensure(x.cust);
        if (!c) return;
        const amt = Number(x.amt) || 0;
        c.bal += amt;
        c.tx.push({ at: x.at || 0, label: 'Opening Balance', amt, kind: 'ob' });
      });

      sales.filter(s => !s.voided).forEach(s => {
        if (!s.cust) return;
        const c = ensure(s.cust);
        if (!c) return;
        if (s.isO2Dropoff && !s.pickedUpAt) return;
        const due = Math.max(0, (Number(s.total) || 0) - (Number(s.paidAtSale) || 0));
        if (due > 0 || s.term !== 'immediate') {
          c.bal += due;
          c.tx.push({ at: s.pickedUpAt || s.at, label: 'Sale #' + s.id.slice(-5).toUpperCase(), amt: due, kind: 'sale', saleId: s.id });
        }
      });

      cf.filter(e => !e.voided && e.type === 'debtpay').forEach(e => {
        const c = ensure(e.cust);
        if (!c) return;
        const amt = Number(e.amt) || 0;
        c.bal -= amt;
        c.tx.push({ at: e.at, label: 'ကြွေးဆပ် (' + (e.ch || 'cash').toUpperCase() + ')', amt: -amt, kind: 'pay' });
      });

      comp.filter(x => !x.voided).forEach(x => {
        const c = ensure(x.cust);
        if (!c) return;
        const amt = Number(x.amt) || 0;
        if (x.kind === 'charge') {
          c.compBal += amt;
          c.tx.push({ at: x.at, label: 'အိုးပျောက်လျော်ကြေး (' + o2Label(x.o2type) + ')', amt, kind: 'comp_charge' });
        } else if (x.kind === 'pay') {
          c.compBal -= amt;
          c.tx.push({ at: x.at, label: 'လျော်ကြေးပေးသွင်း (' + (x.ch || 'cash').toUpperCase() + ')', amt: -amt, kind: 'comp_pay' });
        }
      });

      return Array.from(map.values()).sort((a, b) => (b.bal + b.compBal) - (a.bal + a.compBal));
    }

    function lineGrossAmt(l) {
      if (l.foc) return 0;
      return (Number(l.qty) || 0) * (Number(l.price) || 0);
    }

    function payLabel(s) {
      if (s.isO2Dropoff && !s.pickedUpAt) return 'Awaiting Pickup';
      const paid = Number(s.paidAtSale) || 0;
      const tot = Number(s.total) || 0;
      if (paid >= tot) return (s.ch || 'cash').toUpperCase();
      if (paid > 0) return (s.ch || 'cash').toUpperCase() + ' (' + paid.toLocaleString() + ') + အကြွေး';
      return 'အကြွေး (' + termLabel(s.term || 'credit') + ')';
    }

    function termLabel(t) {
      const m = { immediate: 'လက်ငင်းရှင်း', roundtrip: 'ခေါက်ပြန်ရှင်း', '15days': '၁၅ ရက်တစ်ခါရှင်း', monthend: 'လကုန်ရှင်း', credit: 'အကြွေး' };
      return m[t] || t;
    }

    function flows(targetDk) {
      const chs = ['cash', 'kpay', 'wave', 'aya'];
      const open = { cash: 0, kpay: 0, wave: 0, aya: 0 };
      const inn = { cash: 0, kpay: 0, wave: 0, aya: 0 };
      const out = { cash: 0, kpay: 0, wave: 0, aya: 0 };

      const addIn = (dk, ch, amt) => {
        if (!chs.includes(ch)) ch = 'cash';
        if (dk < targetDk) open[ch] += amt;
        else if (dk === targetDk) inn[ch] += amt;
      };
      const addOut = (dk, ch, amt) => {
        if (!chs.includes(ch)) ch = 'cash';
        if (dk < targetDk) open[ch] -= amt;
        else if (dk === targetDk) out[ch] += amt;
      };

      const baseOpen = getMeta('cash_open') || {};
      chs.forEach(c => { open[c] += Number(baseOpen[c]) || 0; });

      sales.filter(s => !s.voided).forEach(s => {
        const paid = Number(s.paidAtSale) || 0;
        if (paid > 0) {
          addIn(dkey(s.paidAt || s.pickedUpAt || s.at), s.ch || 'cash', paid);
        }
      });

      stk.filter(x => !x.voided).forEach(x => {
        if ((x.type === 'gasin' || x.type === 'gasret') && (Number(x.cost) || 0) > 0 && x.ch !== 'credit') {
          addOut(dkey(x.at), x.ch || 'cash', Number(x.cost) || 0);
        }
      });

      comp.filter(x => !x.voided && x.kind === 'pay').forEach(x => {
        addIn(dkey(x.at), x.ch || 'cash', Number(x.amt) || 0);
      });

      cf.filter(e => !e.voided).forEach(e => {
        const dk = dkey(e.at);
        const amt = Number(e.amt) || 0;
        if (e.type === 'debtpay' || e.type === 'fac_refund_in') {
          addIn(dk, e.ch || 'cash', amt);
        } else if (e.type === 'exp' || e.type === 'fac_settle') {
          addOut(dk, e.ch || 'cash', amt);
        } else if (e.type === 'xfer') {
          addOut(dk, e.from || 'cash', amt);
          addIn(dk, e.to || 'kpay', amt);
        } else if (e.type === 'loan') {
          if ((e.dir || 'borrow') === 'borrow') {
            if (!e.repaid) addIn(dk, e.ch || 'cash', amt);
            else {
              addIn(dk, e.ch || 'cash', amt);
              addOut(dkey(e.repaidAt || e.at), e.repaidCh || e.ch || 'cash', amt);
            }
          } else {
            if (!e.repaid) addOut(dk, e.ch || 'cash', amt);
            else {
              addOut(dk, e.ch || 'cash', amt);
              addIn(dkey(e.repaidAt || e.at), e.repaidCh || e.ch || 'cash', amt);
            }
          }
        }
      });

      const close = {};
      chs.forEach(c => { close[c] = open[c] + inn[c] - out[c]; });
      return { chs, open, inn, out, close };
    }

    function calcPnL(periodKey, isMonthly) {
      const matchPeriod = ts => {
        if (!ts) return false;
        const k = isMonthly ? mkey(ts) : dkey(ts);
        return k === periodKey;
      };

      let netRevenue = 0;
      let gasCogs = 0;
      let o2Cogs = 0;
      let prodCogs = 0;
      let unidGasWarn = false;
      const supPrices = gasLatestSupplierPrices();
      const slotAg = gasStockState().slotViss.agent || 'TT Gas';

      sales.filter(s => !s.voided).forEach(s => {
        const revTs = s.isO2Dropoff ? s.pickedUpAt : s.at;
        if (!revTs || !matchPeriod(revTs)) return;
        netRevenue += Number(s.total) || 0;
        (s.lines || []).forEach(l => {
          const q = Number(l.qty) || 0;
          if (l.gasViss > 0) {
            if (l.buyBackCost > 0) {
              gasCogs += Number(l.buyBackCost);
            } else {
              const ag = l.gasAgent || slotAg;
              const sp = supPrices[ag] || supPrices['TT Gas'];
              if (!sp.confirmed) unidGasWarn = true;
              gasCogs += Number(l.gasViss) * sp.perViss;
            }
          } else if (l.o2type) {
            if (l.o2type === 'OVER_40L_OWN' && Number(l.liters) > 0) {
              const cap = Number(cfg.motherCap) || 55;
              o2Cogs += 25000 * (Number(l.liters) / cap);
            } else {
              const unitFill = (O2_TYPES[l.o2type] && O2_TYPES[l.o2type].fillCost) || 0;
              o2Cogs += q * unitFill;
            }
          } else {
            prodCogs += q * (Number(l.costAtSale) || 0);
          }
        });
      });

      let weightVarianceExp = 0;
      stk.filter(x => !x.voided && x.type === 'gasin' && matchPeriod(x.at)).forEach(x => {
        const nom = (AGENTS[x.agent] || AGENTS['TT Gas']).viss;
        const c = Number(x.cyls) || 1;
        const expectedV = c * nom;
        const actualV = Number(x.actualViss) > 0 ? Number(x.actualViss) : expectedV;
        const shortV = Math.max(0, r2(expectedV - actualV));
        if (shortV > 0 && (Number(x.cost) || 0) > 0) {
          weightVarianceExp += ((Number(x.cost) || 0) / expectedV) * shortV;
        }
      });

      let opExp = 0;
      cf.filter(e => !e.voided && e.type === 'exp' && matchPeriod(e.at)).forEach(e => {
        if (e.isSavings || e.isRentPayment) return;
        opExp += Number(e.amt) || 0;
      });

      const ym = periodKey.slice(0, 7);
      const yr = Number(ym.slice(0, 4));
      const mo = Number(ym.slice(5, 7));
      let allocatedRent = 0;
      let rentWarn = '';
      if (yr <= 2026) {
        const daysInMo = new Date(yr, mo, 0).getDate();
        allocatedRent = isMonthly ? 750000 : (750000 / daysInMo);
      } else if (Number(cfg.rent2027) > 0) {
        const daysInMo = new Date(yr, mo, 0).getDate();
        allocatedRent = isMonthly ? Number(cfg.rent2027) : (Number(cfg.rent2027) / daysInMo);
      } else {
        rentWarn = '2027 Rent Unconfirmed';
      }

      const totalCogs = gasCogs + o2Cogs + prodCogs;
      const grossProfit = netRevenue - totalCogs;
      const netProfit = grossProfit - opExp - weightVarianceExp - allocatedRent;

      return {
        netRevenue, gasCogs, o2Cogs, prodCogs, totalCogs,
        grossProfit, opExp, weightVarianceExp, allocatedRent,
        rentWarn, unidGasWarn, supPrices, netProfit
      };
    }

    // =========================================================================
    // 7. 80MM THERMAL RECEIPT PRINT (printSale)
    // =========================================================================
    function printSale(idOrSale) {
      const s = typeof idOrSale === 'string' ? sales.find(x => x.id === idOrSale) : idOrSale;

      const itemNodes = (s.lines || []).map(l => {

          )
        );
      });

      const footerLines = (rc.foot || '').split('\n').map(line => h('div', { class: 'ft' }, line));

      box.replaceChildren(
        h('div', { class: 'c big' }, 'AUNG Gas Solutions'),
        ...headerLines,
        h('div', { class: 'dd' }),
        h('div', { class: 'r' }, h('span', {}, 'ဘောင်ချာ: #' + s.id.slice(-6).toUpperCase()), h('span', {}, dkey(s.at) + ' ' + tm(s.at))),
        custName ? h('div', { class: 'r' }, h('span', {}, 'ဝယ်သူ: ' + custName), h('span', {}, termLabel(s.term || 'immediate'))) : '',
        s.isO2Dropoff ? h('div', { class: 'r b' }, h('span', {}, 'O2 Status:'), h('span', {}, s.pickedUpAt ? ('Picked Up (' + dkey(s.pickedUpAt) + ')') : 'Filled – Awaiting Pickup')) : '',
        h('div', { class: 'dd' }),
        ...itemNodes,
        h('div', { class: 'ss' }),
        (Number(s.discount) || 0) > 0 ? h('div', { class: 'r' }, h('span', {}, 'လျှော့ဈေး'), h('span', {}, '−' + Number(s.discount).toLocaleString())) : '',
        h('div', { class: 'r tt' }, h('span', {}, 'ကျသင့်ငွေ'), h('span', {}, money(s.total))),
        h('div', { class: 'r' }, h('span', {}, 'ပေးချေမှု'), h('span', {}, payLabel(s))),
        custRec && custRec.bal > 0 ? h('div', { class: 'r b' }, h('span', {}, 'လက်ကျန်ကြွေး:'), h('span', {}, money(custRec.bal))) : '',
        h('div', { class: 'dd' }),
        ...footerLines
      );
      setTimeout(() => window.print(), 60);
    }

    // =========================================================================
    // 8. TAB 1: ရောင်းချမှု (SINGLE-SCREEN CHECKOUT + LOAN BANNER)
    // =========================================================================
    function loanBanner() {
      const activeLoans = cf.filter(e => e.type === 'loan' && !e.voided && !e.repaid);
      if (!activeLoans.length) return '';
      const todayKey = dkey(Date.now());
      const dueOrOver = activeLoans.filter(e => e.dueDate && e.dueDate <= todayKey);
      const borrowSum = activeLoans.filter(e => (e.dir || 'borrow') === 'borrow').reduce((a, e) => a + (Number(e.amt) || 0), 0);
      const lendSum = activeLoans.filter(e => e.dir === 'lend').reduce((a, e) => a + (Number(e.amt) || 0), 0);
      return h('div', { class: 'card', style: 'border:2px solid ' + (dueOrOver.length ? 'var(--red)' : 'var(--org)') + ';background:#FFFDF9' },

          h('div', {},
            h('b', { style: 'color:' + (dueOrOver.length ? 'var(--red)' : '#9A3412') }, '💰 ယာယီချေးငွေ လက်ကျန် (' + activeLoans.length + ' ခု)'),
            h('div', { style: 'font-size:13px' },
              (borrowSum > 0 ? 'ချေးယူထားငွေ: ' + money(borrowSum) + '  ' : '') +
              (lendSum > 0 ? 'ထုတ်ချေးထားငွေ: ' + money(lendSum) : '')
            )
          ),
          h('button', { class: 'n', onclick: () => { expSubTab = 2; show(7); } }, 'ကြည့်ရန် / ပြန်ဆပ်မည်')
        )
      );
    }

    function viewSale(root) {
      const todayKey = dkey(Date.now());
      const todaySales = sales.filter(s => dkey(s.at) === todayKey).sort((a, b) => (b.at || 0) - (a.at || 0));
      const lastAuto = getMeta('last_auto_backup_at');

      const prodSel = h('select', { id: 'sProd' },
        h('option', { value: '' }, '-- ပစ္စည်းရွေးပါ / Gas ပိဿာ --'),
        h('option', { value: '__GAS_VISS__' }, '🔥 Gas ပိဿာရောင်း (Viss)'),
        h('option', { value: '__GAS_CAN__' }, '🔥 Gas ဗူးသေး (Can)'),
        ...Object.values(O2_TYPES).map(t => h('option', { value: '__O2__' + t.id }, '🫁 Oxygen: ' + t.label)),
        ...products.filter(p => !p.archived).map(p => h('option', { value: p.id }, p.name + ' (' + money(p.sellPrice) + ')'))
      );

      const qtyIn = h('input', { id: 'sQty', type: 'number', step: 'any', value: '1', placeholder: 'အရေအတွက် / ပိဿာ' });
      const priceIn = h('input', { id: 'sPrice', type: 'number', placeholder: 'ဈေးနှုန်း (MMK)' });
      const o2MoveSel = h('select', { id: 'sO2Move', style: 'display:none' },
        h('option', { value: 'counter_swap' }, 'Counter အိုးလဲ (1-for-1 Swap)'),
        h('option', { value: 'site_keep' }, 'Site ပို့ - အိုးထားခဲ့ (Keep)'),
        h('option', { value: 'site_swap' }, 'Site ပို့ - အိုးလဲယူ (Swap)'),
        h('option', { value: 'dropoff' }, 'O2 Drop-off (Filled – Awaiting Pickup)')
      );
      const focChk = h('input', { id: 'sFoc', type: 'checkbox', style: 'width:auto;margin-right:6px' });

      prodSel.addEventListener('change', () => {
        const v = prodSel.value;
        o2MoveSel.style.display = v.startsWith('__O2__') ? 'block' : 'none';
        if (v === '__GAS_VISS__') priceIn.value = '4200';
        else if (v === '__GAS_CAN__') priceIn.value = '2500';
        else if (v.startsWith('__O2__')) {
          const tid = v.replace('__O2__', '');
          priceIn.value = tid === '47L_FACTORY' ? '28000' : tid === 'OVER_40L_OWN' ? '32000' : '24000';
        } else {
          const p = products.find(x => x.id === v);
          if (p) priceIn.value = p.sellPrice || 0;
        }
      });

      const addLine = () => {
        const v = prodSel.value;
        const q = Number(qtyIn.value) || 0;
        const pr = focChk.checked ? 0 : (Number(priceIn.value) || 0);
        if (!v || q <= 0) return uiAlert('ပစ္စည်းနှင့် အရေအတွက် မှန်ကန်စွာ ထည့်ပါ။');

        if (v === '__GAS_VISS__') {
          const gs = gasStockState();
          const useBb = gs.buyBackViss > 0 ? Math.min(gs.buyBackViss, q) : 0;
          const bbCost = useBb > 0 ? (gs.buyBackValue / gs.buyBackViss) * useBb : 0;
          cart.push({
            name: 'Gas (ပိဿာ)',
            qty: q,
            unit: 'viss',
            price: pr,
            foc: focChk.checked,
            gasViss: q,
            gasAgent: gs.slotViss.agent || 'TT Gas',
            buyBackCost: bbCost
          });
        } else if (v === '__GAS_CAN__') {
          cart.push({ name: 'Gas ဗူးသေး', qty: q, unit: 'ဗူး', price: pr, foc: focChk.checked, isGasCan: true, costAtSale: 1800 });
        } else if (v.startsWith('__O2__')) {
          const tid = v.replace('__O2__', '');
          const mv = o2MoveSel.value;
          cart.push({
            name: o2Label(tid),
            qty: q,
            unit: 'လုံး',
            price: pr,
            foc: focChk.checked,
            o2type: tid,
            ownership: O2_TYPES[tid].ownership,
            o2Movement: mv
          });
        } else {
          const p = products.find(x => x.id === v);
          if (!p) return;
          cart.push({
            prodId: p.id,
            name: p.name,
            qty: q,
            unit: p.unit || 'ခု',
            price: pr,
            foc: focChk.checked,
            costAtSale: Number(p.buyPrice) || 0
          });
        }
        render();
      };

      const subTot = cart.reduce((a, l) => a + lineGrossAmt(l), 0);
      const discIn = h('input', { id: 'sDisc', type: 'number', value: '0', placeholder: 'လျှော့ဈေး (MMK)' });
      const custIn = h('input', { id: 'sCust', placeholder: 'ဖောက်သည်အမည် (လက်ငင်းဆို ချန်ထားနိုင်)' });
      const chSel = h('select', { id: 'sCh' },
        h('option', { value: 'cash' }, 'Cash (ငွေသား)'),
        h('option', { value: 'kpay' }, 'KPay'),
        h('option', { value: 'wave' }, 'Wave'),
        h('option', { value: 'aya' }, 'AyA')
      );
      const termSel = h('select', { id: 'sTerm' },
        h('option', { value: 'immediate' }, 'လက်ငင်းရှင်း (Paid Full)'),
        h('option', { value: 'roundtrip' }, 'ခေါက်ပြန်ရှင်း (COD)'),
        h('option', { value: '15days' }, '၁၅ ရက်တစ်ခါရှင်း'),
        h('option', { value: 'monthend' }, 'လကုန်ရှင်း'),
        h('option', { value: 'credit' }, 'အကြွေး (Credit)')
      );
      const paidIn = h('input', { id: 'sPaid', type: 'number', placeholder: 'ယခုပေးငွေ (လက်ငင်းဆို အလိုအလျောက် အပြည့်)' });

      const saveSale = async () => {
        if (!cart.length) return uiAlert('စာရင်းထဲ ပစ္စည်းထည့်ပါ။');
        const now = Date.now();
        try {
          checkLockOrThrow(now);
        } catch (err) {
          return uiAlert(err.message);
        }

        const disc = Math.max(0, Number(discIn.value) || 0);
        const total = Math.max(0, subTot - disc);
        const cust = custIn.value.trim();
        const term = termSel.value;
        const ch = chSel.value;
        const isDropoff = cart.some(l => l.o2Movement === 'dropoff');

        if ((term !== 'immediate' || cart.some(l => l.o2Movement && l.o2Movement.startsWith('site_'))) && !cust) {
          return uiAlert('အကြွေး / COD / Site အိုးပို့ အတွက် ဖောက်သည်အမည် ထည့်ပါ။');
        }

        const paidAtSale = isDropoff ? 0 : (paidIn.value !== '' ? Number(paidIn.value) : (term === 'immediate' ? total : 0));
        const saleObj = {
          id: uid(),
          at: now,
          cust,
          ch,
          term,
          discount: disc,
          total,
          paidAtSale,
          paidAt: paidAtSale > 0 ? now : null,
          isO2Dropoff: isDropoff,
          pickedUpAt: null,
          lines: cart.map(x => ({ ...x })),
          voided: false
        };

        const mat = o2StockMatrix();
        const newMoves = [];
        for (const l of saleObj.lines) {
          if (l.o2type && l.o2Movement !== 'dropoff') {
            if ((mat[l.o2type]?.full || 0) < l.qty) {
              return uiAlert(o2Label(l.o2type) + ' အပြည့်အိုး လက်ကျန် မလုံလောက်ပါ။');
            }
            newMoves.push({
              id: uid(),
              saleId: saleObj.id,
              o2type: l.o2type,
              ownership: l.ownership,
              movementType: l.o2Movement || 'counter_swap',
              cust,
              qty: l.qty,
              at: now,
              createdAt: now,
              voided: false
            });
          }
        }

        await txWrite(['sales', 'o2move'], st => {
          st.sales.put(saleObj);
          newMoves.forEach(m => st.o2move.put(m));
        });

        sales.push(saleObj);
        o2move.push(...newMoves);
        cart = [];
        render();
        const doPrint = await uiConfirm('အရောင်းသိမ်းပြီးပါပြီ! 80mm ဘောင်ချာ Print ထုတ်မလား?', 'သိမ်းဆည်းပြီး');
        if (doPrint) printSale(saleObj);
      };

      root.replaceChildren(
        h('div', { class: 'msg i', style: 'margin-top:0;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px' },
          h('span', {}, '🛡 ' + tr('lastBackup') + ': ' + (bk ? sd_(bk) : (lastAuto ? 'Auto ' + sd_(lastAuto) : tr('neverBackup')))),
          h('button', { class: 'n', onclick: () => show(5) }, 'Backup / Update')
        ),
        loanBanner(),
        h('div', { class: 'card' },
          h('b', { style: 'font-size:15.5px' }, 'အရောင်းသွင်းရန် (Checkout)'),
          h('label', {}, 'ပစ္စည်းရွေးရန်'),
          prodSel,
          o2MoveSel,
          h('div', { class: 'row' },
            h('div', {}, h('label', {}, 'အရေအတွက် / ပိဿာ'), qtyIn),
            h('div', {}, h('label', {}, 'ဈေးနှုန်း'), priceIn)
          ),
          h('label', { style: 'display:flex;align-items:center;margin-top:8px' }, focChk, 'FOC (အခမဲ့ပေးခြင်း — COGS တွင် မှတ်တမ်းဝင်မည်)'),
          h('button', { style: 'width:100%;margin-top:8px', onclick: addLine }, '+ စာရင်းထဲထည့်မည်')
        ),
        cart.length ? h('div', { class: 'card', style: 'border:2px solid var(--org)' },
          h('b', {}, 'လက်ရှိဘောင်ချာ စာရင်း (' + cart.length + ' မျိုး)'),
          ...cart.map((l, idx) => h('div', { class: 'li' },
            h('div', {},
              h('b', {}, l.name),
              l.foc ? h('span', { class: 'tag g' }, 'FOC') : '',
              h('div', {}, h('small', {}, l.qty + ' ' + l.unit + ' × ' + (l.foc ? '0' : Number(l.price).toLocaleString())))
            ),
            h('div', { style: 'display:flex;align-items:center;gap:6px' },
              h('b', {}, l.foc ? '0 MMK' : money(lineGrossAmt(l))),
              h('button', { class: 'g', onclick: () => { cart.splice(idx, 1); render(); } }, 'ဖျက်')
            )
          )),
          h('div', { class: 'tot' }, 'စုစုပေါင်း: ' + money(subTot)),
          h('div', { class: 'row' },
            h('div', {}, h('label', {}, 'လျှော့ဈေး (MMK)'), discIn),
            h('div', {}, h('label', {}, 'ငွေပေးချေမှု Channel'), chSel)
          ),
          h('div', { class: 'row' },
            h('div', {}, h('label', {}, 'ငွေရှင်းစနစ်'), termSel),
            h('div', {}, h('label', {}, 'ယခုပေးငွေ'), paidIn)
          ),
          h('label', {}, 'ဖောက်သည်အမည်'),
          custIn,
          h('button', { class: 'o', onclick: saveSale }, '✔ အရောင်းသိမ်းမည် (Save Sale)')
        ) : '',
        h('div', { class: 'card' },
          h('b', {}, 'ယနေ့ အရောင်းမှတ်တမ်းများ (' + todaySales.length + ')'),
          todaySales.length ? todaySales.map(s => h('div', { class: 'li ' + (s.voided ? 'void' : '') },
            h('div', {},
              h('b', {}, (s.cust || 'လက်ငင်းဝယ်သူ') + ' — ' + money(s.total)),
              h('span', { class: 'tag b' }, payLabel(s)),
              h('div', {}, h('small', {}, tm(s.at) + ' · ' + (s.lines || []).map(l => l.name + '×' + l.qty).join(', ')))
            ),
            h('div', { style: 'display:flex;gap:5px' },
              h('button', { class: 'n', onclick: () => printSale(s) }, '🖨 Print'),
              !s.voided ? h('button', {
                class: 'g',
                onclick: async () => {
                  try { checkLockOrThrow(s.at); } catch (e) { return uiAlert(e.message); }
                  if (!(await uiConfirm('ဒီဘောင်ချာကို Void လုပ်မလား?'))) return;
                  s.voided = true;
                  await putRec('sales', s);
                  render();
                }
              }, 'Void') : ''
            )
          )) : h('div', { style: 'margin-top:6px' }, h('small', {}, 'ယနေ့ အရောင်းမှတ်တမ်း မရှိသေးပါ။'))
        )
      );
    }

            ),

                if (np == null) return;
                const nb = prompt('အရင်းဈေး အသစ် (ယခင်ရောင်းပြီးသား COGS မပြောင်းပါ):', p.buyPrice);
                if (nb == null) return;
                p.sellPrice = Number(np) || 0;
                p.buyPrice = Number(nb) || 0;

                render();

          )) : h('div', {}, h('small', {}, 'ပစ္စည်းစာရင်း မရှိသေးပါ။'))

          h('option', { value: 'TT Gas' }, 'TT Gas (48kg / 28.5 viss)'),

        );

        const chSel = h('select', {},

                  const av = Number(actVissIn.value) > 0 ? Number(actVissIn.value) : (c * nom);
                  const cost = Number(costIn.value) || 0;

                  if (mode === 'gasin') {

                    await putRec('stk', ev);
                    stk.push(ev);
                  } else {
                    const ev = {
                      id: uid(),
                      type: 'gasopen',
                      'full_TT Gas': ag === 'TT Gas' ? c : gs.byAgent['TT Gas'].full,
                      'empty_TT Gas': gs.byAgent['TT Gas'].empty,
                      'full_NGN': ag === 'NGN' ? c : gs.byAgent['NGN'].full,
                      'empty_NGN': gs.byAgent['NGN'].empty,

                      canRem: gs.slotCan.rem,
                      cans: gs.slotCan.cans,
                      at: now,
                      voided: false

                    await putRec('stk', ev);

                  render();

            'အပြည့် ' + gs.fullTotal + ' လုံး · လက်ကျန်အိုး (လ/က) ' + openSlotCount + ' လုံး · အခွံ ' + gs.emptyTotal + ' လုံး · ' +

        ),

        h('div', { class: 'card' },
          h('div', { style: 'font-size:14px;font-weight:700' }, 'ပိဿာဖြည့်အိုး (လက်ရှိသုံးနေတာ) · ' + gs.slotViss.agent),
          h('div', { style: 'font-size:22px;font-weight:800;margin:2px 0' }, r2(gs.slotViss.rem) + ' ပိဿာ'),
          h('div', { style: 'font-size:12.5px;color:var(--mut);margin-bottom:8px' }, '≈ Gas ဗူး ' + cansApprox + ' ဗူးစာ'),
          h('div', { class: 'row' },
            h('button', { style: 'background:var(--org)', onclick: () => doSwapModal('viss') }, 'အိုးလဲမည်'),
            h('button', { class: 'n', onclick: () => doAdjModal('viss') }, 'လက်ကျန်ချိန်ညှိ')
          )
        ),

        h('div', { class: 'card' },
          h('div', { style: 'font-size:14px;font-weight:700' }, 'ဗူးဖြည့်အိုး (လက်ရှိသုံးနေတာ) · ' + gs.slotCan.agent),
          h('div', { style: 'font-size:20px;font-weight:800;margin:2px 0' }, r2(gs.slotCan.rem) + ' ပိဿာ · ဗူးအသင့်ရှိ: ' + gs.slotCan.cans + ' ဗူး'),
          h('div', { class: 'row', style: 'margin-top:8px' },
            h('button', { style: 'background:var(--org)', onclick: () => doSwapModal('can') }, 'အိုးလဲမည်'),
            h('button', { class: 'n', onclick: () => doAdjModal('can') }, 'လက်ကျန်ချိန်ညှိ')
          )
        ),

        h('div', { class: 'card', style: 'border:1.5px solid var(--grey)' },
          h('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px' },
            h('b', { style: 'font-size:15.5px' }, 'နေ့စဉ် Gas စာရင်းတိုက်စစ်ချက်'),
            dateSel
          ),
          h('div', { class: 'li' }, h('span', {}, 'Opening Balance'), h('b', {}, r2(rec.openV) + ' viss')),
          h('div', { class: 'li' },
            h('span', {}, '+ အဝင် (In)' + (rec.inText ? ' (' + rec.inText + ')' : '')),

          ),
          rec.bbV > 0 ? h('div', { class: 'li' },
            h('span', {}, '+ ပြန်ဝယ် (Buy-Back)'),
            h('b', { style: 'color:var(--ok)' }, '+' + r2(rec.bbV) + ' viss')
          ) : '',
          h('div', { class: 'li' },
            h('span', {}, '- ယနေ့ ပိဿာအရောင်း'),
            h('b', {}, '-' + r2(rec.soldV) + ' viss')
          ),
          h('div', { class: 'li' },
            h('span', {}, '- ဗူးအိုးလဲ' + (rec.canSwapText ? ' (' + rec.canSwapText + ')' : '')),
            h('b', {}, '-' + r2(rec.canSwapV) + ' viss')
          ),
          h('div', { class: 'li', style: 'border-top:2px solid var(--ln)' },
            h('b', {}, '= စာရင်းလက်ကျန် (Book Stock)'),
            h('b', {}, r2(rec.bookV) + ' viss')
          ),

          h('div', { style: 'margin-top:10px;font-weight:700;font-size:14px' }, 'မြေပြင်လက်ကျန် (Ground Stock)'),
          ...Object.entries(AGENTS).filter(([ag]) => (gs.byAgent[ag]?.full || 0) > 0).map(([ag, info]) =>
            h('div', { class: 'li' },
              h('span', {}, 'Full · ' + ag + ' (' + gs.byAgent[ag].full + ' × ' + info.viss + ' viss)'),
              h('span', {}, r2(gs.byAgent[ag].full * info.viss) + ' viss')
            )
          ),
          gs.slotViss.rem > 0 ? h('div', { class: 'li' },
            h('span', {}, 'လ/က · ' + gs.slotViss.agent + ' (1 × ' + r2(gs.slotViss.rem) + ' viss)'),
            h('span', {}, r2(gs.slotViss.rem) + ' viss')
          ) : '',
          gs.slotCan.rem > 0 ? h('div', { class: 'li' },
            h('span', {}, 'ဗူးဖြည့် · ' + gs.slotCan.agent + ' (1 × ' + r2(gs.slotCan.rem) + ' viss)'),
            h('span', {}, r2(gs.slotCan.rem) + ' viss')
          ) : '',
          gs.buyBackViss > 0 ? h('div', { class: 'li' },
            h('span', {}, 'Buy-Back Stock'),
            h('span', {}, r2(gs.buyBackViss) + ' viss')
          ) : '',
          h('div', { class: 'li', style: 'border-top:2px solid var(--ln)' },
            h('b', {}, '= မြေပြင်လက်ကျန် စုစုပေါင်း'),
            h('b', {}, r2(gs.totalGroundV) + ' viss')
          ),
          h('div', { class: 'li' },
            h('b', {}, 'ကွာဟချက် (မြေပြင် - စာရင်း)'),
            h('b', { style: 'color:' + (rec.diffV < 0 ? 'var(--red)' : 'var(--ok)') }, (rec.diffV >= 0 ? '+' : '') + r2(rec.diffV) + ' viss')
          ),
          h('div', { class: 'row', style: 'margin-top:8px' },
            h('button', {
              class: 'n',
              onclick: async () => {
                const v = prompt(ddisp(recDate) + ' အတွက် Opening Balance (viss):', rec.openV);
                if (v == null) return;
                const ts = parseDateTs(recDate);
                try { checkLockOrThrow(ts); } catch (e) { return uiAlert(e.message); }
                const ev = { id: uid(), type: 'gasdayopen', openViss: Number(v) || 0, at: ts, voided: false };
                await putRec('stk', ev);
                stk.push(ev);
                render();
              }
            }, 'Opening ပြင်မည်'),
            h('button', {
              class: 'n',
              onclick: async () => {
                await setMeta('gas_close_' + recDate, { at: Date.now(), bookV: rec.bookV, groundV: gs.totalGroundV, diffV: rec.diffV });
                uiAlert(ddisp(recDate) + ' ညနေလက်ကျန် (' + r2(gs.totalGroundV) + ' viss) သိမ်းဆည်းပြီးပါပြီ။');
              }
            }, 'ညနေလက်ကျန် သိမ်းမည်')
          )
        )
      );
    }

    // =========================================================================
    // 11. TAB 6: OXYGEN (4-TYPE, BACKDATED ENTRY, DROPOFF/PICKUP, FACTORY & LOST)
    // =========================================================================
    function viewOxygen(root) {
      const mat = o2StockMatrix();
      const pendingDropoffs = sales.filter(s => !s.voided && s.isO2Dropoff && !s.pickedUpAt);

      const subBar = h('div', { class: 'sub-tabs' },
        h('button', { class: o2SubTab === 1 ? 'on' : '', onclick: () => { o2SubTab = 1; render(); } }, 'အိုးလက်ကျန် & အရင်ရက်'),
        h('button', { class: o2SubTab === 2 ? 'on' : '', onclick: () => { o2SubTab = 2; render(); } }, 'Drop-off & Mother Cyl'),
        h('button', { class: o2SubTab === 3 ? 'on' : '', onclick: () => { o2SubTab = 3; render(); } }, 'Factory ရှင်း & အိုးပျောက်')
      );

      let body = h('div', {});
      if (o2SubTab === 1) {
        const effDateIn = h('input', { type: 'date', value: dkey(Date.now()) });
        const typeSel = h('select', {}, ...Object.values(O2_TYPES).map(t => h('option', { value: t.id }, t.label)));
        const actSel = h('select', {},
          h('option', { value: 'baseline' }, 'လက်ကျန်စတင်သတ်မှတ် (Baseline Full/Empty)'),
          h('option', { value: 'site_keep' }, 'အရင်ရက် Site ပို့ - အိုးထားခဲ့ (Keep)'),
          h('option', { value: 'cust_return' }, 'အရင်ရက် ဖောက်သည် အခွံပြန်အပ် (Return)'),
          h('option', { value: 'fac_send_empty' }, 'Factory သို့ အခွံပို့ (Send Empty)'),
          h('option', { value: 'fac_recv_full' }, 'Factory မှ အပြည့်ပြန်ဝင် (Receive Full)')
        );
        const qtyIn = h('input', { type: 'number', value: '1', placeholder: 'အရေအတွက် (Full / Qty)' });
        const empIn = h('input', { type: 'number', value: '0', placeholder: 'Empty (Baseline အတွက်သာ)' });
        const custIn = h('input', { placeholder: 'ဖောက်သည် / ဆေးခန်းအမည်' });

        body = h('div', {},
          h('div', { class: 'kpi-grid' },
            ...Object.values(mat).map(t => h('div', { class: 'card kpi-box ' + (t.ownership === 'factory' ? 'org' : ''), style: 'margin:0' },
              h('b', {}, t.label),
              h('div', { class: 'kpi-val' }, 'အပြည့်: ' + t.full + ' · အခွံ: ' + t.empty),
              h('small', {}, 'Custody: ' + t.custody + ' · စောင့်ဆိုင်း: ' + t.waitingPickup)
            ))
          ),
          h('div', { class: 'card' },
            h('b', {}, '📅 Oxygen အရင်ရက်စာရင်း / Movement ထည့်ရန် (Backdated Entry)'),
            h('div', { class: 'row' },
              h('div', {}, h('label', {}, 'ဖြစ်ပွားသည့် ရက်စွဲ (Effective Date)'), effDateIn),
              h('div', {}, h('label', {}, 'အိုးအမျိုးအစား (4-Type)'), typeSel)
            ),
            h('label', {}, 'လုပ်ဆောင်ချက်'), actSel,
            h('div', { class: 'row' },
              h('div', {}, h('label', {}, 'အရေအတွက် / Full'), qtyIn),
              h('div', {}, h('label', {}, 'Empty (Baseline အတွက်)'), empIn)
            ),
            h('label', {}, 'ဖောက်သည်အမည် (Site / Return အတွက်)'), custIn,
            h('button', {
              class: 'o',
              onclick: async () => {
                const effTs = parseDateTs(effDateIn.value);
                try { checkLockOrThrow(effTs); } catch (e) { return uiAlert(e.message); }
                const tid = typeSel.value;
                const mv = actSel.value;
                const q = Number(qtyIn.value) || 0;
                const emp = Number(empIn.value) || 0;
                const cust = custIn.value.trim();

                if ((mv === 'site_keep' || mv === 'cust_return') && !cust) return uiAlert('ဖောက်သည်အမည် ထည့်ပါ။');
                if (mv === 'cust_return' && custO2Custody(ck(cust), tid) < q) {
                  return uiAlert('ဖောက်သည်ထံတွင် ထိုအိုးအမျိုးအစား Custody မလုံလောက်ပါ။');
                }
                if ((mv === 'site_keep' && mat[tid].full < q) || (mv === 'fac_send_empty' && mat[tid].empty < q)) {
                  return uiAlert('လက်ကျန်အိုး မလုံလောက်ပါ။');
                }

                const now = Date.now();
                const moveRec = {
                  id: uid(),
                  o2type: tid,
                  ownership: O2_TYPES[tid].ownership,
                  movementType: mv,
                  cust,
                  qty: q,
                  full: q,
                  empty: emp,
                  at: effTs,
                  createdAt: now,
                  voided: false
                };

                const writes = [putRec('o2move', moveRec)];
                if (mv === 'fac_recv_full') {
                  const billRec = {
                    id: uid(),
                    o2type: tid,
                    qty: q,
                    total: q * O2_TYPES[tid].fillCost,
                    at: effTs,
                    createdAt: now,
                    voided: false
                  };
                  facbill.push(billRec);
                  writes.push(putRec('facbill', billRec));
                }
                await Promise.all(writes);
                o2move.push(moveRec);
                render();
                uiAlert('Oxygen မှတ်တမ်း သိမ်းဆည်းပြီးပါပြီ။');
              }
            }, 'Oxygen မှတ်တမ်း သိမ်းမည်')
          )
        );
      } else if (o2SubTab === 2) {
        const capIn = h('input', { type: 'number', value: String(cfg.motherCap || 55) });
        body = h('div', {},
          h('div', { class: 'card' },
            h('b', {}, 'Filled – Awaiting Pickup စာရင်း (' + pendingDropoffs.length + ')'),
            h('div', {}, h('small', {}, 'လာယူသည့်နေ့ (pickupAt) တွင်သာ Revenue & COGS တွက်ပါမည်။ ငွေရှင်းသည့်နေ့ကို သီးခြားမှတ်နိုင်ပါသည်။')),
            pendingDropoffs.length ? pendingDropoffs.map(s => h('div', { class: 'li' },
              h('div', {},
                h('b', {}, (s.cust || 'ဝယ်သူ') + ' — ' + money(s.total)),
                h('div', {}, h('small', {}, 'ဖြည့်သည့်ရက်: ' + dkey(s.at)))
              ),
              h('button', {
                class: 'n',
                onclick: async () => {
                  const pDate = prompt('လာရောက်ထုတ်ယူသည့် ရက်စွဲ (YYYY-MM-DD):', dkey(Date.now()));
                  if (!pDate) return;
                  const pTs = parseDateTs(pDate);
                  try { checkLockOrThrow(pTs); } catch (e) { return uiAlert(e.message); }
                  const payNow = await uiConfirm('ထုတ်ယူချိန်တွင် ငွေတစ်ခါတည်း ပေးချေပါသလား? (မပေးသေးပါက Customer Receivable အဖြစ် မှတ်ပါမည်)');
                  s.pickedUpAt = pTs;
                  if (payNow) {
                    s.paidAtSale = s.total;
                    s.paidAt = pTs;
                  }
                  await putRec('sales', s);
                  render();
                }
              }, '✔ Picked Up မှတ်မည်')
            )) : h('div', { style: 'margin-top:6px' }, h('small', {}, 'စောင့်ဆိုင်းနေသော O2 Drop-off မရှိပါ။'))
          ),
          h('div', { class: 'card' },
            h('b', {}, 'Mother Cylinder (Over 40L အပိုင်)'),
            h('div', { class: 'msg w' }, cfg.motherConfirmed ? ('အတည်ပြုပြီး Capacity: ' + cfg.motherCap + 'L') : ('ခန့်မှန်းတန်ဖိုး (' + (cfg.motherCap || 55) + 'L — Unconfirmed Estimate)')),
            h('label', {}, 'Mother Cylinder Capacity (Liters)'),
            capIn,
            h('button', {
              class: 'n',
              style: 'margin-top:8px',
              onclick: async () => {
                cfg.motherCap = Number(capIn.value) || 55;
                cfg.motherConfirmed = true;
                await setMeta('v24_cfg', cfg);
                render();
              }
            }, 'Capacity အတည်ပြုသိမ်းမည်')
          )
        );
      } else {
        const openBills = facbill.filter(b => !b.voided);
        const lostCustIn = h('input', { placeholder: 'ဖောက်သည်အမည်' });
        const lostTypeSel = h('select', {},
          h('option', { value: '40L_OWN' }, '40L အပိုင်'),
          h('option', { value: 'OVER_40L_OWN' }, 'Over 40L အပိုင်')
        );
        const lostAmtIn = h('input', { type: 'number', value: '150000', placeholder: 'လျော်ကြေးပမာဏ (MMK)' });

        body = h('div', {},
          h('div', { class: 'card' },
            h('b', {}, 'Factory O2 ငွေရှင်းတမ်းများ (Void vs. Actual Refund ခွဲခြားထားသည်)'),
            openBills.length ? openBills.map(b => {
              const sets = facsettle.filter(x => x.billId === b.id);
              const paid = sets.filter(x => !x.voided).reduce((a, x) => a + (Number(x.amt) || 0), 0);
              const due = Math.max(0, (Number(b.total) || 0) - paid);
              return h('div', { style: 'border-bottom:1px solid var(--ln);padding:8px 0' },
                h('div', { style: 'display:flex;justify-content:space-between;align-items:center' },
                  h('b', {}, dkey(b.at) + ' · ' + o2Label(b.o2type) + ' (' + b.qty + ' လုံး)'),
                  h('span', {}, 'ကျန်: ' + money(due))
                ),
                due > 0 ? h('button', {
                  class: 'n',
                  style: 'margin-top:6px',
                  onclick: async () => {
                    const amt = Number(prompt('ပေးချေမည့်ပမာဏ (ကျန်: ' + due + '):', due)) || 0;
                    if (amt <= 0 || amt > due) return uiAlert('ပမာဏ မှားယွင်းနေပါသည်။');
                    const ch = prompt('Channel ရွေးပါ (cash / kpay / wave / aya):', 'kpay') || 'cash';
                    const now = Date.now();
                    const refId = 'FAC-' + uid().toUpperCase();
                    const stRec = { id: uid(), refId, billId: b.id, amt, ch, at: now, voided: false };
                    const cfRec = { id: uid(), refId, type: 'fac_settle', amt, ch, note: 'Factory O2 ' + o2Label(b.o2type), at: now, voided: false };
                    await txWrite(['facsettle', 'cf'], st => {
                      st.facsettle.put(stRec);
                      st.cf.put(cfRec);
                    });
                    facsettle.push(stRec);
                    cf.push(cfRec);
                    render();
                  }
                }, '+ Factory ငွေပေးချေမည်') : '',
                ...sets.map(st => h('div', { class: 'li ' + (st.voided ? 'void' : ''), style: 'padding-left:10px' },
                  h('small', {}, st.refId + ' · ' + dkey(st.at) + ' · ' + money(st.amt) + ' (' + st.ch + ')'),
                  !st.voided ? h('div', { style: 'display:flex;gap:4px' },
                    h('button', {
                      class: 'g',
                      onclick: async () => {
                        if (!(await uiConfirm('မှားထည့်ထားသော Settlement ကို Void လုပ်မည် (Cash Inflow မဝင်ပါ)?'))) return;
                        st.voided = true;
                        const linkedCf = cf.find(x => x.refId === st.refId);
                        if (linkedCf) linkedCf.voided = true;
                        await txWrite(['facsettle', 'cf'], s => {
                          s.facsettle.put(st);
                          if (linkedCf) s.cf.put(linkedCf);
                        });
                        render();
                      }
                    }, 'Void'),
                    h('button', {
                      class: 'n',
                      onclick: async () => {
                        const rAmt = Number(prompt('Factory မှ အမှန်တကယ် ငွေပြန်အမ်းသည့် ပမာဏ:', st.amt)) || 0;
                        if (rAmt <= 0) return;
                        const rCh = prompt('ပြန်ဝင်သည့် Channel (cash / kpay / wave / aya):', st.ch) || 'cash';
                        const cfIn = { id: uid(), type: 'fac_refund_in', amt: rAmt, ch: rCh, note: 'Factory Actual Refund (' + st.refId + ')', at: Date.now(), voided: false };

                        cf.push(cfIn);
                        render();
                        uiAlert('Actual Refund +' + money(rAmt) + ' (' + rCh + ') မှတ်တမ်းတင်ပြီးပါပြီ။');
                      }
                    }, 'Actual Refund')
                  ) : ''
                ))
              );
            }) : h('small', {}, 'Factory ငွေရှင်းတမ်း မရှိသေးပါ။')
          ),
          h('div', { class: 'card' },
            h('b', {}, 'ဆိုင်ပိုင်အိုး ပျောက်ဆုံးလျော်ကြေး (Lost Cylinder Compensation)'),
            h('label', {}, 'ဖောက်သည်အမည်'), lostCustIn,
            h('div', { class: 'row' },
              h('div', {}, h('label', {}, 'အိုးအမျိုးအစား'), lostTypeSel),

            ),
            h('button', {
              class: 'o',
              onclick: async () => {

                const amt = Number(lostAmtIn.value) || 0;
                if (!c || amt <= 0) return uiAlert('ဖောက်သည်အမည်နှင့် လျော်ကြေးပမာဏ ထည့်ပါ။');
                const now = Date.now();
                const mv = { id: uid(), o2type: lostTypeSel.value, ownership: 'shop', movementType: 'cyl_lost_retire', cust: c, qty: 1, at: now, voided: false };
                const cp = { id: uid(), kind: 'charge', cust: c, o2type: lostTypeSel.value, amt, at: now, voided: false };
                await txWrite(['o2move', 'comp'], st => {
                  st.o2move.put(mv);
                  st.comp.put(cp);
                });
                o2move.push(mv);
                comp.push(cp);
                render();
                uiAlert('အိုးပျောက်လျော်ကြေး ရရန်ရှိစာရင်း မှတ်တမ်းတင်ပြီးပါပြီ (O2 Sales Revenue ထဲ မထည့်ပါ)။');
              }
            }, 'အိုးပျောက်လျော်ကြေး မှတ်မည်')
          )
        );
      }

      root.replaceChildren(subBar, body);
    }

      );

            h('div', { class: 'row' },

              h('div', {}, h('label', {}, 'Channel'), chSel)
            ),

            h('label', { style: 'display:flex;align-items:center' }, savChk, 'စုငွေဖယ်ခြင်း (Savings — P&L စရိတ်ထဲ မထည့်ပါ)'),
            h('button', {

                const ev = { id: uid(), type: 'exp', note: noteIn.value.trim(), amt, ch: chSel.value, isRentPayment: rentChk.checked, isSavings: savChk.checked, at: Date.now(), voided: false };
                await putRec('cf', ev);
                cf.push(ev);
                render();

              style: 'width:100%;margin-top:8px',
              onclick: async () => {

                const ev = { id: uid(), type: 'xfer', from: xFrom.value, to: xTo.value, amt, at: Date.now(), voided: false };

                cf.push(ev);

        );

      const targetDk = getMeta('rep_date') || dkey(Date.now());
