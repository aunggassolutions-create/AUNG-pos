/* IndexedDB v5 */
let db;
const STORES=['products','sales','meta','gasEv','gasExchanges','customers','debtLogs','stockLogs','expenses'];
const open=()=>new Promise((ok,no)=>{
  const r=indexedDB.open('aung-pos',5);
  r.onupgradeneeded=()=>{
    const d=r.result;
    STORES.forEach(n=>{
      if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:n==='meta'?'k':'id'});
    });
  };
  r.onsuccess=()=>ok(r.result);
  r.onerror=()=>no(r.error);
});
const run=(st,mode,fn)=>new Promise((ok,no)=>{const t=db.transaction(st,mode);let out;t.oncomplete=()=>ok(out);t.onabort=()=>no(t.error);t.onerror=()=>{};out=fn(t)});
const all=s=>new Promise((ok,no)=>{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const add=(s,o)=>run(s,'readwrite',t=>t.objectStore(s).add(o));
const put=(s,o)=>run(s,'readwrite',t=>t.objectStore(s).put(o));
const del=(s,k)=>run(s,'readwrite',t=>t.objectStore(s).delete(k));

async function seed(){
  const existing=await all('products');
  if(existing.length>0){
    // Ensure Gas (kg) exists alongside Gas (ပိဿာ) and Gas ဗူးဖြည့်
    const hasKg=existing.some(p=>p.gas==='kg');
    if(!hasKg){
      await add('products',{id:uuid(),name:'Gas (kg)',cat:'LPG ဓာတ်ငွေ့',unit:'kg',gas:'kg',cost:0,price:0,stock:0,emptyStock:0,sample:false,at:Date.now()});
    }
    return;
  }
  await run(['products','meta'],'readwrite',t=>{
    SAMPLE.forEach(([n,c,u,g])=>{
      t.objectStore('products').add({
        id:uuid(),name:n,cat:c,unit:u,gas:g||null,
        cost:0,price:0,stock:0,emptyStock:0,
        sample:!g,at:Date.now()
      });
    });
    t.objectStore('meta').put({k:'seeded_v5',v:Date.now()});
  });
}

/* Calculate LPG viss usage from product & unit */
function gv(p,q,u){
  if(!p||!p.gas)return 0;
  if(p.gas==='can'){
    return u==='ဘူး'?q/cfg.cans:null;
  }
  if(p.gas==='viss'||p.gas==='kg'){
    if(u==='viss')return q;
    if(u==='kg')return q/(cfg.kgPerViss||1.63293);
    return null;
  }
  return 0;
}

/* CSV Export */
function exportCSV(filename, rows){
  const processRow=row=>row.map(val=>{
    let text=val===null||val===undefined?'':(''+val).replace(/"/g,'""');
    return `"${text}"`;
  }).join(',');
  const csvContent='\uFEFF'+rows.map(processRow).join('\r\n');
  const blob=new Blob([csvContent],{type:'text/csv;charset=utf-8;'});
  const link=document.createElement('a');
  link.href=URL.createObjectURL(blob);
  link.setAttribute('download',filename);
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
}

    h('div',{class:'card'},
      h('small',{},'နောက်ဆုံး Backup သိမ်းဆည်းခဲ့သည့်အချိန်: ',h('b',{},lastBackup?new Date(lastBackup).toLocaleString('en-GB'):'မသိမ်းရသေးပါ (စာရင်း/သိမ်း တွင် Backup လုပ်ပါ)'))
    )
  );
}

/* 1. SALES / NEW SALE VIEW */
function viewSale(){
  const app=$('#app');app.replaceChildren();
  const dl=h('datalist',{id:'pl'},products.map(p=>h('option',{value:p.name})));
  const pn=h('input',{list:'pl',placeholder:'ပစ္စည်းရိုက်ပါ / ရွေးပါ',autocomplete:'off'});
  const qty=h('input',{type:'number',inputmode:'decimal',step:'any',min:'0',placeholder:'ပမာဏ'});
  const un=h('select',{},UNITS.map(u=>h('option',{value:u},u)));
  const pr=h('input',{type:'number',inputmode:'numeric',min:'0',placeholder:'တစ်ယူနစ် ရောင်းဈေး (Ks)'});

  pn.onchange=()=>{
    const p=products.find(x=>x.name===pn.value);
    if(p){
      un.value=p.unit;
      if(p.price>0)pr.value=p.price;
    }
  };

  const cdl=h('datalist',{id:'cl'},customers.map(c=>h('option',{value:c.name+(c.phone?' ('+c.phone+')':'')})));
  const cnInput=h('input',{list:'cl',placeholder:'ဖောက်သည်အမည် ရွေးပါ/ရိုက်ပါ'});
  const pmSelect=h('select',{},PAY_METHODS.map(m=>h('option',{value:m},m)));
  const partialWrap=h('div',{style:'display:none'});
  const partialIn=h('input',{type:'number',inputmode:'numeric',min:'0',placeholder:'ယခု လက်ငင်းပေးသွင်းငွေ (မပေးလျှင် 0 ထားပါ)'});
  partialWrap.append(h('label',{},'လက်ငင်း တစ်စိတ်တစ်ပိုင်း ပေးသွင်းငွေ (Partial Payment)'),partialIn);

  pmSelect.onchange=()=>{
    partialWrap.style.display=pmSelect.value==='အကြွေး (Credit)'?'block':'none';
  };

  const msg=h('div'),list=h('div'),tot=h('div',{class:'tot'}),save=h('button',{class:'o'},'ရောင်းချမှု သိမ်းမည် (Save & Print)'),today=h('div');

  const draw=()=>{
    list.replaceChildren(...lines.map((l,i)=>h('div',{class:'li'},
      h('span',{},
        h('b',{},l.name)+' × '+l.qty+' '+l.unit+' @ '+money(l.price),
        l.gasTank?h('small',{},' ['+(l.gasTank==='can'?'ဗူးဖြည့်အိုး':'ပိဿာအိုး')+'မှ '+r2(l.gasViss)+' ပိဿာ]'):''
      ),
      h('span',{},money(l.qty*l.price)+' ',h('button',{class:'g',onclick:()=>{lines.splice(i,1);draw()}},'ဖယ်'))
    )));
    tot.textContent='စုစုပေါင်း: '+money(lines.reduce((s,l)=>s+l.qty*l.price,0));
    save.disabled=!lines.length;
  };

  const addLine=()=>{
    const p=products.find(x=>x.name===pn.value.trim()),q=parseFloat(qty.value),pc=parseFloat(pr.value);
    if(!p)return note(msg,'ပစ္စည်းစာရင်းထဲမှ ပစ္စည်းကို ရွေးပါ။ မရှိပါက "စတော့ခ်" တွင် အရင်ထည့်ပါ။');
    if(!(q>0))return note(msg,'ပမာဏကို 0 ထက်ကြီးအောင် ထည့်ပါ။');
    if(isNaN(pc)||pc<=0)return note(msg,'ရောင်းဈေးနှုန်းကို ကိုယ်တိုင် ထည့်သွင်းပါ (0 ထက်ကြီးရမည်)။');

    const g=gv(p,q,un.value);
    if(g===null)return note(msg,'Gas ဗူးဖြည့်ကို "ဘူး" ယူနစ်ဖြင့်၊ Gas အလေးချိန်ကို "viss" သို့မဟုတ် "kg" ယူနစ်ဖြင့်သာ ထည့်ပါ။');

    if(!p.gas&&!p.sample&&(p.stock||0)<q){
      if(!confirm(`"${p.name}" သည် စတော့ခ်တွင် ${p.stock||0} ${p.unit} သာ ရှိပါသည်။ ဆက်လက်ရောင်းချမလား?`))return;
    }

    let targetTank=null;
    if(p.gas==='can')targetTank='can';
    else if(p.gas==='viss'||p.gas==='kg')targetTank='viss';

    lines.push({pid:p.id,name:p.name,cat:p.cat,cost:p.cost||0,qty:q,unit:un.value,price:pc,gasViss:g,gasTank:targetTank});
    msg.replaceChildren();pn.value=qty.value=pr.value='';draw();
  };

  save.onclick=async()=>{
    if(saving||!lines.length)return;saving=true;save.disabled=true;
    try{
      const payType=pmSelect.value;
      const totalAmount=lines.reduce((s,l)=>s+l.qty*l.price,0);
      const paidNow=payType==='အကြွေး (Credit)'?Math.min(totalAmount,parseFloat(partialIn.value)||0):totalAmount;
      const creditRem=r2(totalAmount-paidNow);

      let selCust=null;
      const rawC=cnInput.value.trim();
      if(rawC){
        selCust=customers.find(c=>c.name===rawC||(c.name+(c.phone?' ('+c.phone+')':''))===rawC);
        if(!selCust){
          selCust={id:uuid(),name:rawC,phone:'',address:'',creditBalance:0,at:Date.now()};
          await add('customers',selCust);
        }
      }

      if(payType==='အကြွေး (Credit)'&&!selCust){
        saving=false;save.disabled=false;
        return note(msg,'အကြွေးရောင်းချရန် ဖောက်သည်အမည် ထည့်သွင်းရန် လိုအပ်ပါသည်။');
      }

      // Deduct 48kg Gas & Product Stock
      for(const l of lines){
        if(l.gasTank==='can')tanks.can.viss=Math.max(0,r2(tanks.can.viss-l.gasViss));
        else if(l.gasTank==='viss')tanks.viss.viss=Math.max(0,r2(tanks.viss.viss-l.gasViss));

        const pObj=products.find(x=>x.id===l.pid);
        if(pObj&&!pObj.gas){
          pObj.stock=Math.max(0,r2((pObj.stock||0)-l.qty));
          await put('products',pObj);
        }
      }
      await saveTanks();

      if(payType==='အကြွေး (Credit)'&&selCust&&creditRem>0){
        selCust.creditBalance=r2((selCust.creditBalance||0)+creditRem);
        await put('customers',selCust);
        await add('debtLogs',{id:uuid(),cid:selCust.id,cname:selCust.name,type:'debt',amount:creditRem,at:Date.now(),note:'ဘောင်ချာ #'+saleId.slice(-6).toUpperCase()});
      }

      const newSale={
        id:saleId,
        at:Date.now(),
        type:payType,
        paidAmount:paidNow,
        customer:selCust?{id:selCust.id,name:selCust.name,phone:selCust.phone}:null,
        lines:lines.map(l=>({...l})),
        total:totalAmount
      };

      await add('sales',newSale);
      await reload();

      if(confirm('ရောင်းချမှု သိမ်းပြီးပါပြီ။ Bluetooth Printer ဖြင့် ဘောင်ချာထုတ်မလား?')){
        printReceipt(newSale);
      }

      lines=[];saleId=uuid();cnInput.value='';partialIn.value='';
      note(msg,'အရောင်းစာရင်း သိမ်းဆည်းပြီးပါပြီ။',1);
    }catch(e){
      if(e&&e.name==='ConstraintError'){
        lines=[];saleId=uuid();
        note(msg,'ဤရောင်းချမှုကို သိမ်းဆည်းပြီးသားဖြစ်ပါသည် (Duplicate ကာကွယ်ထားသည်)။',1);
      }else{
        note(msg,'မသိမ်းနိုင်ပါ: '+(e&&e.message||e));
      }
    }
    saving=false;draw();drawToday();
  };

  const drawToday=()=>{
    const s0=new Date();s0.setHours(0,0,0,0);
    const ts=sales.filter(s=>s.at>=s0.getTime());
    const sum=ts.filter(s=>!s.voided).reduce((a,s)=>a+s.total,0);
    today.replaceChildren(
      h('h2',{},'ယနေ့ အရောင်းမှတ်တမ်း ('+money(sum)+')'),
      h('div',{class:'card'},ts.length?ts.map(s=>h('div',{class:'li'},
        h('span',{class:s.voided?'void':''},
          new Date(s.at).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})+' · ',
          h('b',{},s.type)+' · ',
          s.customer?h('span',{},'['+s.customer.name+'] '):'',
          s.lines.map(l=>l.name+'×'+l.qty+l.unit).join(', '),
          s.voided?' (ပယ်ဖျက်/ပြန်အပ်)':''
        ),
        h('span',{},
          h('b',{class:s.voided?'void':''},money(s.total))+' ',
          h('button',{class:'b',onclick:()=>printReceipt(s)},'Print'),' ',
          s.voided?'':h('button',{class:'g',onclick:async()=>{
            if(!confirm('ဤရောင်းချမှုကို ပယ်ဖျက်/ပြန်အပ် (Reverse) လုပ်မလား? နှုတ်ထားသော စတော့ခ်နှင့် Gas များ ပြန်ပေါင်းပေးပါမည်။'))return;
            s.voided=true;s.voidedAt=Date.now();
            try{
              for(const l of s.lines){
                if(l.gasTank==='can')tanks.can.viss=r2(tanks.can.viss+(l.gasViss||0));
                else if(l.gasTank==='viss')tanks.viss.viss=r2(tanks.viss.viss+(l.gasViss||0));
                const pObj=products.find(x=>x.id===l.pid);
                if(pObj&&!pObj.gas){
                  pObj.stock=r2((pObj.stock||0)+l.qty);
                  await put('products',pObj);
                }
              }
              if(s.type==='အကြွေး (Credit)'&&s.customer){
                const cObj=customers.find(c=>c.id===s.customer.id);
                const credRem=s.total-(s.paidAmount||0);
                if(cObj&&credRem>0){
                  cObj.creditBalance=Math.max(0,r2(cObj.creditBalance-credRem));
                  await put('customers',cObj);
                }
              }
              await saveTanks();await put('sales',s);await reload();drawToday();
            }catch(e){alert('မပယ်ဖျက်နိုင်ပါ: '+e.message);}
          }},'ပယ်ဖျက်')
        )
      )):h('small',{},'ယနေ့ အရောင်း မရှိသေးပါ။'))
    );
  };

  app.append(
    dl,cdl,
    h('div',{class:'card'},
      h('b',{},'အရောင်းဘောင်ချာ အသစ်ဖွင့်ရန်'),
      h('label',{},'ပစ္စည်းရွေးရန်'),pn,
      h('div',{class:'row'},
        h('div',{},h('label',{},'ပမာဏ'),qty),
        h('div',{},h('label',{},'ယူနစ် (kg/viss/ဘူး/ခု)'),un)
      ),
      h('label',{},'တစ်ယူနစ် ရောင်းဈေး (Ks)'),pr,
      h('button',{class:'o',onclick:addLine,style:'background:var(--navy)'},'+ စာရင်းထဲ ထည့်မည်')
    ),
    h('div',{class:'card'},
      h('label',{},'ဖောက်သည် (အကြွေးရောင်းလျှင် မဖြစ်မနေထည့်ပါ)'),cnInput,
      h('label',{},'ငွေပေးချေမှု ပုံစံ'),pmSelect,
      partialWrap
    ),
    msg,
    h('div',{class:'card'},list,tot,save),
    today
  );
  draw();drawToday();
}

/* 2. PRODUCTS & INVENTORY VIEW (Purchases, Adjustments, Returns, Cylinders) */
let invSub=1;
function viewProducts(){
  const app=$('#app');app.replaceChildren();
  const msg=h('div');

  const navBar=h('div',{class:'subtabs'},
    h('button',{class:invSub==1?'on':'',onclick:()=>{invSub=1;viewProducts()}},'၁။ ပစ္စည်း/စတော့ခ်စာရင်း'),
    h('button',{class:invSub==2?'on':'',onclick:()=>{invSub=2;viewProducts()}},'၂။ အဝင်/ချိန်ညှိ/ပြန်အပ်'),
    h('button',{class:invSub==3?'on':'',onclick:()=>{invSub=3;viewProducts()}},'၃။ ပစ္စည်းအသစ်ထည့်ရန်')
  );
  app.append(navBar,msg);

  if(invSub===1){
    const q=h('input',{placeholder:'ပစ္စည်းအမည် သို့မဟုတ် အမျိုးအစား ရှာရန်...'});
    const box=h('div',{class:'card'});
    const draw=()=>{
      const t=q.value.toLowerCase();
      const ps=products.filter(p=>p.name.toLowerCase().includes(t)||p.cat.toLowerCase().includes(t));
      box.replaceChildren(...(ps.length?ps.map(p=>h('div',{class:'li'},
        h('div',{},
          h('b',{},p.name),
          p.sample?h('span',{class:'tag'},'နမူနာ'):'',
          h('br'),
          h('small',{},p.cat+' · ဝယ်ဈေး: '+money(p.cost||0)+' · ရောင်းဈေး: '+money(p.price||0)),
          h('br'),
          p.gas?h('span',{class:'badge viss'},'48kg အိုးမှ တိုက်ရိုက်နှုတ်သည်'):h('span',{},
            h('b',{style:'color:'+((p.stock||0)<=2?'var(--red)':'var(--ok)')},'အပြည့်/လက်ကျန်: '+(p.stock||0)+' '+p.unit),
            (p.cat==='LPG ဘူး'||p.cat==='အောက်ဆီဂျင်')?h('small',{},' | အိုးခွံအလွတ်: '+(p.emptyStock||0)+' လုံး'):''
          )
        ),
        h('div',{},
          h('button',{class:'b',onclick:async()=>{
            const np=prompt(`"${p.name}" ရောင်းဈေး (Ks):`,p.price||0);
            if(np===null)return;
            const nc=prompt(`"${p.name}" ဝယ်ဈေး/အရင်း (Ks):`,p.cost||0);
            if(nc===null)return;
            p.price=parseFloat(np)||0;
            p.cost=parseFloat(nc)||0;
            p.sample=false;
            await put('products',p);await reload();draw();
          }},'ဈေးပြင်'),' ',
          h('button',{class:'g',onclick:async()=>{
            if(!confirm(`"${p.name}" ကို ပစ္စည်းစာရင်းမှ ဖျက်မလား? ယခင်ရောင်းချမှုမှတ်တမ်းများ မပျက်ပါ။`))return;
            await del('products',p.id);await reload();draw();
          }},'ဖျက်')
        )
      )):[h('small',{},'ပစ္စည်း မတွေ့ပါ။')]));
    };
    q.oninput=draw;
    app.append(
      h('div',{class:'msg e',style:'background:#FFF3E8;color:#9A4308'},'"နမူနာ" ပစ္စည်းများတွင် ဈေးနှုန်းနှင့် လက်ကျန် 0 ထားရှိပါသည်။ "ဈေးပြင်" နှိပ်၍ ဈေးထည့်သွင်းပါ သို့မဟုတ် အဝင်စာရင်းသွင်းပါ။'),
      q,box
    );
    draw();
  }
  else if(invSub===2){
    // Purchases, Stock Adjustments, Returns, Empty Cylinder tracking
    const pSel=h('select',{},products.filter(p=>!p.gas).map(p=>h('option',{value:p.id},p.name+' (လက်ကျန်: '+(p.stock||0)+')')));
    const actType=h('select',{},
      h('option',{value:'purchase'},'ပစ္စည်းအဝင် / ဝယ်ယူမှု (Purchase +)'),
      h('option',{value:'return'},'ဖောက်သည် ပစ္စည်းပြန်အပ် (Customer Return +)'),
      h('option',{value:'adjust_add'},'စတော့ခ် အပေါင်းချိန်ညှိ (Adjust +)'),
      h('option',{value:'adjust_sub'},'စတော့ခ် အနှုတ်/ပျက်စီး ချိန်ညှိ (Adjust -)'),
      h('option',{value:'empty_in'},'အိုးခွံအလွတ် အဝင် (+)'),
      h('option',{value:'empty_out'},'အိုးခွံအလွတ် အထွက် (-)')
    );
    const qIn=h('input',{type:'number',step:'any',min:'0',placeholder:'အရေအတွက်'});
    const costIn=h('input',{type:'number',min:'0',placeholder:'တစ်ယူနစ် ဝယ်ဈေး (Ks) - အဝင်အတွက်သာ'});
    const noteIn=h('input',{placeholder:'မှတ်ချက် (ဥပမာ ဒိုင်အမည် / ပြန်အပ်သည့်အကြောင်းရင်း)'});

    const saveStockBtn=h('button',{class:'o',onclick:async()=>{
      const p=products.find(x=>x.id===pSel.value);
      const q=parseFloat(qIn.value),c=parseFloat(costIn.value);
      if(!p)return note(msg,'ပစ္စည်း ရွေးပါ။');
      if(!(q>0))return note(msg,'အရေအတွက် 0 ထက်ကြီးအောင် ထည့်ပါ။');
      const tp=actType.value;
      if(tp==='purchase'){
        p.stock=r2((p.stock||0)+q);
        if(c>0)p.cost=c;
        p.sample=false;
      }else if(tp==='return'||tp==='adjust_add'){
        p.stock=r2((p.stock||0)+q);
      }else if(tp==='adjust_sub'){
        if(!confirm(`"${p.name}" ထဲမှ ${q} ${p.unit} နှုတ်ယူမလား?`))return;
        p.stock=Math.max(0,r2((p.stock||0)-q));
      }else if(tp==='empty_in'){
        p.emptyStock=r2((p.emptyStock||0)+q);
      }else if(tp==='empty_out'){
        p.emptyStock=Math.max(0,r2((p.emptyStock||0)-q));
      }
      await put('products',p);
      await add('stockLogs',{id:uuid(),at:Date.now(),pid:p.id,pname:p.name,type:tp,qty:q,unit:p.unit,cost:c||p.cost||0,note:noteIn.value.trim()});
      await reload();viewProducts();
    }},'စတော့ခ် မှတ်တမ်း သိမ်းမည်');

    const logList=h('div',{class:'card'},
      stockLogs.length?stockLogs.slice(0,20).map(l=>h('div',{class:'li'},
        h('span',{},
          new Date(l.at).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' · ',
          h('b',{},l.pname)+' ('+l.type+') ',
          l.note?h('small',{},'· '+l.note):''
        ),
        h('b',{},l.qty+' '+l.unit)
      )):h('small',{},'စတော့ခ် အဝင်/အထွက် မှတ်တမ်း မရှိသေးပါ။')
    );

    app.append(
      h('div',{class:'card'},
        h('b',{},'စတော့ခ် အဝင် / ချိန်ညှိ / ပြန်အပ် / အိုးခွံမှတ်တမ်း'),
        h('label',{},'ပစ္စည်းရွေးပါ'),pSel,
        h('label',{},'လုပ်ဆောင်ချက် အမျိုးအစား'),actType,
        h('label',{},'အရေအတွက်'),qIn,
        h('label',{},'ဝယ်ဈေး (Ks) - ပြောင်းလဲလိုပါက ထည့်ပါ'),costIn,
        h('label',{},'မှတ်ချက်'),noteIn,
        saveStockBtn
      ),
      h('h2',{},'နောက်ဆုံး စတော့ခ်မှတ်တမ်းများ'),
      logList
    );
  }
  else if(invSub===3){
    const nn=h('input',{placeholder:'ပစ္စည်းအမည် အသစ်'});
    const nc=h('select',{},CATS.map(c=>h('option',{},c)));
    const nu=h('select',{},UNITS.map(u=>h('option',{},u)));
    const nCost=h('input',{type:'number',min:'0',placeholder:'ဝယ်ဈေး / အရင်း (Ks)'});
    const nPrice=h('input',{type:'number',min:'0',placeholder:'ရောင်းဈေး (Ks)'});
    const nStock=h('input',{type:'number',min:'0',placeholder:'စတင် လက်ကျန်အရေအတွက်'});

    const addBtn=h('button',{class:'o',onclick:async()=>{
      const n=nn.value.trim();if(!n)return note(msg,'ပစ္စည်းအမည် ထည့်ပါ။');
      if(products.some(p=>p.name.toLowerCase()===n.toLowerCase()))return note(msg,'ဤပစ္စည်းအမည် ရှိပြီးသားဖြစ်ပါသည်။');
      await add('products',{
        id:uuid(),name:n,cat:nc.value,unit:nu.value,gas:null,
        cost:parseFloat(nCost.value)||0,
        price:parseFloat(nPrice.value)||0,
        stock:parseFloat(nStock.value)||0,
        emptyStock:0,sample:false,at:Date.now()
      });
      await reload();invSub=1;viewProducts();
    }},'ပစ္စည်းအသစ် သိမ်းမည်');

    app.append(h('div',{class:'card'},
      h('b',{},'ပစ္စည်းအသစ် ထည့်သွင်းရန်'),
      h('label',{},'ပစ္စည်းအမည်'),nn,
      h('div',{class:'row'},h('div',{},h('label',{},'အမျိုးအစား'),nc),h('div',{},h('label',{},'ယူနစ်'),nu)),
      h('div',{class:'row'},h('div',{},h('label',{},'ဝယ်ဈေး (Ks)'),nCost),h('div',{},h('label',{},'ရောင်းဈေး (Ks)'),nPrice)),
      h('label',{},'စတင် လက်ကျန်စတော့ခ်'),nStock,
      addBtn
    ));
  }
}

/* 3. 48KG GAS MANAGEMENT VIEW (Dual Taps + Swap + Vendor Exchange) */

  const app=$('#app');app.replaceChildren();

        if(!confirm('ဗူးဖြည့်အိုး အသစ်ဖွင့်မလား? (အပြည့် ၁ လုံးနှုတ်ပြီး '+cfg.usable+' ပိဿာ သတ်မှတ်ပါမည်။ ယခင်အိုးကို အလွတ်စာရင်းပို့ပါမည်)'))return;
        act(null,async()=>{
          if(tanks.fullCount>0)tanks.fullCount--;
          tanks.emptyCount++;
          tanks.can.viss=cfg.usable;
          tanks.can.openedAt=Date.now();
          await saveTanks();
          await add('gasEv',{id:uuid(),at:Date.now(),tank:'can',type:'open',viss:cfg.usable,note:'ဗူးဖြည့်အိုး အသစ်ဖွင့်'});
        });
      }},'အိုးအသစ် ဖွင့်မည်'),
      h('button',{class:'b',onclick:()=>{
        if(tanks.can.viss<=0)return alert('ဗူးဖြည့်အိုးထဲတွင် Gas မရှိပါ။');

        act(null,async()=>{

          tanks.viss.viss=r2(tanks.viss.viss+tr);

          await saveTanks();

    )

  const vissBox=h('div',{class:'card'},
    h('div',{style:'display:flex;justify-content:space-between;align-items:center'},
      h('b',{},'၂။ ပိဿာဖြည့်အိုး (Tap B)'),
      h('span',{class:'badge viss'},'ပိဿာ / kg အိုး')
    ),
    h('div',{class:'tot',style:'text-align:left;color:var(--navy)'},r2(tanks.viss.viss)+' ပိဿာ <small style="font-size:14px;font-weight:normal">(≈ '+r2(tanks.viss.viss*(cfg.kgPerViss||1.63293))+' kg)</small>'),
    h('div',{class:'row',style:'margin-top:10px'},
      h('button',{class:'b',style:'background:var(--navy);color:#fff',onclick:()=>{
        if(tanks.fullCount<=0&&!confirm('ဆိုင်တွင် 48kg အပြည့်အိုး 0 ဖြစ်နေပါသည်။ ဆက်ဖွင့်မလား?'))return;
        if(!confirm('ပိဿာဖြည့်အိုး အသစ်ဖွင့်မလား? (အပြည့် ၁ လုံးနှုတ်ပြီး '+cfg.usable+' ပိဿာ သတ်မှတ်ပါမည်။ ယခင်အိုးကို အလွတ်စာရင်းပို့ပါမည်)'))return;
        act(null,async()=>{
          if(tanks.fullCount>0)tanks.fullCount--;
          tanks.emptyCount++;
          tanks.viss.viss=cfg.usable;
          tanks.viss.openedAt=Date.now();
          await saveTanks();
          await add('gasEv',{id:uuid(),at:Date.now(),tank:'viss',type:'open',viss:cfg.usable,note:'ပိဿာဖြည့်အိုး အသစ်ဖွင့်'});
        });
      }},'အိုးအသစ် ဖွင့်မည်'),
      h('button',{class:'b',onclick:()=>{
        if(tanks.viss.viss<=0)return alert('ပိဿာဖြည့်အိုးထဲတွင် Gas မရှိပါ။');
        if(!confirm('ပိဿာဖြည့်အိုးမှ ကျန်ရှိသော ('+r2(tanks.viss.viss)+' ပိဿာ) ကို ဗူးဖြည့်အိုးသို့ လွှဲပြောင်းသတ်မှတ်မလား?'))return;
        act(null,async()=>{
          const tr=tanks.viss.viss;
          tanks.can.viss=r2(tanks.can.viss+tr);
          tanks.viss.viss=0;
          await saveTanks();
          await add('gasEv',{id:uuid(),at:Date.now(),tank:'swap',type:'transfer',viss:tr,note:'ပိဿာအိုး -> ဗူးဖြည့်အိုးသို့ '+r2(tr)+' ပိဿာ ပြောင်း'});
        });
      }},'ဗူးအိုးသို့ ပြောင်း (Swap)')
    )
  );

  // Vendor Exchange
  const exFull=num('အပြည့် ရရှိသည့် အလုံးရေ'),exEmpty=num('အလွတ် ပြန်ပေးသည့် အလုံးရေ'),exCost=num('တစ်လုံး ဝယ်ဈေး (Ks)'),exSup=h('input',{placeholder:'ကိုယ်စားလှယ် အမည် / မှတ်ချက်'});
  const exBtn=h('button',{class:'o',onclick:()=>{
    const f=parseInt(exFull.value)||0,e=parseInt(exEmpty.value)||0,c=parseFloat(exCost.value)||0,s=exSup.value.trim();
    if(f<=0&&e<=0)return note(msg,'အပြည့်ရယူသည့် အလုံး သို့မဟုတ် အလွတ်ပေးသည့် အလုံးရေ ထည့်ပါ။');
    if(!confirm(`ကိုယ်စားလှယ်နှင့် အိုးလဲလှယ်မှု (အပြည့်ရ: ${f} လုံး၊ အလွတ်ပေး: ${e} လုံး) သိမ်းမလား?`))return;
    act(exBtn,async()=>{
      tanks.fullCount+=f;
      tanks.emptyCount=Math.max(0,tanks.emptyCount-e);
      await saveTanks();
      // Update LPG cost per viss automatically if unitCost is given
      if(c>0&&cfg.usable>0){
        const costPerViss=r2(c/cfg.usable);
        for(const p of products){
          if(p.gas==='viss')p.cost=costPerViss;
          else if(p.gas==='kg')p.cost=r2(costPerViss/(cfg.kgPerViss||1.63293));
          else if(p.gas==='can')p.cost=r2(costPerViss/cfg.cans);
          if(p.gas)await put('products',p);
        }
      }
      await add('gasExchanges',{id:uuid(),at:Date.now(),fullIn:f,emptyOut:e,unitCost:c,totalCost:c*f,supplier:s});
      exFull.value=exEmpty.value=exCost.value=exSup.value='';

    h('label',{},'ကိုယ်စားလှယ် / မှတ်ချက်'),exSup,
    exBtn
  );

  // Adjustments
  const adjTank=h('select',{},h('option',{value:'can'},'ဗူးဖြည့်အိုး (Tap A)'),h('option',{value:'viss'},'ပိဿာဖြည့်အိုး (Tap B)'));
  const adjVal=num('ပိဿာ ပမာဏ (+ သို့ -)'),adjWhy=h('input',{placeholder:'အကြောင်းရင်း (ဥပမာ စတင်လက်ကျန်)'});
  const adjBtn=h('button',{class:'o',style:'background:var(--navy)',onclick:()=>{
    const v=parseFloat(adjVal.value),w=adjWhy.value.trim(),tk=adjTank.value;
    if(isNaN(v)||v===0)return note(msg,'ပိဿာ ပမာဏ ထည့်ပါ။');
    if(!w)return note(msg,'အကြောင်းရင်း ထည့်ပါ။');
    act(adjBtn,async()=>{
      if(tk==='can')tanks.can.viss=Math.max(0,r2(tanks.can.viss+v));
      else tanks.viss.viss=Math.max(0,r2(tanks.viss.viss+v));
      await saveTanks();
      await add('gasEv',{id:uuid(),at:Date.now(),tank:tk,type:'adjust',viss:v,note:w});
      adjVal.value=adjWhy.value='';
    });
  }},'ပိဿာ လက်ကျန် ချိန်ညှိမည်');

  const fCntInput=num('',tanks.fullCount),eCntInput=num('',tanks.emptyCount);
  const setCntBtn=h('button',{class:'b',onclick:()=>{
    act(setCntBtn,async()=>{
      tanks.fullCount=parseInt(fCntInput.value)||0;
      tanks.emptyCount=parseInt(eCntInput.value)||0;
      await saveTanks();
    });
  }},'အိုးအရေအတွက် တိုက်ရိုက်သိမ်းမည်');

  const adjBox=h('div',{class:'card'},
    h('b',{},'လက်ကျန် ချိန်ညှိခြင်း / စတင်လက်ကျန် ထည့်ခြင်း'),
    h('label',{},'ပြင်ဆင်မည့် အိုးရွေးပါ'),adjTank,
    h('label',{},'တိုး/လျှော့မည့် ပိဿာ (+ / -)'),adjVal,
    h('label',{},'အကြောင်းရင်း'),adjWhy,
    adjBtn,
    h('hr',{style:'border:0;border-top:1px solid var(--ln);margin:14px 0'}),
    h('b',{},'ဆိုင်လက်ကျန် 48kg အိုးအရေအတွက် ပြင်ရန်'),
    h('div',{class:'row'},h('div',{},h('label',{},'အပြည့်အိုး (လုံး)'),fCntInput),h('div',{},h('label',{},'အလွတ်အိုး (လုံး)'),eCntInput)),
    h('div',{style:'margin-top:10px'},setCntBtn)
  );

  const logBox=h('div',{class:'card'},
    gasEv.length?gasEv.slice(0,15).map(e=>h('div',{class:'li'},
      h('span',{},
        new Date(e.at).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' · ',
        h('b',{},e.tank==='can'?'[ဗူးအိုး] ':e.tank==='viss'?'[ပိဿာအိုး] ':'[Swap] '),
        e.note||''
      ),
      h('b',{},(e.viss>0?'+':'')+r2(e.viss)+' ပိဿာ')
    )):h('small',{},'မှတ်တမ်း မရှိသေးပါ။')
  );

  app.append(dash,canBox,vissBox,vendorBox,adjBox,msg,h('h2',{},'48kg Gas မှတ်တမ်းများ'),logBox);
}

/* 4. CUSTOMERS & CREDIT VIEW (Partial Debt Payments) */
function viewCustomers(){
  const app=$('#app');app.replaceChildren();
  const q=h('input',{placeholder:'ဖောက်သည်အမည် သို့မဟုတ် ဖုန်း ရှာရန်...'});
  const box=h('div',{class:'card'}),msg=h('div');
  const totalCreditSum=customers.reduce((s,c)=>s+(c.creditBalance||0),0);

  const draw=()=>{
    const t=q.value.toLowerCase();
    const cs=customers.filter(c=>(c.name||'').toLowerCase().includes(t)||(c.phone||'').includes(t));
    box.replaceChildren(...(cs.length?cs.map(c=>h('div',{class:'li'},
      h('div',{},
        h('b',{},c.name),
        c.phone?h('span',{},' · '+c.phone):'',
        h('br'),
        c.address?h('small',{},c.address+' · '):'',
        h('b',{style:'color:'+(c.creditBalance>0?'var(--red)':'var(--ok)')},'အကြွေးကျန်: '+money(c.creditBalance||0))
      ),
      h('div',{},
        c.creditBalance>0?h('button',{class:'ok',onclick:async()=>{
          const payVal=prompt(`"${c.name}" ထံမှ အကြွေးပြန်ဆပ်ငွေ (တစ်စိတ်တစ်ပိုင်း သို့မဟုတ် အပြည့်) ထည့်ပါ:
လက်ရှိအကြွေးကျန်: ${money(c.creditBalance)}`,c.creditBalance);
          if(!payVal)return;
          const amt=parseFloat(payVal);
          if(isNaN(amt)||amt<=0)return alert('မှန်ကန်သော ပမာဏ ထည့်ပါ။');
          c.creditBalance=Math.max(0,r2(c.creditBalance-amt));
          await put('customers',c);
          await add('debtLogs',{id:uuid(),cid:c.id,cname:c.name,type:'repay',amount:amt,at:Date.now(),note:'အကြွေးပြန်ဆပ်ငွေ (လက်ကျန်: '+money(c.creditBalance)+')'});
          await reload();viewCustomers();
        }},'အကြွေးဆပ်'):'',
        ' ',
        h('button',{class:'g',onclick:async()=>{
          if(!confirm(`"${c.name}" ကို ဖျက်မလား?`))return;
          await del('customers',c.id);await reload();draw();
        }},'ဖျက်')
      )
    )):[h('small',{},'ဖောက်သည် မတွေ့ပါ။')]));
  };
  q.oninput=draw;

  const cName=h('input',{placeholder:'ဖောက်သည် အမည်'});
  const cPhone=h('input',{placeholder:'ဖုန်းနံပါတ်'});
  const cAddr=h('input',{placeholder:'လိပ်စာ'});
  const addCBtn=h('button',{class:'o',onclick:async()=>{
    const n=cName.value.trim();if(!n)return note(msg,'အမည် ထည့်ပါ။');
    await add('customers',{id:uuid(),name:n,phone:cPhone.value.trim(),address:cAddr.value.trim(),creditBalance:0,at:Date.now()});
    cName.value=cPhone.value=cAddr.value='';
    await reload();draw();note(msg,'ဖောက်သည် သိမ်းပြီးပါပြီ။',1);
  }},'ဖောက်သည် အသစ်ထည့်မည်');

  const dLogs=h('div',{class:'card'},
    debtLogs.length?debtLogs.slice(0,15).map(d=>h('div',{class:'li'},
      h('span',{},new Date(d.at).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' · ',h('b',{},d.cname)+' · '+d.note),
      h('b',{style:'color:'+(d.type==='repay'?'var(--ok)':'var(--red)')},(d.type==='repay'?'-':'+')+money(d.amount))
    )):h('small',{},'အကြွေးမှတ်တမ်း မရှိသေးပါ။')
  );

  app.append(
    h('div',{class:'card'},
      h('div',{class:'stat-box'},h('small',{},'စုစုပေါင်း ရရန်ရှိ အကြွေးကျန်ငွေ'),h('div',{class:'num',style:'color:var(--red)'},money(totalCreditSum)))
    ),
    h('div',{class:'card'},h('b',{},'ဖောက်သည် အသစ်ထည့်ရန်'),cName,cPhone,cAddr,addCBtn),
    msg,
    h('h2',{},'ဖောက်သည်နှင့် အကြွေးစာရင်း ('+customers.length+')'),
    q,box,
    h('h2',{},'အကြွေးယူ / ပြန်ဆပ် မှတ်တမ်းများ'),
    dLogs
  );
  draw();
}

/* 5. EXPENSES VIEW (Requirement 5 & 11) */
function viewExpenses(){
  const app=$('#app');app.replaceChildren();
  const msg=h('div');
  const eCat=h('select',{},EXP_CATS.map(c=>h('option',{},c)));
  const eAmt=h('input',{type:'number',min:'0',placeholder:'ကုန်ကျငွေ ပမာဏ (Ks)'});
  const eNote=h('input',{placeholder:'အကြောင်းအရာ အသေးစိတ် (ဥပမာ ဆိုင်ကယ်ဆီဖိုး / ထမင်းဖိုး)'});

  const addEBtn=h('button',{class:'o',onclick:async()=>{
    const a=parseFloat(eAmt.value);
    if(isNaN(a)||a<=0)return note(msg,'ကုန်ကျငွေ ပမာဏကို မှန်ကန်စွာ ထည့်ပါ။');
    await add('expenses',{id:uuid(),at:Date.now(),cat:eCat.value,amount:a,note:eNote.value.trim()});
    eAmt.value=eNote.value='';
    await reload();viewExpenses();
  }},'အသုံးစရိတ် သိမ်းမည်');

  const s0=new Date();s0.setHours(0,0,0,0);
  const todayExp=expenses.filter(e=>e.at>=s0.getTime()).reduce((a,e)=>a+e.amount,0);

  const list=h('div',{class:'card'},
    expenses.length?expenses.slice(0,25).map(e=>h('div',{class:'li'},
      h('span',{},
        new Date(e.at).toLocaleString('en-GB',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' · ',
        h('b',{},e.cat),
        e.note?' ('+e.note+')':''
      ),
      h('span',{},
        h('b',{style:'color:var(--red)'},money(e.amount))+' ',
        h('button',{class:'g',onclick:async()=>{
          if(!confirm('ဤအသုံးစရိတ်ကို ဖျက်မလား?'))return;
          await del('expenses',e.id);await reload();viewExpenses();
        }},'ဖျက်')
      )
    )):h('small',{},'အသုံးစရိတ် မှတ်တမ်း မရှိသေးပါ။')
  );

  app.append(
    h('div',{class:'card'},
      h('div',{class:'stat-box'},h('small',{},'ယနေ့ စုစုပေါင်း အသုံးစရိတ်'),h('div',{class:'num',style:'color:var(--red)'},money(todayExp)))
    ),
    h('div',{class:'card'},
      h('b',{},'ဆိုင်အသုံးစရိတ် အသစ်မှတ်ရန်'),
      h('label',{},'စရိတ်အမျိုးအစား'),eCat,
      h('label',{},'ပမာဏ (Ks)'),eAmt,
      h('label',{},'မှတ်ချက်'),eNote,
      addEBtn
    ),
    msg,
    h('h2',{},'အသုံးစရိတ် မှတ်တမ်းများ'),
    list
  );
}

/* 6. DAILY REPORTS & JSON BACKUP / RESTORE VIEW (Requirements 5, 10, 12, 13, 15, 16) */
function viewReports(){
  const app=$('#app');app.replaceChildren();
  const msg=h('div');
  const fMode=h('select',{},h('option',{value:'day'},'ယနေ့ စာရင်းချုပ် (Daily)'),h('option',{value:'month'},'ဒီလ စာရင်းချုပ် (Monthly)'),h('option',{value:'all'},'အားလုံး စာရင်းချုပ် (All Time)'));
  const repBox=h('div');

  const renderSummary=()=>{
    const mode=fMode.value;
    const now=new Date();
    let startTs=0;
    if(mode==='day'){const d0=new Date();d0.setHours(0,0,0,0);startTs=d0.getTime();}
    else if(mode==='month'){startTs=new Date(now.getFullYear(),now.getMonth(),1).getTime();}

    const fSales=sales.filter(s=>!s.voided&&s.at>=startTs);
    const fExp=expenses.filter(e=>e.at>=startTs);
    const fRepay=debtLogs.filter(d=>d.type==='repay'&&d.at>=startTs);

    let totalRev=0,totalCost=0,totalGasViss=0,totalCans=0;
    let payStats={'ငွေသား (Cash)':0,'KPay':0,'Wave Pay':0,'အကြွေး (Credit)':0};

    fSales.forEach(s=>{
      totalRev+=s.total;
      payStats[s.type]=(payStats[s.type]||0)+s.total;
      s.lines.forEach(l=>{
        if(l.gasViss)totalGasViss+=l.gasViss;
        if(l.gasTank==='can')totalCans+=l.qty;
        totalCost+=((l.cost||0)*l.qty);
      });
    });

    const totalExpAmt=fExp.reduce((a,e)=>a+e.amount,0);
    const totalRepayAmt=fRepay.reduce((a,d)=>a+d.amount,0);
    const grossProfit=totalRev-totalCost;
    const netProfit=grossProfit-totalExpAmt;

    repBox.replaceChildren(
      h('div',{class:'grid2'},
        h('div',{class:'stat-box'},h('small',{},'စုစုပေါင်း ရောင်းရငွေ'),h('div',{class:'num'},money(totalRev))),
        h('div',{class:'stat-box'},h('small',{},'အရင်း (COGS)'),h('div',{class:'num'},money(totalCost))),
        h('div',{class:'stat-box'},h('small',{},'အကြမ်းဖျင်းအမြတ် (Gross)'),h('div',{class:'num',style:'color:var(--ok)'},money(grossProfit))),
        h('div',{class:'stat-box'},h('small',{},'အသားတင်အမြတ် (စရိတ်နှုတ်ပြီး)'),h('div',{class:'num',style:'color:'+(netProfit>=0?'var(--ok)':'var(--red)')},money(netProfit)))
      ),
      h('div',{class:'card',style:'margin-top:10px'},
        h('b',{},'ငွေပေးချေမှုအလိုက် အရောင်းနှင့် အကြွေးပြန်ရငွေ'),
        h('div',{class:'li'},h('span',{},'ငွေသား (Cash)'),h('b',{},money(payStats['ငွေသား (Cash)']||0))),
        h('div',{class:'li'},h('span',{},'KPay'),h('b',{},money(payStats['KPay']||0))),
        h('div',{class:'li'},h('span',{},'Wave Pay'),h('b',{},money(payStats['Wave Pay']||0))),
        h('div',{class:'li'},h('span',{},'အကြွေးရောင်းချမှု (Credit)'),h('b',{style:'color:var(--red)'},money(payStats['အကြွေး (Credit)']||0))),
        h('div',{class:'li'},h('span',{},'အကြွေးပြန်ဆပ် ရရှိငွေ'),h('b',{style:'color:var(--ok)'},money(totalRepayAmt))),
        h('div',{class:'li'},h('span',{},'ဆိုင်အသုံးစရိတ် စုစုပေါင်း'),h('b',{style:'color:var(--red)'},money(totalExpAmt)))
      ),
      h('div',{class:'card'},
        h('b',{},'48kg Gas ထွက်ရှိမှု စာရင်းချုပ်'),
        h('div',{class:'li'},h('span',{},'စုစုပေါင်း ကုန်ကျသည့် Gas ပိဿာ'),h('b',{},r2(totalGasViss)+' ပိဿာ')),
        h('div',{class:'li'},h('span',{},'ရောင်းချခဲ့သည့် Gas ဗူးဖြည့်ပမာဏ'),h('b',{},totalCans+' ဗူး'))
      ),
      h('div',{class:'card'},
        h('b',{},'Excel / CSV ဖိုင်များ ထုတ်ယူရန်'),
        h('div',{class:'row',style:'margin-top:8px'},
          h('button',{class:'b',onclick:()=>{
            const rows=[['SaleID','Date','Time','Customer','PaymentType','ItemName','Qty','Unit','Cost','Price','GasViss','LineTotal']];
            fSales.forEach(s=>{
              const d=new Date(s.at);
              s.lines.forEach(l=>rows.push([s.id,d.toLocaleDateString('en-GB'),d.toLocaleTimeString('en-GB'),s.customer?s.customer.name:'',s.type,l.name,l.qty,l.unit,l.cost||0,l.price,l.gasViss||0,l.qty*l.price]));
            });
            exportCSV('AUNG_Sales_'+mode+'_'+new Date().toISOString().slice(0,10)+'.csv',rows);
          }},'📥 အရောင်း CSV'),
          h('button',{class:'b',onclick:()=>{
            const rows=[['ID','Name','Category','Unit','Cost','Price','Stock','EmptyStock']];
            products.forEach(p=>rows.push([p.id,p.name,p.cat,p.unit,p.cost||0,p.price||0,p.stock||0,p.emptyStock||0]));
            exportCSV('AUNG_Stock_'+new Date().toISOString().slice(0,10)+'.csv',rows);
          }},'📥 စတော့ခ် CSV'),
          h('button',{class:'b',onclick:()=>{
            const rows=[['ID','Date','Category','Amount','Note']];
            fExp.forEach(e=>rows.push([e.id,new Date(e.at).toLocaleString('en-GB'),e.cat,e.amount,e.note||'']));
            exportCSV('AUNG_Expenses_'+new Date().toISOString().slice(0,10)+'.csv',rows);
          }},'📥 စရိတ် CSV')
        )
      )
    );
  };
  fMode.onchange=renderSummary;

  // Complete JSON Backup & Restore (Safe Non-destructive Merge)
  const bkBtn=h('button',{class:'o',onclick:async()=>{
    const payload={
      app:'AUNG-POS',version:5,exportedAt:Date.now(),
      data:{}
    };
    for(const st of STORES){
      payload.data[st]=await all(st);
    }
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='AUNG_POS_Backup_'+new Date().toISOString().slice(0,10)+'.json';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    lastBackup=Date.now();
    await put('meta',{k:'lastBackup',v:lastBackup});
    await reload();viewReports();
  }},'💾 ဒေတာအားလုံး JSON Backup သိမ်းမည်');

  const fileIn=h('input',{type:'file',accept:'.json,application/json'});
  const resBtn=h('button',{class:'b',style:'margin-top:8px;width:100%;padding:11px',onclick:async()=>{
    const f=fileIn.files&&fileIn.files[0];
    if(!f)return note(msg,'Restore လုပ်မည့် .json ဖိုင်ကို အရင်ရွေးချယ်ပါ။');
    if(!confirm('Backup ဖိုင်ထဲမှ ဒေတာများကို လက်ရှိဖုန်းထဲသို့ ပြန်ထည့် (Restore) မလား?
(လက်ရှိ ရှိပြီးသား မှတ်တမ်းများကို မပျက်စီးစေဘဲ အသစ်များကိုသာ ပေါင်းထည့်ပေးပါမည်)'))return;
    try{
      const txt=await f.text();
      const parsed=JSON.parse(txt);
      if(!parsed||!parsed.data)throw new Error('မှန်ကန်သော AUNG POS Backup ဖိုင် မဟုတ်ပါ။');
      let addedCount=0,skippedCount=0;
      for(const st of STORES){
        const arr=parsed.data[st];
        if(!Array.isArray(arr))continue;
        const existing=await all(st);
        const keyField=st==='meta'?'k':'id';
        const existingKeys=new Set(existing.map(x=>x[keyField]));
        for(const item of arr){
          if(!item||!item[keyField])continue;
          if(existingKeys.has(item[keyField])){
            skippedCount++;
          }else{
            await add(st,item);
            addedCount++;
          }
        }
      }
      await reload();renderSummary();
      note(msg,`Restore အောင်မြင်ပါသည်။ မှတ်တမ်းအသစ် (${addedCount}) ခု ထည့်သွင်းပြီး၊ ရှိပြီးသား (${skippedCount}) ခုကို ထပ်မံမထည့်ဘဲ ကာကွယ်ပေးထားပါသည်။`,1);
    }catch(e){
      note(msg,'Restore မအောင်မြင်ပါ: '+(e&&e.message||e));
    }
  }},'📂 JSON Backup ဖိုင်မှ ပြန်သွင်းမည် (Safe Merge Restore)');

  const bkCard=h('div',{class:'card'},
    h('b',{},'Backup နှင့် Restore (ဒေတာလုံခြုံရေး)'),
    h('div',{style:'margin:6px 0'},h('small',{},'နောက်ဆုံး Backup သိမ်းခဲ့ချိန်: ',h('b',{},lastBackup?new Date(lastBackup).toLocaleString('en-GB'):'မရှိသေးပါ'))),
    bkBtn,
    h('hr',{style:'border:0;border-top:1px solid var(--ln);margin:14px 0'}),
    h('label',{},'Backup (.json) ဖိုင် ပြန်ထည့်ရန် ရွေးပါ'),
    fileIn,
    resBtn
  );

  app.append(
    h('div',{class:'card'},h('label',{},'စာရင်းချုပ် ကာလရွေးချယ်ရန်'),fMode),
    msg,
    repBox,
    bkCard
  );
  renderSummary();
}

/* Navigation & App Init */
const show=n=>{
  tab=n;
  for(let i=0;i<=6;i++){
    const btn=$('#t'+i);
    if(btn)btn.className=(n===i?'on':'');
  }
  if(n===0)viewDashboard();
  else if(n===1)viewSale();
  else if(n===2)viewProducts();
  else if(n===3)viewGas();
  else if(n===4)viewCustomers();
  else if(n===5)viewExpenses();
  else if(n===6)viewReports();
};

for(let i=0;i<=6;i++){
  const btn=$('#t'+i);
  if(btn)btn.onclick=()=>show(i);
}

const net=()=>{
  const e=$('#net');
  e.textContent=navigator.onLine?'အွန်လိုင်း':'အော့ဖ်လိုင်း (ဆက်သုံးနိုင်)';
  e.className=navigator.onLine?'':'off';
};
addEventListener('online',net);
addEventListener('offline',net);
net();

(async()=>{
  try{
    db=await open();
    await seed();
    await reload();
    show(0);
    if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
    if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
  }catch(e){
    $('#app').append(h('div',{class:'msg e'},'ဖုန်းထဲ သိုလှောင်မှု ဖွင့်မရပါ: '+(e&&e.message||e)));
  }
})();
