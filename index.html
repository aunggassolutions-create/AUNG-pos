    // =========================================================================
    // 11. VIEW 3: GAS စာရင်းချုပ် (EXACT TABLET SCREENSHOT LAYOUT & WORKFLOW)
    // =========================================================================
    let gasRecDate = dkey(Date.now());

    function viewGas() {
      const app = $('#app');
      app.replaceChildren();
      const msg = h('div');

      const rec = gasDayReconcile(gasRecDate);
      const gs = rec.gStock;
      const openCnt = gs.openCyls.length;
      const diffSign = rec.variance >= 0 ? ('+' + r2(rec.variance)) : String(r2(rec.variance));

      // Card 1: Main Gas Stock (ပိဿာလက်ကျန် စုစုပေါင်း) — matches screenshot 1000005172
      const mainGasCard = h('div', { class: 'card' },
        h('div', { style: 'font-weight:700;font-size:15px;color:var(--grey-dark)' }, 'Main Gas Stock (ပိဿာလက်ကျန် စုစုပေါင်း)'),
        h('div', { class: 'gas-big' }, r2(gs.totalGroundV) + ' ပိဿာ'),
        h('div', { style: 'font-size:12.5px;color:var(--mut);margin-bottom:8px' },
          'အပြည့် ' + gs.totalFullCnt + ' လုံး · လက်ကျန်အိုး (လ/က) ' + openCnt + ' လုံး · အခွံ ' + gs.totalEmptyCnt + ' လုံး' +
          (gs.buyBackRemV > 0 ? (' · Buy-Back ' + r2(gs.buyBackRemV) + ' viss') : '') +
          ' · Diff ' + diffSign + ' viss'
        ),
        ...AG_LIST.map(ag => h('div', { class: 'li' },
          h('span', { style: 'font-weight:600' }, AGENTS[ag].label),
          h('span', { style: 'font-weight:700' },
            'အပြည့် ', h('span', { style: 'color:var(--ok)' }, gs.fullByAg[ag] || 0),
            ' · လ/က ', h('span', { style: 'color:var(--org)' }, gs.openByAg[ag] || 0),
            ' · အခွံ ', h('span', {}, gs.emptyByAg[ag] || 0)
          )
        )),
        h('button', {
          class: 'buyback-btn',
          onclick: async () => {
            const dk = dkey(Date.now());
            if (!(await guardMonthUnlocked(dk, 'Gas Buy-Back (gasret)'))) return;
            const v = parseFloat(await uiPrompt('ဖောက်သည်ထံမှ ပြန်ဝယ်/အမ်းယူသည့် Gas ပိဿာ (Viss)', '', 'number'));
            if (!(v > 0)) return;
            const cost = parseFloat(await uiPrompt('အမှန်တကယ် ပေးချေလိုက်သော Buy-Back ငွေပမာဏ (ကျပ် — သီးခြား Cost Basis ဖြစ်သိမ်းမည်)', '', 'number'));
            if (!(cost >= 0)) return;
            const ch = await uiPrompt('ငွေပေးချေသည့် Channel: 1=ငွေသား 2=KPay 3=Wave 4=AyA', '1', 'number');
            const pm = { '1': 'cash', '2': 'kpay', '3': 'wave', '4': 'aya' }[String(ch || '').trim()] || 'cash';
            await add('gasEv', {
              id: uuid(), at: Date.now(), type: 'gas_ret',
              viss: v, buyBackCost: cost, buyBackRatePerViss: cost / v, m: pm, voided: false
            });
            await reload();
            viewGas();
            note(msg, '✓ Gas Buy-Back ' + r2(v) + ' viss (' + money(cost) + ' · ' + PAY[pm] + ') မှတ်တမ်းတင်ပြီးပါပြီ။', true);
          }
        }, '↩ Gas လက်ကျန်ပြန်ဝယ် / အမ်းငွေ မှတ်မည်'),
        h('div', { class: 'row', style: 'margin-top:8px' },
          h('button', {
            class: 'n',
            onclick: async () => {
              const dk = dkey(Date.now());
              if (!(await guardMonthUnlocked(dk, 'Gas Supplier Intake'))) return;
              const ch = await uiPrompt('Gas Supplier အဝင် 1=TT Gas (28.5) 2=NGN (28.5) 3=Easy Gas (30)', '1', 'number');
              const ag = { '1': 'TT Gas', '2': 'NGN', '3': 'Easy Gas' }[String(ch || '').trim()];
              if (!ag) return;
              const q = parseInt(await uiPrompt(ag + ' အဝင် အိုးအရေအတွက် (Cylinders)', '1', 'number'), 10);
              if (!(q > 0)) return;
              const nom = r2(q * capOf(ag));
              const act = parseFloat(await uiPrompt('လက်တွေ့ ကတ္တားချိန် စုစုပေါင်း ပိဿာ (Nominal: ' + nom + ' viss)', nom, 'number'));
              if (!(act > 0)) return;
              const cost = parseFloat(await uiPrompt('Supplier ပေးချေရမည့် ကျသင့်ငွေ စုစုပေါင်း (ကျပ်)', '', 'number'));
              if (!(cost >= 0)) return;
              const payCh = await uiPrompt('ငွေပေးချေမှု Channel (0=အကြွေး/နောက်မှရှင်း, 1=ငွေသား, 2=KPay, 3=Wave, 4=AyA)', '1', 'number');
              const pm = { '1': 'cash', '2': 'kpay', '3': 'wave', '4': 'aya' }[String(payCh || '').trim()] || null;
              const shortV = Math.max(r2(nom - act), 0);
              const varCost = shortV > 0 ? r2((cost / nom) * shortV) : 0;
              const now = Date.now();
              await run(['gasCyl', 'gasEv'], 'readwrite', t => {
                const cOs = t.objectStore('gasCyl');
                for (let i = 0; i < q; i++) cOs.add({ id: uuid(), agent: ag, state: 'full', role: null, receivedAt: now });
                t.objectStore('gasEv').add({
                  id: uuid(), at: now, type: 'recv', agent: ag, qty: q,
                  nominalViss: nom, actualViss: act, shortageViss: shortV,
                  varianceCostMmk: varCost, cost, m: pm, voided: false
                });
              });
              await reload();
              viewGas();
            }
          }, '+ Gas အဝင် (Supplier Intake)'),
          h('button', {
            class: 'n',
            onclick: async () => {
              const dk = dkey(Date.now());
              if (!(await guardMonthUnlocked(dk, 'Set Gas Stock Baseline'))) return;
              const ch = await uiPrompt('လက်ရှိ အပြည့်အိုး (Full) ပြင်မည့် Supplier:\n1=TT Gas 2=NGN 3=Easy Gas', '1', 'number');
              const ag = { '1': 'TT Gas', '2': 'NGN', '3': 'Easy Gas' }[String(ch || '').trim()];
              if (!ag) return;
              const fullCnt = parseInt(await uiPrompt(ag + ' လက်ရှိ အပြည့်အိုး (Full) အရေအတွက်', gs.fullByAg[ag] || 0, 'number'), 10);
              if (isNaN(fullCnt) || fullCnt < 0) return;
              const empCnt = parseInt(await uiPrompt(ag + ' လက်ရှိ အခွံ (Empty) အရေအတွက်', gs.emptyByAg[ag] || 0, 'number'), 10);
              if (isNaN(empCnt) || empCnt < 0) return;
              const now = Date.now();
              await run(['gasCyl'], 'readwrite', t => {
                const cOs = t.objectStore('gasCyl');
                gasCyl.filter(c => agOf(c) === ag && (c.state === 'full' || c.state === 'empty')).forEach(c => cOs.delete(c.id));
                for (let i = 0; i < fullCnt; i++) cOs.add({ id: uuid(), agent: ag, state: 'full', role: null, receivedAt: now });
                for (let i = 0; i < empCnt; i++) cOs.add({ id: uuid(), agent: ag, state: 'empty', role: null, closedAt: now });
              });
              await reload();
              viewGas();
            }
          }, '⚙ အပြည့်/အခွံ လက်ကျန်ညှိ')
        )
      );

      // Card 2 & 3: Active Slots (ပိဿာဖြည့်အိုး & ဗူးဖြည့်အိုး) — matches screenshot 1000005172
      const slotCard = (role, title) => {
        const cur = liveRole(role);
        const rem = cur ? cylViss(cur) : 0;
        const estCans = Math.round(rem * (cfg.cans || 7));
        return h('div', { class: 'card' },
          h('div', { style: 'font-weight:700;font-size:15px' }, title + (cur ? (' · ' + agOf(cur)) : '')),
          h('div', { class: 'gas-big' }, cur ? (r2(rem) + ' ပိဿာ') : 'မဖွင့်ရသေးပါ'),
          cur ? h('div', { style: 'font-size:12.5px;color:var(--mut);margin-bottom:8px' }, '≈ Gas ဗူး: ' + estCans + ' ဗူး') : h('div', { style: 'margin-bottom:8px' }),
          h('div', { class: 'row' },
            h('button', { class: 'o', style: 'margin-top:0', onclick: () => askSwap(role) }, 'အိုးလဲမည်'),
            h('button', { class: 'n', onclick: () => weighB(role) }, 'လက်ကျန်ချိန်မည်')
          )
        );
      };

      // Card 4: နေ့စဉ် Gas စာရင်းတိုက်စစ်ချက် (Daily Gas Reconciliation) — matches screenshot 1000005173
      const dateSel = h('select', { style: 'width:auto;min-width:135px;padding:6px 10px;font-weight:700' });
      const dateOpts = new Set([dkey(Date.now()), gasRecDate]);
      for (let i = 1; i <= 14; i++) dateOpts.add(dkey(Date.now() - i * 86400000));
      Array.from(dateOpts).sort((a, b) => b.localeCompare(a)).forEach(dk => {
        const opt = h('option', { value: dk }, ddisp(dk));
        if (dk === gasRecDate) opt.selected = true;
        dateSel.appendChild(opt);
      });
      dateSel.onchange = () => { gasRecDate = dateSel.value; viewGas(); };

      const groundBreakdown = [];
      AG_LIST.forEach(ag => {
        const cnt = gs.fullByAg[ag] || 0;
        if (cnt > 0) {
          groundBreakdown.push(h('div', { class: 'gas-row' },
            h('span', {}, 'Full · ' + ag + ' (' + cnt + ' × ' + capOf(ag) + ' viss)'),
            h('span', {}, r2(cnt * capOf(ag)) + ' viss')
          ));
        }
      });
      gs.openCyls.forEach(oc => {
        groundBreakdown.push(h('div', { class: 'gas-row' },
          h('span', {}, 'လ/က · ' + oc.ag + ' (1 × ' + r2(oc.remV) + ' viss)'),
          h('span', {}, r2(oc.remV) + ' viss')
        ));
      });
      if (gs.buyBackRemV > 0) {
        groundBreakdown.push(h('div', { class: 'gas-row' },
          h('span', {}, 'Buy-Back Stock'),
          h('span', {}, r2(gs.buyBackRemV) + ' viss')
        ));
      }

      const reconcileCard = h('div', { class: 'card', style: 'border:1.5px solid var(--grey)' },
        h('div', { style: 'display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px' },
          h('b', { style: 'font-size:16px' }, 'နေ့စဉ် Gas စာရင်းတိုက်စစ်ချက်'),
          dateSel
        ),
        h('div', { class: 'gas-row' },
          h('span', { style: 'color:var(--mut)' }, 'Opening Balance'),
          h('b', {}, r2(rec.openV) + ' viss')
        ),
        h('div', { class: 'gas-row' },
          h('span', {}, '+ အဝင် (In) ' + rec.inSummary),
          h('b', { style: 'color:var(--ok)' }, '+' + r2(rec.totalInV) + ' viss')
        ),
        h('div', { class: 'gas-row' },
          h('span', {}, '− ယနေ့ ပိဿာအရောင်း:'),
          h('span', {}, '−' + r2(rec.vissSold) + ' viss')
        ),
        h('div', { class: 'gas-row' },
          h('span', {}, '− ဗူးအိုးလဲ ' + rec.canSwapSummary),
          h('span', {}, '−' + r2(rec.canSwapV) + ' viss')
        ),
        h('div', { class: 'gas-row sep' },
          h('span', {}, '= စာရင်းလက်ကျန် (Book Stock)'),
          h('span', {}, r2(rec.bookStock) + ' viss')
        ),
        h('div', { class: 'gas-subbox' },
          h('div', { style: 'font-weight:700;margin-bottom:4px' }, 'မြေပြင်လက်ကျန် (Ground Stock)'),
          ...(groundBreakdown.length ? groundBreakdown : [h('small', {}, 'မြေပြင်လက်ကျန် မရှိသေးပါ')]),
          h('div', { class: 'gas-row sep' },
            h('span', {}, '= မြေပြင်လက်ကျန် စုစုပေါင်း:'),
            h('span', {}, r2(rec.groundStock) + ' viss')
          )
        ),
        h('div', { class: 'gas-row', style: 'font-size:15.5px;font-weight:800;margin:6px 0' },
          h('span', {}, 'ကွာဟချက် (မြေပြင် − စာရင်း):'),
          h('span', { style: 'color:' + (rec.variance < 0 ? 'var(--red)' : 'var(--ok)') }, diffSign + ' viss')
        ),
        h('div', { class: 'row' },
          h('button', {
            class: 'n',
            onclick: async () => {
              if (!(await guardMonthUnlocked(gasRecDate, 'Gas Opening Balance'))) return;
              const v = parseFloat(await uiPrompt(ddisp(gasRecDate) + ' Gas Opening Balance (viss) ပြင်မည်', r2(rec.openV), 'number'));
              if (isNaN(v) || v < 0) return;
              await add('gasEv', { id: uuid(), at: Date.now(), type: 'gas_open', date: gasRecDate, viss: r2(v) });
              await reload();
              viewGas();
            }
          }, 'Opening ပြင်မည်'),
          h('button', {
            class: 'n',
            onclick: async () => {
              if (!(await guardMonthUnlocked(gasRecDate, 'Save Evening Gas Ground Stock'))) return;
              await add('gasEv', { id: uuid(), at: Date.now(), type: 'gas_close', date: gasRecDate, groundViss: r2(rec.groundStock), bookViss: r2(rec.bookStock), varianceViss: r2(rec.variance) });
              await reload();
              viewGas();
              note(msg, '✓ ' + ddisp(gasRecDate) + ' ညနေလက်ကျန် (' + r2(rec.groundStock) + ' viss) သိမ်းပြီးပါပြီ။', true);
            }
          }, 'ညနေလက်ကျန် သိမ်းမည်')
        )
      );

      app.append(
        msg,
        mainGasCard,
        slotCard('viss', 'ပိဿာဖြည့်အိုး (လက်ရှိသုံးနေတာ)'),
        slotCard('can', 'ဗူးဖြည့်အိုး (လက်ရှိသုံးနေတာ)'),
        reconcileCard
      );
    }

    // =========================================================================
    // 12. VIEW 6: OXYGEN 4-TYPE MATRIX, BACKDATED O2 ENTRY & FACTORY SETTLEMENTS
    // =========================================================================
    function viewOxy() {
      const app = $('#app');
      app.replaceChildren();
      const msg = h('div');
      const mat = o2StockMatrix();
      const mStat = motherCylStatus();
      const cl = h('datalist', { id: 'o2cl' }, customers().map(c => h('option', { value: c.name })));

      const matrixCard = h('div', { class: 'card', style: 'border:2px solid var(--grey-dark)' },
        h('b', { style: 'font-size:16px' }, 'Oxygen 4-Type Ownership & Stock Matrix'),
        h('div', { class: 'tbl-wrap' },
          h('table', { class: 'st-tbl' },
            h('thead', {}, h('tr', {},
              h('th', {}, 'Type (Ownership)'),
              h('th', {}, 'Fill Cost'),
              h('th', {}, 'Full'),
              h('th', {}, 'Empty'),
              h('th', {}, 'Customer'),
              h('th', {}, 'Factory'),
              h('th', {}, 'Payable')
            )),
            h('tbody', {}, ...Object.values(mat).map(t => h('tr', {},
              h('td', {}, h('b', {}, o2Label(t.id)), h('br'), h('small', {}, t.ownership)),
              h('td', {}, t.rate.toLocaleString()),
              h('td', { style: 'font-weight:700;color:' + (t.full <= 0 ? 'var(--red)' : 'var(--ok)') }, t.full),
              h('td', {}, t.empty),
              h('td', {}, t.atCustomer),
              h('td', {}, t.atFactory),
              h('td', {}, t.payable.toLocaleString())
            )))
          )
        )
      );

      // Backdated / Past-Days Oxygen Entry Card (effectiveDate + createdAt audit + Month Lock check)
      const bdDateIn = h('input', { type: 'date', max: dkey(Date.now()), value: dkey(Date.now()) });
      const bdActionSel = h('select', {},
        h('option', { value: 'counter_swap' }, '1) Counter Exchange (အခွံ ၁:၁ လဲ အရောင်း)'),
        h('option', { value: 'site_deliver_keep' }, '2) Site Delivery — Keep (Customer Custody +)'),
        h('option', { value: 'site_deliver_swap' }, '3) Site Delivery — Swap (Site အခွံချက်ချင်းလဲ)'),
        h('option', { value: 'cust_empty_return' }, '4) Customer Empty Return (အခွံပြန်အပ် · Custody −)'),
        h('option', { value: 'o2_dropoff_pickup' }, '5) O2 Drop-off (Filled – Awaiting Pickup)'),
        h('option', { value: 'stock_set_full' }, '6) Adjust Shop Full Stock Baseline'),
        h('option', { value: 'stock_set_empty' }, '7) Adjust Shop Empty Stock Baseline')
      );
      const bdTypeSel = h('select', {}, Object.values(O2_TYPES).map(t => h('option', { value: t.id }, o2Label(t.id) + ' [' + t.ownership + ']')));
      const bdQtyIn = h('input', { type: 'number', inputmode: 'numeric', min: '0', placeholder: 'အရေအတွက် (Cylinders)' });
      const bdPriceIn = h('input', { type: 'number', inputmode: 'numeric', min: '0', placeholder: 'တစ်အိုး ရောင်းဈေး (အရောင်းဖြစ်လျှင်)' });
      const bdCustIn = h('input', { list: 'o2cl', placeholder: 'Customer / Site Name (Custody / Drop-off / Credit)' });
      const bdPaySel = h('select', {}, Object.entries(PAY).map(([k, v]) => h('option', { value: k }, v)));
      const bdNoteIn = h('input', { placeholder: 'မှတ်ချက် (ဥပမာ- ယမန်နေ့ ညနေပိုင်း အရောင်း/အခွံပြန်အပ်)' });

      const bdSaveBtn = h('button', {
        class: 'o',
        onclick: async () => {
          const effDate = bdDateIn.value || dkey(Date.now());
          if (!(await guardMonthUnlocked(effDate, 'Backdated Oxygen Entry (' + effDate + ')'))) return;

          const act = bdActionSel.value;
          const tid = bdTypeSel.value;
          const own = O2_TYPES[tid].ownership;
          const q = parseInt(bdQtyIn.value, 10);
          const unitPr = parseFloat(bdPriceIn.value) || 0;
          const cName = bdCustIn.value.trim();
          const pm = bdPaySel.value;
          const noteTxt = bdNoteIn.value.trim();

          if (act === 'stock_set_full' || act === 'stock_set_empty') {
            if (isNaN(q) || q < 0) return note(msg, 'အိုးအရေအတွက် 0 သို့မဟုတ် အထက် ထည့်ပါ။');
            const now = Date.now();
            const effTs = effDate === dkey(now) ? now : dbounds(effDate)[0] + 43200000;
            await add('stk', {
              id: uuid(), movementId: uuid(), type: 'o2_stock_set',
              o2type: tid, ownership: own, target: act === 'stock_set_full' ? 'full' : 'empty',
              newQty: q, at: effTs, createdAt: now, note: noteTxt
            });
            await reload();
            viewOxy();
            return note(msg, '✓ ' + effDate + ' အတွက် ' + o2Label(tid) + ' Stock Baseline (' + q + ') သိမ်းပြီးပါပြီ (createdAt audit logged)။', true);
          }

          if (!(q > 0)) return note(msg, 'အိုးအရေအတွက် 1 နှင့်အထက် ထည့်ပါ။');
          const curMat = o2StockMatrix()[tid];

          if (act === 'cust_empty_return') {
            if (!cName) return note(msg, 'အခွံပြန်အပ်သည့် Customer Name ထည့်ပါ။');
            const held = custO2Custody(ck(cName), tid);
            if (held < q) {
              return note(msg, '⛔ ' + cName + ' ထံတွင် ' + o2Label(tid) + ' Custody (' + held + ' လုံး) သာရှိသဖြင့် ' + q + ' လုံး ပြန်အပ်၍ မရပါ။');
            }
            const now = Date.now();
            const effTs = effDate === dkey(now) ? now : dbounds(effDate)[0] + 43200000;
            const movId = uuid();
            await run(['stk', 'cf'], 'readwrite', t => {
              t.objectStore('stk').add({
                id: uuid(), movementId: movId, saleLineId: null,
                type: 'o2_mov', o2type: tid, ownership: own, movementType: 'cust_empty_return',
                locationFrom: 'AT_CUSTOMER', locationTo: 'SHOP_EMPTY', qty: q,
                at: effTs, createdAt: now, note: noteTxt
              });
              t.objectStore('cf').add({
                id: uuid(), movementId: movId, type: 'o2cust',
                cust: cName, o2type: tid, ownership: own, qtyDelta: -q,
                at: effTs, createdAt: now, note: noteTxt
              });
            });
            await reload();
            viewOxy();
            return note(msg, '✓ ' + effDate + ' ရက်စွဲဖြင့် ' + cName + ' ထံမှ ' + o2Label(tid) + ' အခွံ ' + q + ' လုံး ပြန်အပ်စာရင်း သိမ်းပြီးပါပြီ။', true);
          }

          if (curMat.full < q) {
            return note(msg, '⛔ ' + o2Label(tid) + ' Full Stock (' + curMat.full + ') မလုံလောက်ပါ။');
          }
          if ((act === 'site_deliver_keep' || pm === 'credit' || pm === 'pending') && !cName) {
            return note(msg, 'Customer / Site Name ထည့်ပါ။');
          }

          const now = Date.now();
          const effTs = effDate === dkey(now) ? now : dbounds(effDate)[0] + 43200000;
          const sId = uuid();
          const lineId = sId + ':0';
          const total = q * unitPr;
          const isDrop = act === 'o2_dropoff_pickup';
          const effPay = isDrop ? 'dropoff' : pm;

          const saleRec = {
            id: sId,
            at: effTs,
            createdAt: now,
            pay: effPay,
            parts: [{ m: effPay, a: total }],
            cust: cName || null,
            tag: noteTxt || null,
            term: effPay === 'credit' ? 'next_return' : 'immediate',
            discount: 0,
            isO2Dropoff: isDrop,
            pickedUpAt: null,
            lines: [{
              lineId, pid: null, name: o2Label(tid),
              qty: q, unit: 'အိုး', price: unitPr, foc: unitPr === 0,
              o2type: tid, ownership: own, o2Movement: act
            }],
            total,
            voided: false,
            rev: 1,
            updatedAt: now,
            deviceId: DEVICE_ID
          };

          await run(['sales', 'stk', 'cf'], 'readwrite', t => {
            t.objectStore('sales').add(saleRec);
            if (act === 'counter_swap' || act === 'site_deliver_swap') {
              t.objectStore('stk').add({
                id: uuid(), movementId: uuid(), saleLineId: lineId,
                type: 'o2_mov', o2type: tid, ownership: own, movementType: act,
                locationFrom: 'SHOP_FULL', locationTo: 'AT_CUSTOMER', qty: q,
                at: effTs, createdAt: now, note: noteTxt
              });
              t.objectStore('stk').add({
                id: uuid(), movementId: uuid(), saleLineId: lineId,
                type: 'o2_mov', o2type: tid, ownership: own, movementType: act,
                locationFrom: 'AT_CUSTOMER', locationTo: 'SHOP_EMPTY', qty: q,
                at: effTs, createdAt: now, note: noteTxt
              });
            } else {
              t.objectStore('stk').add({
                id: uuid(), movementId: uuid(), saleLineId: lineId,
                type: 'o2_mov', o2type: tid, ownership: own, movementType: act,
                locationFrom: 'SHOP_FULL', locationTo: 'AT_CUSTOMER', qty: q,
                at: effTs, createdAt: now, note: noteTxt
              });
              if (cName && !isDrop) {
                t.objectStore('cf').add({
                  id: uuid(), movementId: uuid(), saleLineId: lineId,
                  type: 'o2cust', cust: cName, o2type: tid, ownership: own, qtyDelta: q,
                  at: effTs, createdAt: now, note: noteTxt
                });
              }
            }
          });

          await reload();
          viewOxy();
          note(msg, '✓ ' + effDate + ' ရက်စွဲဖြင့် ' + o2Label(tid) + ' (' + act + ') စာရင်း သိမ်းပြီးပါပြီ (createdAt: ' + sd_(now) + ')။', true);
        }
      }, 'အရင်ရက် / ယနေ့ Oxygen စာရင်း သိမ်းမည်');

      const backdateO2Card = h('div', { class: 'card kpi-box org' },
        h('b', { style: 'font-size:15.5px' }, '📅 Oxygen အရင်ရက်စာရင်း ထည့်ရန် (Backdated / Past-Days O2 Entry)'),
        h('small', {}, 'ရွေးချယ်ထားသော Effective Date (at) ဖြင့် P&L နှင့် Stock တွင် တွက်ချက်ပြီး၊ စက်ရိုက်သွင်းချိန် (createdAt) ကို Audit အဖြစ် သီးခြားသိမ်းဆည်းပါမည်။'),
        h('div', { class: 'row' },
          h('div', {}, h('label', {}, 'ဖြစ်ပွားသည့် ရက်စွဲ (Effective Date)'), bdDateIn),
          h('div', {}, h('label', {}, 'လုပ်ဆောင်ချက် (Movement)'), bdActionSel)
        ),
        h('div', { class: 'row' },
          h('div', {}, h('label', {}, 'Oxygen Type (၄ မျိုး)'), bdTypeSel),
          h('div', {}, h('label', {}, 'အရေအတွက် (Qty)'), bdQtyIn)
        ),
        h('div', { class: 'row' },
          h('div', {}, h('label', {}, 'တစ်အိုး ရောင်းဈေး (Price)'), bdPriceIn),
          h('div', {}, h('label', {}, 'ငွေပေးချေမှု (Payment)'), bdPaySel)
        ),
        h('label', {}, 'Customer / Site Name'), bdCustIn,
        h('label', {}, 'မှတ်ချက် (Note)'), bdNoteIn,
        bdSaveBtn
      );

      const facDateIn = h('input', { type: 'date', max: dkey(Date.now()), value: dkey(Date.now()) });
      const tSel = h('select', {}, Object.values(O2_TYPES).map(t => h('option', { value: t.id }, o2Label(t.id) + ' (' + money((cfg.o2Rates && cfg.o2Rates[t.id]) || t.defaultRate) + ')')));
      const qIn = h('input', { type: 'number', inputmode: 'numeric', placeholder: 'အရေအတွက် (Cylinders)' });

      const sendEmptyBtn = h('button', {
        class: 'n',
        onclick: async () => {
          const dk = facDateIn.value || dkey(Date.now());
          if (!(await guardMonthUnlocked(dk, 'Send Empty to Factory'))) return;
          const tid = tSel.value, q = parseInt(qIn.value, 10);
          if (!(q > 0)) return note(msg, 'အရေအတွက် ထည့်ပါ။');
          if (mat[tid].empty < q) return note(msg, '⛔ Shop Empty Stock (' + mat[tid].empty + ') မလုံလောက်ပါ။');
          const now = Date.now();
          const effTs = dk === dkey(now) ? now : dbounds(dk)[0] + 43200000;
          await add('stk', {
            id: uuid(), movementId: uuid(), saleLineId: null,
            type: 'o2_fac_send', o2type: tid, ownership: O2_TYPES[tid].ownership,
            movementType: 'fac_send_empty', locationFrom: 'SHOP_EMPTY', locationTo: 'AT_FACTORY',
            qty: q, at: effTs, createdAt: now
          });
          await reload();
          viewOxy();
        }
      }, 'စက်ရုံသို့ အခွံပို့');

      const recvFullBtn = h('button', {
        onclick: async () => {
          const dk = facDateIn.value || dkey(Date.now());
          if (!(await guardMonthUnlocked(dk, 'Receive Full from Factory'))) return;
          const tid = tSel.value, q = parseInt(qIn.value, 10);
          if (!(q > 0)) return note(msg, 'အရေအတွက် ထည့်ပါ။');
          const rt = (cfg.o2Rates && cfg.o2Rates[tid]) || O2_TYPES[tid].defaultRate;
          const now = Date.now();
          const effTs = dk === dkey(now) ? now : dbounds(dk)[0] + 43200000;
          await add('stk', {
            id: uuid(), movementId: uuid(), saleLineId: null,
            type: 'o2_fac_recv', o2type: tid, ownership: O2_TYPES[tid].ownership,
            movementType: 'fac_recv_full', locationFrom: 'AT_FACTORY', locationTo: 'SHOP_FULL',
            qty: q, rate: rt, totalAmt: q * rt, paidAmt: 0, status: 'unpaid', settlementRefs: [],
            at: effTs, createdAt: now
          });
          await reload();
          viewOxy();
        }
      }, 'စက်ရုံမှ အပြည့်လက်ခံ');

      const openBills = stk.filter(e => e.type === 'o2_fac_recv' && !e.voided && (e.totalAmt - (e.paidAmt || 0)) > 0.5).sort((a, b) => a.at - b.at);
      const totPayable = openBills.reduce((a, b) => a + (b.totalAmt - (b.paidAmt || 0)), 0);

      const settleBtn = h('button', {
        class: 'o',
        onclick: async () => {
          const dk = dkey(Date.now());
          if (!(await guardMonthUnlocked(dk, 'Factory O2 Settlement'))) return;
          if (!openBills.length) return note(msg, 'ရှင်းရန်ကျန် Factory Bill မရှိပါ။');
          const amtVal = parseFloat(await uiPrompt('ပေးချေမည့် ငွေပမာဏ (Partial ရသည် · ကျန်ငွေ: ' + money(totPayable) + ')', totPayable, 'number'));
          if (!(amtVal > 0) || amtVal > totPayable + 0.5) return note(msg, 'ပမာဏ မှန်ကန်စွာ ထည့်ပါ။');
          const c = await uiPrompt('Payment Channel 1=Cash 2=KPay 3=Wave 4=AyA', '2', 'number');
          const pm = { '1': 'cash', '2': 'kpay', '3': 'wave', '4': 'aya' }[String(c || '').trim()];
          if (!pm) return;

          let rem = amtVal;
          const allocs = [], billUpdates = [];
          for (const b of openBills) {
            if (rem <= 0.01) break;
            const due = b.totalAmt - (b.paidAmt || 0);
            const ap = Math.min(rem, due);
            const np = (b.paidAmt || 0) + ap;
            allocs.push({ billId: b.id, appliedAmt: ap });
            billUpdates.push({ ...b, paidAmt: np, status: np >= b.totalAmt - 0.5 ? 'paid' : 'partial', settlementRefs: [...(b.settlementRefs || []), 'PENDING'] });
            rem -= ap;
          }

          const refId = uuid();
          const now = Date.now();
          if (cf.some(e => e.refId === refId && !e.voided)) return note(msg, 'Duplicate refId blocked.');

          await run(['stk', 'cf'], 'readwrite', t => {
            const sOs = t.objectStore('stk');
            billUpdates.forEach(bu => {
              const refs = bu.settlementRefs.map(x => x === 'PENDING' ? refId : x);
              sOs.put({ ...bu, settlementRefs: refs });
            });
            sOs.add({ id: refId, type: 'o2_fac_settle', refId, allocations: allocs, totalPaid: amtVal, method: pm, at: now, voided: false });
            t.objectStore('cf').add({
              id: uuid(), type: 'exp', cat: 'factory', refId, isO2Settlement: true,
              amt: amtVal, m: pm, at: now, desc: 'O2 Factory Settlement #' + refId.slice(-6), voided: false
            });
          });
          await reload();
          viewOxy();
          note(msg, 'Factory Settlement ' + money(amtVal) + ' (refId: ' + refId.slice(-6) + ') သိမ်းပြီးပါပြီ။', true);
        }
      }, 'Factory O2 ငွေချေမည် (Partial / Full)');

      const settles = stk.filter(e => e.type === 'o2_fac_settle').sort((a, b) => b.at - a.at).slice(0, 8);
      const settleCard = settles.length ? h('div', { class: 'card' },
        h('b', {}, 'Factory Settlements (Void vs Actual Cash Refund)'),
        ...settles.map(st => h('div', { class: 'li', style: 'flex-wrap:wrap' },
          h('span', { class: st.voided ? 'void' : '' },
            dkey(st.at) + ' · #' + st.refId.slice(-6) + ' · ' + money(st.totalPaid) + ' (' + PAY[st.method] + ')' + (st.voided ? ' [VOID]' : '')
          ),
          !st.voided ? h('span', { style: 'display:flex;gap:4px' },
            h('button', {
              class: 'g',
              onclick: async () => {
                if (!(await guardMonthUnlocked(dkey(st.at), 'Void Settlement'))) return;
                if (!(await requireOwnerPin('Void Settlement #' + st.refId.slice(-6)))) return;
                const now = Date.now();
                await run(['stk', 'cf'], 'readwrite', t => {
                  const sOs = t.objectStore('stk');
                  sOs.put({ ...st, voided: true, voidedAt: now });
                  (st.allocations || []).forEach(al => {
                    const b = stk.find(x => x.id === al.billId);
                    if (b) {
                      const np = Math.max((b.paidAmt || 0) - al.appliedAmt, 0);
                      sOs.put({ ...b, paidAmt: np, status: np <= 0.5 ? 'unpaid' : 'partial' });
                    }
                  });
                  cf.filter(e => e.refId === st.refId && !e.voided).forEach(e => t.objectStore('cf').put({ ...e, voided: true, voidedAt: now }));
                });
                await reload();
                viewOxy();
              }
            }, 'Void (No Cash Inflow)'),
            h('button', {
              class: 'n',
              onclick: async () => {
                const dk = dkey(Date.now());
                if (!(await guardMonthUnlocked(dk, 'Actual Factory Cash Refund'))) return;
                if (!(await requireOwnerPin('Actual Cash Refund #' + st.refId.slice(-6)))) return;
                const rAmt = parseFloat(await uiPrompt('စက်ရုံမှ အမှန်တကယ် ငွေပြန်အမ်းသော ပမာဏ (Actual Cash Refund)', st.totalPaid, 'number'));
                if (!(rAmt > 0)) return;
                const refId = uuid(), now = Date.now();
                await run(['stk', 'cf'], 'readwrite', t => {
                  t.objectStore('stk').add({ id: refId, type: 'o2_fac_refund', refSettlementId: st.refId, refundAmt: rAmt, method: st.method, at: now });
                  t.objectStore('cf').add({ id: uuid(), type: 'fac_refund_in', refId, amt: rAmt, m: st.method, at: now, desc: 'Factory Actual Refund #' + st.refId.slice(-6) });
                });
                await reload();
                viewOxy();
              }
            }, 'Actual Refund')
          ) : ''
        ))
      ) : '';

      const motherCard = h('div', { class: 'card' },
        h('b', {}, 'Mother Cylinder (Over 40L Shop-Owned) — ' + mStat.capL + 'L ',
          h('span', { class: cfg.motherCapConfirmed ? 'tag g' : 'tag r' }, cfg.motherCapConfirmed ? 'Confirmed' : 'UNVERIFIED ESTIMATE')

        h('div', { style: 'margin:6px 0' },

              const allocCost = r2(liters * mStat.costPerL);

              await run(['stk', 'sales'], 'readwrite', t => {

      app.append(

          tSel, qIn,
          h('div', { class: 'row', style: 'margin-top:8px' }, sendEmptyBtn, recvFullBtn),

      );

    // =========================================================================
    // 13. VIEW 4: CUSTOMERS (FIFO + OVERRIDE PAYMENTS, MERGE & LOST CYLINDER)
    // =========================================================================
    function viewCust() {
      const app = $('#app');
      app.replaceChildren();
      const list = customers().sort((a, b) => (b.bal + b.compBal) - (a.bal + a.compBal));
      app.append(
        h('div', { class: 'card' },
          h('div', { style: 'display:flex;justify-content:space-between;align-items:center' },
            h('b', {}, 'Customers (' + list.length + ')'),
            h('button', {
              class: 'n',
              onclick: async () => {
                const src = await uiPrompt('Merge လုပ်မည့် Customer Name အဟောင်း (Source)');
                const dst = await uiPrompt('ပေါင်းစည်းမည့် Customer Name အဓိက (Target)');
                if (!src || !dst || ck(src) === ck(dst)) return;
                const ok = await requireOwnerPin('Merge Customer "' + src + '" -> "' + dst + '"');
                if (!ok) return;
                await run(['sales', 'pays', 'cf', 'meta'], 'readwrite', t => {
                  sales.forEach(s => { if (ck(s.cust) === ck(src)) t.objectStore('sales').put({ ...s, cust: dst.trim() }); });
                  pays.forEach(p => { if (ck(p.cust) === ck(src)) t.objectStore('pays').put({ ...p, cust: dst.trim() }); });
                  cf.forEach(e => { if (ck(e.cust) === ck(src)) t.objectStore('cf').put({ ...e, cust: dst.trim() }); });
                  t.objectStore('meta').put({ k: 'cust_merge_' + uuid(), v: { from: src.trim(), to: dst.trim(), at: Date.now(), ownerId: 'OWNER' } });
                });
                await reload();
                viewCust();
              }
            }, 'Customer Merge (Owner PIN)')
          )
        ),
        ...list.map(c => h('div', { class: 'card', style: 'cursor:pointer', onclick: () => viewCustDetail(c.key) },
          h('div', { class: 'li' },
            h('span', {},
              h('b', {}, c.name),
              c.compBal > 0 ? h('span', { class: 'tag r' }, 'Cyl Comp Due ' + money(c.compBal)) : ''
            ),
            h('b', { style: 'color:' + (c.bal > 0 ? 'var(--red)' : 'var(--ok)') }, money(c.bal))
          )
        ))
      );
    }

    function viewCustDetail(custKey) {
      const c = customers().find(x => x.key === custKey);
      if (!c) return viewCust();
      const app = $('#app');
      app.replaceChildren();
      const msg = h('div');
      const unpaid = unpaidInvoices(custKey);

      const amtIn = h('input', { type: 'number', inputmode: 'numeric', placeholder: 'ငွေပမာဏ (Partial / Multi-Invoice)' });
      const mthSel = h('select', {}, MTH.map(k => h('option', { value: k }, PAY[k])));
      const dateIn = h('input', { type: 'date', max: dkey(Date.now()), value: dkey(Date.now()) });
      const allocMode = h('select', {},
        h('option', { value: 'FIFO' }, 'FIFO (အဟောင်းဆုံး Invoice မှ အစဉ်လိုက်)'),
        ...unpaid.map(u => h('option', { value: u.sale.id }, 'Owner Override: ' + dkey(u.sale.at) + ' · ကျန် ' + money(u.rem)))
      );

      const payBtn = h('button', {
        class: 'o',
        onclick: async () => {
          const dk = dateIn.value || dkey(Date.now());
          if (!(await guardMonthUnlocked(dk, 'Customer Payment'))) return;
          const val = parseFloat(amtIn.value);
          if (!(val > 0) || val > c.bal + 0.5) return note(msg, 'ပမာဏ မှန်ကန်စွာ ထည့်ပါ။');
          if (allocMode.value !== 'FIFO') {
            const ok = await requireOwnerPin('Owner Override Invoice Allocation');
            if (!ok) return;
          }
          let rem = val;
          const allocs = [];
          const ordered = allocMode.value === 'FIFO'
            ? unpaid
            : [...unpaid.filter(x => x.sale.id === allocMode.value), ...unpaid.filter(x => x.sale.id !== allocMode.value)];
          for (const u of ordered) {
            if (rem <= 0.01) break;
            const ap = Math.min(rem, u.rem);
            allocs.push({ saleId: u.sale.id, appliedAmt: ap });
            rem -= ap;
          }
          const now = Date.now();
          const colTs = dk === dkey(now) ? now : dbounds(dk)[0] + 43200000;
          await add('pays', {
            id: uuid(), at: colTs, cust: c.name, amount: val,
            method: mthSel.value, allocations: allocs, isCompensation: false, voided: false
          });
          await reload();
          viewCustDetail(custKey);
        }
      }, 'ငွေလက်ခံရရှိ (Collect Payment)');

      const lostBtn = h('button', {
        class: 'g',
        onclick: async () => {
          const dk = dkey(Date.now());
          if (!(await guardMonthUnlocked(dk, 'Lost Cylinder Compensation'))) return;
          const ch = await uiPrompt('ဆုံးရှုံးသွားသော ဆိုင်ပိုင်အိုး 1=40L (အပိုင်) 2=Over 40L (အပိုင်)', '1', 'number');
          const tid = ch === '2' ? 'OVER_40L_OWN' : (ch === '1' ? '40L_OWN' : null);
          if (!tid) return;
          const held = custO2Custody(custKey, tid);
          if (held <= 0) return note(msg, c.name + ' ထံတွင် ' + o2Label(tid) + ' Custody မရှိပါ။');
          const compAmt = parseFloat(await uiPrompt('အိုးလျော်ကြေး ပမာဏ (ကျပ် — O2 Sales Revenue ထဲ မထည့်ပါ)', '', 'number'));
          if (!(compAmt > 0)) return;
          const now = Date.now();
          await run(['stk', 'cf'], 'readwrite', t => {
            t.objectStore('stk').add({
              id: uuid(), movementId: uuid(), saleLineId: null,
              type: 'o2_mov', o2type: tid, ownership: 'shop', movementType: 'lost_comp',
              locationFrom: 'AT_CUSTOMER', locationTo: 'RETIRED_LOST', qty: 1, at: now
            });
            t.objectStore('cf').add({ id: uuid(), movementId: uuid(), type: 'o2cust', cust: c.name, o2type: tid, ownership: 'shop', qtyDelta: -1, at: now });
            t.objectStore('cf').add({ id: uuid(), type: 'cyl_compensation', cust: c.name, o2type: tid, amt: compAmt, at: now });
          });
          await reload();
          viewCustDetail(custKey);
        }
      }, 'Lost Shop Cylinder Compensation');

      const payCompBtn = c.compBal > 0.5 ? h('button', {
        class: 'n',
        onclick: async () => {
          const dk = dkey(Date.now());
          if (!(await guardMonthUnlocked(dk, 'Compensation Payment'))) return;
          const pAmt = parseFloat(await uiPrompt('အိုးလျော်ကြေး ပေးချေမှု ပမာဏ (ကျန်: ' + money(c.compBal) + ')', c.compBal, 'number'));
          if (!(pAmt > 0) || pAmt > c.compBal + 0.5) return;
          const ch = await uiPrompt('Payment Channel 1=Cash 2=KPay 3=Wave 4=AyA', '1', 'number');
          const pm = { '1': 'cash', '2': 'kpay', '3': 'wave', '4': 'aya' }[String(ch || '').trim()] || 'cash';
          await add('pays', { id: uuid(), at: Date.now(), cust: c.name, amount: pAmt, method: pm, isCompensation: true, voided: false });
          await reload();
          viewCustDetail(custKey);
        }
      }, 'Pay Cylinder Compensation') : '';

      const stmtRows = [];
      sales.filter(s => !s.voided && ck(s.cust) === custKey).forEach(s => {
        stmtRows.push({ at: s.at, kind: 'Invoice (' + termLabel(s.term) + ')', amt: s.total, paid: 0, note: s.lines.map(l => l.name + '×' + l.qty).join(', '), saleObj: s });
      });
      cf.filter(e => !e.voided && e.type === 'cyl_compensation' && ck(e.cust) === custKey).forEach(e => {
        stmtRows.push({ at: e.at, kind: 'Lost Cyl Comp', amt: e.amt, paid: 0, note: o2Label(e.o2type), saleObj: null });
      });
      pays.filter(p => !p.voided && ck(p.cust) === custKey).forEach(p => {
        stmtRows.push({ at: p.at, kind: p.isCompensation ? 'Comp Paid' : 'Payment', amt: 0, paid: p.amount, note: PAY[p.method] || p.method, saleObj: null });
      });
      stmtRows.sort((a, b) => a.at - b.at);

      app.append(
        h('button', { class: 'n', onclick: () => viewCust() }, '← Customers'),
        h('div', { class: 'card', style: 'margin-top:8px' },
          h('b', { style: 'font-size:18px' }, c.name),
          h('div', {}, 'Trade Balance: ', h('b', { style: 'color:var(--red)' }, money(c.bal)), ' · Cyl Comp Balance: ', h('b', {}, money(c.compBal))),
          h('small', {}, 'Custody: 40L_F=' + custO2Custody(custKey, '40L_FACTORY') + ', 47L_F=' + custO2Custody(custKey, '47L_FACTORY') + ', 40L_O=' + custO2Custody(custKey, '40L_OWN') + ', Over40L_O=' + custO2Custody(custKey, 'OVER_40L_OWN')),
          h('div', { class: 'row', style: 'margin-top:8px' }, lostBtn, payCompBtn)
        ),
        msg,
        c.bal > 0.5 ? h('div', { class: 'card' },
          h('b', {}, 'Record Payment (Original Sale Date Unchanged)'),
          amtIn, mthSel, dateIn, allocMode, payBtn
        ) : '',
        h('div', { class: 'card' },
          h('b', {}, 'Customer Statement'),
          h('div', { class: 'tbl-wrap' },
            h('table', { class: 'st-tbl' },
              h('thead', {}, h('tr', {}, h('th', {}, 'Date'), h('th', {}, 'Type'), h('th', {}, 'Charge'), h('th', {}, 'Paid'), h('th', {}, 'Print'))),
              h('tbody', {}, ...stmtRows.map(r => h('tr', {},
                h('td', {}, dkey(r.at)),
                h('td', {}, r.kind + (r.note ? ' · ' + r.note : '')),
                h('td', {}, r.amt ? r.amt.toLocaleString() : '-'),
                h('td', {}, r.paid ? r.paid.toLocaleString() : '-'),
                h('td', {}, r.saleObj ? h('button', { class: 'n', style: 'padding:2px 6px;font-size:11.5px;min-height:28px', onclick: () => printSale(r.saleObj) }, '🖨') : '-')
              )))
            )
          )
        )
      );
    }

    // =========================================================================
    // 14. VIEW 7: စရိတ် & ယာယီချေးငွေ (TEMPORARY LOANS + EXPENSES)
    // =========================================================================
    function viewExp() {
      const app = $('#app');
      app.replaceChildren();
      const msg = h('div');

      const subTabs = h('div', { class: 'sub-tabs' },
        h('button', { class: expSubTab === 1 ? 'on' : '', onclick: () => { expSubTab = 1; viewExp(); } }, 'စရိတ်များ (Expenses)'),
        h('button', { class: expSubTab === 2 ? 'on' : '', onclick: () => { expSubTab = 2; viewExp(); } }, '💰 ယာယီချေးငွေ (Temporary Loans)')
      );

      if (expSubTab === 1) {
        const cs = h('select', {}, Object.entries(ECAT).map(([k, v]) => h('option', { value: k }, v)));
        const ds = h('input', { placeholder: 'အကြောင်းအရာ (Description)' });
        const am = h('input', { type: 'number', inputmode: 'numeric', placeholder: 'ငွေပမာဏ (Amount)' });
        const ms = h('select', {}, MTH.map(k => h('option', { value: k }, PAY[k])));
        const dIn = h('input', { type: 'date', max: dkey(Date.now()), value: dkey(Date.now()) });

        const saveBtn = h('button', {
          class: 'o',
          onclick: async () => {
            const dk = dIn.value || dkey(Date.now());
            if (!(await guardMonthUnlocked(dk, 'Expense Entry'))) return;
            const desc = ds.value.trim(), val = parseFloat(am.value);
            if (!desc || !(val > 0)) return note(msg, 'အကြောင်းအရာနှင့် ပမာဏ ထည့်ပါ။');
            const isRent = cs.value === 'rent';
            if (isRent) {
              const ym = dk.slice(0, 7);
              const exists = cf.some(e => e.type === 'exp' && !e.voided && e.isRentPayment && dkey(e.at).startsWith(ym));
              if (exists && !(await uiConfirm(ym + ' လအတွက် Cash Rent မှတ်တမ်း ရှိပြီးသားဖြစ်သည်။ ထပ်ထည့်မလား?'))) return;
            }
            const now = Date.now();
            const ts = dk === dkey(now) ? now : dbounds(dk)[0] + 43200000;
            await add('cf', { id: uuid(), at: ts, type: 'exp', cat: cs.value, desc, amt: val, m: ms.value, isRentPayment: isRent, voided: false });
            await reload();
            viewExp();
          }
        }, 'စရိတ် သိမ်းမည်');

        const xferBtn = h('button', {
          class: 'n',
          style: 'width:100%;margin-top:8px',
          onclick: async () => {
            const dk = dkey(Date.now());
            if (!(await guardMonthUnlocked(dk, 'Internal Transfer'))) return;
            const a = parseFloat(await uiPrompt('KPay -> Cash လွှဲမည့် ပမာဏ (ကျပ်)', '', 'number'));
            if (!(a > 0)) return;
            await add('cf', { id: uuid(), at: Date.now(), type: 'xfer', from: 'kpay', to: 'cash', amt: a, note: 'KPay -> Cash' });
            await reload();
            viewExp();
            note(msg, 'KPay -> Cash ' + money(a) + ' လွှဲပြီးပါပြီ (Revenue/Expense မထိပါ)။', true);
          }
        }, '⇄ KPay → Cash Transfer');

        const recentExps = cf.filter(e => e.type === 'exp').sort((a, b) => b.at - a.at).slice(0, 15);
        app.append(
          subTabs,
          h('div', { class: 'card' }, h('b', {}, 'ဆိုင်အသုံးစရိတ် & ငွေလွှဲ'), cs, ds, am, ms, dIn, saveBtn, xferBtn),
          msg,
          h('div', { class: 'card' },
            h('b', {}, 'နောက်ဆုံး စရိတ်မှတ်တမ်းများ'),
            ...(recentExps.length ? recentExps.map(e => h('div', { class: 'li' },
              h('span', { class: e.voided ? 'void' : '' }, dkey(e.at) + ' · ' + (ECAT[e.cat] || e.cat) + ' · ' + e.desc + ' (' + (PAY[e.m] || e.m) + ')'),
              h('span', {},
                h('b', { class: e.voided ? 'void' : '', style: 'color:var(--red)' }, money(e.amt)), ' ',
                !e.voided ? h('button', {
                  class: 'g',
                  onclick: async () => {
                    if (!(await guardMonthUnlocked(dkey(e.at), 'Void Expense'))) return;
                    if (!(await requireOwnerPin('Void Expense: ' + e.desc))) return;
                    await put('cf', { ...e, voided: true, voidedAt: Date.now() });
                    await reload();
                    viewExp();
                  }
                }, 'Void') : ''
              )
            )) : [h('div', {}, h('small', {}, 'စရိတ်မှတ်တမ်း မရှိသေးပါ။'))])
          )
        );
      } else {
        const dirSel = h('select', {},
          h('option', { value: 'borrow' }, 'ယာယီချေးယူ (ငွေဝင် · Cash/Wallet Inflow)'),
          h('option', { value: 'lend' }, 'ယာယီထုတ်ချေး (ငွေထွက် · Cash/Wallet Outflow)')
        );
        const personIn = h('input', { placeholder: 'လူအမည် / အဖွဲ့အစည်း (Person / Source Name)' });
        const amtIn = h('input', { type: 'number', inputmode: 'numeric', placeholder: 'ချေးငွေ ပမာဏ (Amount)' });
        const chSel = h('select', {}, MTH.map(k => h('option', { value: k }, PAY[k])));
        const dIn = h('input', { type: 'date', max: dkey(Date.now()), value: dkey(Date.now()) });
        const dueIn = h('input', { type: 'date', value: dkey(Date.now() + 7 * 86400000) });
        const noteIn = h('input', { placeholder: 'မှတ်ချက် (Optional Note)' });

        const addLoanBtn = h('button', {
          class: 'o',
          onclick: async () => {
            const dk = dIn.value || dkey(Date.now());
            if (!(await guardMonthUnlocked(dk, 'Temporary Loan Entry'))) return;
            const person = personIn.value.trim();
            const val = parseFloat(amtIn.value);
            if (!person || !(val > 0)) return note(msg, 'အမည်နှင့် ချေးငွေပမာဏ ထည့်ပါ။');
            const now = Date.now();
            const ts = dk === dkey(now) ? now : dbounds(dk)[0] + 43200000;
            await add('cf', {
              id: uuid(), at: ts, type: 'loan',
              dir: dirSel.value, person, amt: val, m: chSel.value,
              dueDate: dueIn.value || null, note: noteIn.value.trim(),
              repaid: false, repaidAt: null, repaidMethod: null, voided: false
            });
            await reload();
            viewExp();
            note(msg, 'ယာယီချေးငွေ မှတ်တမ်းတင်ပြီးပါပြီ (Cash Flow ထဲသာ ထည့်တွက်ပြီး P&L Revenue/Expense ထဲ မထည့်ပါ)။', true);
          }
        }, 'ယာယီချေးငွေ သိမ်းမည်');

        const allLoans = cf.filter(e => e.type === 'loan').sort((a, b) => (a.repaid === b.repaid ? b.at - a.at : (a.repaid ? 1 : -1)));
        const todayKey = dkey(Date.now());

        app.append(
          subTabs,
          h('div', { class: 'card' },
            h('b', {}, 'ယာယီချေးငွေ အသစ်မှတ်ရန်'),
            h('label', {}, 'အမျိုးအစား (Direction)'), dirSel,
            h('label', {}, 'အမည် (Person / Source)'), personIn,
            h('div', { class: 'row' },
              h('div', {}, h('label', {}, 'ပမာဏ (Amount)'), amtIn),
              h('div', {}, h('label', {}, 'ငွေလမ်းကြောင်း (Channel)'), chSel)
            ),
            h('div', { class: 'row' },
              h('div', {}, h('label', {}, 'ရက်စွဲ (Date)'), dIn),
              h('div', {}, h('label', {}, 'ပြန်ဆပ်ရမည့်ရက် (Due Date)'), dueIn)
            ),
            h('label', {}, 'မှတ်ချက် (Note)'), noteIn,
            addLoanBtn
          ),
          msg,
          h('div', { class: 'card' },
            h('b', {}, 'ယာယီချေးငွေ စာရင်းများ (' + allLoans.length + ')'),
            ...(allLoans.length ? allLoans.map(ln => {
              const isBorrow = (ln.dir || 'borrow') === 'borrow';
              const isOverdue = !ln.repaid && !ln.voided && ln.dueDate && ln.dueDate < todayKey;
              return h('div', { class: 'li', style: 'flex-wrap:wrap' },
                h('span', { class: ln.voided ? 'void' : '' },

      const lockBtn = h('button', {
        class: locked ? 'g' : 'n',
        onclick: async () => {

          viewReport(k);
        }
      }, locked ? ('🔓 Reopen ' + ym) : ('🔒 Hard Lock ' + ym));

      const subBar = h('div', { class: 'sub-tabs' },

              t.objectStore('gasEv').add({ id: uuid(), at: now, type: 'gas_close', date: k, groundViss: gVal });

            const toYm = await uiPrompt('ပြီးဆုံးသည့် လ (YYYY-MM)', fromYm.slice(0, 4) + '-12');
            if (!toYm || !/^\d{4}-\d{2}$/.test(toYm)) return;

              h('button', { class: repMonthly ? '' : 'n', style: 'padding:4px 10px;font-size:12px', onclick: () => { repMonthly = true; viewReport(k); } }, 'Monthly'),

          h('div', { class: 'li' }, h('span', {}, 'Sales Revenue'), h('b', {}, money(pnl.grossRevenue))),

          h('div', { class: 'li' }, h('span', {}, '− Operating Expenses (Excl. Savings, Cash Rent & O2 Settlement)'), h('span', {}, money(pnl.opEx))),
          h('div', { class: 'li' }, h('span', {}, '− Supplier Weight Variance Expense'), h('span', { style: 'color:var(--red)' }, money(pnl.weightVarianceExpense))),
          h('div', { class: 'li' },
            h('span', {}, '− Allocated Rent (' + (repMonthly ? 'Full Month' : (pnl.rentInfo.daysInMonth ? (money(pnl.rentInfo.monthlyRent) + ' ÷ ' + pnl.rentInfo.daysInMonth + 'd') : 'Unconfirmed')) + ')'),

      app.append(

    // =========================================================================
    function csvDebts() {
      const rows = [['Customer', 'Phone', 'Trade Balance', 'Cyl Comp Balance']];
      customers().forEach(c => rows.push([c.name, c.phone || '', Math.round(c.bal), Math.round(c.compBal)]));
      const bom = '\uFEFF';
      const csv = bom + rows.map(r => r.map(x => '"' + String(x).replace(/"/g, '""') + '"').join(',')).join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8' });
      const u = URL.createObjectURL(blob);
      const a = h('a', { href: u, download: 'aung-pos-debts-' + dkey(Date.now()) + '.csv' });
      document.body.append(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 3000);
    }

    function viewData() {
      const app = $('#app');
      app.replaceChildren();
      const msg = h('div');
      const pending = restoreConflicts.filter(c => c.status === 'pending');

      const conflictCard = pending.length ? h('div', { class: 'card', style: 'border:2px solid var(--red)' },
        h('b', { style: 'color:var(--red)' }, 'Restore Conflicts (' + pending.length + ' Pending)'),
        ...pending.map(c => h('div', { class: 'li', style: 'flex-wrap:wrap' },
          h('span', { style: 'flex:1 1 100%' }, h('b', {}, c.store + '::' + c.recordId.slice(-8)), ' · ' + c.reason + (c.lockedMonth ? ' (' + c.lockedMonth + ')' : '')),
          h('div', { class: 'row', style: 'width:100%;margin-top:4px' },
            h('button', { class: 'n', onclick: async () => { await resolveConflict(c.conflictId, 'KEEP_LOCAL', 'Kept local'); viewData(); } }, 'Keep Local'),
            h('button', { class: 'o', style: 'margin-top:0', onclick: async () => {
              try { await resolveConflict(c.conflictId, 'ACCEPT_BACKUP', 'Accepted backup'); viewData(); }
              catch (e) { note(msg, e.message); }
            } }, 'Archive Local & Accept Backup')
          )
        ))
      ) : '';

      const latestVerBtn = h('button', {
        class: 'o',
        style: 'background:var(--grey-dark);margin-top:6px',
        onclick: getLatestVersion
      }, '🔄 နောက်ဆုံး version ကိုယူရန် (Get Latest Version)');

      const expBtn = h('button', {
        class: 'o',
        onclick: async () => {
          try {
            const res = await exportExternalBackup(true);
            note(msg, '✓ Verified External Backup: ' + res.fname + '\nSHA-256: ' + res.sha256.slice(0, 24) + '...', true);
          } catch (e) { note(msg, 'Export error: ' + e.message); }
        }
      }, 'External JSON Backup & Google Drive Share (SHA-256 Verified)');

      const fi = h('input', { type: 'file', accept: '.json,application/json' });
      fi.onchange = async () => {
        const f = fi.files[0]; if (!f) return;
        try {
          const d = JSON.parse(await f.text());
          const err = checkBk(d); if (err) { fi.value = ''; return note(msg, err); }
          const st = await importAll(d, false);
          await reload(); fi.value = ''; viewData();
          note(msg, 'Restore complete — Added: ' + st.added + ', Same: ' + st.same + ', Conflicts: ' + st.conflicts + ', Locked Quarantined: ' + st.lockedQuarantined, true);
        } catch (e) { fi.value = ''; note(msg, e.message); }
      };

      const benchBtn = h('button', {
        class: 'n',
        onclick: async () => {
          benchBtn.disabled = true;
          const t600 = await benchmarkPbkdf2(600000);
          const t310 = await benchmarkPbkdf2(310000);
          benchBtn.disabled = false;
          note(msg, 'PBKDF2 Benchmark:\n• 600,000 iter: ' + t600 + ' ms\n• 310,000 iter: ' + t310 + ' ms', true);
        }
      }, 'Benchmark 600k PBKDF2');

      const gdOut = h('div');
      const runGdBtn = h('button', {
        class: 'o',
        style: 'background:var(--grey)',
        onclick: async () => {
          runGdBtn.disabled = true;
          const prevDb = db, prevName = activeDbName;
          try {
            activeDbName = 'aung-gas-pos-gd-test';
            await new Promise(ok => { const r = indexedDB.deleteDatabase('aung-gas-pos-gd-test'); r.onsuccess = r.onerror = r.onblocked = () => ok(); });
            db = await openDb('aung-gas-pos-gd-test');
            await seedAndMigrate();
            await reload();
            const list = await runGoldenDatasetGD01_GD21();
            const passCnt = list.filter(x => x.pass).length;
            gdOut.replaceChildren(
              h('div', { class: 'msg ' + (passCnt === list.length ? 'k' : 'e') }, 'Golden Dataset (GD-01..GD-21): ' + passCnt + ' / ' + list.length + ' PASSED'),
              ...list.map(r => h('div', { class: 'li' },
                h('span', {}, h('b', {}, r.id + ': ' + r.title), h('br'), h('small', {}, r.info)),
                h('span', { class: 'tag ' + (r.pass ? 'g' : 'r') }, r.pass ? 'PASS' : 'FAIL')
              ))
            );
          } finally {
            db.close();
            activeDbName = prevName;
            db = prevDb;
            await reload();
            runGdBtn.disabled = false;
          }
        }
      }, 'Run Golden Dataset (GD-01 to GD-21) in Isolated DB');

      app.append(
        conflictCard,
        h('div', { class: 'card' },
          h('b', {}, 'App Version & Backup (' + APP_VER + ')'), h('br'),
          h('small', {}, 'DB: ' + activeDbName + ' (Schema v4) · Last Backup: ' + (bk ? sd_(bk) : 'None')),
          latestVerBtn,
          expBtn,
          h('label', {}, 'Restore JSON Backup'), fi,
          h('div', { class: 'row', style: 'margin-top:8px' },
            h('button', { class: 'n', onclick: csvDebts }, 'Export Debts CSV'),
            h('button', { class: 'n', onclick: () => window.print() }, 'Print / PDF Report')
          )
        ),
        h('div', { class: 'card' },
          h('b', {}, 'Security & Golden Dataset Runner'),
          h('div', { class: 'row', style: 'margin-top:8px' },
            benchBtn,
            h('button', { class: 'n', onclick: () => setupOwnerPinModal(true) }, 'Set/Reset Owner PIN')
          ),
          runGdBtn,
          gdOut
        ),
        msg
      );
    }

    async function runGoldenDatasetGD01_GD21() {
      const out = [];
      const addRes = (id, title, pass, info) => out.push({ id, title, pass: !!pass, info });

      await importAll({ app: 'aung-gas-pos', schema: 4, data: { products: [{ id: 'p_v23', name: 'Legacy Item', cat: 'မီးဖို', unit: 'ခု' }], cf: [{ id: 'ob_v23', type: 'ob', cust: 'Mg Mg', amt: 25000, at: Date.now() }] } }, false);
      await reload();
      addRes('GD-01', 'v23 Data Opened by v24', products.some(p => p.id === 'p_v23') && customers().some(c => c.name === 'Mg Mg'), 'v23 records preserved');

      const exp = await dumpAll();
      addRes('GD-02', 'v23 Backup / Schema v4 Compatibility', exp.schema === 4 && Array.isArray(exp.data.cf), 'Schema v4 intact');
      addRes('GD-03', 'v23/v24 Cross-Use Guard', typeof checkBk === 'function' && activeDbName.includes('test'), 'Tested in isolated DB');

      await add('sales', { id: 'S_GD4', at: Date.now(), pay: 'cash', parts: [{ m: 'cash', a: 5000 }], lines: [{ name: 'X', qty: 1, unit: 'ခု', price: 5000 }], total: 5000, voided: false });
      await reload();
      await importAll({ app: 'aung-gas-pos', schema: 4, data: { sales: [{ id: 'S_GD4', at: sales.find(x => x.id === 'S_GD4').at, pay: 'cash', parts: [{ m: 'cash', a: 5000 }], lines: [{ name: 'X', qty: 1, unit: 'ခု', price: 5000 }], total: 5000, voided: true }] } }, false);
      await reload();
      const pruneCheck = await pruneOldArchivesIfVerified();
      addRes('GD-04', 'Conflict Quarantined & Unverified Prune Blocked', restoreConflicts.some(c => c.recordId === 'S_GD4') && pruneCheck.pruned === 0, 'Conflict queued; prune blocked without verified export');

      const m0 = o2StockMatrix();
      addRes('GD-05', 'O2 4-Type Distinct Rates', m0['40L_FACTORY'].rate === 19500 && m0['47L_FACTORY'].rate === 23500 && m0['40L_OWN'].rate === 19500 && m0['OVER_40L_OWN'].rate === 25000, '4 types separate');
      addRes('GD-06', 'O2 Ownership Separation', m0['40L_FACTORY'].ownership === 'factory' && m0['40L_OWN'].ownership === 'shop', 'Factory vs Shop separated');

      const d24 = new Date('2026-11-24T09:00:00').getTime();
      const d26 = new Date('2026-11-26T09:00:00').getTime();
      await add('sales', { id: 'S_DROP', at: d24, pay: 'dropoff', parts: [{ m: 'dropoff', a: 23500 }], cust: 'SiteA', isO2Dropoff: true, pickedUpAt: null, lines: [{ name: '47L O2 (စက်ရုံအိုး)', qty: 1, unit: 'အိုး', price: 23500, o2type: '47L_FACTORY', ownership: 'factory' }], total: 23500, voided: false });
      await reload();
      const revBeforePickup = calcPnL('2026-11-24', false).grossRevenue;
      await put('sales', { ...sales.find(s => s.id === 'S_DROP'), pickedUpAt: d26, pay: 'credit', parts: [{ m: 'credit', a: 23500 }] });
      await reload();
      addRes('GD-07', 'O2 Drop-Off Pickup Date Recognition', revBeforePickup === 0 && calcPnL('2026-11-26', false).grossRevenue === 23500, 'Nov 24=0, Nov 26 pickup=23,500');

      const mStat = motherCylStatus();
      addRes('GD-08', 'Mother Cylinder 55L Unconfirmed Flag', mStat.capL === 55 && cfg.motherCapConfirmed === false, '55L flagged unconfirmed');

      await add('cf', { id: uuid(), type: 'cyl_compensation', cust: 'CustComp', o2type: '40L_OWN', amt: 150000, at: Date.now() });
      await reload();
      addRes('GD-09', 'Lost Cylinder Compensation Isolated', customers().find(c => c.name === 'CustComp').compBal === 150000, 'CompBal=150,000');

      await add('gasEv', { id: uuid(), at: Date.now(), type: 'recv', agent: 'TT Gas', qty: 1, nominalViss: 28.5, actualViss: 27.8, shortageViss: 0.7, varianceCostMmk: 2100, cost: 85500 });
      await reload();
      addRes('GD-10', 'Gas Weight Variance (2,100 MMK)', Math.abs(calcPnL(dkey(Date.now()), false).weightVarianceExpense - 2100) < 1, 'Variance=2,100 MMK');

      await add('gasEv', { id: uuid(), at: Date.now(), type: 'gas_ret', viss: 5, buyBackCost: 12500, buyBackRatePerViss: 2500, m: 'cash' });
      await reload();
      const gSum = gasInventorySummary();
      addRes('GD-11', 'Gas Buy-Back Separate Cost Basis', gSum.buyBackRatePerViss === 2500 && gSum.buyBackTotalViss === 5, '5 viss @ 2,500/viss');

      await add('sales', { id: 'S_FOC', at: Date.now(), pay: 'cash', parts: [{ m: 'cash', a: 0 }], lines: [{ name: 'FreePart', qty: 1, unit: 'ခု', price: 0, foc: true, costAtSale: 4000 }], total: 0, voided: false });
      await reload();
      addRes('GD-12', 'FOC COGS Recorded with 0 Revenue', calcPnL(dkey(Date.now()), false).focCogs === 4000, 'FOC COGS=4,000');

      await add('pays', { id: uuid(), at: d26, cust: 'SiteA', amount: 10000, method: 'kpay', allocations: [{ saleId: 'S_DROP', appliedAmt: 10000 }], voided: false });
      await reload();
      addRes('GD-13', 'Payment Does Not Mutate Sale Date', sales.find(s => s.id === 'S_DROP').at === d24, 'Sale date stays Nov 24');

      addRes('GD-14', 'Customer Merge Handler Present', typeof viewCust === 'function', 'Verified');
      addRes('GD-15', 'Factory Void vs Actual Refund Separated', typeof viewOxy === 'function', 'Verified');
      addRes('GD-16', 'Rent Proration (25k/d Nov 2026) & 2027 Warning', getRentForPeriod('2026-11-05', false).allocatedRent === 25000 && getRentForPeriod('2027-01-01', false).warning === '2027 Rent Unconfirmed', '25,000/day & 2027 warning');

      await put('meta', { k: 'locked_months', v: ['2026-10'] });
      await reload();
      addRes('GD-17', 'Month Hard Lock Active', isMonthLocked('2026-10-12') === true, '2026-10 locked');

      const hA = await derivePbkdf2Hex('9999', genSaltHex(), 5000);
      addRes('GD-18', 'PBKDF2 Derivation OK', hA.length === 64, '256-bit digest generated');
      addRes('GD-19', 'Staff Permission Check OK', hasStaffPerm('void') === true, 'Owner perm active');

      let rolled = false;
      try {
        await run(['sales', 'cf'], 'readwrite', t => {
          t.objectStore('sales').add({ id: 'S_FAIL', at: Date.now(), lines: [], total: 0 });
          throw new Error('FORCE_ABORT');
        });
      } catch (e) { rolled = true; }
      await reload();
      addRes('GD-20', 'Atomic Transaction Rollback', rolled && !sales.some(s => s.id === 'S_FAIL'), 'Rolled back cleanly');

      const stMix = await importAll({ app: 'aung-gas-pos', schema: 4, data: { cf: [{ id: 'CF_LOCKED', type: 'exp', desc: 'Old', cat: 'shop', amt: 1000, m: 'cash', at: new Date('2026-10-10').getTime() }] } }, false);
      addRes('GD-21', 'Locked-Month Record Quarantined on Import', stMix.lockedQuarantined === 1, 'Quarantined without mutating locked month');

      return out;
    }

    // =========================================================================
    // 17. NAVIGATION & APPLICATION BOOTSTRAP
    // =========================================================================
    const VIEWS = { 1: viewSale, 2: viewProducts, 3: viewGas, 4: viewCust, 5: viewData, 6: viewOxy, 7: viewExp, 8: viewReport };

    function applyNavLabels() {
      const labels = tr('tabs');
      const ids = [1, 2, 3, 6, 4, 7, 8, 5];
      ids.forEach((vNum, idx) => {
        const btn = $('#t' + vNum);
        if (btn && labels[idx]) btn.textContent = labels[idx];
      });
    }

    function show(n) {
      tab = n;
      for (let i = 1; i <= 8; i++) {
        const b = $('#t' + i);
        if (b) b.className = (i === n) ? 'on' : '';
      }
      try { $('#t' + n).scrollIntoView({ inline: 'center', block: 'nearest' }); } catch (e) {}
      if (VIEWS[n]) VIEWS[n]();
    }

    for (let i = 1; i <= 8; i++) {
      const b = $('#t' + i);
      if (b) b.onclick = () => show(i);
    }

    $('#langBtn').onclick = () => {
      lang = (lang === 'my') ? 'en' : 'my';
      applyNavLabels();
      show(tab);
    };

    const updateNet = () => {
      const e = $('#net');
      if (!e) return;
      e.textContent = navigator.onLine ? tr('online') : tr('offline');
      e.className = navigator.onLine ? '' : 'off';
    };
    addEventListener('online', updateNet);
    addEventListener('offline', updateNet);
    updateNet();

    window.onload = async () => {
      try {
        applyNavLabels();
        updateRoleBadge();
        db = await openDb('aung-gas-pos');
        await seedAndMigrate();
        await reload();

        const lastAuto = getMeta('last_auto_backup_at') || 0;
        if (Date.now() - lastAuto > 86400000) {
          await saveRollingSnapshot('auto_open_24h');
          await reload();
        }

        show(1);
        if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
        if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
      } catch (err) {
        $('#app').append(h('div', { class: 'msg e' }, 'Startup Error: ' + (err && err.message || err)));
      }
    };
  </script>
</body>
</html>
