<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#374151">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <title>AUNG Gas Solutions POS v24</title>
  <style>
    :root {
      /* Grey & Orange Brand Palette */
      --grey: #334155;
      --grey-dark: #1E293B;
      --grey-mid: #475569;
      --org: #EA580C;
      --org-soft: #FFEDD5;
      --bg: #F3F4F6;
      --card: #FFFFFF;
      --ln: #D1D5DB;
      --red: #B91C1C;
      --red-bg: #FEE2E2;
      --ok: #15803D;
      --ok-bg: #DCFCE7;
      --warn-bg: #FFF7ED;
      --info-bg: #E5E7EB;
      --mut: #6B7280;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--grey-dark);
      font-family: "Noto Sans Myanmar", "Myanmar Text", system-ui, -apple-system, sans-serif;
      line-height: 1.65;
      padding-bottom: 84px;
      overflow-x: hidden;
    }
    #splash {
      position: fixed;
      inset: 0;
      background: #FFFFFF;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity .35s ease, visibility .35s ease;
    }
    #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    header {
      background: var(--grey-dark);
      color: #FFFFFF;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      position: sticky;
      top: 0;
      z-index: 20;
      border-bottom: 3px solid var(--org);
      box-shadow: 0 2px 6px rgba(31, 41, 55, .18);
    }
    header .brand { font-size: 16.5px; font-weight: 800; display: flex; align-items: center; gap: 6px; }
    header .brand span.acc { color: #FB923C; }
    header .hdr-right { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .lang-btn {
      background: var(--grey-mid);
      color: #FFFFFF;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 12px;
      font-weight: 700;
      min-height: 28px;
      cursor: pointer;
    }
    #net {
      font-size: 12px;
      padding: 2px 10px;
      border-radius: 12px;
      background: var(--ok);
      color: #fff;
      font-weight: 600;
    }
    #net.off { background: var(--org); }
    main {
      padding: 12px;
      max-width: 780px;
      margin: auto;
    }
    h2 { font-size: 16.5px; margin: 14px 0 6px; color: var(--grey-dark); }
    .card {
      background: var(--card);
      border: 1px solid var(--ln);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(31, 41, 55, .05);
    }
    .card.kpi-box { border-left: 4px solid var(--grey); }
    .card.kpi-box.org { border-left-color: var(--org); }
    .card.kpi-box.ok { border-left-color: var(--ok); }
    .card.kpi-box.warn { border-left-color: var(--red); }
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 10px;
    }
    @media (min-width: 640px) {
      .kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    }
    .kpi-val { font-size: 15.5px; font-weight: 700; margin-top: 2px; word-break: break-word; }
    label { display: block; font-size: 13.5px; margin-top: 8px; font-weight: 600; color: var(--grey-dark); }
    input, select, textarea {
      width: 100%;
      padding: 10px;
      font: inherit;
      border: 1px solid var(--ln);
      border-radius: 8px;
      background: #FFFFFF;
      color: var(--grey-dark);
      margin-top: 3px;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
    .row > * { flex: 1 1 130px; min-width: 0; }
    button {
      font: inherit;
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--grey);
      color: #FFFFFF;
      cursor: pointer;
      min-height: 42px;
      font-weight: 600;
    }
    button.o {
      background: var(--org);
      color: #FFFFFF;
      font-weight: 700;
      width: 100%;
      margin-top: 10px;
      padding: 12px 14px;
    }
    button.g {
      background: #FFFFFF;
      color: var(--red);
      border: 1px solid var(--red);
      padding: 6px 10px;
      font-size: 13px;
      min-height: 36px;
    }
    button.n {
      background: #FFFFFF;
      color: var(--grey-dark);
      border: 1px solid var(--grey);
      padding: 7px 11px;
      font-size: 13px;
      min-height: 36px;
    }
    button.buyback-btn {
      width: 100%;
      background: #FFF7ED;
      color: #9A3412;
      border: 1.5px solid #FDBA74;
      margin-top: 10px;
      font-weight: 700;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .sub-tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .sub-tabs button { flex: 1 1 95px; padding: 8px 6px; font-size: 12.5px; min-height: 38px; background: #E5E7EB; color: var(--grey-dark); border: 1px solid var(--ln); }
    .sub-tabs button.on { background: var(--grey-dark); color: #FFFFFF; border-color: var(--grey-dark); }
    .li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid var(--ln);
    }
    .li:last-child { border-bottom: 0; }
    .tag {
      font-size: 11.5px;
      background: var(--org-soft);
      color: #9A3412;
      border-radius: 5px;
      padding: 1px 6px;
      margin-left: 5px;
      display: inline-block;
      font-weight: 700;
    }
    .tag.b { background: var(--info-bg); color: var(--grey-dark); }
    .tag.g { background: var(--ok-bg); color: var(--ok); }
    .tag.r { background: var(--red-bg); color: var(--red); }
    .tot { font-size: 19px; font-weight: 700; text-align: right; margin-top: 8px; color: var(--grey-dark); }
    .void { text-decoration: line-through; opacity: .55; }
    .msg {
      padding: 10px 12px;
      border-radius: 8px;
      margin: 8px 0;
      font-size: 13.5px;
      white-space: pre-line;
      font-weight: 600;
    }
    .msg.e { background: var(--red-bg); color: var(--red); border: 1px solid #FCA5A5; }
    .msg.k { background: var(--ok-bg); color: var(--ok); border: 1px solid #86EFAC; }
    .msg.w { background: var(--warn-bg); color: #9A3412; border: 1px solid #FDBA74; }
    .msg.i { background: var(--info-bg); color: var(--grey-dark); border: 1px solid #D1D5DB; }
    .gas-big { font-size: 26px; font-weight: 800; color: var(--grey-dark); line-height: 1.25; margin: 4px 0; }
    .gas-subbox {
      background: #F8FAFC;
      border: 1px solid var(--ln);
      border-radius: 8px;
      padding: 10px;
      margin: 8px 0;
    }
    .gas-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      font-size: 14px;
    }
    .gas-row.sep { border-top: 1px solid var(--ln); margin-top: 4px; padding-top: 8px; font-weight: 700; }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: #FFFFFF;
      border-top: 2px solid var(--grey-dark);
      overflow-x: auto;
      z-index: 25;
    }
    nav button {
      flex: 0 0 auto;
      min-width: 22vw;
      background: #FFFFFF;
      color: var(--grey-dark);
      border-radius: 0;
      padding: 12px 8px;
      font-weight: 700;
      font-size: 12.5px;
      white-space: nowrap;
      min-height: 52px;
    }
    @media (min-width: 720px) {
      nav button { min-width: auto; flex: 1 1 0; }
    }
    nav button.on { background: var(--org); color: #FFFFFF; }
    small { color: var(--mut); }
    .tbl-wrap { width: 100%; overflow-x: auto; }
    .st-tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; margin-top: 6px; }
    .st-tbl th, .st-tbl td { border: 1px solid var(--ln); padding: 6px; text-align: right; }
    .st-tbl th:first-child, .st-tbl td:first-child { text-align: left; }
    .st-tbl th { background: #F3F4F6; color: var(--grey-dark); font-weight: 700; }
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(31, 41, 55, .72);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px;
      z-index: 80;
    }
    .modal-box {
      background: #FFFFFF;
      border-radius: 12px;
      padding: 16px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 14px 34px rgba(0, 0, 0, .28);
      max-height: 90vh;
      overflow-y: auto;
    }
    #rcpt { display: none; }
    @media print {
      @page { size: 80mm auto; margin: 3mm; }
      body { background: #FFFFFF; padding: 0; margin: 0; }
      header, main, nav, #splash, .modal-bg { display: none !important; }
      #rcpt {
        display: block;
        width: 72mm;
        margin: 0 auto;
        color: #000000;
        font-family: "Noto Sans Myanmar", "Myanmar Text", monospace, sans-serif;
        line-height: 1.48;
        font-size: 12px;
      }
      #rcpt .c { text-align: center; }
      #rcpt .r { display: flex; justify-content: space-between; align-items: baseline; gap: 6px; }
      #rcpt .r.b { font-weight: 700; }
      #rcpt .r span:last-child { white-space: nowrap; }
      #rcpt .big { font-size: 1.42em; font-weight: 900; letter-spacing: 0.5px; }
      #rcpt .dd { border-top: 1.5px dashed #000; margin: 7px 0; }
      #rcpt .ss { border-top: 2.5px solid #000; margin: 7px 0 4px; }
      #rcpt .it { margin: 5px 0; }
      #rcpt .nm { font-weight: 700; }
      #rcpt .tt { font-size: 1.32em; font-weight: 800; }
      #rcpt .ft { margin-top: 8px; text-align: center; font-size: 11px; }
    }
  </style>
</head>
<body>

  <!-- Branded Splash Screen (Grey & Orange) -->
  <div id="splash">
    <svg width="260" height="125" viewBox="0 0 320 155" xmlns="http://www.w3.org/2000/svg" aria-label="AUNG Gas Solutions">
      <text x="160" y="88" text-anchor="middle" font-family="Impact,'Arial Black',system-ui,sans-serif" font-weight="900" font-size="94" letter-spacing="2" fill="#334155">AUNG</text>
      <text x="160" y="135" text-anchor="middle" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="40" letter-spacing="-0.5" fill="#EA580C">Gas Solutions</text>
    </svg>
    <small style="margin-top:6px;font-weight:700;color:#334155">POS v24 · feature/aung-pos-v24</small>
  </div>

  <!-- Top Navigation & Language Switcher -->
  <header>
    <div class="brand">
      <span>AUNG <span class="acc">Gas Solutions</span></span>
      <span class="tag b" id="roleBadge">OWNER</span>
    </div>
    <div class="hdr-right">
      <button class="lang-btn" id="langBtn" title="Switch Myanmar / English">MM / EN</button>
      <span id="net"></span>
    </div>
  </header>

  <main id="app"></main>

  <!-- 8-Tab Bottom Navigation -->
  <nav>
    <button id="t1">ရောင်းချမှု</button>
    <button id="t2">ပစ္စည်းများ</button>
    <button id="t3">Gas စာရင်း</button>
    <button id="t6">Oxygen</button>
    <button id="t4">ဖောက်သည်</button>
    <button id="t7">စရိတ်/ချေးငွေ</button>
    <button id="t8">စာရင်းချုပ်</button>
    <button id="t5">ဒေတာ</button>
  </nav>

  <div id="rcpt"></div>

  <script>
    // Hide splash quickly & safely
    setTimeout(() => {
      const sp = document.getElementById('splash');
      if (sp) sp.classList.add('hide');
    }, 650);

    // Global runtime error catcher so UI never fails silently
    window.addEventListener('error', ev => {
      const app = document.getElementById('app');
      if (app && !app.children.length) {
        const d = document.createElement('div');
        d.className = 'msg e';
        d.textContent = 'Runtime Error: ' + (ev && ev.message || 'Unknown error');
        app.appendChild(d);
      }
    });

    // =========================================================================
    // 1. CONSTANTS, DICTIONARIES & BRAND CONFIGURATION
    // =========================================================================
    const APP_VER = 'POS v24 (feature/aung-pos-v24)';
    const DB_SCHEMA_VER = 4;
    const STORES = ['products', 'sales', 'pays', 'stk', 'cf', 'meta', 'gasCyl', 'gasEv'];
    const UNITS = ['ပိဿာ', 'ဗူး', 'အိုး', 'ခု', 'မီတာ', 'ကတ်', 'လုံး', 'L'];
    const CATS = ['ဓာတ်ငွေ့', 'အောက်ဆီဂျင်', 'မီးဖို', 'အပိုပစ္စည်း', 'အခြား'];
    const ECAT = {
      shop: 'ဆိုင်စရိတ်',
      deliv: 'ပို့ဆောင်ခ',
      rent: 'ဆိုင်ခန်းလခ (Cash Rent)',
      factory: 'စက်ရုံပေးချေ',
      saving: 'စုငွေ (Savings)',
      other: 'အခြား'
    };
    const PAY = {
      cash: 'ငွေသား',
      kpay: 'KPay',
      wave: 'Wave',
      aya: 'AyA',
      credit: 'အကြွေး/Site',
      pending: 'ပို့ပြီးရှင်း (COD)',
      dropoff: 'အိုးအပ် (Awaiting Pickup)'
    };
    const MTH = ['cash', 'kpay', 'wave', 'aya'];

    // Gas Agents & Capacities (Preserved from v23)
    const AGENTS = {
      'TT Gas': { cap: 28.5, kg: '48kg', label: 'TT Gas (48kg / 28.5viss)' },
      'NGN': { cap: 28.5, kg: '48kg', label: 'NGN (48kg / 28.5viss)' },
      'Easy Gas': { cap: 30.0, kg: '50kg', label: 'Easy Gas (50kg / 30viss)' }
    };
    const AG_LIST = ['TT Gas', 'NGN', 'Easy Gas'];

    // Oxygen 4-Type Ownership & Fill Rates (Zero Regex)
    const O2_TYPES = {
      '40L_FACTORY': { id: '40L_FACTORY', labelMy: '40L စက်ရုံအိုး', labelEn: '40L Factory Cylinder', ownership: 'factory', defaultRate: 19500 },
      '47L_FACTORY': { id: '47L_FACTORY', labelMy: '47L စက်ရုံအိုး', labelEn: '47L Factory Cylinder', ownership: 'factory', defaultRate: 23500 },
      '40L_OWN': { id: '40L_OWN', labelMy: '40L အပိုင်', labelEn: '40L Shop-Owned', ownership: 'shop', defaultRate: 19500 },
      'OVER_40L_OWN': { id: 'OVER_40L_OWN', labelMy: 'Over 40L အပိုင်', labelEn: 'Over 40L Shop-Owned', ownership: 'shop', defaultRate: 25000 }
    };

    const SITE_TERMS = {
      immediate: { labelMy: 'လက်ငင်းရှင်း', labelEn: 'Immediate' },
      next_return: { labelMy: 'ခေါက်ပြန်ရှင်း', labelEn: 'Pay on Next Return' },
      biweekly_15: { labelMy: '၁၅ ရက်တစ်ခါရှင်း', labelEn: '15-Day Cycle' },
      month_end: { labelMy: 'လကုန်ရှင်း', labelEn: 'Month-End' }
    };

    const I18N = {
      my: {
        tabs: ['ရောင်းချမှု', 'ပစ္စည်းများ', 'Gas စာရင်း', 'Oxygen', 'ဖောက်သည်', 'စရိတ်/ချေးငွေ', 'စာရင်းချုပ်', 'ဒေတာ'],
        online: 'အွန်လိုင်း',
        offline: 'အော့ဖ်လိုင်း',
        lastBackup: 'နောက်ဆုံး Backup အချိန်',
        neverBackup: 'မပြုလုပ်ရသေးပါ'
      },
      en: {
        tabs: ['Sales', 'Products', 'Gas Stock', 'Oxygen', 'Customers', 'Exp/Loans', 'Reports', 'Data'],
        online: 'Online',
        offline: 'Offline',
        lastBackup: 'Last Backup Time',
        neverBackup: 'Not yet backed up'
      }
    };

    // =========================================================================
    // 2. DOM HELPERS, MODAL DIALOGS & DATE UTILITIES
    // =========================================================================
    const $ = s => document.querySelector(s);
    function h(tag, attrs = {}, ...kids) {
      const el = document.createElement(tag);
      for (const [k, v] of Object.entries(attrs || {})) {
        if (k === 'class') el.className = v;
        else if (k === 'style') el.style.cssText = v;
        else if (k.startsWith('on') && typeof v === 'function') el[k] = v;
        else if (v !== false && v !== null && v !== undefined) el.setAttribute(k, v === true ? '' : v);
      }
      kids.flat().forEach(c => {
        if (c !== null && c !== undefined && c !== false) {
          el.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
        }
      });
      return el;
    }

    function note(el, txt, ok = false) {
      if (!el) return;
      el.replaceChildren(h('div', { class: 'msg ' + (ok ? 'k' : 'e') }, txt));
    }

    function uiAlert(txt) {
      return new Promise(res => {
        const bg = h('div', { class: 'modal-bg' },
          h('div', { class: 'modal-box' },
            h('div', { style: 'white-space:pre-line;font-weight:600;margin-bottom:12px' }, txt),
            h('button', { class: 'o', onclick: () => { bg.remove(); res(); } }, 'OK')
          )
        );
        document.body.appendChild(bg);
      });
    }

    function uiConfirm(txt, okLabel = 'OK', cancelLabel = 'Cancel') {
      return new Promise(res => {
        const bg = h('div', { class: 'modal-bg' },
          h('div', { class: 'modal-box' },
            h('div', { style: 'white-space:pre-line;font-weight:600;margin-bottom:12px' }, txt),
            h('div', { class: 'row' },
              h('button', { class: 'n', onclick: () => { bg.remove(); res(false); } }, cancelLabel),
              h('button', { class: 'o', style: 'margin-top:0', onclick: () => { bg.remove(); res(true); } }, okLabel)
            )
          )
        );
        document.body.appendChild(bg);
      });
    }

    function uiPrompt(txt, defVal = '', type = 'text') {
      return new Promise(res => {
        const inp = h('input', { type, value: defVal === null || defVal === undefined ? '' : String(defVal) });
        const bg = h('div', { class: 'modal-bg' },
          h('div', { class: 'modal-box' },
            h('div', { style: 'white-space:pre-line;font-weight:600;margin-bottom:8px' }, txt),
            inp,
            h('div', { class: 'row', style: 'margin-top:10px' },
              h('button', { class: 'n', onclick: () => { bg.remove(); res(null); } }, 'Cancel'),
              h('button', { class: 'o', style: 'margin-top:0', onclick: () => { const v = inp.value; bg.remove(); res(v); } }, 'OK')
            )
          )
        );
        document.body.appendChild(bg);
        setTimeout(() => { inp.focus(); inp.select(); }, 30);
      });
    }

    const uuid = () => (crypto && crypto.randomUUID) ? crypto.randomUUID() : ('id-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10));
    const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
    const money = n => Math.round(Number(n) || 0).toLocaleString() + ' ကျပ်';
    const ck = s => String(s || '').trim().toLowerCase().replace(/\s+/g, ' ');
    const dkey = ts => {
      const d = new Date(ts || Date.now());
      return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    };
    const ddisp = k => {
      if (!k || k.length < 10) return k || '';
      return k.slice(5, 7) + '/' + k.slice(8, 10) + '/' + k.slice(0, 4);
    };
    const dbounds = k => {
      const [y, m, d] = k.split('-').map(Number);
      const a = new Date(y, m - 1, d, 0, 0, 0, 0).getTime();
      const b = new Date(y, m - 1, d, 23, 59, 59, 999).getTime();
      return [a, b];
    };
    const tm = ts => {
      const d = new Date(ts || Date.now());
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    };
    const sd_ = ts => ts ? (dkey(ts) + ' ' + tm(ts)) : '';

    // =========================================================================
    // 3. GLOBAL STATE & INDEXEDDB (SCHEMA v4)
    // =========================================================================
    let db = null;
    let activeDbName = 'aung-gas-pos';
    let lang = 'my';
    let tab = 1;
    let repTab = 1;
    let expSubTab = 1;
    let repMonthly = false;
    let saving = false;
    let saleId = uuid();
    let lines = [];

    let products = [];
    let sales = [];
    let pays = [];
    let stk = [];
    let cf = [];
    let meta = [];
    let gasCyl = [];
    let gasEv = [];

    let cfg = {
      cans: 7,
      o2Rates: { '40L_FACTORY': 19500, '47L_FACTORY': 23500, '40L_OWN': 19500, 'OVER_40L_OWN': 25000 },
      motherCapL: 55,
      motherCapConfirmed: false,
      dashWidgets: { pnl: true, gas: true, o2: true, debt: true, fac: true, backup: true }
    };

        req.onsuccess = e => res(e.target.result);
        req.onerror = e => rej(e.target.error);
      });
    }

    function run(storeNames, mode, fn) {
      return new Promise((res, rej) => {
        const tx = db.transaction(storeNames, mode);
        let out;
        try { out = fn(tx); } catch (err) { try { tx.abort(); } catch (e) {} return rej(err); }
        tx.oncomplete = () => res(out);
        tx.onerror = e => rej(e.target.error || new Error('Transaction error'));
        tx.onabort = e => rej(e.target.error || new Error('Transaction aborted'));
      });
    }

    function genSaltHex() {
      const b = new Uint8Array(16);
      crypto.getRandomValues(b);
      return Array.from(b, x => x.toString(16).padStart(2, '0')).join('');
    }

    async function derivePbkdf2Hex(pin, saltHex, iterations = 310000) {
      const enc = new TextEncoder();
      const key = await crypto.subtle.importKey('raw', enc.encode(String(pin)), 'PBKDF2', false, ['deriveBits']);
      const salt = new Uint8Array(saltHex.match(/.{1,2}/g).map(b => parseInt(b, 16)));
      const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations, hash: 'SHA-256' }, key, 256);
      return Array.from(new Uint8Array(bits), x => x.toString(16).padStart(2, '0')).join('');
    }

    async function benchmarkPbkdf2(iter) {
      const t0 = performance.now();
      await derivePbkdf2Hex('1234', genSaltHex(), iter);
      return Math.round(performance.now() - t0);
    }

      if (p1 !== p2) { await uiAlert('PIN နှစ်ခု မတူညီပါ။'); return false; }
      const salt = genSaltHex();
      const recCode = 'REC-' + genSaltHex().slice(0, 8).toUpperCase();
      const recSalt = genSaltHex();
      const hash = await derivePbkdf2Hex(p1, salt, 310000);
      const recHash = await derivePbkdf2Hex(recCode, recSalt, 310000);
      await put('meta', {

    async function requireOwnerPin(reason) {
      let sec = getMeta('owner_pin_sec');
      if (!sec) {
        const ok = await setupOwnerPinModal(false);
        if (!ok) return false;
        sec = getMeta('owner_pin_sec');
      }
      if (Date.now() < pinLockUntil) {
        const secLeft = Math.ceil((pinLockUntil - Date.now()) / 1000);
        await uiAlert('PIN မှားယွင်းမှုများသဖြင့် ' + secLeft + ' စက္ကန့် စောင့်ပါ။');
        return false;
      }
      if (pinCheckBusy) return false;
      const entered = await uiPrompt('🔒 Owner PIN လိုအပ်ပါသည်\nလုပ်ဆောင်ချက်: ' + reason, '', 'password');
      if (!entered) return false;
      pinCheckBusy = true;
      try {
        const hTry = await derivePbkdf2Hex(entered.trim(), sec.salt, sec.iter || 310000);
        if (hTry === sec.hash) {
          pinFailCount = 0;
          await put('meta', { k: 'pin_audit_' + uuid(), v: { action: 'PIN_OK', reason, at: Date.now() } });
          return true;
        }
        pinFailCount++;
        if (pinFailCount >= 4) pinLockUntil = Date.now() + 30000;
        await put('meta', { k: 'pin_audit_' + uuid(), v: { action: 'PIN_FAIL', reason, at: Date.now() } });
        await uiAlert('Owner PIN မှားယွင်းနေပါသည်။');
        return false;
      } finally {
        pinCheckBusy = false;
      }
    }

    // =========================================================================
    // 5. GAS INVENTORY, ACTIVE SLOTS, DAILY RECONCILIATION & SUPPLIER COSTING
    // =========================================================================
    const agOf = c => c ? (c.agent || 'TT Gas') : 'TT Gas';
    const capOf = ag => (AGENTS[ag] && AGENTS[ag].cap) || 28.5;

    function liveRole(role) {
      return gasCyl.find(c => c.role === role && c.state === 'open') || null;
    }

    function cylViss(c) {
      if (!c) return 0;
      if (c.state === 'full') return capOf(agOf(c));
      if (c.state !== 'open') return 0;
      const soldV = sales
        .filter(s => !s.voided)
        .flatMap(s => s.lines || [])
        .filter(l => l.cylId === c.id)
        .reduce((a, l) => a + (Number(l.gasViss) || 0), 0);
      const startV = Number(c.startViss) || capOf(agOf(c));
      const adjV = Number(c.adjViss) || 0;
      return Math.max(r2(startV - soldV + adjV), 0);
    }

    function gasStockViss() {
      const fullByAg = { 'TT Gas': 0, 'NGN': 0, 'Easy Gas': 0 };
      const emptyByAg = { 'TT Gas': 0, 'NGN': 0, 'Easy Gas': 0 };
      const openByAg = { 'TT Gas': 0, 'NGN': 0, 'Easy Gas': 0 };
      const openCyls = [];

      gasCyl.forEach(c => {
        const ag = agOf(c);
        if (c.state === 'full') fullByAg[ag] = (fullByAg[ag] || 0) + 1;
        else if (c.state === 'empty') emptyByAg[ag] = (emptyByAg[ag] || 0) + 1;
        else if (c.state === 'open') {
          openByAg[ag] = (openByAg[ag] || 0) + 1;
          openCyls.push({ cyl: c, ag, remV: cylViss(c) });
        }
      });

      const buyBackEvents = gasEv.filter(e => e.type === 'gas_ret' && !e.voided);
      const buyBackInV = buyBackEvents.reduce((a, e) => a + (Number(e.viss) || 0), 0);
      const buyBackSoldV = sales
        .filter(s => !s.voided)
        .flatMap(s => s.lines || [])
        .filter(l => l.isBuyBackStock)
        .reduce((a, l) => a + (Number(l.gasViss) || 0), 0);
      const buyBackRemV = Math.max(r2(buyBackInV - buyBackSoldV), 0);

      let fullV = 0;
      AG_LIST.forEach(ag => { fullV += (fullByAg[ag] || 0) * capOf(ag); });
      const openV = openCyls.reduce((a, x) => a + x.remV, 0);
      const totalGroundV = r2(fullV + openV + buyBackRemV);
      const totalFullCnt = AG_LIST.reduce((a, ag) => a + (fullByAg[ag] || 0), 0);
      const totalEmptyCnt = AG_LIST.reduce((a, ag) => a + (emptyByAg[ag] || 0), 0);

      return {
        fullByAg, emptyByAg, openByAg, openCyls,
        fullV: r2(fullV), openV: r2(openV), buyBackRemV,
        totalGroundV, totalFullCnt, totalEmptyCnt
      };
    }

    function gasInventorySummary() {
      const latestBySupplier = {};
      AG_LIST.forEach(ag => {
        const evs = gasEv
          .filter(e => e.type === 'recv' && !e.voided && agOf(e) === ag && Number(e.cost) > 0)
          .sort((a, b) => b.at - a.at);
        if (evs.length) {
          const ev = evs[0];
          const nom = Number(ev.nominalViss) || (capOf(ag) * (Number(ev.qty) || 1));
          const perCyl = Number(ev.cost) / (Number(ev.qty) || 1);
          const perViss = Number(ev.cost) / nom;
          latestBySupplier[ag] = { ratePerViss: perViss, ratePerCyl: perCyl, date: dkey(ev.at) };
        }
      });

      const bbEvs = gasEv.filter(e => e.type === 'gas_ret' && !e.voided).sort((a, b) => b.at - a.at);
      const st = gasStockViss();
      const latestBb = bbEvs[0] || null;
      return {
        latestBySupplier,
        buyBackRatePerViss: latestBb ? (Number(latestBb.buyBackRatePerViss) || (Number(latestBb.buyBackCost) / (Number(latestBb.viss) || 1))) : null,
        buyBackTotalViss: st.buyBackRemV,
        buyBackRemainingViss: st.buyBackRemV
      };
    }

    function gasDayReconcile(k) {
      const [a, b] = dbounds(k);
      // Opening balance: explicit gas_open for date k, or previous day's gas_close, or 0
      const explicitOpen = gasEv.filter(e => e.type === 'gas_open' && e.date === k).sort((x, y) => y.at - x.at)[0];
      let openV = 0;
      if (explicitOpen) {
        openV = Number(explicitOpen.viss) || 0;
      } else {
        const prevCloses = gasEv.filter(e => e.type === 'gas_close' && e.date < k).sort((x, y) => y.date.localeCompare(x.date) || y.at - x.at);
        if (prevCloses.length) openV = Number(prevCloses[0].groundViss) || 0;
      }

      // + အဝင် (In): supplier intakes + gas_ret buy-backs on date k
      const dayRecvs = gasEv.filter(e => e.type === 'recv' && !e.voided && e.at >= a && e.at <= b);
      const recvByAg = {};
      let recvV = 0;
      dayRecvs.forEach(e => {
        const ag = agOf(e);
        const q = Number(e.qty) || 1;
        const v = Number(e.actualViss) || (q * capOf(ag));
        recvV += v;
        recvByAg[ag] = (recvByAg[ag] || { qty: 0, viss: 0 });
        recvByAg[ag].qty += q;
        recvByAg[ag].viss = r2(recvByAg[ag].viss + v);
      });
      const dayBb = gasEv.filter(e => e.type === 'gas_ret' && !e.voided && e.at >= a && e.at <= b);
      const bbV = dayBb.reduce((acc, e) => acc + (Number(e.viss) || 0), 0);
      const totalInV = r2(recvV + bbV);

      const inParts = [];
      Object.entries(recvByAg).forEach(([ag, info]) => inParts.push(ag + ' ' + info.qty + ' × ' + capOf(ag) + ' = ' + r2(info.viss)));
      if (bbV > 0) inParts.push('Buy-Back = ' + r2(bbV));

      // - ယနေ့ ပိဿာအရောင်း (viss sales on date k)
      const dayLines = sales.filter(s => !s.voided && saleRevenueDateKey(s) === k).flatMap(s => s.lines || []);
      const vissSold = r2(dayLines.filter(l => l.gasRole === 'viss').reduce((acc, l) => acc + (Number(l.gasViss) || 0), 0));

      // - ဗူးအိုးလဲ (can cylinder swaps on date k)
      const daySwaps = gasEv.filter(e => e.type === 'swap' && !e.voided && e.role === 'can' && e.at >= a && e.at <= b);
      const canSwapV = r2(daySwaps.reduce((acc, e) => acc + (Number(e.capViss) || capOf(agOf(e))), 0));
      const swapLabels = daySwaps.map(e => agOf(e) + ' (' + (Number(e.capViss) || capOf(agOf(e))) + ' viss)');

      const bookStock = r2(openV + totalInV - vissSold - canSwapV);
      const gStock = gasStockViss();
      const groundStock = gStock.totalGroundV;
      const variance = r2(groundStock - bookStock);

      return {
        openV: r2(openV),
        totalInV,
        inSummary: inParts.length ? '(' + inParts.join(', ') + ')' : '',
        vissSold,
        canSwapV,
        canSwapSummary: swapLabels.length ? '(' + swapLabels.join(', ') + ')' : '',
        bookStock,
        groundStock,
        gStock,
        variance
      };
    }

    async function askSwap(role) {
      const dk = dkey(Date.now());
      if (!(await guardMonthUnlocked(dk, 'Gas Cylinder Swap'))) return;
      const ch = await uiPrompt(
        (role === 'viss' ? 'ပိဿာဖြည့်အိုး' : 'ဗူးဖြည့်အိုး') + ' အိုးအသစ်လဲရန် Supplier ရွေးပါ:\n' +
        '1 = TT Gas (48kg / 28.5 viss)\n' +
        '2 = NGN (48kg / 28.5 viss)\n' +
        '3 = Easy Gas (50kg / 30 viss)',
        '1', 'number'
      );
      const ag = { '1': 'TT Gas', '2': 'NGN', '3': 'Easy Gas' }[String(ch || '').trim()];
      if (!ag) return;

      const cur = liveRole(role);
      const fullCyl = gasCyl.find(c => c.state === 'full' && agOf(c) === ag);
      if (!fullCyl) {
        const addNew = await uiConfirm(ag + ' အပြည့်အိုး လက်ကျန် (0) ဖြစ်နေပါသည်။ အိုးအသစ် 1 လုံး ထည့်ပြီး ချက်ချင်းဖွင့်သုံးမလား?');
        if (!addNew) return;
      }

      const now = Date.now();
      const cap = capOf(ag);
      await run(['gasCyl', 'gasEv'], 'readwrite', t => {
        const cOs = t.objectStore('gasCyl');
        if (cur) cOs.put({ ...cur, state: 'empty', role: null, closedAt: now });
        if (fullCyl) {
          cOs.put({ ...fullCyl, state: 'open', role, startViss: cap, adjViss: 0, openedAt: now });
        } else {
          cOs.add({ id: uuid(), agent: ag, state: 'open', role, startViss: cap, adjViss: 0, openedAt: now });
        }
        t.objectStore('gasEv').add({ id: uuid(), at: now, type: 'swap', role, agent: ag, capViss: cap });
      });
      await reload();
      viewGas();
    }

    async function weighB(role) {
      const cur = liveRole(role);
      if (!cur) return uiAlert('လက်ရှိဖွင့်သုံးနေသော အိုး မရှိပါ။ အရင် အိုးလဲမည် ကို နှိပ်ပါ။');
      const curV = cylViss(cur);
      const inp = await uiPrompt(
        agOf(cur) + ' (' + (role === 'viss' ? 'ပိဿာဖြည့်အိုး' : 'ဗူးဖြည့်အိုး') + ')\n' +
        'လက်ရှိ စာရင်းလက်ကျန်: ' + r2(curV) + ' viss\n' +
        'ကတ္တားဖြင့် လက်တွေ့ချိန်တွယ်ရရှိသော ပိဿာ ထည့်ပါ:',
        r2(curV), 'number'
      );
      const actual = parseFloat(inp);
      if (isNaN(actual) || actual < 0) return;
      const diff = r2(actual - curV);
      await put('gasCyl', { ...cur, adjViss: r2((Number(cur.adjViss) || 0) + diff) });
      await add('gasEv', { id: uuid(), at: Date.now(), type: 'weigh', role, cylId: cur.id, agent: agOf(cur), diffViss: diff, actualViss: actual });
      await reload();
      viewGas();
    }

    // =========================================================================
    // 6. OXYGEN 4-TYPE OWNERSHIP MATRIX & MOTHER CYLINDER STATUS
    // =========================================================================
    function o2StockMatrix() {
      const res = {};
      Object.values(O2_TYPES).forEach(t => {
        res[t.id] = {
          id: t.id,
          ownership: t.ownership,
          rate: (cfg.o2Rates && cfg.o2Rates[t.id]) || t.defaultRate,
          full: 0,
          empty: 0,
          atCustomer: 0,
          atFactory: 0,
          payable: 0
        };
      });

      stk.filter(e => !e.voided).forEach(e => {
        const t = e.o2type && res[e.o2type];
        if (!t) return;
        const q = Number(e.qty) || 0;
        if (e.type === 'o2_stock_set') {
          if (e.target === 'full') t.full = Number(e.newQty) || 0;
          if (e.target === 'empty') t.empty = Number(e.newQty) || 0;
        } else if (e.type === 'o2_mov') {
          if (e.locationFrom === 'SHOP_FULL') t.full -= q;
          if (e.locationFrom === 'SHOP_EMPTY') t.empty -= q;
          if (e.locationFrom === 'AT_CUSTOMER') t.atCustomer -= q;
          if (e.locationFrom === 'AT_FACTORY') t.atFactory -= q;

          if (e.locationTo === 'SHOP_FULL') t.full += q;
          if (e.locationTo === 'SHOP_EMPTY') t.empty += q;
          if (e.locationTo === 'AT_CUSTOMER') t.atCustomer += q;
          if (e.locationTo === 'AT_FACTORY') t.atFactory += q;
        } else if (e.type === 'o2_fac_send') {
          t.empty -= q;
          t.atFactory += q;
        } else if (e.type === 'o2_fac_recv') {
          t.atFactory = Math.max(t.atFactory - q, 0);
          t.full += q;
          t.payable += Math.max((Number(e.totalAmt) || 0) - (Number(e.paidAmt) || 0), 0);
        }
      });

      return res;
    }

    function custO2Custody(custKey, o2type) {
      return cf
        .filter(e => !e.voided && e.type === 'o2cust' && ck(e.cust) === custKey && (!o2type || e.o2type === o2type))
        .reduce((a, e) => a + (Number(e.qtyDelta) || 0), 0);
    }

    function motherCylStatus() {
      const capL = Number(cfg.motherCapL) || 55;
      const rate = (cfg.o2Rates && cfg.o2Rates.OVER_40L_OWN) || 25000;
      const recvs = stk.filter(e => !e.voided && e.type === 'o2_fac_recv' && e.o2type === 'OVER_40L_OWN').sort((a, b) => b.at - a.at);
      const active = recvs[0] || null;
      const usedL = active
        ? stk.filter(e => !e.voided && e.type === 'o2_mother_fill' && e.motherId === active.id).reduce((a, e) => a + (Number(e.liters) || 0), 0)
        : 0;
      const remL = Math.max(r2(capL - usedL), 0);
      return { active, capL, remL, costPerL: rate / capL };
    }

    // =========================================================================
    // 7. CUSTOMERS, RECEIVABLES, CASH FLOW (V23) & P&L ENGINE (V24)
    // =========================================================================
    const isO2DropoffAwaitingPickup = s => !s.voided && s.isO2Dropoff && !s.pickedUpAt;
    const isDeferredUnrecognized = s => isO2DropoffAwaitingPickup(s);
    const saleRevenueDateKey = s => dkey(s.pickedUpAt || s.at);

    function customers() {
      const map = new Map();
      const ensure = name => {
        const k = ck(name);
        if (!k) return null;
        if (!map.has(k)) map.set(k, { key: k, name: String(name).trim(), phone: '', bal: 0, compBal: 0 });
        return map.get(k);
      };
      sales.filter(s => !s.voided && s.cust && !isO2DropoffAwaitingPickup(s)).forEach(s => {
        const c = ensure(s.cust);
        if (c && (s.pay === 'credit' || s.pay === 'pending')) c.bal += (Number(s.total) || 0);
      });
      cf.filter(e => !e.voided && e.cust).forEach(e => {
        const c = ensure(e.cust);
        if (!c) return;
        if (e.type === 'ob') c.bal += (Number(e.amt) || 0);
        if (e.type === 'cyl_compensation') c.compBal += (Number(e.amt) || 0);
      });
      pays.filter(p => !p.voided && p.cust).forEach(p => {
        const c = ensure(p.cust);
        if (!c) return;
        if (p.isCompensation) c.compBal -= (Number(p.amount) || 0);
        else c.bal -= (Number(p.amount) || 0);
      });
      return Array.from(map.values());
    }

    function unpaidInvoices(custKey) {
      const invs = sales.filter(s => !s.voided && !isO2DropoffAwaitingPickup(s) && ck(s.cust) === custKey && (s.pay === 'credit' || s.pay === 'pending'))
        .sort((a, b) => a.at - b.at);
      const paidBySale = new Map();
      pays.filter(p => !p.voided && !p.isCompensation && ck(p.cust) === custKey).forEach(p => {
        (p.allocations || []).forEach(al => {
          paidBySale.set(al.saleId, (paidBySale.get(al.saleId) || 0) + (Number(al.appliedAmt) || 0));
        });
      });
      return invs.map(s => {
        const rem = Math.max((Number(s.total) || 0) - (paidBySale.get(s.id) || 0), 0);
        return { sale: s, rem };
      }).filter(x => x.rem > 0.5);
    }

    function stockOf(p) {
      if (!p || p.gas || p.o2type) return null;
      const base = Number(p.stock);
      if (isNaN(base)) return null;
      const sold = sales.filter(s => !s.voided).flatMap(s => s.lines || []).filter(l => l.pid === p.id).reduce((a, l) => a + (Number(l.qty) || 0), 0);
      return r2(base - sold);
    }

    // Restored v23 Cash Flow Engine (Cash, KPay, Wave, AyA) — Kept strictly separate from P&L
    function flows(m, a, b) {
      let i = 0, o = 0;
      sales.filter(s => !s.voided && !isO2DropoffAwaitingPickup(s)).forEach(s => {
        const ts = s.pickedUpAt || s.at;
        if (ts >= a && ts <= b && s.pay === m) i += (Number(s.total) || 0);
      });
      pays.filter(p => !p.voided && p.at >= a && p.at <= b && p.method === m).forEach(p => {
        i += (Number(p.amount) || 0);
      });
      cf.filter(e => !e.voided).forEach(e => {
        if (e.type === 'exp' && e.at >= a && e.at <= b && e.m === m) o += (Number(e.amt) || 0);
        if (e.type === 'fac_refund_in' && e.at >= a && e.at <= b && e.m === m) i += (Number(e.amt) || 0);
        if (e.type === 'xfer' && e.at >= a && e.at <= b) {
          if (e.to === m) i += (Number(e.amt) || 0);
          if (e.from === m) o += (Number(e.amt) || 0);
        }
        if (e.type === 'loan') {
          const isBorrow = (e.dir || 'borrow') === 'borrow';
          if (e.at >= a && e.at <= b && e.m === m) {
            if (isBorrow) i += (Number(e.amt) || 0);
            else o += (Number(e.amt) || 0);
          }
          if (e.repaid && e.repaidAt >= a && e.repaidAt <= b && (e.repaidMethod || e.m) === m) {
            if (isBorrow) o += (Number(e.amt) || 0);
            else i += (Number(e.amt) || 0);
          }
        }
      });
      gasEv.filter(e => !e.voided && e.at >= a && e.at <= b).forEach(e => {
        if (e.type === 'gas_ret' && e.m === m) o += (Number(e.buyBackCost) || 0);
        if (e.type === 'recv' && e.m === m) o += (Number(e.cost) || 0);
      });
      return { i: Math.round(i), o: Math.round(o) };
    }

    function opening(m, k) {
      const explicit = cf.filter(e => e.type === 'bal' && e.kind === 'open' && e.method === m && e.date === k).sort((a, b) => b.at - a.at)[0];
      if (explicit) return Number(explicit.amt) || 0;
      const prevClose = cf.filter(e => e.type === 'bal' && e.kind === 'close' && e.method === m && e.date < k).sort((a, b) => b.date.localeCompare(a.date) || b.at - a.at)[0];
      if (prevClose) return Number(prevClose.amt) || 0;
      return 0;
    }

    function getRentForPeriod(dateOrYm, isMonthly) {
      const ym = String(dateOrYm).slice(0, 7);
      const slot = rentSchedule.find(r => ym >= r.from && ym <= r.to);
      if (!slot) {
        return { monthlyRent: 0, daysInMonth: 0, allocatedRent: 0, warning: ym >= '2027-01' ? '2027 Rent Unconfirmed' : 'Rent Unconfirmed' };
      }
      const [y, m] = ym.split('-').map(Number);
      const daysInMonth = new Date(y, m, 0).getDate();
      const allocatedRent = isMonthly ? slot.monthlyRent : (slot.monthlyRent / daysInMonth);
      return { monthlyRent: slot.monthlyRent, daysInMonth, allocatedRent, warning: null };
    }

    function calcPnL(dateOrYm, isMonthly) {
      const matchPeriod = dk => isMonthly ? dk.startsWith(dateOrYm) : dk === dateOrYm;
      const relSales = sales.filter(s => !s.voided && !isO2DropoffAwaitingPickup(s) && matchPeriod(saleRevenueDateKey(s)));
      const gInfo = gasInventorySummary();
      const prodMap = new Map(products.map(p => [p.id, p]));

      let grossRevenue = 0;
      let gasCogs = 0;
      let o2Cogs = 0;
      let prodCogs = 0;
      let focCogs = 0;
      let missingCostCount = 0;
      let estimatedGasCount = 0;
      const appliedGasMetaSet = new Set();

      relSales.forEach(s => {
        grossRevenue += (Number(s.total) || 0);
        (s.lines || []).forEach(l => {
          let lineCost = 0;
          if (l.motherFillLiters > 0) {
            lineCost = Number(l.costAtSale) || 0;
            o2Cogs += lineCost;
          } else if (l.o2type && O2_TYPES[l.o2type]) {
            const rt = (cfg.o2Rates && cfg.o2Rates[l.o2type]) || O2_TYPES[l.o2type].defaultRate;
            lineCost = (Number(l.qty) || 0) * rt;
            o2Cogs += lineCost;
          } else if (l.gasViss > 0) {
            const gv = Number(l.gasViss) || 0;
            if (l.isBuyBackStock && gInfo.buyBackRatePerViss !== null) {
              lineCost = gv * gInfo.buyBackRatePerViss;
              appliedGasMetaSet.add('Buy-Back @ ' + Math.round(gInfo.buyBackRatePerViss).toLocaleString() + '/viss');
            } else if (l.agent && gInfo.latestBySupplier[l.agent]) {
              const sup = gInfo.latestBySupplier[l.agent];
              lineCost = gv * sup.ratePerViss;
              appliedGasMetaSet.add(l.agent + ' @ ' + Math.round(sup.ratePerViss).toLocaleString() + '/viss (' + sup.date + ')');
            } else {
              const fallback = Object.values(gInfo.latestBySupplier)[0];
              const estRate = fallback ? fallback.ratePerViss : 3000;
              lineCost = gv * estRate;
              estimatedGasCount++;
              appliedGasMetaSet.add('Estimated @ ' + Math.round(estRate).toLocaleString() + '/viss');
            }
            if (l.foc) focCogs += lineCost;
            else gasCogs += lineCost;
          } else {
            const pRec = prodMap.get(l.pid);
            if (Number.isFinite(l.costAtSale)) lineCost = Number(l.costAtSale);
            else if (pRec && Number.isFinite(pRec.buyPrice) && pRec.buyPrice > 0) lineCost = (Number(l.qty) || 0) * pRec.buyPrice;
            else missingCostCount++;

            if (l.foc) focCogs += lineCost;
            else prodCogs += lineCost;
          }
        });
      });

      const opEx = cf.filter(e => !e.voided && e.type === 'exp' && matchPeriod(dkey(e.at)) && e.cat !== 'saving' && !e.isRentPayment && !e.isO2Settlement)
        .reduce((a, e) => a + (Number(e.amt) || 0), 0);

      const weightVarianceExpense = gasEv.filter(e => !e.voided && e.type === 'recv' && matchPeriod(dkey(e.at)))
        .reduce((a, e) => a + (Number(e.varianceCostMmk) || 0), 0);

      const rentInfo = getRentForPeriod(dateOrYm, isMonthly);
      const totalCogs = gasCogs + o2Cogs + prodCogs + focCogs;
      const grossProfit = grossRevenue - totalCogs;
      const netProfit = grossProfit - opEx - weightVarianceExpense - rentInfo.allocatedRent;

      return {
        grossRevenue, gasCogs, o2Cogs, prodCogs, focCogs, totalCogs,
        grossProfit, opEx, weightVarianceExpense, rentInfo, netProfit,
        missingCostCount, estimatedGasCount, appliedGasMeta: Array.from(appliedGasMetaSet)
      };
    }

    // =========================================================================
    // 8. BACKUP, ROLLING SNAPSHOTS, CONFLICT QUEUE & GET LATEST VERSION
    // =========================================================================
    async function dumpAll() {
      const data = {};
      for (const st of STORES) data[st] = await getAll(st);
      return { app: 'aung-gas-pos', schema: DB_SCHEMA_VER, exportedAt: Date.now(), deviceId: DEVICE_ID, data };
    }

    async function sha256Text(txt) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
      return Array.from(new Uint8Array(buf), b => b.toString(16).padStart(2, '0')).join('');
    }

    async function saveRollingSnapshot(reason) {
      const snap = await dumpAll();
      const raw = JSON.stringify(snap);
      const now = Date.now();
      const snaps = (getMeta('rolling_snapshots') || []).slice(-2);
      snaps.push({ id: uuid(), at: now, reason, size: raw.length, data: snap });
      await run(['meta'], 'readwrite', t => {
        const m = t.objectStore('meta');
        m.put({ k: 'rolling_snapshots', v: snaps });
        m.put({ k: 'last_auto_backup_at', v: now });
      });
    }

    async function exportExternalBackup(sharePrompt = false) {
      const payload = await dumpAll();
      const json = JSON.stringify(payload, null, 2);
      const hash = await sha256Text(json);
      const fname = 'aung-gas-pos-v24-' + dkey(Date.now()) + '.json';
      const blob = new Blob([json], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = h('a', { href: url, download: fname });
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);

      const now = Date.now();
      await run(['meta'], 'readwrite', t => {
        const m = t.objectStore('meta');
        m.put({ k: 'last_bk', v: now });
        m.put({ k: 'last_verified_export', v: { at: now, sha256: hash, fname } });
      });
      await reload();

      if (sharePrompt && navigator.canShare) {
        try {
          const f = new File([blob], fname, { type: 'application/json' });
          if (navigator.canShare({ files: [f] })) await navigator.share({ title: fname, files: [f] });
        } catch (e) {}
      }
      return { fname, sha256: hash };
    }

    function checkBk(d) {
      if (!d || typeof d !== 'object') return 'Invalid JSON backup.';
      if (d.app && d.app !== 'aung-gas-pos') return 'Wrong app backup file.';
      if (!d.data || typeof d.data !== 'object') return 'Missing backup data object.';
      return null;
    }

    async function importAll(d, skipPreSnap = false) {
      if (!skipPreSnap) await saveRollingSnapshot('pre_restore');
      let added = 0, same = 0, conflicts = 0, lockedQuarantined = 0;
      const newConflicts = [...restoreConflicts];

      for (const st of STORES) {
        if (st === 'meta') continue;
        const incoming = Array.isArray(d.data[st]) ? d.data[st] : [];
        const existing = await getAll(st);
        const exMap = new Map(existing.map(x => [x.id, x]));

        for (const rec of incoming) {
          if (!rec || !rec.id) continue;
          const recDate = rec.date || (rec.at ? dkey(rec.at) : null);
          if (recDate && isMonthLocked(recDate)) {
            lockedQuarantined++;
            newConflicts.push({
              conflictId: uuid(), store: st, recordId: rec.id, status: 'pending',
              reason: 'LOCKED_MONTH', lockedMonth: recDate.slice(0, 7),
              localCopy: exMap.get(rec.id) || null, backupCopy: rec, at: Date.now()
            });
            continue;
          }
          const loc = exMap.get(rec.id);
          if (!loc) {
            await put(st, rec);
            added++;
          } else if (JSON.stringify(loc) === JSON.stringify(rec)) {
            same++;
          } else {
            conflicts++;
            newConflicts.push({
              conflictId: uuid(), store: st, recordId: rec.id, status: 'pending',
              reason: 'CONTENT_MISMATCH',
              localCopy: loc, backupCopy: rec, at: Date.now()
            });
          }
        }
      }
      await put('meta', { k: 'restore_conflicts', v: newConflicts });
      await reload();
      return { added, same, conflicts, lockedQuarantined };
    }

    async function resolveConflict(conflictId, action, noteTxt) {
      const idx = restoreConflicts.findIndex(c => c.conflictId === conflictId && c.status === 'pending');
      if (idx < 0) return;
      const c = restoreConflicts[idx];
      if (c.reason === 'LOCKED_MONTH' && isMonthLocked(c.lockedMonth)) {
        throw new Error('Month ' + c.lockedMonth + ' is locked. Reopen month first.');
      }
      const ok = await requireOwnerPin('Resolve Restore Conflict (' + c.store + '::' + c.recordId.slice(-6) + ')');
      if (!ok) return;

      if (action === 'ACCEPT_BACKUP') {
        const archives = getMeta('conflict_archives') || [];
        if (c.localCopy) archives.push({ id: uuid(), archivedAt: Date.now(), store: c.store, record: c.localCopy });
        await run([c.store, 'meta'], 'readwrite', t => {
          t.objectStore(c.store).put(c.backupCopy);
          t.objectStore('meta').put({ k: 'conflict_archives', v: archives });
        });
      }
      const updated = [...restoreConflicts];
      updated[idx] = { ...c, status: 'resolved', resolution: action, resolvedAt: Date.now(), note: noteTxt };
      await put('meta', { k: 'restore_conflicts', v: updated });
      await reload();
    }

    async function pruneOldArchivesIfVerified() {
      const ver = getMeta('last_verified_export');
      const archives = getMeta('conflict_archives') || [];
      if (!ver || archives.length <= 50) return { pruned: 0 };
      const kept = archives.slice(-50);
      await put('meta', { k: 'conflict_archives', v: kept });
      return { pruned: archives.length - kept.length };
    }

    async function getLatestVersion() {
      const go = await uiConfirm(
        'နောက်ဆုံး Version ကို ရယူပါမည်။\n\n' +
        'သင့် စာရင်း Data များ လုံးဝ မပျောက်ဘဲ App Cache ကိုသာ ရှင်းလင်းပြီး ပြန်ဖွင့်ပေးပါမည်။ ဆက်လုပ်မလား?',
        'ယူမည် (Update)', 'Cancel'
      );
      if (!go) return;
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(k => caches.delete(k)));
        }
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(r => r.update().catch(() => {})));
          regs.forEach(r => { if (r.waiting) r.waiting.postMessage({ type: 'SKIP_WAITING' }); });
        }
      } catch (e) {}
      location.reload();
    }

    // =========================================================================
    // 8B. 80MM THERMAL RECEIPT PRINT SYSTEM (printSale)
    // =========================================================================
    function printSale(idOrSale) {
      const s = typeof idOrSale === 'string' ? sales.find(x => x.id === idOrSale) : idOrSale;
      if (!s) return uiAlert('ဘောင်ချာ မှတ်တမ်း မတွေ့ပါ။');

      const custRec = custName ? customers().find(c => c.key === ck(custName)) : null;

      const headerLines = (rc.head || 'သာကေတ၊ ရန်ကုန်မြို့\nLPG ဓာတ်ငွေ့ နှင့် ဆေးရုံသုံး/စက်မှုသုံး အောက်ဆီဂျင် ရောင်းဝယ်ရေး')
        .split('\n')
        .map(line => h('div', { class: 'c' }, line));

      const itemNodes = (s.lines || []).map(l => {
        const lineAmt = lineGrossAmt(l);
        const typeTag = l.o2type
          ? (' [' + o2Label(l.o2type) + (l.o2Movement ? ' · ' + l.o2Movement : '') + ']')
          : (l.gasViss > 0 ? (' [' + r2(l.gasViss) + ' viss]') : '');
        return h('div', { class: 'it' },
          h('div', { class: 'nm' }, l.name + typeTag + (l.foc ? ' [FOC]' : '')),
          h('div', { class: 'r' },
            h('span', {}, l.qty + ' ' + (l.unit || '') + ' × ' + (l.foc ? '0 (FOC)' : (Number(l.price) || 0).toLocaleString())),

        );

        const c40F = custO2Custody(cKey, '40L_FACTORY');
        const c47F = custO2Custody(cKey, '47L_FACTORY');
        const c40O = custO2Custody(cKey, '40L_OWN');
        const cOvO = custO2Custody(cKey, 'OVER_40L_OWN');
        const hasAnyCust = (c40F + c47F + c40O + cOvO) > 0;

        return h('div', {},

          hasBal ? h('div', { class: 'r b' }, h('span', {}, 'လက်ကျန်ကြွေး (Balance):'), h('span', {}, money(custRec.bal))) : '',
          custRec.compBal > 0.5 ? h('div', { class: 'r' }, h('span', {}, 'အိုးလျော်ကြေးကျန်:'), h('span', {}, money(custRec.compBal))) : '',
          hasAnyCust ? h('div', { style: 'margin-top:3px;font-size:0.92em' },
            h('b', {}, 'Customer အိုးလက်ကျန် (Custody): '),
            [
              c40F ? ('40Lစက်ရုံ:' + c40F) : '',
              c47F ? ('47Lစက်ရုံ:' + c47F) : '',

            ].filter(Boolean).join(', ')

        );

      const footerLines = (rc.foot || 'ဝယ်ယူအားပေးမှုကို ကျေးဇူးတင်ပါသည်။')
        .split('\n')
        .map(line => h('div', { class: 'ft' }, line));

      box.replaceChildren(
        h('div', { class: 'c big' }, 'AUNG Gas Solutions'),
        ...headerLines,
        h('div', { class: 'dd' }),
        h('div', { class: 'r' }, h('span', {}, 'ဘောင်ချာ: #' + s.id.slice(-6).toUpperCase()), h('span', {}, dkey(s.at) + ' ' + tm(s.at))),
        custName ? h('div', { class: 'r' }, h('span', {}, 'ဝယ်သူ: ' + custName), h('span', {}, s.term && s.term !== 'immediate' ? termLabel(s.term) : '')) : '',
        s.tag ? h('div', {}, 'Tag/Token: ' + s.tag) : '',
        s.isO2Dropoff ? h('div', { class: 'r b' }, h('span', {}, 'O2 Status:'), h('span', {}, s.pickedUpAt ? ('Picked Up (' + dkey(s.pickedUpAt) + ')') : 'Filled – Awaiting Pickup')) : '',
        s.voided ? h('div', { class: 'c', style: 'font-weight:900;margin:4px 0' }, '*** VOIDED / ပယ်ဖျက်ပြီး ***') : '',
        h('div', { class: 'dd' }),
        ...itemNodes,
        h('div', { class: 'ss' }),
        disc > 0 ? h('div', { class: 'r' }, h('span', {}, 'စုစုပေါင်း (Subtotal)'), h('span', {}, subTotal.toLocaleString())) : '',
        disc > 0 ? h('div', { class: 'r' }, h('span', {}, 'လျှော့ဈေး (Discount)'), h('span', {}, '−' + disc.toLocaleString())) : '',
        h('div', { class: 'r tt' }, h('span', {}, 'ကျသင့်ငွေ'), h('span', {}, money(s.total))),
        h('div', { class: 'r' }, h('span', {}, 'ပေးချေမှု'), h('span', {}, payLabel(s))),
        custodyBlock,
        h('div', { class: 'dd' }),
        ...footerLines
      );

      setTimeout(() => window.print(), 60);

    function loanBanner() {
      const activeLoans = cf.filter(e => e.type === 'loan' && !e.voided && !e.repaid);
      if (!activeLoans.length) return '';
      const todayKey = dkey(Date.now());
      const dueOrOver = activeLoans.filter(e => e.dueDate && e.dueDate <= todayKey);
      const borrowSum = activeLoans.filter(e => (e.dir || 'borrow') === 'borrow').reduce((a, e) => a + (Number(e.amt) || 0), 0);
      const lendSum = activeLoans.filter(e => e.dir === 'lend').reduce((a, e) => a + (Number(e.amt) || 0), 0);

      return h('div', { class: 'card', style: 'border:2px solid ' + (dueOrOver.length ? 'var(--red)' : 'var(--org)') + ';background:' + (dueOrOver.length ? '#FFF8F7' : '#FFFDF9') },
        h('div', { style: 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px' },
          h('div', {},
            h('b', { style: 'color:' + (dueOrOver.length ? 'var(--red)' : '#9A3412') },
              '💰 ယာယီချေးငွေ လက်ကျန် (' + activeLoans.length + ' ခု)' + (dueOrOver.length ? ' · ⚠ ရက်စေ့/ကျော်လွန် ' + dueOrOver.length + ' ခု' : '')
            ),
            h('div', { style: 'font-size:13px' },
              (borrowSum > 0 ? 'ချေးယူထားငွေ: ' + money(borrowSum) + '  ' : '') +
              (lendSum > 0 ? 'ထုတ်ချေးထားငွေ: ' + money(lendSum) : '')

          h('button', { class: 'n', onclick: () => { expSubTab = 2; show(7); } }, 'ကြည့်ရန် / ပြန်ဆပ်မည်')

    function viewSale() {
      const app = $('#app');
      app.replaceChildren();

      const dl = h('datalist', { id: 'pl' }, products.map(p => h('option', { value: p.name })));
      const cl = h('datalist', { id: 'cl' }, customers().map(c => h('option', { value: c.name })));
      const pn = h('input', { list: 'pl', placeholder: 'ပစ္စည်းနာမည် ရိုက်ပါ / ရွေးပါ', autocomplete: 'off' });
      const qty = h('input', { type: 'number', inputmode: 'decimal', step: 'any', min: '0', placeholder: 'ပမာဏ' });
      const un = h('select', {}, UNITS.map(u => h('option', { value: u }, u)));
      const pr = h('input', { type: 'number', inputmode: 'numeric', min: '0', placeholder: 'ဈေးနှုန်း (ကျပ်)' });
      const foc = h('input', { type: 'checkbox', style: 'width:auto;margin-right:8px' });

      const o2ModeSel = h('select', {},
        h('option', { value: 'counter_swap' }, 'Counter Exchange (အခွံ ၁:၁ တူညီသော Type/Ownership လဲမည်)'),
        h('option', { value: 'site_deliver_keep' }, 'Site Delivery — Keep (အိုးထားခဲ့ · Customer Custody +)'),
        h('option', { value: 'site_deliver_swap' }, 'Site Delivery — Swap (Site မှာ အခွံချက်ချင်းလဲမည်)'),
        h('option', { value: 'o2_dropoff_pickup' }, 'O2 Drop-off ("Filled – Awaiting Pickup" · လာယူမှ Rev/COGS)')
      );
      const o2Wrap = h('div', { style: 'display:none' }, h('label', {}, 'Oxygen Movement Mode'), o2ModeSel);

      pn.onchange = () => {
        const p = products.find(x => x.name === pn.value.trim());
        if (p) {
          un.value = p.unit;
          if (p.sellPrice > 0 && !pr.value) pr.value = p.sellPrice;
          o2Wrap.style.display = (p.o2type && O2_TYPES[p.o2type]) ? 'block' : 'none';
        } else {
          o2Wrap.style.display = 'none';
        }
      };

      const pay = h('select', {}, Object.entries(PAY).map(([k, v]) => h('option', { value: k }, v)));
      const siteTermSel = h('select', {}, Object.entries(SITE_TERMS).map(([k, v]) => h('option', { value: k }, lang === 'en' ? v.labelEn : v.labelMy)));
      const siteTermWrap = h('div', { style: 'display:none' }, h('label', {}, 'Site Payment Term'), siteTermSel);
      const cust = h('input', { list: 'cl', placeholder: 'Customer Name (COD / Credit / Site / Custody)', autocomplete: 'off', style: 'margin-top:8px' });
      const tagIn = h('input', { placeholder: 'Tag / Token (Drop-off)', autocomplete: 'off', style: 'margin-top:8px;display:none' });
      const discIn = h('input', { type: 'number', inputmode: 'numeric', min: '0', placeholder: 'Discount (ကျပ် — 2% ကျော်လျှင် Owner PIN လို)' });
      const dIn = h('input', { type: 'date', max: dkey(Date.now()), value: dkey(Date.now()) });

      pay.onchange = () => {
        siteTermWrap.style.display = (pay.value === 'credit') ? 'block' : 'none';
        tagIn.style.display = (pay.value === 'dropoff') ? 'block' : 'none';
      };

      const msg = h('div'), list = h('div'), tot = h('div', { class: 'tot' });
      const saveBtn = h('button', { class: 'o' }, 'ရောင်းချမှု သိမ်းမည်');

      const draw = () => {
        const sub = lines.reduce((s, l) => s + lineGrossAmt(l), 0);
        const dAmt = parseFloat(discIn.value) || 0;
        list.replaceChildren(...lines.map((l, i) => h('div', { class: 'li' },
          h('span', {},
            l.name + ' × ' + l.qty + ' ' + l.unit,
            l.o2type ? h('span', { class: 'tag b' }, o2Label(l.o2type) + ' · ' + l.o2Movement) : '',
            l.foc ? h('span', { class: 'tag' }, 'FOC') : ''
          ),
          h('span', {},
            money(lineGrossAmt(l)) + ' ',
            h('button', { class: 'g', onclick: () => { lines.splice(i, 1); draw(); } }, 'ဖယ်')
          )
        )));
        tot.textContent = 'စုစုပေါင်း ' + money(Math.max(sub - dAmt, 0));
        saveBtn.disabled = !lines.length;
      };
      discIn.oninput = draw;

      const addLine = async () => {
        const p = products.find(x => x.name === pn.value.trim());
        const q = parseFloat(qty.value);
        const pc = parseFloat(pr.value);
        const f = foc.checked;

        if (!p) return note(msg, 'ပစ္စည်းစာရင်းထဲမှ ပစ္စည်းကို ရွေးပါ။');
        if (!(q > 0)) return note(msg, 'ပမာဏကို 0 ထက်ကြီးအောင် ထည့်ပါ။');
        if (!f && (isNaN(pc) || pc < 0)) return note(msg, 'ဈေးနှုန်း ထည့်ပါ (FOC ဆိုလျှင် အမှန်ခြစ်ပါ)။');

        let o2Mov = null;
        if (p.o2type && O2_TYPES[p.o2type]) {
          o2Mov = o2ModeSel.value;
          const mat = o2StockMatrix()[p.o2type];
          const inCart = lines.filter(l => l.o2type === p.o2type).reduce((a, l) => a + l.qty, 0);
          if (mat.full < (q + inCart)) {
            return note(msg, '⛔ ' + o2Label(p.o2type) + ' Full Stock (' + mat.full + ') မလုံလောက်ပါ (Negative Stock ကာကွယ်ထားပါသည်)။');
          }
          if (o2Mov === 'o2_dropoff_pickup') pay.value = 'dropoff';
        } else if (!p.gas) {
          const st = stockOf(p);
          if (st !== null && q > st && !(await uiConfirm('"' + p.name + '" လက်ကျန် ' + r2(st) + ' ' + p.unit + ' ရှိသည်။ ဆက်ထည့်မလား?'))) return;
        }

        const gInfo = gasInventorySummary();
        const gViss = p.gas ? (p.gas === 'viss' ? q : q / (cfg.cans || 7)) : 0;
        const liveCyl = p.gas ? liveRole(p.gas) : null;
        const ag = liveCyl ? agOf(liveCyl) : null;
        const isBuyBackStock = !!(p.gas && !ag && gInfo.buyBackRatePerViss !== null && gInfo.buyBackRemainingViss > 0);

        lines.push({
          pid: p.id,
          name: p.name,
          qty: q,
          unit: un.value,
          price: isNaN(pc) ? 0 : pc,
          foc: f,
          gasViss: gViss,
          gasRole: p.gas || null,
          cylId: liveCyl ? liveCyl.id : null,
          agent: ag,
          isBuyBackStock,
          o2type: p.o2type || null,
          ownership: p.o2type ? O2_TYPES[p.o2type].ownership : null,
          o2Movement: o2Mov
        });

        pn.value = qty.value = pr.value = '';
        foc.checked = false;
        o2Wrap.style.display = 'none';
        msg.replaceChildren();
        draw();
      };

      saveBtn.onclick = async () => {
        if (saving || !lines.length) return;
        const targetDate = dIn.value || dkey(Date.now());
        if (!(await guardMonthUnlocked(targetDate, 'အရောင်း မှတ်တမ်း သိမ်းဆည်းခြင်း'))) return;

        const sub = lines.reduce((s, l) => s + lineGrossAmt(l), 0);
        const dAmt = parseFloat(discIn.value) || 0;
        if (dAmt > 0 && sub > 0 && (dAmt / sub) > 0.02) {
          const ok = await requireOwnerPin('Discount 2% ကျော်လွန်ခွင့် (' + money(dAmt) + ')');
          if (!ok) return;
        }

        const pm = pay.value;
        const cName = cust.value.trim();
        const tg = tagIn.value.trim();
        if ((pm === 'credit' || pm === 'pending') && !cName) return note(msg, 'COD / Credit / Site အတွက် Customer Name ထည့်ပါ။');
        if (lines.some(l => l.o2Movement === 'site_deliver_keep') && !cName) return note(msg, 'Site Delivery (Keep) အတွက် Customer Name ထည့်ပါ။');

        saving = true;
        saveBtn.disabled = true;
        try {
          const now = Date.now();
          const saleTs = targetDate === dkey(now) ? now : dbounds(targetDate)[0] + 43200000;
          const total = Math.max(sub - dAmt, 0);
          const isO2Drop = lines.some(l => l.o2Movement === 'o2_dropoff_pickup');

          const prodMap = new Map(products.map(x => [x.id, x]));
          const committedLines = lines.map((l, idx) => {
            const pRec = prodMap.get(l.pid);
            let costAtSale = null;
            let costMissing = false;
            if (!l.gasViss && !l.o2type) {
              if (pRec && Number.isFinite(pRec.buyPrice) && pRec.buyPrice > 0) {
                costAtSale = (Number(l.qty) || 0) * pRec.buyPrice;
              } else {
                costMissing = true;
              }
            }
            return { ...l, lineId: saleId + ':' + idx, costAtSale, costMissing };
          });

          const savedSaleId = saleId;
          const saleObj = {
            id: savedSaleId,
            at: saleTs,
            createdAt: now,
            pay: pm,
            parts: [{ m: pm, a: total }],
            cust: cName || null,
            tag: tg || null,
            term: pm === 'credit' ? siteTermSel.value : 'immediate',
            discount: dAmt,
            isO2Dropoff: isO2Drop,
            pickedUpAt: null,
            lines: committedLines,
            total,
            voided: false,
            rev: 1,
            updatedAt: now,
            deviceId: DEVICE_ID
          };

          await run(['sales', 'stk', 'cf'], 'readwrite', t => {
            t.objectStore('sales').add(saleObj);
            committedLines.forEach(l => {
              if (l.o2type && O2_TYPES[l.o2type]) {
                const own = O2_TYPES[l.o2type].ownership;
                if (l.o2Movement === 'counter_swap' || l.o2Movement === 'site_deliver_swap') {
                  t.objectStore('stk').add({
                    id: uuid(), movementId: uuid(), saleLineId: l.lineId,
                    type: 'o2_mov', o2type: l.o2type, ownership: own,
                    movementType: l.o2Movement, locationFrom: 'SHOP_FULL', locationTo: 'AT_CUSTOMER',
                    qty: l.qty, at: saleTs, createdAt: now
                  });
                  t.objectStore('stk').add({
                    id: uuid(), movementId: uuid(), saleLineId: l.lineId,
                    type: 'o2_mov', o2type: l.o2type, ownership: own,
                    movementType: l.o2Movement, locationFrom: 'AT_CUSTOMER', locationTo: 'SHOP_EMPTY',
                    qty: l.qty, at: saleTs, createdAt: now
                  });
                } else {
                  t.objectStore('stk').add({
                    id: uuid(), movementId: uuid(), saleLineId: l.lineId,
                    type: 'o2_mov', o2type: l.o2type, ownership: own,
                    movementType: l.o2Movement, locationFrom: 'SHOP_FULL', locationTo: 'AT_CUSTOMER',
                    qty: l.qty, at: saleTs, createdAt: now
                  });
                  if (cName && l.o2Movement !== 'o2_dropoff_pickup') {
                    t.objectStore('cf').add({
                      id: uuid(), movementId: uuid(), saleLineId: l.lineId,
                      type: 'o2cust', cust: cName, o2type: l.o2type, ownership: own,
                      qtyDelta: l.qty, at: saleTs, createdAt: now
                    });
                  }
                }
              }
            });
          });

          lines = [];
          saleId = uuid();
          discIn.value = '';
          cust.value = '';
          tagIn.value = '';
          await reload();
          msg.replaceChildren(
            h('div', { class: 'msg k', style: 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px' },
              h('span', {}, '✓ အရောင်းမှတ်တမ်း သိမ်းပြီးပါပြီ (#' + savedSaleId.slice(-6).toUpperCase() + ')'),
              h('button', { class: 'n', onclick: () => printSale(savedSaleId) }, '🖨 ဘောင်ချာ Print ထုတ်မည်')
            )
          );
        } catch (e) {
          note(msg, 'Error (Rolled back): ' + (e && e.message || e));
        } finally {
          saving = false;
          draw();
          drawToday();
        }
      };

      const awaitingPickup = sales.filter(isO2DropoffAwaitingPickup);
      const dropCard = awaitingPickup.length ? h('div', { class: 'card', style: 'border:2px solid var(--org);background:#FFFDF9' },
        h('b', { style: 'color:#9A3412' }, 'Filled – Awaiting Pickup (' + awaitingPickup.length + ')'),
        h('small', {}, 'ဖောက်သည် လာယူချိန်မှသာ Revenue & COGS အသိအမှတ်ပြုမည်။ ငွေချေမှုကို သီးခြားမှတ်တမ်းတင်မည်။'),
        ...awaitingPickup.map(s => h('div', { class: 'li', style: 'flex-wrap:wrap' },
          h('span', {}, (s.cust || s.tag || 'Drop-off') + ' · ' + s.lines.map(l => l.name + '×' + l.qty).join(', ') + ' · ' + money(s.total)),
          h('button', {
            style: 'padding:5px 10px;font-size:12.5px',
            onclick: async () => {
              const pDate = await uiPrompt('လာယူသည့် ရက်စွဲ (YYYY-MM-DD)', dkey(Date.now()));
              if (!pDate) return;
              if (!(await guardMonthUnlocked(pDate, 'O2 Drop-off Pickup Recognition'))) return;
              const pickupTs = dbounds(pDate)[0] + 43200000;
              const paidNow = await uiConfirm('ယခုလာယူချိန်တွင် ငွေရှင်းပြီးပါသလား?\n(OK = ယခုပေးချေပြီး / Cancel = နောက်မှရှင်းမည် - Customer Receivable မှတ်မည်)', 'ငွေရှင်းပြီး', 'နောက်မှရှင်းမည်');
              let payCh = 'credit';
              if (paidNow) {
                const c = await uiPrompt('ငွေပေးချေမှု 1=ငွေသား 2=KPay 3=Wave 4=AyA', '1', 'number');
                payCh = { '1': 'cash', '2': 'kpay', '3': 'wave', '4': 'aya' }[String(c || '').trim()] || 'cash';
              }
              await run(['sales', 'cf'], 'readwrite', t => {
                t.objectStore('sales').put({ ...s, pickedUpAt: pickupTs, pay: payCh, parts: [{ m: payCh, a: s.total }] });
                if (s.cust) {
                  s.lines.forEach(l => {
                    if (l.o2type) {
                      t.objectStore('cf').add({
                        id: uuid(), movementId: uuid(), saleLineId: l.lineId,
                        type: 'o2cust', cust: s.cust, o2type: l.o2type, ownership: l.ownership,
                        qtyDelta: l.qty, at: pickupTs
                      });
                    }
                  });
                }
              });
              await reload();
              viewSale();
            }
          }, 'လာယူပြီ (Pickup)')
        ))
      ) : '';

      const todayList = h('div');
      const drawToday = () => {
        const t0 = dbounds(dkey(Date.now()))[0];
        const ts = sales.filter(s => (saleRevenueDateKey(s) === dkey(Date.now())) || (s.at >= t0 && !isDeferredUnrecognized(s)));
        const dayRev = sales.filter(s => !s.voided && saleRevenueDateKey(s) === dkey(Date.now())).reduce((a, s) => a + s.total, 0);
        todayList.replaceChildren(
          h('h2', {}, 'ယနေ့ Recognized Sales: ' + money(dayRev)),
          h('div', { class: 'card' }, ts.length ? ts.map(s => h('div', { class: 'li', style: 'flex-wrap:wrap' },
            h('span', { class: s.voided ? 'void' : '' },
              tm(s.pickedUpAt || s.at) + ' · ' + s.lines.map(l => l.name + '×' + l.qty).join(', ') + ' · ' + payLabel(s) + (s.cust ? ' (' + s.cust + ')' : '')
            ),
            h('span', { style: 'display:flex;align-items:center;gap:6px' },
              h('b', { class: s.voided ? 'void' : '' }, money(s.total)),
              h('button', { class: 'n', style: 'padding:4px 8px;font-size:12px', onclick: () => printSale(s) }, '🖨 Print'),
              !s.voided ? h('button', {
                class: 'g',
                onclick: async () => {
                  const dk = dkey(s.at);
                  if (!(await guardMonthUnlocked(dk, 'Void Sale'))) return;
                  const ok = await requireOwnerPin('Void Sale #' + s.id.slice(-6));
                  if (!ok) return;
                  const now = Date.now();
                  await run(['sales', 'stk', 'cf'], 'readwrite', t => {
                    t.objectStore('sales').put({ ...s, voided: true, voidedAt: now });
                    stk.filter(e => e.saleLineId && e.saleLineId.startsWith(s.id + ':')).forEach(e => t.objectStore('stk').put({ ...e, voided: true }));
                    cf.filter(e => e.saleLineId && e.saleLineId.startsWith(s.id + ':')).forEach(e => t.objectStore('cf').put({ ...e, voided: true }));
                  });
                  await reload();
                  drawToday();
                }
              }, 'Void') : ''
            )
          )) : h('small', {}, 'ယနေ့ အရောင်း မရှိသေးပါ။'))
        );
      };

      app.append(
        dl, cl,
        buildOwnerDashboard(),
        loanBanner(),
        dropCard,
        h('div', { class: 'card' },
          h('label', {}, 'ပစ္စည်း (Product)'), pn,
          o2Wrap,
          h('div', { class: 'row' },
            h('div', {}, h('label', {}, 'ပမာဏ (Qty)'), qty),
            h('div', {}, h('label', {}, 'ယူနစ် (Unit)'), un)
          ),
          h('label', {}, 'ဈေးနှုန်း (Price)'), pr,
          h('label', { style: 'display:flex;align-items:center' }, foc, 'FOC (Revenue = 0, COGS တွက်မည်)'),
          h('button', { class: 'o', style: 'background:var(--grey)', onclick: addLine }, 'စာရင်းထဲ ထည့်မည် (Add)')
        ),
        msg,
        h('div', { class: 'card' },
          list, tot,
          h('label', {}, 'ရက်စွဲ (Date)'), dIn,
          h('label', {}, 'ပေးချေမှု (Payment)'), pay,
          siteTermWrap, cust, tagIn,
          h('label', {}, 'Discount (ကျပ်)'), discIn,
          saveBtn
        ),
        todayList
      );
      draw();
      drawToday();
    }

    // =========================================================================

    // =========================================================================
