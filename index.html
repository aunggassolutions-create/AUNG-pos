<!doctype html>
<html lang="my"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0B1F3A">
<link rel="manifest" href="manifest.webmanifest">

<title>AUNG POS</title>
<style>
:root{--navy:#0B1F3A;--org:#E86A12;--bg:#F4F6F9;--ln:#D5DBE4;--red:#B3261E;--ok:#1B7F3B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:"Noto Sans Myanmar","Myanmar Text",system-ui,sans-serif;line-height:1.7;padding-bottom:72px}
header{background:var(--navy);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:17px}
#net{font-size:13px;padding:2px 10px;border-radius:12px;background:var(--ok)}
#net.off{background:var(--org)}
main{padding:12px;max-width:640px;margin:auto}
h2{font-size:17px;margin:14px 0 6px}
.card{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:10px;margin-bottom:10px}
label{display:block;font-size:14px;margin-top:8px}
input,select{width:100%;padding:10px;font:inherit;border:1px solid var(--ln);border-radius:6px;background:#fff;color:var(--navy)}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font:inherit;border:0;border-radius:6px;padding:10px 14px;background:var(--navy);color:#fff}
button.o{background:var(--org);font-weight:700;width:100%;margin-top:10px;padding:13px}
button.g{background:#fff;color:var(--red);border:1px solid var(--red);padding:4px 10px;font-size:13px}
button:disabled{opacity:.5}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--ln)}
.li:last-child{border:0}
.tag{font-size:12px;background:#FFE9D6;color:#9A4308;border-radius:4px;padding:0 6px;margin-left:6px}
.tot{font-size:20px;font-weight:700;text-align:right;margin-top:8px}
.void{text-decoration:line-through;opacity:.55}
.msg{padding:10px;border-radius:6px;margin:8px 0;font-size:14px}
.msg.e{background:#FDE7E5;color:var(--red)}.msg.k{background:#E3F4E8;color:var(--ok)}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:2px solid var(--navy)}
nav button{flex:1;background:#fff;color:var(--navy);border-radius:0;padding:14px 0;font-weight:700;font-size:13px}
nav button.on{background:var(--org);color:#fff}
small{color:#5A6B82}
button.n{background:#fff;color:var(--navy);border:1px solid var(--navy);padding:4px 10px;font-size:13px}

#rcpt{display:none}

@media print {
  @page {
    size: 80mm auto;
    margin: 3mm;
  }

  body {
    background: #fff !important;
    padding: 0 !important;
  }

  header, main, nav {
    display: none !important;
  }

  #rcpt {
    display: block !important;
    width: 15px;
    color: #000;
    font-family: "Noto Sans Myanmar", "Myanmar Text", sans-serif;
    font-size: 40px;
    line-height: 1.8;
    font-weight: 500;
  }

  #rcpt .c {
    text-align: center;
    margin-bottom: 5px;
  }

  #rcpt .c b {
    font-size: 30px;
    font-weight: 900;
  }

  #rcpt .r {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    line-height: 1.8;
  }

  #rcpt .r b {
    font-size: 18px;
    font-weight: 900;
  }

  #rcpt hr {
    border: 0;
    border-top: 1px dashed #000;
    margin: 8px 0;
  }
}

<script>

...s.lines.map(l=>h('div',{},h('div',{},l.name),h('div',{class:'r'},h('span',{},l.qty+' '+l.unit+(l.foc?'':' × '+money(l.price))),h('span',{},l.foc?'FOC':money(amt(l)))))),
h('hr'),h('div',{class:'r'},h('b',{},'စုစုပေါင်း'),h('b',{},money(stotal(s)))),h('div',{},'ငွေပေးချေမှု: '+PAY[payOf(s)]+(s.cust?' ('+s.cust+')':'')),h('hr'),h('div',{class:'c'},rc.foot||'ကျေးဇူးတင်ပါတယ်'));

function viewSale(){

const msg=h('div'),list=h('div'),tot=h('div',{class:'tot'}),save=h('button',{class:'o'},'ရောင်းချမှု သိမ်းမည်'),today=h('div');

const drawToday=()=>{const s0=new Date();s0.setHours(0,0,0,0);const t0=s0.getTime(),ts=sales.filter(s=>s.at>=t0),ok=ts.filter(s=>!s.voided);

app.append(
...live.map(card),
...miss.map(r=>h('div',{class:'msg e'},RL[r]+' မရှိသေးပါ။ အောက်မှာ ဖွင့်ပါ။ မဖွင့်ရသေးရင် ရောင်းချမှုက "အိုးမသတ်မှတ်" အဖြစ် မှတ်ပါမယ်။')),
(loose||old)?h('div',{class:'msg',style:'background:#FFF3E8;color:#9A4308'},'အိုးမခွဲမီ မှတ်တမ်း: ရောင်းပြီး '+r2(loose)+' ပိဿာ၊ ယခင်စနစ်က ထည့်ထားတာ '+r2(old)+' ပိဿာ။ စမ်းသပ်တာဆိုရင် လျစ်လျူရှုနိုင်ပါတယ်။'):'',
msg,
h('div',{class:'card'},h('b',{},'48kg အိုးသစ် ဖွင့်ရန်'),h('label',{},'ဘယ်လိုသုံးမလဲ'),rs,iv,cost,ob),
h('div',{class:'card'},h('b',{},'ကိုယ်စားလှယ်နဲ့ အိုးလဲမှု'),h('div',{},'ဆိုင်မှာ အပြည့် '+fullLeft+' လုံး · အလွတ် (ပြန်မပေးရသေး) '+emptyWait+' လုံး'),h('small',{},'ပထမဆုံး ဆိုင်မှာရှိသမျှ (သုံးနေတာပါ) ရေပြီး "အပြည့် ရရှိ" အဖြစ် ထည့်ပါ'),aq,ac,h('div',{class:'row',style:'margin-top:8px'},rb,tb)),
h('div',{class:'card'},h('b',{},'သတ်မှတ်ချက်'),h('label',{},'ဘူးတစ်လုံးက ထုတ်လို့ရတဲ့ ပိဿာ'),cu,h('label',{},'၁ ပိဿာ = Gas ဗူး (ဗူး)'),cc,h('label',{},'ဘူးအပြည့် စာရင်းပိဿာ'),cn,sb),
h('h2',{},'မှတ်တမ်း'),h('div',{class:'card'},hist.length?hist:h('small',{},'မှတ်တမ်း မရှိသေးပါ။')))}
const STORES=['products','sales','gasEv','pays','stk','meta'];
const saveBlob=(name,blob)=>{const u=URL.createObjectURL(blob),a=h('a',{href:u,download:name});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)};
const pad=n=>String(n).padStart(2,'0'),fstamp=()=>{const d=new Date();return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'-'+pad(d.getHours())+pad(d.getMinutes())};
const esc=v=>{let x=v==null?'':String(v);if(/^[=+\-@]/.test(x)&&isNaN(Number(x)))x="'"+x;return /[",\n\r]/.test(x)?'"'+x.replace(/"/g,'""')+'"':x};
const toCsv=rows=>'\ufeff'+rows.map(r=>r.map(esc).join(',')).join('\r\n');
async function dumpAll(){const o={};for(const n of STORES)o[n]=await all(n);o.meta=o.meta.filter(x=>x.k!=='lastBackup');return{app:'aung-gas-pos',schema:3,exportedAt:new Date().toISOString(),data:o}}
const checkBk=d=>{if(!d||d.app!=='aung-gas-pos'||!d.data||typeof d.data!=='object')return 'ဒါ AUNG POS backup ဖိုင် မဟုတ်ပါ။';if(!(d.schema<=3))return 'ဒီ backup က app ဗားရှင်းအသစ်ကနေ ထုတ်ထားတာ။ app ကို အရင် update လုပ်ပါ။';
for(const n of STORES){const a=d.data[n];if(a===undefined)continue;if(!Array.isArray(a))return n+' အပိုင်း ပျက်နေပါတယ်။';
for(const r of a){if(!r||typeof r!=='object'||typeof(n==='meta'?r.k:r.id)!=='string')return n+' ထဲမှာ ပျက်တဲ့ မှတ်တမ်း ပါနေပါတယ်။';
if(n==='sales'&&(typeof r.at!=='number'||!Array.isArray(r.lines)||!r.lines.every(l=>l&&Number.isFinite(l.qty)&&Number.isFinite(l.price))))return 'ရောင်းချမှု မှတ်တမ်းထဲ ပျက်တာ ပါနေပါတယ်။';
if(n==='pays'&&!Number.isFinite(r.amount))return 'ကြွေးပြန်ပေး မှတ်တမ်းထဲ ပျက်တာ ပါနေပါတယ်။';
if(n==='stk'&&!Number.isFinite(r.qty))return 'လက်ကျန် မှတ်တမ်းထဲ ပျက်တာ ပါနေပါတယ်။'}}return null};
const importAll=(d,fresh)=>new Promise((ok,no)=>{const t=db.transaction(STORES,'readwrite'),st={added:0,same:0,diff:0};if(fresh)t.objectStore('products').clear();
STORES.forEach(n=>{const os=t.objectStore(n);(d.data[n]||[]).forEach(r=>{if(n==='meta'&&(r.k==='lastBackup'||r.k==='seeded'||r.k==='gas2'))return;const g=os.get(n==='meta'?r.k:r.id);g.onsuccess=()=>{if(g.result===undefined){os.add(r);st.added++}else if(JSON.stringify(g.result)===JSON.stringify(r))st.same++;else st.diff++}})});
t.oncomplete=()=>ok(st);t.onabort=()=>no(t.error)});
function viewData(){
const app=$('#app');app.replaceChildren();const msg=h('div');
const st=t=>new Date(t).toLocaleDateString('en-GB')+' '+new Date(t).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
const days=bk?(Date.now()-bk)/864e5:null;
const bkb=h('button',{class:'o',onclick:async()=>{bkb.disabled=true;try{const d=await dumpAll();saveBlob('aung-pos-backup-'+fstamp()+'.json',new Blob([JSON.stringify(d)],{type:'application/json'}));await put('meta',{k:'lastBackup',v:Date.now()});await reload();viewData();note($('#bmsg'),'Backup ဖိုင် ထုတ်ပြီးပါပြီ။ ဖုန်း Downloads ထဲ ရှိမရှိ စစ်ပြီး Google Drive/Telegram စတာတွေကို ပို့သိမ်းပါ။ ဖုန်းထဲမှာပဲ ထားရင် ဖုန်းပျောက်ရင် ပါသွားမယ်။',1)}catch(e){bkb.disabled=false;note(msg,'Backup မထုတ်နိုင်ပါ: '+(e&&e.message||e))}}},'Backup ဖိုင် ထုတ်မည် (JSON)');
const fi=h('input',{type:'file',accept:'.json,application/json'});
fi.onchange=async()=>{const f=fi.files[0];if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(e){fi.value='';return note(msg,'ဖိုင်ကို ဖတ်မရပါ (JSON မဟုတ်ဘူး/ပျက်နေတယ်)။ ဘာမှ မပြောင်းလဲပါဘူး။')}
const er=checkBk(d);if(er){fi.value='';return note(msg,er+' ဘာမှ မပြောင်းလဲပါဘူး။')}
const c=n=>(d.data[n]||[]).length,fresh=!sales.length&&!stk.length&&!pays.length&&!gasEv.length;
const q='Backup ('+(d.exportedAt?st(d.exportedAt):'')+'): ရောင်းချမှု '+c('sales')+'၊ ပစ္စည်း '+c('products')+'၊ လက်ကျန်မှတ်တမ်း '+c('stk')+'၊ ကြွေးပြန်ပေး '+c('pays')+'၊ Gas မှတ်တမ်း '+c('gasEv')+'။\n\n'+(fresh?'ဒီဖုန်းမှာ ရောင်းချမှု မရှိသေးလို့ လက်ရှိ (နမူနာ) ပစ္စည်းစာရင်းကို backup ထဲကဟာနဲ့ အစားထိုးပါမယ်။\n':'ဒီဖုန်းထဲ ဒေတာ ရှိပြီးသားမို့ မရှိတာတွေပဲ ထပ်ထည့်ပါမယ်၊ ရှိပြီးသားကို မထိပါဘူး။\n')+'ဆက်လုပ်မလား?';
if(!confirm(q)){fi.value='';return}
try{const r=await importAll(d,fresh);await reload();fi.value='';viewData();note($('#bmsg'),'Restore ပြီးပါပြီ။ ထပ်ထည့်တာ '+r.added+'၊ ရှိပြီးသားမို့ ကျော်တာ '+r.same+'၊ မတူလို့ လက်ရှိကို ထားခဲ့တာ '+r.diff+'။',1)}catch(e){fi.value='';note(msg,'Restore မအောင်မြင်ပါ: '+(e&&e.message||e)+'။ ဘာမှ မပြောင်းလဲပါဘူး။')}};
const shareB=(()=>{try{const f=new File(['{}'],'x.json',{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]}))return h('button',{class:'o',style:'background:var(--navy)',onclick:async()=>{try{const d=await dumpAll(),nm='aung-pos-backup-'+fstamp()+'.json';await navigator.share({files:[new File([JSON.stringify(d)],nm,{type:'application/json'})],title:nm});await put('meta',{k:'lastBackup',v:Date.now()});await reload();viewData()}catch(e){if(e&&e.name!=='AbortError')note(msg,'မမျှဝေနိုင်ပါ: '+(e.message||e))}}},'Backup ကို Telegram/Drive သို့ ပို့မည်')}catch(e){}return ''})();
const dlCsv=(name,rows)=>saveBlob(name+'-'+fstamp()+'.csv',new Blob([toCsv(rows)],{type:'text/csv;charset=utf-8'}));
const csvSales=()=>{const R=[['ရက်စွဲ','အချိန်','ဘောင်ချာ','ငွေပေးချေမှု','ဖောက်သည်','ပစ္စည်း','ပမာဏ','ယူနစ်','ဈေး','FOC','ငွေ','ပယ်ဖျက်ပြီး']];[...sales].sort((a,b)=>a.at-b.at).forEach(x=>{const d=new Date(x.at);x.lines.forEach(l=>R.push([d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),pad(d.getHours())+':'+pad(d.getMinutes()),x.id.slice(-6).toUpperCase(),PAY[payOf(x)],x.cust||'',l.name,l.qty,l.unit,l.price,l.foc?'FOC':'',amt(l),x.voided?'ပယ်ဖျက်ပြီး':'']))});dlCsv('sales',R)};
const csvProducts=()=>{const R=[['ပစ္စည်း','အမျိုးအစား','ယူနစ်','လက်ကျန် (ရေတွက်ထားမှ)','နမူနာ']];products.forEach(p=>{const s_=p.gas?null:stockOf(p);R.push([p.name,p.cat,p.unit,s_===null?'':Math.round(s_*100)/100,p.sample?'နမူနာ':''])});dlCsv('products-stock',R)};
const csvDebts=()=>{const m={};sales.filter(x=>!x.voided&&payOf(x)==='credit'&&x.cust).forEach(x=>{const k=x.cust.toLowerCase();(m[k]=m[k]||{n:x.cust,c:0,p:0}).c+=stotal(x)});pays.forEach(x=>{const k=x.cust.toLowerCase();(m[k]=m[k]||{n:x.cust,c:0,p:0}).p+=x.amount});dlCsv('debts',[['ဖောက်သည်','ကြွေးယူ','ပြန်ပေး','ကျန်']].concat(Object.values(m).map(c=>[c.n,c.c,c.p,c.c-c.p])))};
const cb=(t,f)=>h('button',{style:'margin:4px 6px 4px 0',onclick:()=>{try{f()}catch(e){note(msg,'CSV မထုတ်နိုင်ပါ: '+(e&&e.message||e))}}},t);
app.append(h('div',{class:'card'},h('b',{},'Backup (ဒေတာ လုံခြုံရေး)'),h('div',{class:'tot',style:'text-align:left;font-size:16px;color:'+(days===null||days>=1?'var(--red)':'var(--ok)')},bk?'နောက်ဆုံး backup ဖိုင်ထုတ်ချိန်: '+st(bk):'Backup တစ်ခါမှ မလုပ်ရသေးပါ'),h('small',{},'ဖိုင်ကို ထုတ်ပေးတာကိုပဲ မှတ်ထားတာ၊ ဖိုင်ကို တကယ် သိမ်းမသိမ်း ကိုယ်တိုင်စစ်ပါ။'),bkb,shareB),
h('div',{id:'bmsg'}),msg,
h('div',{class:'card'},h('b',{},'Restore (backup ဖိုင်ကနေ ပြန်ထည့်)'),h('br'),h('small',{},'ရှိပြီးသားကို ဘယ်တော့မှ မထပ်ရေးပါဘူး။ ရောင်းချမှု ထပ်နေတာ မဖြစ်ပါဘူး။'),fi),
h('div',{class:'card'},h('b',{},'CSV ထုတ်ရန် (Google Sheets/Excel အတွက်)'),h('br'),cb('ရောင်းချမှု',csvSales),cb('ပစ္စည်း/လက်ကျန်',csvProducts),cb('ကြွေးစာရင်း',csvDebts)))}
/* shell */
const show=n=>{tab=n;$('#t1').className=n==1?'on':'';$('#t2').className=n==2?'on':'';$('#t3').className=n==3?'on':'';$('#t4').className=n==4?'on':'';$('#t5').className=n==5?'on':'';n==1?viewSale():n==2?viewProducts():n==3?viewGas():n==4?viewDebt():viewData()};

addEventListener('online',net);addEventListener('offline',net);net();
(async()=>{try{db=await open();await seed();await ensureGas();await reload();show(1);if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();

catch(e){$('#app').append(h('div',{class:'msg e'},'ဖုန်းထဲ သိမ်းဆည်းမှု မဖွင့်နိုင်ပါ: '+(e&&e.message||e)+'။ Private/Incognito မဟုတ်တဲ့ Chrome မှာ ဖွင့်ပါ။'))}})();
