        type: 'date',
        value: targetDk,
        style: 'width:auto',
        onchange: async e => {
          await setMeta('rep_date', e.target.value);
          render();
        }
      });

      const subBar = h('div', { class: 'sub-tabs' },
        h('button', { class: repTab === 1 ? 'on' : '', onclick: () => { repTab = 1; render(); } }, 'ငွေစာရင်းချုပ် (Cash Flow)'),
        h('button', { class: repTab === 5 ? 'on' : '', onclick: () => { repTab = 5; render(); } }, 'စာရင်းပိတ် (Day Close)'),
        h('button', { class: repTab === 6 ? 'on' : '', onclick: () => { repTab = 6; render(); } }, 'အရှုံး/အမြတ် (P&L)')
      );

      let body = h('div', {});
      if (repTab === 1) {
        const fl = flows(targetDk);
        const totOpen = fl.chs.reduce((a, c) => a + fl.open[c], 0);
        const totIn = fl.chs.reduce((a, c) => a + fl.inn[c], 0);
        const totOut = fl.chs.reduce((a, c) => a + fl.out[c], 0);
        const totClose = fl.chs.reduce((a, c) => a + fl.close[c], 0);

        body = h('div', { class: 'card' },
          h('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px' },
            h('b', { style: 'font-size:15.5px' }, 'ငွေစာရင်းချုပ် (Cash Flow)'),
            dateIn
          ),
          h('div', { class: 'tbl-wrap' },
            h('table', { class: 'st-tbl' },
              h('thead', {}, h('tr', {}, h('th', {}, 'Channel'), h('th', {}, 'Opening'), h('th', {}, '+ Inflow'), h('th', {}, '- Outflow'), h('th', {}, 'Expected Close'))),
              h('tbody', {},
                ...fl.chs.map(c => h('tr', {},
                  h('td', {}, h('b', {}, c.toUpperCase())),
                  h('td', {}, Math.round(fl.open[c]).toLocaleString()),
                  h('td', { style: 'color:var(--ok)' }, '+' + Math.round(fl.inn[c]).toLocaleString()),
                  h('td', { style: 'color:var(--red)' }, '-' + Math.round(fl.out[c]).toLocaleString()),
                  h('td', {}, h('b', {}, Math.round(fl.close[c]).toLocaleString()))
                )),
                h('tr', { style: 'background:#F3F4F6;font-weight:700' },
                  h('td', {}, 'စုစုပေါင်း'),
                  h('td', {}, Math.round(totOpen).toLocaleString()),
                  h('td', { style: 'color:var(--ok)' }, '+' + Math.round(totIn).toLocaleString()),
                  h('td', { style: 'color:var(--red)' }, '-' + Math.round(totOut).toLocaleString()),
                  h('td', {}, Math.round(totClose).toLocaleString())
                )
              )
            )
          ),
          h('button', {
            class: 'n',
            style: 'margin-top:10px',
            onclick: async () => {
              const cur = getMeta('cash_open') || {};
              const cVal = prompt('စတင် Opening Cash (MMK):', cur.cash || 0);
              if (cVal == null) return;
              const kVal = prompt('စတင် Opening KPay (MMK):', cur.kpay || 0);
              const wVal = prompt('စတင် Opening Wave (MMK):', cur.wave || 0);
              const aVal = prompt('စတင် Opening AyA (MMK):', cur.aya || 0);
              await setMeta('cash_open', { cash: Number(cVal) || 0, kpay: Number(kVal) || 0, wave: Number(wVal) || 0, aya: Number(aVal) || 0 });
              render();
            }
          }, 'စတင် Opening ငွေလက်ကျန် ပြင်ရန်')
        );
      } else if (repTab === 5) {
        const fl = flows(targetDk);
        const savedClose = getMeta('dayclose_' + targetDk);
        body = h('div', { class: 'card' },
          h('div', { style: 'display:flex;justify-content:space-between;align-items:center;margin-bottom:8px' },
            h('b', { style: 'font-size:15.5px' }, 'နေ့စဉ် စာရင်းပိတ် (Daily Closing)'),
            dateIn
          ),
          savedClose ? h('div', { class: 'msg k' }, '✔ ' + targetDk + ' စာရင်းပိတ်ပြီး (' + sd_(savedClose.at) + ')') : '',
          ...fl.chs.map(c => h('div', { class: 'li' },
            h('span', {}, c.toUpperCase() + ' Expected Close'),
            h('b', {}, money(fl.close[c]))
          )),
          h('button', {
            class: 'o',
            onclick: async () => {
              await setMeta('dayclose_' + targetDk, { at: Date.now(), close: fl.close });
              render();
              uiAlert(targetDk + ' နေ့စဉ် စာရင်းပိတ် မှတ်တမ်းသိမ်းပြီးပါပြီ။');
            }
          }, '✔ ယနေ့ စာရင်းပိတ်မည် (Save Day Close)')
        );
      } else {
        const dPnl = calcPnL(targetDk, false);
        const mPnl = calcPnL(targetDk.slice(0, 7), true);
        const renderPnlCard = (title, p) => h('div', { class: 'card' },
          h('b', { style: 'font-size:15px' }, title),
          p.unidGasWarn ? h('div', { class: 'msg w' }, '⚠ Gas Supplier ဝယ်ဈေးမှတ်တမ်း မပြည့်စုံသေးပါ — ခန့်မှန်း COGS (Estimated) ဖြင့် တွက်ထားပါသည်။') : '',
          p.rentWarn ? h('div', { class: 'msg w' }, '⚠ ' + p.rentWarn) : '',
          h('div', { class: 'li' }, h('span', {}, 'Net Revenue (အရောင်းဝင်ငွေ)'), h('b', {}, money(p.netRevenue))),
          h('div', { class: 'li' }, h('span', {}, '- Gas COGS (Supplier Latest / Buy-Back)'), h('span', {}, '-' + money(p.gasCogs))),
          h('div', { class: 'li' }, h('span', {}, '- Oxygen COGS (4-Type / Mother Cyl)'), h('span', {}, '-' + money(p.o2Cogs))),
          h('div', { class: 'li' }, h('span', {}, '- Product COGS (Commit-Time + FOC)'), h('span', {}, '-' + money(p.prodCogs))),
          h('div', { class: 'li', style: 'border-top:1.5px solid var(--ln)' }, h('b', {}, '= Gross Profit'), h('b', {}, money(p.grossProfit))),
          h('div', { class: 'li' }, h('span', {}, '- Operating Expenses'), h('span', {}, '-' + money(p.opExp))),
          h('div', { class: 'li' }, h('span', {}, '- Supplier Weight Variance Expense'), h('span', {}, '-' + money(p.weightVarianceExp))),
          h('div', { class: 'li' }, h('span', {}, '- Allocated Shop Rent (750k/mo)'), h('span', {}, '-' + money(p.allocatedRent))),
          h('div', { class: 'li', style: 'border-top:2px solid var(--grey-dark)' },
            h('b', {}, '= Net Profit / (Loss)'),
            h('b', { style: 'color:' + (p.netProfit < 0 ? 'var(--red)' : 'var(--ok)') }, money(p.netProfit))
          ),
          h('div', { style: 'margin-top:6px' },
            h('small', {}, 'Supplier Latest Rates: ' + Object.values(p.supPrices).map(s => s.agent + ' ' + Math.round(s.perViss) + '/viss' + (s.effectiveDate ? ' (' + s.effectiveDate + ')' : ' [Est]')).join(' · '))
          )
        );
        body = h('div', {},
          h('div', { style: 'display:flex;justify-content:flex-end;margin-bottom:8px' }, dateIn),
          renderPnlCard('နေ့စဉ် အရှုံး/အမြတ် (Daily P&L — ' + targetDk + ')', dPnl),
          renderPnlCard('လစဉ် အရှုံး/အမြတ် (Monthly P&L — ' + targetDk.slice(0, 7) + ')', mPnl)
        );
      }

      root.replaceChildren(subBar, body);
    }

    // =========================================================================
    // 15. TAB 5: ဒေတာ (BACKUP, RESTORE, MONTH LOCK & GET LATEST VERSION)
    // =========================================================================
    async function runAutoDailyBackupIfNeeded() {
      const todayKey = dkey(Date.now());
      const lastAutoDate = getMeta('last_auto_backup_date');
      if (lastAutoDate === todayKey) return;
      const snaps = getMeta('rolling_snapshots') || [];
      const payload = buildBackupPayload();
      snaps.unshift({ at: Date.now(), date: todayKey, data: payload });
      while (snaps.length > 3) snaps.pop();
      await setMeta('rolling_snapshots', snaps);
      await setMeta('last_auto_backup_date', todayKey);
      await setMeta('last_auto_backup_at', Date.now());
    }

    function buildBackupPayload() {
      return {
        version: 'v24',
        exportedAt: Date.now(),
        products, sales, stk, cf, ob, meta,
        o2cust, o2move, facbill, facsettle, comp,
        locked_months, period_reopen_log
      };
    }

    async function getLatestVersionNow() {
      if (!(await uiConfirm('နောက်ဆုံး Version ကို ရယူရန် App Cache အဟောင်းများကို ရှင်းလင်းပြီး ပြန်ဖွင့်ပါမည် (စာရင်း Data များ လုံးဝ မပျောက်ပါ)။ ဆက်လုပ်မလား?'))) return;
      try {
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const r of regs) await r.unregister();
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          for (const k of keys) await caches.delete(k);
        }
      } catch (e) {}
      location.reload();
    }

    function viewData(root) {
      const snaps = getMeta('rolling_snapshots') || [];
      const fileIn = h('input', { type: 'file', accept: '.json' });
      const lockMonthIn = h('input', { type: 'month', value: mkey(Date.now()) });

      root.replaceChildren(
        h('div', { class: 'card', style: 'border:2px solid var(--org)' },
          h('b', { style: 'font-size:15.5px' }, '🔄 Version & Offline Update'),
          h('div', { style: 'margin:4px 0 8px' }, h('small', {}, 'လက်ရှိ Version: POS v24 (feature/aung-pos-v24) · IndexedDB: ' + DB_NAME)),
          h('button', { class: 'o', style: 'margin-top:0', onclick: getLatestVersionNow }, '🔄 နောက်ဆုံး version ကိုယူရန် (Get Latest Version)')
        ),
        h('div', { class: 'card' },
          h('b', {}, 'Backup & Restore (Data ကာကွယ်ရေး)'),
          h('div', { class: 'msg i' },
            'နောက်ဆုံး Manual Export: ' + (bk ? sd_(bk) : 'မထုတ်ရသေးပါ') + '\n' +
            'Auto Daily Snapshots: ' + snaps.length + ' / 3 သိမ်းဆည်းထားသည်'
          ),
          h('button', {
            class: 'o',
            onclick: async () => {
              const payload = JSON.stringify(buildBackupPayload(), null, 2);
              const blob = new Blob([payload], { type: 'application/json' });
              const a = document.createElement('a');
              a.href = URL.createObjectURL(blob);
              a.download = 'AUNG-Gas-POS-Backup-' + dkey(Date.now()) + '.json';
              a.click();
              bk = Date.now();
              await setMeta('last_manual_backup_at', bk);
              render();
            }
          }, '⬇ Backup ဖိုင်ထုတ်မည် (Download JSON)'),
          h('label', { style: 'margin-top:12px' }, 'Backup ဖိုင်ပြန်သွင်းရန် (Restore JSON)'),
          fileIn,
          h('button', {
            class: 'n',
            style: 'width:100%;margin-top:8px',
            onclick: async () => {
              const f = fileIn.files && fileIn.files[0];
              if (!f) return uiAlert('JSON Backup ဖိုင် ရွေးပါ။');
              if (!(await uiConfirm('Restore မလုပ်မီ လက်ရှိ Data ကို Pre-Restore Snapshot အဖြစ် အလိုအလျောက် သိမ်းဆည်းပါမည်။ ဆက်လုပ်မလား?'))) return;
              await setMeta('pre_restore_snapshot', { at: Date.now(), data: buildBackupPayload() });
              const txt = await f.text();
              const parsed = JSON.parse(txt);
              const stores = ['products', 'sales', 'stk', 'cf', 'ob', 'o2cust', 'o2move', 'facbill', 'facsettle', 'comp'];
              for (const stName of stores) {
                if (Array.isArray(parsed[stName])) {
                  for (const item of parsed[stName]) {
                    if (item && item.id) await putRec(stName, item);
                  }
                }
              }
              await reloadAll();
              render();
              uiAlert('Backup Restore အောင်မြင်ပါပြီ!');
            }
          }, '⬆ Backup ပြန်သွင်းမည် (Restore)')
        ),
        h('div', { class: 'card' },
          h('b', {}, 'Month Hard Lock (လချုပ် စာရင်းပိတ်ခြင်း)'),
          h('div', { class: 'row' },
            lockMonthIn,
            h('button', {
              class: 'n',
              onclick: async () => {
                const mk = lockMonthIn.value;
                if (!mk) return;
                const cur = isMonthLocked(mk);
                const rec = { id: mk, locked: !cur, updatedAt: Date.now() };
                await putRec('locked_months', rec);
                const idx = locked_months.findIndex(x => x.id === mk);
                if (idx >= 0) locked_months[idx] = rec; else locked_months.push(rec);
                render();
                uiAlert(mk + (!cur ? ' လကို စာရင်းပိတ် (Locked) လုပ်ပြီးပါပြီ။' : ' လကို ပြန်ဖွင့် (Reopened) လုပ်ပြီးပါပြီ။'));
              }
            }, 'Lock / Reopen ပြောင်းမည်')
          ),
          h('div', { style: 'margin-top:6px' },
            h('small', {}, 'Locked Months: ' + (locked_months.filter(x => x.locked).map(x => x.id).join(', ') || 'မရှိသေးပါ'))
          )
        )
      );
    }

    // =========================================================================
    // 16. NAVIGATION, BOOT & SERVICE WORKER REGISTRATION
    // =========================================================================
    function show(n) {
      tab = n;
      render();
    }

    function render() {
      for (let i = 1; i <= 8; i++) {
        const b = $('#t' + i);
        if (b) b.classList.toggle('on', tab === i);
      }
      const root = $('#app');
      if (!root) return;
      if (tab === 1) viewSale(root);
      else if (tab === 2) viewProducts(root);
      else if (tab === 3) viewGas(root);
      else if (tab === 4) viewCustomers(root);
      else if (tab === 5) viewData(root);
      else if (tab === 6) viewOxygen(root);
      else if (tab === 7) viewExpenses(root);
      else if (tab === 8) viewReports(root);
    }

    async function reloadAll() {
      [
        products, sales, stk, cf, ob, meta,
        o2cust, o2move, facbill, facsettle, comp,
        locked_months, period_reopen_log, conflict_queue
      ] = await Promise.all(ALL_STORES.map(s => getAllSafe(s)));

      bk = getMeta('last_manual_backup_at');
      const savedCfg = getMeta('v24_cfg');
      if (savedCfg) cfg = { ...cfg, ...savedCfg };
    }

    async function init() {
      const updateNet = () => {
        const el = $('#net');
        if (!el) return;
        const on = navigator.onLine;
        el.textContent = on ? 'အွန်လိုင်း' : 'အော့ဖ်လိုင်း';
        el.classList.toggle('off', !on);
      };
      window.addEventListener('online', updateNet);
      window.addEventListener('offline', updateNet);
      updateNet();

      for (let i = 1; i <= 8; i++) {
        const btn = $('#t' + i);
        if (btn) btn.addEventListener('click', () => show(i));
      }
      const lBtn = $('#langBtn');
      if (lBtn) {
        lBtn.addEventListener('click', () => {
          lang = lang === 'my' ? 'en' : 'my';
          render();
        });
      }

      await openDB();
      await reloadAll();
      await runAutoDailyBackupIfNeeded();
      render();

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      }
    }

    init().catch(err => {
      const app = $('#app');
      if (app) app.innerHTML = '<div class="msg e">Startup Error: ' + String(err && err.message ? err.message : err) + '</div>';
    });
  </script>
</body>
</html>
