<!doctype html>
<html lang="my">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0B192C">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <title>AUNG Gas Solutions POS v24-s13</title>
  <style>
    :root {
      --navy: #0B192C;
      --navy-mid: #16325B;
      --org: #E86A12;
      --org-soft: #FFE9D6;
      --bg: #F4F6F9;
      --card: #FFFFFF;
      --ln: #D5DBE4;
      --red: #B3261E;
      --ok: #1B7F3B;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--navy);
      font-family: "Noto Sans Myanmar", "Myanmar Text", system-ui, -apple-system, sans-serif;
      line-height: 1.7;
      padding-bottom: 82px;
      overflow-x: hidden;
    }
    #splash {
      position: fixed;
      inset: 0;
      background: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
      transition: opacity .35s ease, visibility .35s ease;
    }
    #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    header {
      background: var(--navy);
      color: #fff;
      padding: 10px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 15;
      border-bottom: 3px solid var(--org);
    }
    header b { font-size: 17px; }
    header b span { color: #FF9E58; }
    .hdr-badges { display: flex; align-items: center; gap: 6px; }
    #syncBadge {
      font-size: 11.5px;
      padding: 2px 9px;
      border-radius: 12px;
      background: #16325B;
      color: #DCE7F7;
      font-weight: 700;
      cursor: pointer;
      display: none;
    }
    #syncBadge.show { display: inline-block; }
    #syncBadge.busy { background: var(--org); color: #fff; }
    #syncBadge.ok { background: #1B7F3B; color: #fff; }
    #syncBadge.err { background: var(--red); color: #fff; }
    #net { font-size: 12.5px; padding: 2px 10px; border-radius: 12px; background: var(--ok); font-weight: 700; }
    #net.off { background: var(--org); }
    main { padding: 12px; max-width: 760px; margin: auto; }
    h2 { font-size: 17px; margin: 14px 0 6px; color: var(--navy); }
    .card {
      background: var(--card);
      border: 1px solid var(--ln);
      border-radius: 9px;
      padding: 11px;
      margin-bottom: 10px;
      box-shadow: 0 1px 2px rgba(11, 25, 44, .05);
    }
    label { display: block; font-size: 13.5px; margin-top: 8px; font-weight: 600; color: var(--navy); }
    input, select, textarea {
      width: 100%;
      padding: 9px 10px;
      font: inherit;
      border: 1px solid var(--ln);
      border-radius: 7px;
      background: #fff;
      color: var(--navy);
      margin-top: 3px;
    }
    .row { display: flex; gap: 8px; flex-wrap: wrap; }
    .row > * { flex: 1 1 120px; min-width: 0; }
    button {
      font: inherit;
      border: 0;
      border-radius: 7px;
      padding: 10px 14px;
      background: var(--navy);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
      min-height: 40px;
    }
    button.o { background: var(--org); font-weight: 700; width: 100%; margin-top: 10px; padding: 13px; }
    button.g { background: #fff; color: var(--red); border: 1px solid var(--red); padding: 4px 10px; font-size: 13px; min-height: 34px; }
    button.n { background: #fff; color: var(--navy); border: 1px solid var(--navy); padding: 5px 10px; font-size: 13px; min-height: 35px; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 6px 0;
      border-bottom: 1px solid var(--ln);
    }
    .li:last-child { border: 0; }
    .tag {
      font-size: 11.5px;
      background: var(--org-soft);
      color: #9A4308;
      border-radius: 4px;
      padding: 1px 6px;
      margin-left: 5px;
      font-weight: 700;
      display: inline-block;
    }
    .tag.ok { background: #E3F4E8; color: var(--ok); }
    .tag.red { background: #FDE7E5; color: var(--red); }
    .tag.navy { background: #E8EEF7; color: var(--navy); }
    .tot { font-size: 20px; font-weight: 700; text-align: right; margin-top: 8px; }
    .void { text-decoration: line-through; opacity: .55; }
    .msg { padding: 10px; border-radius: 7px; margin: 8px 0; font-size: 14px; white-space: pre-line; }
    .msg.e { background: #FDE7E5; color: var(--red); }
    .msg.k { background: #E3F4E8; color: var(--ok); }
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: #fff;
      border-top: 2px solid var(--navy);
      overflow-x: auto;
      z-index: 20;
    }
    nav button {
      flex: 0 0 auto;
      min-width: 21vw;
      background: #fff;
      color: var(--navy);
      border-radius: 0;
      padding: 13px 8px;
      font-weight: 700;
      font-size: 12.5px;
      white-space: nowrap;
      min-height: 50px;
    }
    @media (min-width: 820px) { nav button { min-width: auto; flex: 1 1 0; } }
    nav button.on { background: var(--org); color: #fff; }
    small { color: #5A6B82; }
    .tr {
      display: grid;
      grid-template-columns: 1fr 62px 66px 84px;
      gap: 4px;
      padding: 6px 0;
      border-bottom: 1px solid var(--ln);
      font-size: 14px;
      align-items: start;
    }
    .tr.h { font-weight: 700; background: #F4F6F9; }
    .tr span:nth-child(n+2) { text-align: right; }
    .st-tbl { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 6px; }
    .st-tbl th, .st-tbl td { border: 1px solid var(--ln); padding: 5px; text-align: right; }
    .st-tbl th:first-child, .st-tbl td:first-child, .st-tbl th:nth-child(4), .st-tbl td:nth-child(4) { text-align: left; }
    .st-tbl th { background: #F4F6F9; color: var(--navy); }
    .log-tbl { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-top: 8px; }
    .log-tbl th, .log-tbl td { border: 1px solid #9AA8BD; padding: 5px 4px; text-align: center; vertical-align: middle; }
    .log-tbl th { background: #E8EEF7; color: var(--navy); font-weight: 700; }
    .log-tbl tr.sub-h th { background: #F4F6F9; font-size: 11px; }
    .log-tbl td.dt-col { text-align: left; white-space: nowrap; font-weight: 600; }
    .log-tbl td.rem-col { text-align: left; min-width: 115px; }
    .log-tbl td.stk-col { font-weight: 700; background: #FFFDF5; }
    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(11, 25, 44, .68);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 60;
    }
    .modal-box {
      background: #fff;
      border-radius: 10px;
      padding: 16px;
      width: 100%;
      max-width: 470px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .25);
      max-height: 90vh;
      overflow-y: auto;
    }
    #rcpt { display: none; }
    @media print {
      @page { size: 80mm auto; margin: 3mm; }
      body { background: #fff; padding: 0; }
      header, main, nav, #splash, .modal-bg { display: none !important; }
      #rcpt { display: block; width: 72mm; color: #000; line-height: 1.5; }
      #rcpt .c { text-align: center; }
      #rcpt .r { display: flex; justify-content: space-between; gap: 8px; }
      #rcpt .r.b { font-weight: 700; }
      #rcpt .r span:last-child { white-space: nowrap; }
      #rcpt .big { font-size: 1.5em; font-weight: 700; }
      #rcpt .dd { border-top: 2px dashed #000; margin: 8px 0; }
      #rcpt .ss { border-top: 3px solid #000; margin: 8px 0 4px; }
      #rcpt .it { margin: 6px 0; }
      #rcpt .nm { font-weight: 700; }
      #rcpt .tt { font-size: 1.4em; font-weight: 700; }
      #rcpt .ft { margin-top: 4px; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <svg width="260" height="125" viewBox="0 0 320 155" xmlns="http://www.w3.org/2000/svg">
      <text x="160" y="88" text-anchor="middle" font-family="Impact,'Arial Black',system-ui,sans-serif" font-weight="900" font-size="94" letter-spacing="2" fill="#0B1F3A">AUNG</text>
      <text x="160" y="135" text-anchor="middle" font-family="'Arial Narrow','Helvetica Neue',Arial,sans-serif" font-weight="800" font-size="40" letter-spacing="-0.5" fill="#E86A12">Gas Solutions</text>
    </svg>
  </div>

  <header>
    <b>AUNG <span>Gas Solutions</span></b>
    <div class="hdr-badges">
      <span id="syncBadge" onclick="show(5)">Sync</span>
      <span id="net"></span>
    </div>
  </header>

  <main id="app"></main>

  <nav>
    <button id="t1">ရောင်းချမှု</button>
    <button id="t2">ပစ္စည်းများ</button>
    <button id="t3">Gas စာရင်း</button>
    <button id="t6">Oxygen</button>
    <button id="t9">O2 Delivery</button>
    <button id="t4">ဖောက်သည်</button>
    <button id="t7">စရိတ်/ငွေဝင်</button>
    <button id="t8">စာရင်းချုပ်</button>
    <button id="t5">ဒေတာ</button>
  </nav>

  <div id="rcpt"></div>

  <script>
    // Guaranteed splash dismissal so screen never stays white
    const hideSplash = () => {
      const sp = document.getElementById('splash');
      if (sp) sp.classList.add('hide');
    };
    setTimeout(hideSplash, 700);

    // Global error boundary for immediate diagnostics instead of blank screen
    window.addEventListener('error', e => {
      hideSplash();
      const appEl = document.getElementById('app');
      if (appEl && !appEl.innerHTML.trim()) {
        appEl.innerHTML = '<div class="msg e">App Error: ' + String(e && e.message || e) + '</div>';
      }
    });
    window.addEventListener('unhandledrejection', e => {
      hideSplash();
      const appEl = document.getElementById('app');
      if (appEl && !appEl.innerHTML.trim()) {
        appEl.innerHTML = '<div class="msg e">Async Error: ' + String(e && e.reason && e.reason.message || e.reason || e) + '</div>';
      }
    });

    const $ = s => document.querySelector(s);
    const h = (t, a = {}, ...c) => {
      const e = document.createElement(t);
      for (const k in a) {
        if (k === 'class') e.className = a[k];
        else if (k.startsWith('on')) e[k] = a[k];
        else e.setAttribute(k, a[k]);
      }
      c.flat().forEach(x => { if (x !== null && x !== undefined && x !== '') e.append(x); });
      return e;
    };
    const money = n => Math.round(n).toLocaleString('en-US') + ' ကျပ်';
    const uuid = () => (typeof crypto !== 'undefined' && crypto.randomUUID) ? crypto.randomUUID() : 's' + Date.now() + Math.random().toString(36).slice(2);
    const AUTO_EXP_EFFECTIVE_DATE = '2026-11-26';

    const CATS = ['LPG ဓာတ်ငွေ့', 'LPG အိုး/ဗူး', 'အောက်ဆီဂျင်', 'မီးဖို', 'Regulator/Valve', 'ဆက်စပ်ပစ္စည်း'];
    const UNITS = ['ခု', 'ဗူး', 'အိုး', 'kg', 'viss'];
    const SAMPLE = [
      ['LPG ပြန်ဖြည့် (kg/viss)', 'LPG ဓာတ်ငွေ့', 'kg'],
      ['EFF ဗူးသစ်', 'LPG အိုး/ဗူး', 'ဗူး'],
      ['KOREANA ဗူးသစ်', 'LPG အိုး/ဗူး', 'ဗူး'],
      ['5kg (Thailand)', 'LPG အိုး/ဗူး', 'အိုး'],
      ['10kg (Thailand)', 'LPG အိုး/ဗူး', 'အိုး'],
      ['15kg (Thailand)', 'LPG အိုး/ဗူး', 'အိုး'],
      ['10L O2', 'အောက်ဆီဂျင်', 'အိုး'],
      ['15L O2', 'အောက်ဆီဂျင်', 'အိုး'],
      ['20L O2', 'အောက်ဆီဂျင်', 'အိုး'],
      ['40L O2', 'အောက်ဆီဂျင်', 'အိုး'],
      ['40L O2 (စက်ရုံအိုး)', 'အောက်ဆီဂျင်', 'အိုး'],
      ['47L O2 (စက်ရုံအိုး)', 'အောက်ဆီဂျင်', 'အိုး'],
      ['Over 40L / 40L အပိုင် O2', 'အောက်ဆီဂျင်', 'အိုး'],
      ['O2 (သေး)', 'အောက်ဆီဂျင်', 'အိုး'],
      ['O2 (ကြီး)', 'အောက်ဆီဂျင်', 'အိုး'],
      ['Rinnai RI-522A', 'မီးဖို', 'ခု'],
      ['Rinnai RV-151', 'မီးဖို', 'ခု'],
      ['SAGA SG-GS652', 'မီးဖို', 'ခု'],
      ['LuckyFlame (L-336S)', 'မီးဖို', 'ခု'],
      ['Namilux (PS)', 'မီးဖို', 'ခု'],
      ['YAMATO L.P.G Regulator', 'Regulator/Valve', 'ခု'],
      ['YAMATO O2 Regulator', 'Regulator/Valve', 'ခု'],
      ['Argon Regulator', 'Regulator/Valve', 'ခု'],
      ['Twin Valve (L.P.G)', 'Regulator/Valve', 'ခု'],
      ['4kg Valve', 'Regulator/Valve', 'ခု'],
      ['KB-5 Valve', 'Regulator/Valve', 'ခု'],
      ['Flowmeter (Male)', 'Regulator/Valve', 'ခု'],
      ['Refill Gun', 'ဆက်စပ်ပစ္စည်း', 'ခု'],
      ['Kovea Gun', 'ဆက်စပ်ပစ္စည်း', 'ခု'],
      ['Cutting Torch', 'ဆက်စပ်ပစ္စည်း', 'ခု'],
      ['Welding Nozzle (No.1)', 'ဆက်စပ်ပစ္စည်း', 'ခု'],
      ['O2 Headnut', 'ဆက်စပ်ပစ္စည်း', 'ခု'],
      ['L.P.G Headnut', 'ဆက်စပ်ပစ္စည်း', 'ခု'],
      ['Portable Magnet', 'ဆက်စပ်ပစ္စည်း', 'ခု']
    ];
    const AGENTS = {
      'TT Gas': { kg: 48, viss: 28.5 },
      'NGN': { kg: 48, viss: 28.5 },
      'Easy Gas': { kg: 50, viss: 30 }
    };
    const O2_TYPES = {
      '40L': { label: '40L (စက်ရုံအိုး)', rate: 19500 },
      '47L': { label: '47L (စက်ရုံအိုး)', rate: 23500 },
      'over40': { label: 'Over 40L / 40L အပိုင်', rate: 25000 }
    };

    // =========================================================================
    // 1. VERSION-SAFE INDEXEDDB OPENER (WITH IN-MEMORY SANDBOX FALLBACK)
    // =========================================================================
    const REQUIRED_STORES = ['products', 'sales', 'meta', 'gasEv', 'pays', 'stk', 'cf'];
    const LOCAL_ONLY_META = new Set(['lastBackup', 'seeded', 'gas2', 'rollingSnapshots', 'preRestoreSnap', 'syncUrl', 'lastSyncAt', 'autoSync']);
    let db = null;
    let useMemDb = false;
    const memStore = {};
    REQUIRED_STORES.forEach(n => { memStore[n] = new Map(); });

    const open = () => new Promise(ok => {
      try {
        if (!window.indexedDB) {
          useMemDb = true;
          return ok(null);
        }
        const probe = indexedDB.open('aung-gas-pos');
        probe.onerror = () => { useMemDb = true; ok(null); };
        probe.onblocked = () => { useMemDb = true; ok(null); };
        probe.onupgradeneeded = () => {
          const d = probe.result;
          REQUIRED_STORES.forEach(n => {
            if (!d.objectStoreNames.contains(n)) {
              d.createObjectStore(n, { keyPath: n === 'meta' ? 'k' : 'id' });
            }
          });
        };
        probe.onsuccess = () => {
          const d = probe.result;
          const missing = REQUIRED_STORES.filter(n => !d.objectStoreNames.contains(n));
          if (missing.length === 0) {
            ok(d);
            return;
          }
          const nextVer = (d.version || 4) + 1;
          d.close();
          const upg = indexedDB.open('aung-gas-pos', nextVer);
          upg.onupgradeneeded = () => {
            const ud = upg.result;
            REQUIRED_STORES.forEach(n => {
              if (!ud.objectStoreNames.contains(n)) {
                ud.createObjectStore(n, { keyPath: n === 'meta' ? 'k' : 'id' });
              }
            });
          };
          upg.onsuccess = () => ok(upg.result);
          upg.onerror = () => { useMemDb = true; ok(null); };
        };
      } catch (e) {
        useMemDb = true;
        ok(null);
      }
    });

    let syncTimer = null;
    let syncInProgress = false;
    let syncUrl = '';
    let lastSyncAt = null;
    let autoSyncEnabled = true;

    const getSyncUrl = () => {
      if (syncUrl) return syncUrl;
      try { return localStorage.getItem('aung_sync_url') || ''; } catch (e) { return ''; }
    };

    const updateSyncBadge = (state, text) => {
      const el = $('#syncBadge');
      if (!el) return;
      if (!getSyncUrl()) {
        el.className = '';
        return;
      }
      el.className = 'show' + (state ? ' ' + state : '');
      el.textContent = text || 'Sync';
    };

    const scheduleAutoSync = () => {
      if (!autoSyncEnabled || !getSyncUrl() || !navigator.onLine) return;
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => {
        runCloudSync({ silent: true, pushOnly: false });
      }, 2200);
    };

    // Unified DB helpers supporting both IndexedDB and Sandbox In-Memory fallback
    const makeMemOs = n => ({
      add: o => { const k = n === 'meta' ? o.k : o.id; if (memStore[n].has(k)) throw Object.assign(new Error('Exists'), { name: 'ConstraintError' }); memStore[n].set(k, JSON.parse(JSON.stringify(o))); },
      put: o => { const k = n === 'meta' ? o.k : o.id; memStore[n].set(k, JSON.parse(JSON.stringify(o))); },
      delete: k => { memStore[n].delete(k); },
      clear: () => { memStore[n].clear(); },
      get: k => { const r = { result: memStore[n].get(k), onsuccess: null }; setTimeout(() => { if (r.onsuccess) r.onsuccess(); }, 0); return r; }
    });

    const run = (st, mode, fn) => new Promise((ok, no) => {
      if (useMemDb || !db) {
        try {
          const fakeTx = { objectStore: n => makeMemOs(n) };
          const out = fn(fakeTx);
          if (mode === 'readwrite') scheduleAutoSync();
          ok(out);
        } catch (err) { no(err); }
        return;
      }
      const t = db.transaction(st, mode);
      let out;
      t.oncomplete = () => {
        if (mode === 'readwrite') scheduleAutoSync();
        ok(out);
      };
      t.onabort = () => no(t.error);
      t.onerror = () => {};
      out = fn(t);
    });

    const all = s => new Promise((ok, no) => {
      if (useMemDb || !db) {
        return ok(Array.from(memStore[s].values()).map(x => JSON.parse(JSON.stringify(x))));
      }
      const q = db.transaction(s).objectStore(s).getAll();
      q.onsuccess = () => ok(q.result);
      q.onerror = () => no(q.error);
    });

    const add = (s, o) => run(s, 'readwrite', t => t.objectStore(s).add(o));
    const put = (s, o) => run(s, 'readwrite', t => t.objectStore(s).put(o));
    const del = (s, k) => run(s, 'readwrite', t => t.objectStore(s).delete(k));

    async function seed() {
      const mm = await all('meta');
      if (mm.find(x => x.k === 'seeded')) return;
      await run(['products', 'meta'], 'readwrite', t => {
        SAMPLE.forEach(([n, c, u]) => t.objectStore('products').add({
          id: uuid(), name: n, cat: c, unit: u, sample: true, at: Date.now()
        }));
        t.objectStore('meta').put({ k: 'seeded', v: Date.now() });
      });
    }

    let cf = [], bk = null, stk = [], rc = { head: '', foot: '' }, pays = [], gasEv = [];
    let cfg = {
      usable: 28.5, cans: 7, nominal: 29.3, low: 2, lowO2: 20, canMin: 197, canMax: 203,
      o2Rates: { '40L': 19500, '47L': 23500, 'over40': 25000, '40L_own': 19500 },
      motherCap: 55, motherConfirmed: false, rent2026: 750000, rent2027: null
    };
    let products = [], sales = [], lines = [], saleId = uuid(), saving = false, tab = 1;
    let lockedMonths = [], reopenLog = [], rollingSnapshots = [];

    const reload = async () => {
      products = (await all('products')).sort((a, b) => a.name.localeCompare(b.name));
      sales = (await all('sales')).sort((a, b) => b.at - a.at);
      gasEv = (await all('gasEv')).sort((a, b) => b.at - a.at);
      pays = (await all('pays')).sort((a, b) => b.at - a.at);
      stk = await all('stk');
      cf = await all('cf');
      const mm = await all('meta');
      const m = mm.find(x => x.k === 'gascfg');
      const r = mm.find(x => x.k === 'rcpt');
      if (m) cfg = { ...cfg, ...m.v, o2Rates: { ...cfg.o2Rates, ...(m.v.o2Rates || {}) } };
      if (r) rc = r.v;
      bk = (mm.find(x => x.k === 'lastBackup') || {}).v || null;
      lockedMonths = (mm.find(x => x.k === 'lockedMonths') || {}).v || [];
      reopenLog = (mm.find(x => x.k === 'reopenLog') || {}).v || [];

    const recTimestamp = (store, r) => {
      if (!r || typeof r !== 'object') return 0;
      if (store === 'meta') return Number(r.at || 0);
      return Number(r.voidedAt || r.repaidAt || r.paidAt || r.closedAt || r.at || 0);
    };

    async function buildSyncPayload() {
      const payload = {};
      for (const n of REQUIRED_STORES) {
        const rows = await all(n);
        if (n === 'meta') {
          payload[n] = rows.filter(x => x && !LOCAL_ONLY_META.has(x.k));
        } else {
          payload[n] = rows;
        }
      }
      return payload;
    }

    const mergeRemoteStoreData = remoteData => new Promise((ok, no) => {
      if (useMemDb || !db) {
        const stats = { added: 0, updated: 0 };
        REQUIRED_STORES.forEach(n => {
          const list = Array.isArray(remoteData[n]) ? remoteData[n] : [];
          list.forEach(r => {
            if (!r || typeof r !== 'object') return;
            const key = n === 'meta' ? r.k : r.id;
            if (!key || (n === 'meta' && LOCAL_ONLY_META.has(key))) return;
            const loc = memStore[n].get(key);
            if (loc === undefined) { memStore[n].set(key, r); stats.added++; }
            else if (recTimestamp(n, r) > recTimestamp(n, loc) && JSON.stringify(loc) !== JSON.stringify(r)) {
              memStore[n].set(key, r); stats.updated++;
            }
          });
        });
        return ok(stats);
      }
      const t = db.transaction(REQUIRED_STORES, 'readwrite');
      const stats = { added: 0, updated: 0 };
      REQUIRED_STORES.forEach(n => {
        const os = t.objectStore(n);
        const list = Array.isArray(remoteData[n]) ? remoteData[n] : [];
        list.forEach(r => {
          if (!r || typeof r !== 'object') return;
          const key = n === 'meta' ? r.k : r.id;
          if (!key) return;
          if (n === 'meta' && LOCAL_ONLY_META.has(key)) return;
          const req = os.get(key);
          req.onsuccess = () => {
            const loc = req.result;
            if (loc === undefined) {
              os.add(r);
              stats.added++;
            } else {
              const remTs = recTimestamp(n, r);
              const locTs = recTimestamp(n, loc);
              if (remTs > locTs && JSON.stringify(loc) !== JSON.stringify(r)) {
                os.put(r);
                stats.updated++;
              }
            }
          };
        });
      });
      t.oncomplete = () => ok(stats);
      t.onabort = () => no(t.error);
    });

    async function runCloudSync({ silent = false, pushOnly = false } = {}) {
      const url = getSyncUrl().trim();
      if (!url) return { ok: false, error: 'Sync URL မထည့်ရသေးပါ။' };
      if (!navigator.onLine) {
        updateSyncBadge('err', 'Sync Off');
        return { ok: false, error: 'အင်တာနက် မရှိပါ။' };
      }
      if (syncInProgress) return { ok: false, error: 'Sync လုပ်နေဆဲ ဖြစ်ပါသည်။' };

      syncInProgress = true;
      updateSyncBadge('busy', 'Syncing...');
      try {
        let pulled = { added: 0, updated: 0 };
        if (!pushOnly) {
          const getRes = await fetch(url, {
            method: 'GET',
            mode: 'cors',
            cache: 'no-store',
            redirect: 'follow'
          });
          if (!getRes.ok) throw new Error('GET HTTP ' + getRes.status);
          const rawGetText = await getRes.text();
          let getJson;
          try {
            getJson = JSON.parse(rawGetText);
          } catch (e) {
            throw new Error('Apps Script GET မှ JSON အဖြေ မဟုတ်ပါ (Deploy > New deployment > Anyone စစ်ပါ)');
          }
          if (!getJson || !getJson.ok) throw new Error((getJson && getJson.error) || 'Invalid server response');
          pulled = await mergeRemoteStoreData(getJson.data || {});
        }

        const localPayload = await buildSyncPayload();
        // Content-Type: text/plain;charset=utf-8 avoids browser CORS preflight OPTIONS request
        const postRes = await fetch(url, {
          method: 'POST',
          mode: 'cors',
          cache: 'no-store',
          redirect: 'follow',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ data: localPayload })
        });
        if (!postRes.ok) throw new Error('POST HTTP ' + postRes.status);
        const rawPostText = await postRes.text();
        let postJson;
        try {
          postJson = JSON.parse(rawPostText);
        } catch (e) {
          throw new Error('Apps Script POST မှ JSON အဖြေ မဟုတ်ပါ (doPost(e) နှင့် New deployment စစ်ပါ)');
        }
        if (!postJson || !postJson.ok) throw new Error((postJson && postJson.error) || 'POST failed');

        const now = Date.now();
        await put('meta', { k: 'lastSyncAt', v: now });
        lastSyncAt = now;

        await reload();
        updateSyncBadge('ok', 'Sync ✓');
        syncInProgress = false;
        if (pulled.added > 0 || pulled.updated > 0) {
          if (typeof VIEWS === 'object' && VIEWS[tab]) VIEWS[tab]();
        }
        return { ok: true, pulled, upserted: postJson.upserted || 0 };
      } catch (err) {
        syncInProgress = false;
        updateSyncBadge('err', 'Sync !');
        const rawErr = String(err && err.message || err);
        const friendlyErr = /failed to fetch|networkerror/i.test(rawErr)
          ? 'Failed to fetch — Google Apps Script တွင် (၁) Deploy > New deployment > Web app ဖြင့် ထုတ်ထားခြင်း ရှိ/မရှိ၊ (၂) Who has access ကို "Anyone" ရွေးထားခြင်း ရှိ/မရှိ၊ (၃) URL အဆုံးသည် /exec ဖြစ်ခြင်း ရှိ/မရှိ စစ်ဆေးပါ။'
          : rawErr;
        return { ok: false, error: friendlyErr };
      }
    }

        .sort((a, b) => a.at - b.at);

          if (use > 0) {
            al.push({ cyl: c.id, viss: use });
            pend[c.id] = (pend[c.id] || 0) + use;
            need -= use;
          }
          const now = Date.now() + g;
          ov.closed[c.id] = true;
          const gain = r < 0 ? Math.abs(r) : 0;
          ov.ops.push({ k: 'put', st: 'stk', obj: { ...c, closed: true, closedAt: now, leftover: 0, gain: Math.round(gain * 1000) / 1000 } });
          if (!nx) {
            const nc = { id: uuid(), at: now, type: 'ocyl', qty: 0, cap: 1, closed: false, adj: 0, log: [] };
            ov.ops.push({ k: 'add', st: 'stk', obj: nc });
            ov.added.push({ kind: 'o2', c: nc });
          }
        }
      }
      if (need > 1e-9) al.push({ cyl: null, viss: need });
      return al;
    }

    async function askSwap(c, kind, onDone) {
      const gas = kind === 'gas', rem = gas ? gasRemOf(c) : o2RemOf(c), R = x => Math.round(x * 100) / 100, lab = gas ? GL[c.role] : 'Oxygen အိုးကြီး';
      const cansUsed = gas ? Math.round((c.cap + (c.adj || 0) - rem) * cfg.cans) : 0;
      let warn = '';
      if (gas && c.role === 'can' && (cansUsed < cfg.canMin || cansUsed > cfg.canMax)) {
        warn = ' (သတိ: ထွက်ရှိ ' + cansUsed + ' ဗူး — သတ်မှတ်ချက် ' + cfg.canMin + '~' + cfg.canMax + ' ဗူး ပြင်ပ)';
      }
      const hasLeftover = rem > 0.05;
      const subTxt = (!hasLeftover ? 'လက်ရှိအိုး ကုန်သွားပါပြီ → အခွံစာရင်းထဲ ဝင်ပါမယ်။' : 'လက်ရှိအိုး ကျန် ' + R(rem) + (gas ? ' viss' : ' %') + ' ရှိသေးလို့ လက်ကျန်အိုး (လ/က) စာရင်းထဲ ဆက်ရှိနေပါမယ်။') + warn;

      if (!gas) {
        if (!(await uiConfirm(lab + ' အိုးသစ်လဲမလား?'))) return;
        const now = Date.now();
        await run('stk', 'readwrite', t => {
          const o = t.objectStore('stk');
          o.put({ ...c, closed: true, closedAt: now, leftover: Math.max(rem, 0) });
          o.add({ id: uuid(), at: now, type: 'ocyl', qty: 0, cap: 1, closed: false, adj: 0, log: [] });
        });
        await reload();
        if (onDone) onDone();
        return;
      }

      const pick = await pickAgentModal(lab + ' အိုးလဲရန်', subTxt, false);
      if (pick.action !== 'swap') return;
      try {
        const now = Date.now(), pickedAg = pick.agent;
        const newCap = AGENTS[pickedAg] ? AGENTS[pickedAg].viss : cfg.usable;
        const gain = rem < 0 ? Math.round(Math.abs(rem) * 1000) / 1000 : 0;
        await run('gasEv', 'readwrite', t => {
          const o = t.objectStore('gasEv');
          if (hasLeftover) {
            o.put({ ...c, at: now + 5, log: [...(c.log || []), { at: now, t: 'swapped out with ' + R(rem) + ' viss remaining' }] });
          } else {
            o.put({ ...c, closed: true, closedAt: now, leftover: 0, gain, cansOut: cansUsed });
          }
          o.add({ id: uuid(), at: now, type: 'cyl', role: c.role, agent: pickedAg, cap: newCap, cost: null, closed: false, adj: 0, gain: 0, log: [] });
        });
        await reload();
        if (onDone) onDone();
      } catch (e) { await uiAlert('မအောင်မြင်ပါ: ' + (e && e.message || e)); }
    }

        if (l) { const rem = gasRemOf(l); if (rem <= cfg.low) L.push({ c: l, kind: 'gas', rem }); }
      });
      const o = stk.filter(e => e.type === 'ocyl' && !e.closed).sort((a, b) => a.at - b.at)[0];
      if (o) { const rem = o2RemOf(o); if (rem * 100 <= cfg.lowO2) L.push({ c: o, kind: 'o2', rem }); }

    async function lowCheck(asg) {
      const u = {};
      asg.forEach(l => {
        (l.alloc || []).forEach(a => { if (a.cyl) (u['g' + a.cyl] = u['g' + a.cyl] || { k: 'gas', id: a.cyl, u: 0 }).u += a.viss; });
        (l.o2alloc || []).forEach(a => { if (a.cyl) (u['o' + a.cyl] = u['o' + a.cyl] || { k: 'o2', id: a.cyl, u: 0 }).u += a.viss; });
      });
      for (const x of Object.values(u)) {
        const c = x.k === 'gas' ? gasEv.find(e => e.id === x.id) : stk.find(e => e.id === x.id);
        if (!c || c.closed) continue;
        const rem = x.k === 'gas' ? gasRemOf(c) : o2RemOf(c), b = rem + x.u;
        const low = x.k === 'gas' ? (rem <= cfg.low && b > cfg.low) : (rem * 100 <= cfg.lowO2 && b * 100 > cfg.lowO2);
        if (low) { await askSwap(c, x.k, () => viewSale()); break; }
      }
    }

      const pr = h('input', { type: 'number', inputmode: 'numeric', min: '0', placeholder: 'ဈေး (တစ်ယူနစ်)' });
      const foc = h('input', { type: 'checkbox', style: 'width:auto;margin-right:8px' });

      pn.onchange = () => {
        const p = products.find(x => x.name === pn.value);
        if (p) {
          un.value = p.unit;
          if (p.sellPrice > 0 && !pr.value) pr.value = p.sellPrice;
        }
      };

      const pay = h('select', {}, Object.entries(PAY).map(([k, v]) => h('option', { value: k }, v)).concat([h('option', { value: 'split' }, 'ခွဲရှင်း (၂ မျိုး)')]));
      const cust = h('input', { list: 'cl', placeholder: 'Customer Name (ကြွေးဆိုရင် လိုအပ်)', autocomplete: 'off', style: 'margin-top:8px' });
      const tagIn = h('input', { placeholder: 'ဗူး/အိုး အမှတ်အသား (ဥပမာ အနီ ၂ ဗူး၊ ကောင်တာဘေး)', autocomplete: 'off', style: 'margin-top:8px;display:none' });
      const mk = () => h('select', {}, ['cash', 'kpay', 'wave', 'aya', 'credit'].map(k => h('option', { value: k }, PAY[k])));
      const sA = mk(), sB = mk();
      sA.value = 'kpay'; sB.value = 'cash';
      const aA = h('input', { type: 'number', inputmode: 'numeric', min: '0', placeholder: 'ပထမနည်းလမ်း ပေးတဲ့ပမာဏ' });
      const bInfo = h('div', { style: 'margin:6px 0;font-weight:700' });
      const split = h('div', { style: 'display:none' }, h('label', {}, 'ပထမနည်းလမ်း + ပမာဏ'), h('div', { class: 'row' }, sA, aA), h('label', {}, 'ကျန်ငွေ ပေးမယ့်နည်းလမ်း'), sB, bInfo);
      const pHint = h('small', { style: 'display:none;color:#9A4308' }, '');

      const sync = () => {
        if (pay.value === 'pending') {
          pHint.style.display = 'block';
          pHint.textContent = 'Delivery ပို့ပြီး ငွေရတဲ့အခါ "ငွေရပြီ" နှိပ်ပါ။';
          tagIn.style.display = 'none';
          cust.style.display = 'block';
        } else if (pay.value === 'dropoff') {
          pHint.style.display = 'block';
          pHint.textContent = 'ဖောက်သည်စာရင်း (ကြွေး) နှင့် ငွေစာရင်းထဲ မဝင်စေဘဲ အမှတ်အသားနဲ့ သီးသန့်မှတ်ပါမယ်။ လာယူငွေရှင်းမှ အဲဒီနေ့ ရောင်းချမှုထဲ ဝင်ပါမယ်။';
          tagIn.style.display = 'block';
          cust.style.display = 'none';
        } else {
          pHint.style.display = 'none';
          tagIn.style.display = 'none';
          cust.style.display = 'block';
        }
        const sp = pay.value === 'split', tt = lines.reduce((x, l) => x + amt(l), 0), a = parseFloat(aA.value) || 0;
        split.style.display = sp ? 'block' : 'none';
        bInfo.textContent = 'ကျန်ငွေ: ' + money(Math.max(tt - a, 0)) + (a > tt ? ' (ပမာဏ များနေပါတယ်)' : '');
      };
      pay.onchange = sync; sA.onchange = sync; sB.onchange = sync; aA.oninput = sync;

      const prt = h('input', { type: 'checkbox', style: 'width:auto;margin-right:8px' });
      try { prt.checked = localStorage.getItem('prt') === '1'; } catch (e) {}
      prt.onchange = () => { try { localStorage.setItem('prt', prt.checked ? '1' : '0'); } catch (e) {} };

      const dIn = h('input', { type: 'date', max: dkey(Date.now()) });
      const hCb = h('input', { type: 'checkbox', checked: '', style: 'width:auto;margin-right:8px' });
      const hBox = h('label', { style: 'display:none;align-items:center' }, hCb, 'အရင်ရက်စာ — 48kg/အိုးကြီးထဲက မနှုတ်ပါနဲ့');
      const dWarn = h('div', { class: 'msg', style: 'display:none;background:#FFF3E8;color:#9A4308' });
      const dSync = () => {
        const p = isPast(dIn.value);
        hBox.style.display = p ? 'flex' : 'none';
        dWarn.style.display = p ? 'block' : 'none';
        dWarn.textContent = '⚠ အရင်ရက် (' + dIn.value + ') အဖြစ် မှတ်နေတာပါ။ ယနေ့အတွက်ဆိုရင် ရက်စွဲကို ဖျက်ပါ။';
      };
      dIn.onchange = dSync; dIn.oninput = dSync;

      const msg = h('div'), list = h('div'), tot = h('div', { class: 'tot' });
      const save = h('button', { class: 'o' }, 'ရောင်းချမှု သိမ်းမည်');
      const today = h('div');

      const draw = () => {
        list.replaceChildren(...lines.map((l, i) => h('div', { class: 'li' },
          h('span', {}, l.name + ' × ' + l.qty + ' ' + l.unit + (l.foc ? '' : ' @ ' + money(l.price)), l.foc ? h('span', { class: 'tag' }, 'FOC') : '', l.gasViss ? ' (Gas ' + (Math.round(l.gasViss * 100) / 100) + ' ပိဿာ)' : ''),
          h('span', {}, (l.foc ? '0 ကျပ်' : money(amt(l))) + ' ', h('button', { class: 'g', onclick: () => { lines.splice(i, 1); draw(); } }, 'ဖယ်'))
        )));
        tot.textContent = 'စုစုပေါင်း ' + money(lines.reduce((s, l) => s + amt(l), 0));
        save.disabled = !lines.length;
        sync();
      };

      const addLine = async () => {
        const p = products.find(x => x.name === pn.value.trim()), q = parseFloat(qty.value), pc = parseFloat(pr.value), f = foc.checked;
        if (!p) return note(msg, 'ပစ္စည်းစာရင်းထဲက ပစ္စည်းကို ရွေးပါ။ မရှိရင် "ပစ္စည်းများ" မှာ အရင်ထည့်ပါ။');
        if (!(q > 0)) return note(msg, 'ပမာဏကို 0 ထက်ကြီးအောင် ထည့်ပါ။');
        if (!f && (isNaN(pc) || pc < 0)) return note(msg, 'ဈေးနှုန်းကို မှန်ကန်အောင် ထည့်ပါ (0 သို့မဟုတ် အထက်)။');
        const g = gv(p, q, un.value);
        if (g === null) return note(msg, 'Gas ကို "Gas (ပိဿာ)" မှာ ပိဿာနဲ့၊ "Gas ဗူးဖြည့်" မှာ ဗူးနဲ့ပဲ ထည့်ပါ။');
        if (!p.gas) {
          const st = stockOf(p);
          if (st !== null) {
            const inCart = lines.filter(l => l.pid === p.id).reduce((a, l) => a + l.qty, 0);
            if (q + inCart > st && !(await uiConfirm('"' + p.name + '" လက်ကျန် ' + Math.round(st * 100) / 100 + ' ' + p.unit + ' ပဲ ရှိတယ်။ ဆက်ထည့်မလား?'))) return;
          }
        }
        const buyPriceAtSale = (!p.gas && p.o2 !== 'refill') ? (Number(p.buyPrice) || 0) : 0;
        lines.push({
          pid: p.id, name: p.name, qty: q, unit: un.value, price: isNaN(pc) ? 0 : pc, foc: f || pc === 0,
          gasViss: g, gasRole: p.gas || null, o2use: (p.o2 === 'refill' && p.use > 0) ? q * p.use : 0,
          buyPriceAtSale
        });
        msg.replaceChildren();
        pn.value = qty.value = pr.value = '';
        foc.checked = false;
        draw();
      };

      save.onclick = async () => {
        if (saving || !lines.length) return;
        const total = lines.reduce((s, l) => s + amt(l), 0), pm = pay.value;
        let c = pm === 'dropoff' ? '' : cust.value.trim(), tg = pm === 'dropoff' ? tagIn.value.trim() : '', newCust = false;
        let parts;
        if (pm === 'split') {
          const a = parseFloat(aA.value);
          if (!(total > 0)) return note(msg, 'FOC သက်သက်ဆိုရင် ခွဲရှင်းမရွေးပါနဲ့။');
          if (!(a > 0 && a < total)) return note(msg, 'ပထမနည်းလမ်း ပမာဏက 0 ထက်ကြီးပြီး စုစုပေါင်းထက် ငယ်ရမယ်။');
          if (sA.value === sB.value) return note(msg, 'နည်းလမ်း နှစ်ခု မတူရပါ။');
          parts = [{ m: sA.value, a: a }, { m: sB.value, a: total - a }];
        } else parts = [{ m: pm, a: total }];
        const hasCr = parts.some(x => x.m === 'credit');
        if (hasCr) {
          if (!c) return note(msg, 'ကြွေးအတွက် Customer Name ထည့်ပါ။');
          if (!(total > 0)) return note(msg, 'FOC သက်သက်ဆိုရင် ကြွေးမရွေးပါနဲ့။');
        }
        if (c) {
          const ex = customers().find(x => x.key === ck(c));
          if (ex) c = ex.name;
          else {
            if (!(await uiConfirm('"' + c + '" က ဖောက်သည်စာရင်းမှာ မရှိသေးပါ။ ဖောက်သည်အသစ်အဖြစ် ထည့်မလား?\n(နာမည်မှားနေရင် မလုပ်ပါ နှိပ်ပြီး ပြင်ပါ)'))) return;
            newCust = true;
          }
        }
        const at = stampAt(dIn.value);
        if (!(await guardMonthLock(at, msg))) return;
        saving = true;
        save.disabled = true;
        let pa = null, done = null;
        const hist = isPast(dIn.value) && hCb.checked;
        try {
          const pend = { g: {}, o: {} }, ov = { closed: {}, added: [], ops: [] }, asg = [];
          for (const l0 of lines) {
            const l = { ...l0 };
            if (!hist) {
              if (l.gasViss) l.alloc = await allocLine('gas', l, pend.g, ov);
              if (l.o2use) l.o2alloc = await allocLine('o2', l, pend.o, ov);
            }
            l.cylId = l.alloc && l.alloc[0] ? l.alloc[0].cyl : null;
            l.o2cyl = l.o2alloc && l.o2alloc[0] ? l.o2alloc[0].cyl : null;
            asg.push(l);
          }
          const sale = { id: saleId, at, hist, pay: parts.length > 1 ? 'split' : parts[0].m, parts, cust: c || null, tag: tg || null, lines: asg, total };
          await run(['sales', 'gasEv', 'stk'], 'readwrite', t => {
            t.objectStore('sales').add(sale);
            ov.ops.forEach(o => t.objectStore(o.st)[o.k](o.obj));
          });
          done = asg;
          if (newCust) await add('cf', { id: uuid(), at: Date.now(), type: 'cust', name: c, phone: '' });
          if (prt.checked && !isPast(dIn.value)) pa = sale;
          const nm = !hist && asg.some(l => (l.alloc || []).some(x => !x.cyl) || (l.o2alloc || []).some(x => !x.cyl));
          lines = [];
          saleId = uuid();
          pay.value = 'cash';
          cust.value = '';
          tagIn.value = '';
          aA.value = '';
          sync();
          await reload();
          note(msg, (isPast(dIn.value) ? '[' + dIn.value + '] ရက်စွဲနဲ့ ' : '') + 'သိမ်းပြီးပါပြီ။ ဖုန်းထဲမှာ သိမ်းထားပါတယ်။' + (nm ? ' (သတိ: အိုးကြီး မဖွင့်ရသေးလို့ "Gas စာရင်း" / "Oxygen" tab မှာ အိုးဖွင့်ပါ)' : ''), 1);
        } catch (e) {
          if (e && e.message === 'CANCELLED') note(msg, 'ရောင်းချမှု မသိမ်းရသေးပါ (ပယ်ဖျက်လိုက်ပါသည်)။');
          else if (e && e.name === 'ConstraintError') {
            lines = [];
            saleId = uuid();
            note(msg, 'ဒီရောင်းချမှုကို သိမ်းပြီးသားပါ၊ ထပ်မသိမ်းပါဘူး။', 1);
          } else note(msg, 'မသိမ်းနိုင်ပါ: ' + (e && e.message || e) + '။ ထပ်ကြိုးစားပါ။');
        }
        saving = false;
        draw();
        drawToday();
        if (pa) printSale(pa);
        if (done && !hist) await lowCheck(done);
      };

      const drawToday = () => {
        const s0 = new Date(); s0.setHours(0, 0, 0, 0);
        const t0 = s0.getTime();
        const ts = sales.filter(s => saleEffAt(s) >= t0 && !isDropoffUnpaid(s)).sort((a, b) => saleEffAt(b) - saleEffAt(a));
        const ok = ts.filter(s => !s.voided);
        const by = { cash: 0, kpay: 0, wave: 0, aya: 0, credit: 0, pending: 0 };
        const col = { cash: 0, kpay: 0, wave: 0, aya: 0 };
        const pin = { cash: 0, kpay: 0, wave: 0, aya: 0 };

        ok.forEach(s => {
          partsOf(s).forEach(x => {
            if (x.m in by) by[x.m] += x.a;
            if (x.m in pin) pin[x.m] += x.a;
          });
        });

        pays.filter(x => x.at >= t0).forEach(x => { col[x.method] += x.amount; });
        const focN = ok.reduce((a, s) => a + s.lines.filter(l => l.foc).length, 0);
        const actualTodaySales = by.cash + by.kpay + by.wave + by.aya + by.credit + by.pending;
        const gasRefundToday = cf.filter(e => e.type === 'gas_ret' && !e.voided && e.at >= t0 && e.m === 'cash').reduce((a, e) => a + e.amt, 0);

        const row = k => h('div', { class: 'li' },
          h('span', {}, PAY[k]),
          h('b', {}, money(pin[k]) + (col[k] ? ' + ကြွေးကောက် ' + money(col[k]) : ''))
        );

        today.replaceChildren(
          h('h2', {}, 'ယနေ့ ရောင်းချမှု: ' + money(actualTodaySales)),
          h('div', { class: 'card' },
            row('cash'), row('kpay'), row('wave'), row('aya'),
            h('div', { class: 'li' }, h('span', {}, 'ကြွေး (မရသေး)'), h('b', {}, money(by.credit))),
            by.pending > 0 ? h('div', { class: 'li' }, h('span', {}, 'COD (ငွေမရသေး)'), h('b', { style: 'color:var(--red)' }, money(by.pending))) : '',
            h('div', { class: 'li' }, h('span', {}, 'FOC (လှူ/လက်ဆောင်)'), h('b', {}, focN + ' ခု')),
            h('div', { class: 'li' }, h('span', {}, 'ဆိုင်ထဲ ငွေသားဝင် (အသားတင်)'), h('b', {}, money(pin.cash + col.cash - gasRefundToday)))
          ),
          h('div', { class: 'card' }, ts.length ? ts.map(s => {
            const effT = saleEffAt(s);
            const who = s.tag ? ('[' + s.tag + ']') : (s.cust || '');
            const fromPrev = s.settledTodayAt && s.at < t0 ? ' (အရင်ရက်ထားခဲ့ဗူး လာယူ)' : '';
            return h('div', { class: 'li' },
              h('span', { class: s.voided ? 'void' : '' }, new Date(effT).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + ' · ' + s.lines.map(l => l.name + '×' + l.qty + (l.foc ? ' (FOC)' : '')).join(', ') + ' · ' + payLabel(s) + (who ? ' (' + who + ')' : '') + fromPrev + (s.voided ? ' (ပယ်ဖျက်ပြီး)' : '')),
              h('span', {},
                h('b', { class: s.voided ? 'void' : '' }, money(stotal(s))), ' ',
                (!s.voided && partsOf(s).some(x => x.m === 'pending')) ? h('button', { style: 'padding:4px 10px;font-size:13px', onclick: () => viewSettle(s.id) }, 'ငွေရပြီ') : '', ' ',
                s.voided ? '' : h('button', { class: 'g', style: 'color:var(--navy);border-color:var(--navy)', onclick: () => printSale(s) }, 'Print'), ' ',
                s.voided ? '' : h('button', {
                  class: 'g',
                  onclick: async () => {
                    if (!(await guardMonthLock(saleEffAt(s), msg))) return;
                    if (!(await uiConfirm('ဒီရောင်းချမှုကို ပယ်ဖျက်မလား?'))) return;
                    s.voided = true;
                    s.voidedAt = Date.now();
                    try { await put('sales', s); await reload(); drawToday(); } catch (e) { await uiAlert('မပယ်ဖျက်နိုင်ပါ: ' + e.message); }
                  }
                }, 'ပယ်ဖျက်')
              )
            );
          }) : h('small', {}, 'ယနေ့ မရောင်းရသေးပါ။'))
        );
      };

      app.append(
        dl, cl, bkBanner(), ...lowBanner(), ...loanBanner(), ...pendBanner(),
        h('div', { class: 'card' },
          h('label', {}, 'ပစ္စည်း'), pn,
          h('div', { class: 'row' },
            h('div', {}, h('label', {}, 'ပမာဏ'), qty),
            h('div', {}, h('label', {}, 'ယူနစ်'), un)
          ),
          h('label', {}, 'ဈေး (ကိုယ်တိုင်ထည့်)'), pr,
          h('label', { style: 'display:flex;align-items:center' }, foc, 'FOC (လှူ/လက်ဆောင် · ငွေမယူ)'),
          h('button', { class: 'o', onclick: addLine, style: 'background:var(--navy)' }, 'စာရင်းထဲ ထည့်မည်')
        ),
        msg,
        h('div', { class: 'card' },
          list, tot,
          h('details', { style: 'margin:8px 0' }, h('summary', { style: 'color:#5A6B82' }, 'ရက်စွဲ ပြောင်းရန် (မလိုရင် မထိပါနဲ့)'), dIn, dWarn, hBox),
          h('label', {}, 'ငွေပေးချေမှု'), pay, pHint, split, cust, tagIn,
          h('label', { style: 'display:flex;align-items:center' }, prt, 'ဘောင်ချာ print ထုတ်မည်'),
          save
        ),
        today
      );
      draw();
      drawToday();
    }

    // =========================================================================
    // 3. TAB 4: ဖောက်သည် (EXACT V23 DEBT & PAYMENT RECONCILIATION)
    // =========================================================================
    const ck = n => String(n || '').trim().toLowerCase();
    function customers() {
      const m = {}, get = n => { const k = ck(n); return m[k] = m[k] || { key: k, name: String(n).trim(), phone: '', cr: 0, pd: 0 }; };
      cf.filter(e => e.type === 'cust').sort((a, b) => a.at - b.at).forEach(e => { const c = get(e.name); if (e.phone !== undefined) c.phone = e.phone; });
      [...sales].sort((a, b) => a.at - b.at).forEach(x => { if (x.cust) { const c = get(x.cust); if (!x.voided) c.cr += creditOf(x); } });
      cf.filter(e => e.type === 'ob' && !e.voided).forEach(e => { get(e.cust).cr += e.amt; });
      pays.forEach(x => { get(x.cust).pd += x.amount; });
      return Object.values(m).map(c => ({ ...c, bal: c.cr - c.pd }));
    }
    const sd_ = t => new Date(t).toLocaleDateString('en-GB') + ' ' + new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

    function custO2Balance(key) {
      const b = { '40L': 0, 'over40': 0, '47L': 0 };
      cf.filter(e => e.type === 'o2cust' && !e.voided && ck(e.cust) === key).forEach(e => {
        if (e.o2type in b) b[e.o2type] += (e.qty || 0);
      });
      return b;
    }

    function custCompBalance(key) {
      let chg = 0, pd = 0;
      cf.filter(e => e.type === 'cyl_comp' && !e.voided && ck(e.cust) === key).forEach(e => {
        if (e.kind === 'charge') chg += (e.amt || 0);
        else if (e.kind === 'pay') pd += (e.amt || 0);
      });
      return { chg, pd, bal: chg - pd };
    }

    function viewCust() {
      const app = $('#app');

    // =========================================================================
    // 5. TAB 3: GAS စာရင်း (AUTO-EXPENSE + DELETE/REVERT + CREDIT PAYABLES)
    // =========================================================================
    function gasBookRecon(dateKey) {
      const [a, b] = dbounds(dateKey);
      const obEv = gasEv.filter(e => e.type === 'gas_ob' && e.date === dateKey).sort((x, y) => y.at - x.at)[0];
      const prevClose = gasEv.filter(e => e.type === 'gas_close' && e.date < dateKey).sort((x, y) => x.date < y.date ? 1 : x.date > y.date ? -1 : y.at - x.at)[0];

      let openViss = 0;
      if (obEv) {
        openViss = obEv.viss;
      } else if (prevClose) {
        const afterPrev = dbounds(prevClose.date)[1] + 1;
        let delta = 0;
        gasEv.forEach(e => {
          if (e.at >= afterPrev && e.at < a) {
            const v = AGENTS[e.agent] ? AGENTS[e.agent].viss : cfg.usable;
            if ((e.type === 'recv' || e.type === 'eswap') && !e.ground) delta += (e.actualViss > 0 ? e.actualViss : e.qty * v);
            if (e.type === 'cyl' && e.role === 'can' && !e.fromMain) delta -= e.cap;
            if (e.type === 'gas_ret_viss') delta += (e.viss || 0);
          }
        });
        sales.forEach(s => {
          if (!s.voided && !s.hist && s.at >= afterPrev && s.at < a) {
            s.lines.forEach(l => { if (l.gasRole === 'viss') delta -= (l.gasViss || 0); });
          }
        });
        openViss = prevClose.groundViss + delta;
      } else {
        let v = 0;
        gasEv.forEach(e => {
          if (e.at < a) {
            const av = AGENTS[e.agent] ? AGENTS[e.agent].viss : cfg.usable;
            if (e.type === 'recv' || e.type === 'eswap') v += (e.actualViss > 0 ? e.actualViss : e.qty * av);
            if (e.type === 'cyl' && e.role === 'can' && !e.fromMain) v -= e.cap;
            if (e.type === 'gas_ret_viss') v += (e.viss || 0);
          }
        });
        sales.forEach(s => {
          if (!s.voided && !s.hist && s.at < a) {
            s.lines.forEach(l => { if (l.gasRole === 'viss') v -= (l.gasViss || 0); });
          }
        });
        openViss = Math.max(v, 0);
      }

      let inViss = 0;
      const inDetails = [];
      gasEv.forEach(e => {
        if (e.at >= a && e.at <= b && (e.type === 'recv' || e.type === 'eswap') && !e.ground) {
          const av = AGENTS[e.agent] ? AGENTS[e.agent].viss : cfg.usable;
          const tot = e.actualViss > 0 ? e.actualViss : e.qty * av;
          inViss += tot;

        h('div', { class: 'card' }, h('b', {}, 'Month Hard Lock (လချုပ် စာရင်းပိတ်ခြင်း)'), lockIn, lockBtn, h('div', { style: 'margin-top:6px' }, h('small', {}, 'ပိတ်ထားသော လများ: ' + (lockedMonths.length ? lockedMonths.join(', ') : 'မရှိသေးပါ')))),
        h('div', { class: 'card' }, h('b', {}, 'ဘောင်ချာ ဆက်တင်'), h('label', {}, 'ခေါင်းစာ (ဖုန်း/လိပ်စာ)'), rh, h('label', {}, 'အောက်စာ'), rf, h('label', {}, 'စာလုံးအရွယ်'), rz, h('div', { class: 'row', style: 'margin-top:8px' }, rsb, rtb)),
        h('div', { class: 'card' }, h('b', {}, 'CSV ထုတ်ရန် (Google Sheets/Excel အတွက်)'), h('br'), cb('ရောင်းချမှု', csvSales), cb('ပစ္စည်း/လက်ကျန်', csvProducts), cb('ကြွေးစာရင်း', csvDebts), cb('စရိတ်', csvExp))
      );
    }

    // =========================================================================
    // 7. TAB 7 & 8: CASH FLOW, PAYABLES, LOANS, REPORTS & P&L
    // =========================================================================
    const ECAT = {
      factory: 'စက်ရုံ / ကုန်ပစ္စည်းဝယ်စရိတ်',
      shop: 'ဆိုင်အသုံးစရိတ်',
      transport: 'သယ်ယူပို့ဆောင်စရိတ် (ကားခ/ဆီဖိုး)',
      owner: 'အိမ်အသုံးစရိတ် / လစာ',
      savings: 'စုငွေ (Savings)',
      other: 'အထွေထွေ အသုံးစရိတ်'
    };
    const MTH = ['cash', 'kpay', 'wave', 'aya'];
    const dkey = t => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
    const dbounds = k => { const [y, m, d] = k.split('-').map(Number); return [new Date(y, m - 1, d).getTime(), new Date(y, m - 1, d + 1).getTime() - 1]; };
    const exps = () => cf.filter(e => e.type === 'exp' && !e.voided);
    const tm = t => new Date(t).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });

    function flows(m, a, b) {
      let i = 0, o = 0, lin = 0, lout = 0, trin = 0, trout = 0, gref = 0;
      sales.forEach(s => {
        if (s.voided || isDropoffUnpaid(s)) return;
        const t = partTime(s);
        if (t >= a && t <= b) partsOf(s).forEach(x => { if (x.m === m) i += x.a; });
      });
      pays.forEach(x => { if (x.method === m && x.at >= a && x.at <= b) i += x.amount; });
      exps().forEach(e => { if (e.m === m && e.at >= a && e.at <= b) o += e.amt; });
      cf.filter(e => e.type === 'cyl_comp' && !e.voided && e.kind === 'pay').forEach(e => { if (e.m === m && e.at >= a && e.at <= b) i += e.amt; });
      cf.filter(e => e.type === 'fac_refund' && !e.voided).forEach(e => { if (e.m === m && e.at >= a && e.at <= b) i += e.amt; });
      cf.filter(e => e.type === 'loan' && !e.voided).forEach(e => {
        if (e.m === m && e.at >= a && e.at <= b) { i += e.amt; lin += e.amt; }
        if (e.repaid && e.repaidMethod === m && e.repaidAt >= a && e.repaidAt <= b) { o += e.amt; lout += e.amt; }
      });
      cf.filter(e => e.type === 'gas_ret' && !e.voided).forEach(e => {
        if (e.m === m && e.at >= a && e.at <= b) { o += e.amt; gref += e.amt; }
      });
      cf.filter(e => e.type === 'xfer' && !e.voided).forEach(e => {
        if (e.to === m && e.at >= a && e.at <= b) { i += e.amt; trin += e.amt; }
        if (e.from === m && e.at >= a && e.at <= b) { o += e.amt; trout += e.amt; }
      });
      return { i, o, lin, lout, trin, trout, gref };
    }

    function opening(m, k) {
      const R = cf.filter(e => e.type === 'bal' && e.method === m);
      const op = R.filter(r => r.kind === 'open' && r.date === k).sort((a, b) => b.at - a.at)[0];
      if (op) return op.amt;
      const cl = R.filter(r => r.kind === 'close' && r.date < k).sort((a, b) => a.date < b.date ? 1 : a.date > b.date ? -1 : b.at - a.at)[0];
      if (!cl) return null;
      const f = flows(m, dbounds(cl.date)[1] + 1, dbounds(k)[0] - 1);
      return cl.amt + f.i - f.o;
    }

    function debtTotal() {
      const m = {};
      sales.filter(x => !x.voided && creditOf(x) > 0 && x.cust).forEach(x => { const k = x.cust.toLowerCase(); m[k] = (m[k] || 0) + creditOf(x); });
      pays.forEach(x => { const k = x.cust.toLowerCase(); m[k] = (m[k] || 0) - x.amount; });
      cf.filter(e => e.type === 'ob' && !e.voided).forEach(e => { const k = e.cust.toLowerCase(); m[k] = (m[k] || 0) + e.amt; });
      return Object.values(m).filter(v => v > 0.5).reduce((a, b) => a + b, 0);
    }

    function calcPnL(periodKey, isMonthly) {
      const inPeriod = t => { if (!t) return false; const dk = dkey(t); return isMonthly ? dk.startsWith(periodKey) : dk === periodKey; };
      const supRates = {};
      Object.keys(AGENTS).forEach(ag => {
        const recvs = gasEv.filter(e => (e.type === 'recv' || e.type === 'eswap') && !e.ground && e.agent === ag && e.cost > 0).sort((a, b) => b.at - a.at);
        if (recvs.length) {
          const latest = recvs[0];
          const nom = AGENTS[ag].viss;
          supRates[ag] = { perViss: latest.cost / nom, date: dkey(latest.at), confirmed: true };
        } else {
          supRates[ag] = { perViss: 3000, date: null, confirmed: false };
        }
      });

      let netRev = 0, gasCogs = 0, o2Cogs = 0, prodCogs = 0, unidGasWarn = false;
      const activeVissCyl = gasEv.filter(e => e.type === 'cyl' && !e.closed && e.role === 'viss').sort((a, b) => a.at - b.at)[0];
      const fallbackAg = (activeVissCyl && activeVissCyl.agent) || 'TT Gas';

      sales.forEach(s => {
        if (s.voided || isDropoffUnpaid(s)) return;
        const revT = saleEffAt(s);
        if (!inPeriod(revT)) return;
        netRev += stotal(s);
        s.lines.forEach(l => {
          if (l.gasViss > 0) {
            if (l.alloc && l.alloc.length) {
              l.alloc.forEach(al => {
                if (al.buyBackRate > 0) gasCogs += al.viss * al.buyBackRate;
                else {
                  const ag = al.agent || fallbackAg;
                  const sr = supRates[ag] || supRates['TT Gas'];
                  if (!sr.confirmed) unidGasWarn = true;
                  gasCogs += al.viss * sr.perViss;
                }
              });
            } else {
              const sr = supRates[fallbackAg] || supRates['TT Gas'];
              if (!sr.confirmed) unidGasWarn = true;
              gasCogs += l.gasViss * sr.perViss;
            }
          } else if (/o2|oxygen|အောက်ဆီဂျင်/i.test(String(l.name || ''))) {
            const nm = String(l.name || '').toLowerCase();
            if (nm.includes('47l')) o2Cogs += l.qty * ((cfg.o2Rates && cfg.o2Rates['47L']) || 23500);
            else if (nm.includes('over 40') || nm.includes('အပိုင်')) {
              const cap = Number(cfg.motherCap) || 55;
              o2Cogs += l.qty * (((cfg.o2Rates && cfg.o2Rates['over40']) || 25000) * (Number(l.liters) || cap) / cap);
            } else o2Cogs += l.qty * ((cfg.o2Rates && cfg.o2Rates['40L']) || 19500);
          } else {
            const prod = products.find(p => p.id === l.pid);
            const unitCost = (l.buyPriceAtSale !== undefined) ? Number(l.buyPriceAtSale) : (prod && Number(prod.buyPrice) || 0);
            prodCogs += l.qty * unitCost;
          }
        });
      });

      let weightVarExp = 0;
      gasEv.forEach(e => {
        if ((e.type === 'recv' || e.type === 'eswap') && !e.ground && inPeriod(e.at) && e.cost > 0 && e.actualViss > 0) {
          const nom = (AGENTS[e.agent] || AGENTS['TT Gas']).viss;
          const expV = e.qty * nom;
          const shortV = Math.max(0, expV - e.actualViss);
          if (shortV > 0) weightVarExp += ((e.qty * e.cost) / expV) * shortV;
        }
      });

      let opExp = 0;
      exps().forEach(e => {
        if (!inPeriod(e.at)) return;
        if (e.cat === 'savings' || e.cat === 'factory' || e.isO2Factory || e.isO2Own || e.isRentPayment || /ဆိုင်လခ|rent/i.test(e.desc)) return;
        opExp += e.amt;
      });

      const ym = periodKey.slice(0, 7);
      const yr = Number(ym.slice(0, 4)), mo = Number(ym.slice(5, 7));
      let rentAlloc = 0, rentWarn = '';
      if (yr <= 2026) {
        const days = new Date(yr, mo, 0).getDate();
        rentAlloc = isMonthly ? 750000 : (750000 / days);
      } else if (Number(cfg.rent2027) > 0) {
        const days = new Date(yr, mo, 0).getDate();
        rentAlloc = isMonthly ? Number(cfg.rent2027) : (Number(cfg.rent2027) / days);
      } else {
        rentWarn = '2027 Rent Unconfirmed';
      }

      const totalCogs = gasCogs + o2Cogs + prodCogs;
      const grossProfit = netRev - totalCogs;
      const netProfit = grossProfit - opExp - weightVarExp - rentAlloc;
      return { netRev, gasCogs, o2Cogs, prodCogs, totalCogs, grossProfit, opExp, weightVarExp, rentAlloc, rentWarn, unidGasWarn, supRates, netProfit };
    }

    let expSubTab = 1;
    function viewExp(dv, sub) {

        const unpaidPayables = [];

        stk.forEach(e => {
          if (e.type === 'buy' && !e.voided && !e.paid) {

            const isCreditStk = e.payCh === 'credit' || (!e.payCh && tot > 0 && !cf.some(x => !x.voided && x.type === 'exp' && Math.abs((x.at || 0) - (e.at || 0)) <= 2000 && x.amt === tot));
            if (isCreditStk && tot > 0) {
              unpaidPayables.push({

                id: e.id,
                at: e.at,

      const full1In = h('input', { type: 'number', inputmode: 'numeric', min: '0', placeholder: '40L Full' });

      const rate1Def = isFac ? ((cfg.o2Rates && cfg.o2Rates['40L']) || 19500) : ((cfg.o2Rates && cfg.o2Rates['40L_own']) || 19500);
      const rate2Def = isFac ? ((cfg.o2Rates && cfg.o2Rates['47L']) || 23500) : ((cfg.o2Rates && cfg.o2Rates['over40']) || 25000);
      const rate1In = h('input', { type: 'number', inputmode: 'numeric', min: '0', value: String(rate1Def) });
      const rate2In = h('input', { type: 'number', inputmode: 'numeric', min: '0', value: String(rate2Def) });
      const remIn = h('input', { placeholder: isFac ? 'Sign / Remarks (မထည့်လည်းရ)' : 'Remarks / ဘောင်ချာနံပါတ်' });

      const dmgCb = h('input', { type: 'checkbox', style: 'width:auto;margin-right:8px' });
      const dmgBox = h('label', {
        style: isFac ? 'display:none' : 'display:flex;align-items:center;margin-top:8px;padding:8px;background:#FDE7E5;border:1px solid #FCA5A5;border-radius:7px;color:var(--red)'
      }, dmgCb, 'အိုးပျက် / ဖြည့်မရ (အခွံသက်သက် ပြန်ထုတ် — 0 ကျပ်)');

      const payStatusSel = h('select', {},
        h('option', { value: 'paid' }, 'လက်ငင်းရှင်းပြီး (Paid — အသုံးစရိတ်ထဲ တန်းဝင်မည်)'),
        h('option', { value: 'unpaid' }, 'ဘောင်ချာကျန် (Unpaid / Credit — နောက်မှရှင်းမည်)')
      );
      const payMethodSel = h('select', {}, MTH.map(k => h('option', { value: k }, PAY[k])));
      const ownPayBox = h('div', { style: isFac ? 'display:none' : 'display:block;margin-top:6px;padding:8px;background:#FFF3E8;border-radius:7px;border:1px solid #FDBA74' },
        h('label', { style: 'margin-top:0' }, 'အပိုင်အိုး ဖြည့်ခ ငွေရှင်းမှု အခြေအနေ'),
        payStatusSel,
        h('div', { id: 'ownChWrap' }, h('label', {}, 'ပေးချေသည့် Channel (လက်ငင်းဆိုလျှင်)'), payMethodSel)
      );
      payStatusSel.onchange = () => {
        const w = ownPayBox.querySelector('#ownChWrap');
        if (w) w.style.display = payStatusSel.value === 'paid' ? 'block' : 'none';
      };
      dmgCb.onchange = () => {
        ownPayBox.style.display = (!isFac && !dmgCb.checked) ? 'block' : 'none';
        if (dmgCb.checked) {
          emp1In.placeholder = '40L အိုးပျက် (ပြန်ထုတ်)';
          emp2In.placeholder = 'Over 40L အိုးပျက် (ပြန်ထုတ်)';
          full1In.value = '';
          full2In.value = '';
          full1In.disabled = true;
          full2In.disabled = true;
        } else {
          emp1In.placeholder = '40L Empty';
          emp2In.placeholder = 'Over 40L Empty';
          full1In.disabled = false;
          full2In.disabled = false;
        }
      };

      const addEntryBtn = h('button', {
        class: 'o',
        onclick: async () => {
          const e1 = parseInt(emp1In.value) || 0;
          const e2 = parseInt(emp2In.value) || 0;
          const f1 = parseInt(full1In.value) || 0;
          const f2 = parseInt(full2In.value) || 0;
          if (e1 <= 0 && e2 <= 0 && f1 <= 0 && f2 <= 0) {
            return note(msg, 'Empty သို့မဟုတ် Full အရေအတွက် အနည်းဆုံး တစ်ကွက် ထည့်ပါ။');
          }
          const dk = effDateIn.value;
          const effAt = stampAt(dk);
          if (!(await guardMonthLock(effAt, msg))) return;

          const r1Parsed = parseFloat(rate1In.value);
          const r2Parsed = parseFloat(rate2In.value);
          const r1 = !isNaN(r1Parsed) && r1Parsed >= 0 ? r1Parsed : rate1Def;
          const r2 = !isNaN(r2Parsed) && r2Parsed >= 0 ? r2Parsed : rate2Def;
          const now = Date.now();

          if (isFac) {
            const billAmt = (f1 * r1) + (f2 * r2);
            const summary = 'စက်ရုံအိုး စာရင်းသွင်းမည် (' + fmtLogDate(dk) + ')\n' +
              '• Empty: 40L (' + e1 + '), 47L (' + e2 + ')\n' +
              '• Full: 40L (' + f1 + '), 47L (' + f2 + ')' +
              (billAmt > 0 ? '\n• လကုန်ရှင်း စာရင်းထဲ ပေါင်းမည့်ငွေ: ' + money(billAmt) : '');
            if (!(await uiConfirm(summary))) return;
            addEntryBtn.disabled = true;
            try {
              await run(['stk', 'meta'], 'readwrite', t => {
                const os = t.objectStore('stk');
                if (e1 > 0 || f1 > 0) os.add({ id: uuid(), at: effAt, effDate: dk, createdAt: now, type: 'o2_fac', o2type: '40L', emptyQty: e1, fullQty: f1, rate: r1, note: remIn.value.trim() });
                if (e2 > 0 || f2 > 0) os.add({ id: uuid(), at: effAt + 1, effDate: dk, createdAt: now, type: 'o2_fac', o2type: '47L', emptyQty: e2, fullQty: f2, rate: r2, note: remIn.value.trim() });
                t.objectStore('meta').put({ k: 'gascfg', v: { ...cfg, o2Rates: { ...cfg.o2Rates, '40L': r1, '47L': r2 } } });
              });
              o2Month = dk.slice(0, 7);
              await reload();
              viewOxy();
              note(msg, 'စက်ရုံအိုး စာရင်းဇယားထဲ ထည့်သွင်းပြီးပါပြီ။', 1);
            } catch (err) { addEntryBtn.disabled = false; note(msg, 'မသိမ်းနိုင်ပါ: ' + (err && err.message || err)); }
          } else {
            const isDamaged = dmgCb.checked;
            if (isDamaged && (e1 <= 0 && e2 <= 0)) {
              return note(msg, 'အိုးပျက် ပြန်ထုတ်မည့် အရေအတွက် (40L သို့မဟုတ် Over 40L) ထည့်ပါ။');
            }
            const billAmt = isDamaged ? 0 : ((f1 * r1) + (f2 * r2));
            const isPaid = isDamaged ? true : (payStatusSel.value === 'paid');
            const pm = payMethodSel.value;
            const willExp = !isDamaged && isPaid && billAmt > 0 && dk >= AUTO_EXP_EFFECTIVE_DATE;

            const summary = isDamaged
              ? 'အိုးပျက် / ဖြည့်မရ (အခွံပြန်ထုတ်) မှတ်မည် (' + fmtLogDate(dk) + ')\n' +
                '• ပြန်ထုတ်သည့် အိုးပျက်: 40L (' + e1 + '), Over 40L (' + e2 + ')\n' +
                '• Stock ထဲမှ လျှော့ပေးမည် · ကျသင့်ငွေ 0 ကျပ် (စရိတ်/ဘောင်ချာကျန် မဝင်ပါ)'
              : 'အပိုင်အိုး စာရင်းသွင်းမည် (' + fmtLogDate(dk) + ')\n' +
                '• Empty: 40L (' + e1 + '), Over 40L (' + e2 + ')\n' +
                '• Full: 40L (' + f1 + '), Over 40L (' + f2 + ')' +
                (billAmt > 0 ? '\n• ကျသင့်ငွေ: ' + money(billAmt) + ' — ' + (isPaid ? 'လက်ငင်းရှင်းပြီး (' + PAY[pm] + ')' : 'ဘောင်ချာကျန် (Unpaid)') : '');
            if (!(await uiConfirm(summary))) return;
            addEntryBtn.disabled = true;
            try {
              const entryId = uuid();
              await run(['stk', 'cf', 'meta'], 'readwrite', t => {
                t.objectStore('stk').add({
                  id: entryId, at: effAt, effDate: dk, createdAt: now, type: 'o2_own',
                  emp40: e1, empOver: e2,
                  full40: isDamaged ? 0 : f1, fullOver: isDamaged ? 0 : f2,
                  damagedReturn: isDamaged,
                  rate40: r1, rateOver: r2, billAmt,
                  paid: isPaid || billAmt <= 0,
                  paidAt: (isPaid && billAmt > 0) ? effAt : null,
                  paidMethod: (isPaid && billAmt > 0) ? pm : null,
                  note: remIn.value.trim()
                });
                if (willExp) {
                  t.objectStore('cf').add({
                    id: uuid(), at: effAt, type: 'exp',
                    desc: 'O2 အပိုင်အိုးဖြည့်ခ (' + fmtLogDate(dk) + ')',
                    cat: 'factory', amt: billAmt, m: pm, isO2Own: true, o2OwnId: entryId
                  });
                }
                t.objectStore('meta').put({ k: 'gascfg', v: { ...cfg, o2Rates: { ...cfg.o2Rates, '40L_own': r1, 'over40': r2 } } });
              });
              o2Month = dk.slice(0, 7);
              await reload();
              viewOxy();
              note(msg, isDamaged ? 'အိုးပျက် (အခွံပြန်ထုတ် — 0 ကျပ်) မှတ်ပြီးပါပြီ။' : 'အပိုင်အိုး စာရင်းဇယားထဲ ထည့်သွင်းပြီးပါပြီ။', 1);
            } catch (err) { addEntryBtn.disabled = false; note(msg, 'မသိမ်းနိုင်ပါ: ' + (err && err.message || err)); }
          }
        }
      }, isFac ? '+ စက်ရုံအိုး ဇယားထဲ မှတ်မည်' : '+ အပိုင်အိုး ဇယားထဲ မှတ်မည်');

      const entryCard = h('div', { class: 'card' },
        h('b', { style: 'font-size:15.5px' }, isFac ? 'စက်ရုံအိုး (40L / 47L) အဝင်အထွက် ထည့်ရန်' : 'အပိုင်အိုး (40L / Over 40L) အဝင်အထွက် ထည့်ရန်'),
        h('div', { class: 'row' },
          h('div', {}, h('label', {}, 'Date (ရက်စွဲ)'), effDateIn),
          h('div', {}, h('label', {}, isFac ? 'Sign / Remarks' : 'Remarks / ဘောင်ချာ'), remIn)
        ),
        dmgBox,
        h('div', { class: 'row' },
          h('div', {}, h('label', {}, 'Empty · 40L (အခွံ)'), emp1In),
          h('div', {}, h('label', {}, isFac ? 'Empty · 47L (အခွံ)' : 'Empty · Over 40L (အခွံ)'), emp2In)
        ),
        h('div', { class: 'row' },
          h('div', {}, h('label', {}, 'Full · 40L (အပြည့်)'), full1In),
          h('div', {}, h('label', {}, isFac ? 'Full · 47L (အပြည့်)' : 'Full · Over 40L (အပြည့်)'), full2In)
        ),
        h('div', { class: 'row' },
          h('div', {}, h('label', {}, '40L တစ်လုံးဈေး (ကျပ်)'), rate1In),
          h('div', {}, h('label', {}, isFac ? '47L တစ်လုံးဈေး (ကျပ်)' : 'Over 40L တစ်လုံးဈေး (ကျပ်)'), rate2In)
        ),
        ownPayBox,
        addEntryBtn
      );

      let ledgerSection;

      if (isFac) {
        const obRec = stk.filter(e => e.type === 'o2_fac_ob' && e.month === o2Month).sort((a, b) => b.at - a.at)[0];
        let open40 = 0, open47 = 0;
        if (obRec) {
          open40 = Number(obRec.s40) || 0;
          open47 = Number(obRec.s47) || 0;
        } else {
          const priorOb = stk.filter(e => e.type === 'o2_fac_ob' && e.month < o2Month).sort((a, b) => a.month < b.month ? 1 : -1)[0];
          const startYm = priorOb ? priorOb.month : '0000-00';
          open40 = priorOb ? (Number(priorOb.s40) || 0) : 0;
          open47 = priorOb ? (Number(priorOb.s47) || 0) : 0;
          stk.filter(e => e.type === 'o2_fac' && mkeyOf(e.at) >= startYm && mkeyOf(e.at) < o2Month).forEach(e => {
            if (e.o2type === '40L') open40 += (e.fullQty || 0) - (e.emptyQty || 0);
            if (e.o2type === '47L') open47 += (e.fullQty || 0) - (e.emptyQty || 0);
          });
        }

        const rawFac = stk.filter(e => e.type === 'o2_fac' && mkeyOf(e.at) === o2Month).sort((a, b) => a.at - b.at);
        const rows = [];
        for (let i = 0; i < rawFac.length; i++) {
          const cur = rawFac[i];
          const nxt = rawFac[i + 1];
          if (nxt && cur.createdAt && cur.createdAt === nxt.createdAt && cur.o2type !== nxt.o2type) {
            const r40 = cur.o2type === '40L' ? cur : nxt;
            const r47 = cur.o2type === '47L' ? cur : nxt;
            rows.push({
              ids: [r40.id, r47.id], at: r40.at, dk: dkey(r40.at),
              e40: r40.emptyQty || 0, e47: r47.emptyQty || 0,
              f40: r40.fullQty || 0, f47: r47.fullQty || 0,
              note: r40.note || r47.note || ''
            });
            i++;
          } else {
            const is40 = cur.o2type === '40L';
            rows.push({
              ids: [cur.id], at: cur.at, dk: dkey(cur.at),
              e40: is40 ? (cur.emptyQty || 0) : 0, e47: !is40 ? (cur.emptyQty || 0) : 0,
              f40: is40 ? (cur.fullQty || 0) : 0, f47: !is40 ? (cur.fullQty || 0) : 0,
              note: cur.note || ''
            });
          }
        }

        let run40 = open40, run47 = open47;
        let sumE40 = 0, sumE47 = 0, sumF40 = 0, sumF47 = 0, sumBill40 = 0, sumBill47 = 0;
        rawFac.forEach(e => {
          if (e.o2type === '40L') sumBill40 += (e.fullQty || 0) * (e.rate !== undefined ? e.rate : rate1Def);
          if (e.o2type === '47L') sumBill47 += (e.fullQty || 0) * (e.rate !== undefined ? e.rate : rate2Def);
        });

        const tableRows = rows.map(r => {
          run40 = run40 - r.e40 + r.f40;
          run47 = run47 - r.e47 + r.f47;
          sumE40 += r.e40; sumE47 += r.e47;
          sumF40 += r.f40; sumF47 += r.f47;
          return h('tr', {},
            h('td', { class: 'dt-col' }, fmtLogDate(r.dk)),
            h('td', {}, r.e40 || ''),
            h('td', {}, r.e47 || ''),
            h('td', { style: 'color:var(--ok);font-weight:700' }, r.f40 || ''),
            h('td', { style: 'color:var(--ok);font-weight:700' }, r.f47 || ''),
            h('td', { class: 'stk-col' }, run40),
            h('td', { class: 'stk-col' }, run47),
            h('td', { class: 'rem-col' },
              r.note || '✓', ' ',
              h('button', {
                class: 'g',
                style: 'padding:1px 6px;font-size:11px;min-height:24px;float:right',
                onclick: async () => {
                  if (!(await guardMonthLock(r.at, msg))) return;
                  if (!(await uiConfirm(fmtLogDate(r.dk) + ' စာရင်းကြောင်းကို ဖျက်မလား?'))) return;
                  for (const id of r.ids) await del('stk', id);
                  await reload();
                  viewOxy();
                }
              }, '×')
            )
          );
        });

        const totalMonthBill = sumBill40 + sumBill47;
        const monthPaid = exps().filter(e => e.cat === 'factory' && e.isO2Factory && (e.facMonth === o2Month || (!e.facMonth && mkeyOf(e.at) === o2Month))).reduce((a, e) => a + e.amt, 0);
        const monthDue = totalMonthBill - monthPaid;

        const setObFacBtn = h('button', {
          class: 'n',
          style: 'padding:4px 9px;font-size:12px',
          onclick: async () => {
            const s40 = parseInt(await uiPrompt(o2Month + ' လအစ စက်ရုံအိုး 40L လက်ကျန် (ဥပမာ 50)', open40, 'number'));
            if (isNaN(s40) || s40 < 0) return;
            const s47 = parseInt(await uiPrompt(o2Month + ' လအစ စက်ရုံအိုး 47L လက်ကျန် (ဥပမာ 23)', open47, 'number'));
            if (isNaN(s47) || s47 < 0) return;
            await add('stk', { id: uuid(), at: Date.now(), type: 'o2_fac_ob', month: o2Month, s40, s47 });
            await reload();
            viewOxy();
          }
        }, 'လအစ Stock ပြင်မည်');

        const settleMonthBtn = h('button', {
          class: 'o',
          onclick: async () => {
            const amt = parseFloat(await uiPrompt(o2Month + ' လအတွက် စက်ရုံသို့ ပေးချေမည့်ငွေ (ကျန်: ' + money(Math.max(monthDue, 0)) + ')', Math.max(Math.round(monthDue), 0), 'number'));
            if (!(amt > 0)) return;
            const ch = await uiPrompt('ဘာနဲ့ပေးလိုက်လဲ (နံပါတ်ရိုက်ပါ — အသုံးစရိတ်စာရင်းထဲ တန်းဝင်ပါမည်)\n1 = ငွေသား\n2 = KPay\n3 = Wave Pay\n4 = AyA Pay', '2', 'number');
            const pm = ({ '1': 'cash', '2': 'kpay', '3': 'wave', '4': 'aya' })[String(ch || '').trim()];
            if (!pm) return;
            const now = Date.now();
            if (!(await guardMonthLock(now, msg))) return;
            if (!(await uiConfirm(o2Month + ' လကုန် စက်ရုံငွေရှင်း ' + money(amt) + ' (' + PAY[pm] + ') မှတ်မလား?\n(အသုံးစရိတ်စာရင်းထဲသို့ တိုက်ရိုက်ထည့်သွင်းပါမည်)'))) return;
            await add('cf', { id: uuid(), at: now, type: 'exp', desc: 'O2 စက်ရုံငွေရှင်း (' + o2Month + ')', cat: 'factory', amt, m: pm, isO2Factory: true, facMonth: o2Month });
            await reload();
            viewOxy();
            note(msg, o2Month + ' လကုန် စက်ရုံငွေရှင်း ' + money(amt) + ' (' + PAY[pm] + ') အသုံးစရိတ်စာရင်းထဲ မှတ်ပြီးပါပြီ။', 1);
          }
        }, '✔ လကုန် စက်ရုံငွေရှင်းမည် (အသုံးစရိတ်ထဲဝင်)');

        ledgerSection = h('div', {},
          h('div', { class: 'card', style: 'border:2px solid var(--navy)' },
            h('div', { style: 'display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px' },
              h('b', { style: 'font-size:15.5px' }, 'စက်ရုံအိုး စာရင်းဇယား (' + o2Month + ')'),
              setObFacBtn
            ),
            h('div', { style: 'overflow-x:auto' },
              h('table', { class: 'log-tbl' },
                h('thead', {},
                  h('tr', {},
                    h('th', { rowspan: '2' }, 'Date'),
                    h('th', { colspan: '2' }, 'Empty (အခွံပို့)'),
                    h('th', { colspan: '2' }, 'Full (အပြည့်ဝင်)'),
                    h('th', { colspan: '2' }, 'Stock (လက်ကျန်)'),
                    h('th', { rowspan: '2' }, 'Sign / Remarks')
                  ),
                  h('tr', { class: 'sub-h' },
                    h('th', {}, '40L'), h('th', {}, '47L'),
                    h('th', {}, '40L'), h('th', {}, '47L'),
                    h('th', {}, '40L'), h('th', {}, '47L')
                  )
                ),
                h('tbody', {},
                  h('tr', { style: 'background:#F4F6F9' },
                    h('td', { class: 'dt-col' }, 'လအစ Opening'),
                    h('td', {}, '-'), h('td', {}, '-'), h('td', {}, '-'), h('td', {}, '-'),
                    h('td', { class: 'stk-col' }, open40),
                    h('td', { class: 'stk-col' }, open47),
                    h('td', { class: 'rem-col' }, h('small', {}, 'Opening Stock'))
                  ),
                  ...(tableRows.length ? tableRows : [h('tr', {}, h('td', { colspan: '8' }, h('small', {}, o2Month + ' လအတွက် စာရင်းမရှိသေးပါ')))]),
                  h('tr', { style: 'background:#E8EEF7;font-weight:700' },
                    h('td', { class: 'dt-col' }, 'လချုပ် စုစုပေါင်း'),
                    h('td', {}, sumE40), h('td', {}, sumE47),
                    h('td', { style: 'color:var(--ok)' }, sumF40), h('td', { style: 'color:var(--ok)' }, sumF47),
                    h('td', { class: 'stk-col' }, run40), h('td', { class: 'stk-col' }, run47),
                    h('td', { class: 'rem-col' }, 'လက်ကျန်')
                  )
                )

    let selectedSiteKey = '';

    function siteHoldingsMap() {
      const map = new Map();
      const ensure = name => {
        const raw = String(name || '').trim();
        if (!raw) return null;
        const k = ck(raw);
        if (!map.has(k)) {
          map.set(k, { key: k, name: raw, f40: 0, f47: 0, own40: 0, gas: 0, gasVissTotal: 0, entries: [] });
        }
        return map.get(k);
      };

      cf.filter(e => e.type === 'o2site' && !e.voided).sort((a, b) => a.at - b.at).forEach(e => {
        const s = ensure(e.site);
        if (!s) return;
        const df40 = Number(e.del40Fac) || 0;
        const df47 = Number(e.del47Fac) || 0;
        const down40 = Number(e.del40Own) || 0;
        const dgas = Number(e.delGas) || 0;
        const dgasViss = Number(e.delGasViss) || 0;

        const ef40 = Number(e.emp40Fac) || 0;
        const ef47 = Number(e.emp47Fac) || 0;
        const eown40 = Number(e.emp40Own) || 0;
        const egas = Number(e.empGas) || 0;

        if (e.isOpening) {
          s.f40 = df40;
          s.f47 = df47;
          s.own40 = down40;
          s.gas = dgas;
        } else {
          s.f40 += (df40 - ef40);
          s.f47 += (df47 - ef47);
          s.own40 += (down40 - eown40);
          s.gas += (dgas - egas);
          s.gasVissTotal += dgasViss;
        }

        s.entries.push({
          ...e,
          bal40Fac: s.f40,
          bal47Fac: s.f47,
          bal40Own: s.own40,
          balGas: s.gas
        });
      });

      return map;
    }

    function viewO2Delivery() {
      const app = $('#app');

      const e40FacIn = h('input', { type: 'number', inputmode: 'numeric', min: '0', placeholder: 'စက်ရုံ 40L အခွံ' });
      const e47FacIn = h('input', { type: 'number', inputmode: 'numeric', min: '0', placeholder: 'စက်ရုံ 47L အခွံ' });
      const e40OwnIn = h('input', { type: 'number', inputmode: 'numeric', min: '0', placeholder: 'အပိုင် 40L အခွံ' });
      const eGasIn = h('input', { type: 'number', inputmode: 'numeric', min: '0', placeholder: 'Gas အခွံ (အလုံး)' });

      const o2PriceIn = h('input', { type: 'number', inputmode: 'numeric', min: '0', value: '25000', placeholder: '25000 (0 ထည့်နိုင်သည်)' });
      const gasPriceIn = h('input', { type: 'number', inputmode: 'numeric', min: '0', placeholder: 'Gas ၁ ပိဿာဈေး (0 ထည့်နိုင်သည်)' });

      const paySel = h('select', {},
        h('option', { value: 'credit' }, 'အကြွေး (Credit — ဖောက်သည် အကြွေးစာရင်းထဲ တန်းဝင်မည်)'),
        h('option', { value: 'cash' }, 'ငွေသား (Cash — ယနေ့ အရောင်းနှင့် ငွေသားထဲ တန်းဝင်မည်)'),
        h('option', { value: 'kpay' }, 'KPay — ယနေ့ အရောင်းနှင့် KPay ထဲ တန်းဝင်မည်'),
        h('option', { value: 'wave' }, 'Wave Pay — ယနေ့ အရောင်းနှင့် Wave ထဲ တန်းဝင်မည်'),
        h('option', { value: 'aya' }, 'AyA Pay — ယနေ့ အရောင်းနှင့် AyA ထဲ တန်းဝင်မည်')
      );
      const noteIn = h('input', { placeholder: 'လက်မှတ် / မှတ်ချက် (မထည့်လည်းရ)' });
      const totPreview = h('div', { class: 'tot', style: 'font-size:17px' }, 'ကျသင့်ငွေ: 0 ကျပ်');

      const calcPreview = () => {
        const o2Qty = (parseInt(d40FacIn.value) || 0) + (parseInt(d47FacIn.value) || 0) + (parseInt(d40OwnIn.value) || 0);
        const o2PrRaw = parseFloat(o2PriceIn.value);
        const o2Pr = !isNaN(o2PrRaw) && o2PrRaw >= 0 ? o2PrRaw : 0;
        const gViss = parseFloat(dGasVissIn.value) || 0;
        const gPrRaw = parseFloat(gasPriceIn.value);
        const gPr = !isNaN(gPrRaw) && gPrRaw >= 0 ? gPrRaw : 0;
        totPreview.textContent = 'ကျသင့်ငွေ: ' + money((o2Qty * o2Pr) + (gViss * gPr));
      };
      [d40FacIn, d47FacIn, d40OwnIn, dGasIn, dGasVissIn, o2PriceIn, gasPriceIn].forEach(el => el.oninput = calcPreview);

      const saveDelivBtn = h('button', {
        class: 'o',
        onclick: async () => {
          const siteName = siteIn.value.trim();
          if (!siteName) return note(msg, 'ဆိုဒ် / ဖောက်သည်အမည် ထည့်ပါ။');

          const df40 = parseInt(d40FacIn.value) || 0;
          const df47 = parseInt(d47FacIn.value) || 0;
          const down40 = parseInt(d40OwnIn.value) || 0;
          const dgas = parseInt(dGasIn.value) || 0;
          const dgasViss = parseFloat(dGasVissIn.value) || 0;

          const ef40 = parseInt(e40FacIn.value) || 0;
          const ef47 = parseInt(e47FacIn.value) || 0;
          const eown40 = parseInt(e40OwnIn.value) || 0;
          const egas = parseInt(eGasIn.value) || 0;

          if (df40 + df47 + down40 + dgas + dgasViss + ef40 + ef47 + eown40 + egas <= 0) {
            return note(msg, 'အပြည့်ပို့ သို့မဟုတ် အခွံပြန်ယူ အရေအတွက် အနည်းဆုံး တစ်ခု ထည့်ပါ။');
          }

          const o2PrRaw = parseFloat(o2PriceIn.value);
          const gPrRaw = parseFloat(gasPriceIn.value);
          const o2Pr = (!isNaN(o2PrRaw) && o2PrRaw >= 0) ? o2PrRaw : 0;
          const gPr = (!isNaN(gPrRaw) && gPrRaw >= 0) ? gPrRaw : 0;

          if (dgasViss > 0 && isNaN(gPrRaw)) {
