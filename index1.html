<!doctype html>
<html lang="my"><head><meta charset="utf-8">

<style>
:root{--navy:#0B1F3A;--org:#E86A12;--bg:#F4F6F9;--ln:#D5DBE4;--red:#B3261E;--ok:#1B7F3B}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--navy);font-family:"Noto Sans Myanmar","Myanmar Text",system-ui,sans-serif;line-height:1.7;padding-bottom:72px}
header{background:var(--navy);color:#fff;padding:10px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}

#net{font-size:13px;padding:2px 10px;border-radius:12px;background:var(--ok)}
#net.off{background:var(--org)}
main{padding:12px;max-width:640px;margin:auto}

.card{background:#fff;border:1px solid var(--ln);border-radius:8px;padding:10px;margin-bottom:10px}

.row{display:flex;gap:8px}.row>*{flex:1}
button{font:inherit;border:0;border-radius:6px;padding:10px 14px;background:var(--navy);color:#fff}

small{color:#5A6B82}
.tr{display:grid;grid-template-columns:1fr 62px 66px 84px;gap:4px;padding:6px 0;border-bottom:1px solid var(--ln);font-size:14px;align-items:start}.tr.h{font-weight:700;background:#F4F6F9}.tr span:nth-child(n+2){text-align:right}
button.n{background:#fff;color:var(--navy);border:1px solid var(--navy);padding:4px 10px;font-size:13px}
#rcpt{display:none}
@media print{@page{size:80mm auto;margin:3mm}body{background:#fff;padding:0}header,main,nav{display:none!important}#rcpt{display:block;width:72mm;color:#000;line-height:1.5}#rcpt .c{text-align:center}#rcpt .r{display:flex;justify-content:space-between;gap:8px}#rcpt .r.b{font-weight:700}#rcpt .r span:last-child{white-space:nowrap}#rcpt .big{font-size:1.5em;font-weight:700}#rcpt .dd{border-top:2px dashed #000;margin:8px 0}#rcpt .ss{border-top:3px solid #000;margin:8px 0 4px}#rcpt .it{margin:6px 0}#rcpt .nm{font-weight:700}#rcpt .tt{font-size:1.4em;font-weight:700}#rcpt .ft{margin-top:4px}}
</style></head><body>
<header><b>AUNG Gas Solutions</b><span id="net"></span></header>
<main id="app"></main>
<nav><button id="t1">ရောင်းချမှု</button><button id="t2">ပစ္စည်းများ</button><button id="t3">Gas စာရင်း</button><button id="t6">Oxygen</button><button id="t4">ဖောက်သည်</button><button id="t7">စရိတ်</button><button id="t8">စာရင်းချုပ်</button><button id="t5">ဒေတာ</button></nav>
<div id="rcpt"></div>
<script>
const $=s=>document.querySelector(s);
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(k==='class')e.className=a[k];else if(k.startsWith('on'))e[k]=a[k];else e.setAttribute(k,a[k])}c.flat().forEach(x=>e.append(x));return e};
const money=n=>Math.round(n).toLocaleString('en-US')+' ကျပ်';
const uuid=()=>crypto.randomUUID?crypto.randomUUID():'s'+Date.now()+Math.random().toString(36).slice(2);
const CATS=['LPG ဓာတ်ငွေ့','LPG အိုး/ဗူး','အောက်ဆီဂျင်','မီးဖို','Regulator/Valve','ဆက်စပ်ပစ္စည်း'];
const UNITS=['ခု','ဗူး','အိုး','kg','viss'];
const SAMPLE=[['LPG ပြန်ဖြည့် (kg/viss)','LPG ဓာတ်ငွေ့','kg'],['EFF ဗူးသစ်','LPG အိုး/ဗူး','ဗူး'],['KOREANA ဗူးသစ်','LPG အိုး/ဗူး','ဗူး'],['5kg (Thailand)','LPG အိုး/ဗူး','အိုး'],['10kg (Thailand)','LPG အိုး/ဗူး','အိုး'],['15kg (Thailand)','LPG အိုး/ဗူး','အိုး'],['O2 (သေး)','အောက်ဆီဂျင်','အိုး'],['O2 (ကြီး)','အောက်ဆီဂျင်','အိုး'],['5L O2','အောက်ဆီဂျင်','အိုး'],['10L O2','အောက်ဆီဂျင်','အိုး'],['40L O2','အောက်ဆီဂျင်','အိုး'],['Rinnai RI-522A','မီးဖို','ခု'],['Rinnai RV-151','မီးဖို','ခု'],['SAGA SG-GS652','မီးဖို','ခု'],['LuckyFlame (L-336S)','မီးဖို','ခု'],['Namilux (PS)','မီးဖို','ခု'],['YAMATO L.P.G Regulator','Regulator/Valve','ခု'],['YAMATO O2 Regulator','Regulator/Valve','ခု'],['Argon Regulator','Regulator/Valve','ခု'],['Twin Valve (L.P.G)','Regulator/Valve','ခု'],['4kg Valve','Regulator/Valve','ခု'],['KB-5 Valve','Regulator/Valve','ခု'],['Flowmeter (Male)','Regulator/Valve','ခု'],['Refill Gun','ဆက်စပ်ပစ္စည်း','ခု'],['Kovea Gun','ဆက်စပ်ပစ္စည်း','ခု'],['Cutting Torch','ဆက်စပ်ပစ္စည်း','ခု'],['Welding Nozzle (No.1)','ဆက်စပ်ပစ္စည်း','ခု'],['O2 Headnut','ဆက်စပ်ပစ္စည်း','ခု'],['L.P.G Headnut','ဆက်စပ်ပစ္စည်း','ခု'],['Portable Magnet','ဆက်စပ်ပစ္စည်း','ခု']];
const AGENTS={'TT Gas':{kg:48,viss:28.5},'NGN':{kg:48,viss:28.5},'Easy Gas':{kg:50,viss:30}};

let db;
const open=()=>new Promise((ok,no)=>{const r=indexedDB.open('aung-gas-pos',4);r.onupgradeneeded=()=>{const d=r.result;['products','sales','meta','gasEv','pays','stk','cf'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:n==='meta'?'k':'id'})})};r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const run=(st,mode,fn)=>new Promise((ok,no)=>{const t=db.transaction(st,mode);let out;t.oncomplete=()=>ok(out);t.onabort=()=>no(t.error);t.onerror=()=>{};out=fn(t)});
const all=s=>new Promise((ok,no)=>{const q=db.transaction(s).objectStore(s).getAll();q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)});
const add=(s,o)=>run(s,'readwrite',t=>t.objectStore(s).add(o));
const put=(s,o)=>run(s,'readwrite',t=>t.objectStore(s).put(o));
const del=(s,k)=>run(s,'readwrite',t=>t.objectStore(s).delete(k));
async function seed(){const m=await new Promise(ok=>{const q=db.transaction('meta').objectStore('meta').get('seeded');q.onsuccess=()=>ok(q.result)});if(m)return;
await run(['products','meta'],'readwrite',t=>{SAMPLE.forEach(([n,c,u])=>t.objectStore('products').add({id:uuid(),name:n,cat:c,unit:u,sample:true,at:Date.now()}));t.objectStore('meta').put({k:'seeded',v:Date.now()})})}

let cf=[],bk=null,stk=[],rc={head:'',foot:''},pays=[],gasEv=[],cfg={usable:28.5,cans:7,nominal:29.3,low:2,lowO2:20,canMin:197,canMax:203},products=[],sales=[],lines=[],saleId=uuid(),saving=false,tab=1;
const reload=async()=>{products=(await all('products')).sort((a,b)=>a.name.localeCompare(b.name));sales=(await all('sales')).sort((a,b)=>b.at-a.at);gasEv=(await all('gasEv')).sort((a,b)=>b.at-a.at);pays=(await all('pays')).sort((a,b)=>b.at-a.at);stk=await all('stk');cf=await all('cf');const mm=await all('meta'),m=mm.find(x=>x.k==='gascfg'),r=mm.find(x=>x.k==='rcpt');if(m)cfg={...cfg,...m.v};if(r)rc=r.v;bk=(mm.find(x=>x.k==='lastBackup')||{}).v||null};
async function ensureGas(){const m=(await all('meta')).find(x=>x.k==='gas2');if(m)return;await run(['products','meta'],'readwrite',t=>{[['Gas (ပိဿာ)','viss','viss'],['Gas ဗူးဖြည့်','ဗူး','can']].forEach(([n,u,g])=>t.objectStore('products').add({id:uuid(),name:n,cat:'LPG ဓာတ်ငွေ့',unit:u,gas:g,sample:false,at:Date.now()}));t.objectStore('meta').put({k:'gas2',v:Date.now()})})}
const gv=(p,q,u)=>p&&p.gas?(p.gas==='viss'?(u==='viss'?q:null):((u==='ဗူး'||u==='ဘူး')?q/cfg.cans:null)):0;
const note=(box,t,k)=>{box.replaceChildren(h('div',{class:'msg '+(k?'k':'e')},t))};

const PAY={cash:'ငွေသား',kpay:'KPay',wave:'Wave Pay',aya:'AyA Pay',credit:'ကြွေး',pending:'COD (ပို့ပြီးငွေချေ)',dropoff:'ထားခဲ့ဗူး (လာယူမှရှင်း)'};
const payOf=s=>s.pay||'cash',amt=l=>l.foc?0:l.qty*l.price,stotal=s=>s.lines.reduce((a,l)=>a+amt(l),0);
const stampAt=v=>{if(!v)return Date.now();const[y,m,d]=v.split('-').map(Number),n=new Date();return Math.min(new Date(y,m-1,d,n.getHours(),n.getMinutes(),n.getSeconds()).getTime(),Date.now())};
const isPast=v=>!!v&&v<dkey(Date.now()),GL={can:'ဗူးဖြည့်အိုး',viss:'ပိဿာဖြည့်အိုး'};

const gasRemOf=c=>c.cap+(c.adj||0)-sales.reduce((a,s)=>s.voided?a:a+s.lines.reduce((b,l)=>b+(l.alloc?l.alloc.reduce((x,al)=>x+(al.cyl===c.id?al.viss:0),0):(l.cylId===c.id?l.gasViss||0:0)),0),0);
const o2RemOf=c=>c.cap+(c.adj||0)-sales.reduce((a,s)=>s.voided?a:a+s.lines.reduce((b,l)=>b+(l.o2alloc?l.o2alloc.reduce((x,al)=>x+(al.cyl===c.id?al.viss:0),0):(l.o2cyl===c.id?l.o2use||0:0)),0),0);

/* Agent Cylinder Breakdown: Full (အပြည့်), Partial/Opened (လက်ကျန်အိုး), Empty (အခွံ) */
const agentStats=()=>{
  const st={};
  Object.keys(AGENTS).forEach(k=>st[k]={full:0,partial:0,empty:0,viss:AGENTS[k].viss,kg:AGENTS[k].kg});
  gasEv.forEach(e=>{
    const ag=e.agent&&st[e.agent]?e.agent:null;
    if(!ag)return;
    if(e.type==='recv')st[ag].full+=e.qty;
    else if(e.type==='ret')st[ag].empty-=e.qty;
    else if(e.type==='eswap'){st[ag].full+=e.qty;st[ag].empty-=e.qty;}
    else if(e.type==='ecount')st[ag].empty+=e.qty;
    else if(e.type==='cyl'){
      if(!e.fromMain)st[ag].full-=1;
      if(e.closed)st[ag].empty+=1;
      else st[ag].partial+=1;
    }
  });
  return st;
};
const groundGas=()=>Object.values(agentStats()).reduce((a,x)=>a+x.full,0);
const partialGasTotal=()=>Object.values(agentStats()).reduce((a,x)=>a+x.partial,0);
const emptyGasTotal=()=>Object.values(agentStats()).reduce((a,x)=>a+x.empty,0);
const mainVissStock=()=>{
  const st=agentStats();
  let fullViss=Object.values(st).reduce((a,x)=>a+Math.max(x.full,0)*x.viss,0);
  const liveViss=gasEv.filter(e=>e.type==='cyl'&&!e.closed&&e.role==='viss').reduce((a,c)=>a+Math.max(gasRemOf(c),0),0);
  return fullViss+liveViss;
};
const groundO2=()=>stk.filter(e=>e.type==='orecv').reduce((a,e)=>a+e.qty,0)-stk.filter(e=>e.type==='ocyl').length;

async function allocLine(kind,l,pend,ov){
  const gas=kind==='gas',R=x=>Math.round(x*100)/100,F=gas?R:(x=>Math.round(x*1000)/10),un=gas?' ပိဿာ':' %';
  const live=()=>(gas?gasEv.filter(e=>e.type==='cyl'&&!e.closed&&e.role===l.gasRole):stk.filter(e=>e.type==='ocyl'&&!e.closed)).filter(e=>!ov.closed[e.id]).concat(ov.added.filter(x=>x.kind===kind&&(!gas||x.c.role===l.gasRole)).map(x=>x.c)).sort((a,b)=>a.at-b.at);
  const rem=c=>(gas?gasRemOf(c):o2RemOf(c))-(pend[c.id]||0);let need=gas?l.gasViss:l.o2use;const al=[];
  for(let g=0;g<6&&need>1e-9;g++){
    const L=live(),c=L[0];
    if(!c){al.push({cyl:null,viss:need});need=0;break}
    const r=rem(c);
    if(r>=need-1e-9){al.push({cyl:c.id,viss:need});pend[c.id]=(pend[c.id]||0)+need;need=0;break}
    const use=Math.max(r,0),nx=L.length>1,gs=(gas?groundGas():groundO2())-ov.added.filter(x=>x.kind===kind).length;
    const q=(gas?GL[c.role]:'Oxygen အိုးကြီး')+' ကျန် '+F(use)+un+'ပဲ ရှိတော့တယ်၊ ဒီရောင်းချမှုက '+F(need)+un+' လိုတယ်။\n\nOK = အိုးလဲပြီး ကျန် '+F(need-use)+un+' ကို '+(nx?'ဆက်သုံးမယ့်အိုး':'အိုးအသစ်')+'ကနေ နှုတ်မယ်\nCancel = အိုးမလဲဘဲ ဒီအိုးကနေပဲ နှုတ်မယ် (အနုတ်ဖြစ်မယ်)'+(!nx&&gs<=0?'\n(သတိ: Ground Stock မှာ အပြည့်အိုး မကျန်တော့ပါ)':'');
    if(!confirm(q)){al.push({cyl:c.id,viss:need});pend[c.id]=(pend[c.id]||0)+need;need=0;break}
    if(use>0){al.push({cyl:c.id,viss:use});pend[c.id]=(pend[c.id]||0)+use;need-=use}
    const st=gas?'gasEv':'stk',now=Date.now()+g;ov.closed[c.id]=true;
    const gain=r<0?Math.abs(r):0;
    ov.ops.push({k:'put',st,obj:{...c,closed:true,closedAt:now,leftover:0,gain:Math.round(gain*1000)/1000}});
    if(!nx){
      const ag=c.agent||'TT Gas';
      const cap=gas?(AGENTS[ag]?AGENTS[ag].viss:cfg.usable):1;
      const nc=gas?{id:uuid(),at:now,type:'cyl',role:c.role,agent:ag,cap,cost:null,closed:false,adj:0,gain:0,log:[]}:{id:uuid(),at:now,type:'ocyl',qty:0,cap:1,closed:false,adj:0,log:[]};
      ov.ops.push({k:'add',st,obj:nc});ov.added.push({kind,c:nc})
    }
  }
  if(need>1e-9)al.push({cyl:null,viss:need});return al
}

async function askSwap(c,kind){
  const gas=kind==='gas',rem=gas?gasRemOf(c):o2RemOf(c),R=x=>Math.round(x*100)/100,lab=gas?GL[c.role]:'Oxygen အိုးကြီး';
  const cansUsed=gas?Math.round((c.cap+(c.adj||0)-rem)*cfg.cans):0;
  let warn='';
  if(gas&&c.role==='can'&&(cansUsed<cfg.canMin||cansUsed>cfg.canMax)){
    warn='\n⚠ သတိ: ဒီဗူးအိုးက စုစုပေါင်း '+cansUsed+' ဗူး ထွက်ထားပါတယ် (သတ်မှတ်ချက် '+cfg.canMin+' ~ '+cfg.canMax+' ဗူး ဘောင်ပြင်ပဖြစ်နေပါတယ်)။';
  }
  const txt=gas?R(rem)+' ပိဿာ (ထွက်ရှိ ≈ '+cansUsed+' ဗူး)':Math.round(rem*1000)/10+' %';
  const same=(gas?gasEv.filter(e=>e.type==='cyl'&&!e.closed&&e.role===c.role):stk.filter(e=>e.type==='ocyl'&&!e.closed)).filter(e=>e.id!==c.id).length,gs=gas?groundGas():groundO2();
  const gainNote=rem<0?'\n(ပိုထွက်ပမာဏ '+R(Math.abs(rem))+(gas?' ပိဿာ':' %')+' ကို Gain အဖြစ် မှတ်ပြီး 0 ပြန်ညှိပေးပါမယ်)':'';
  const q=lab+(rem<=0?' ကုန်သွားပါပြီ':' ကျန်တော့တယ်: '+txt)+'။'+warn+gainNote+'\n'+(same?'ဆက်သုံးမယ့်အိုး ရှိပြီးသား၊ ဒီအိုးကို ပိတ်မလား?':'အိုးသစ်လဲမလား? (ဒီအိုးကို ပိတ်ပြီး Ground Stock ထဲက အိုးသစ် ဖွင့်မယ်)')+(!same&&gs<=0?'\n(သတိ: Ground Stock မှာ အပြည့်အိုး မကျန်တော့ပါ)':'');
  if(!confirm(q))return false;
  try{
    const now=Date.now(),st=gas?'gasEv':'stk';
    const ag=c.agent||'TT Gas';
    const cap=gas?(AGENTS[ag]?AGENTS[ag].viss:cfg.usable):1;
    const gain=rem<0?Math.round(Math.abs(rem)*1000)/1000:0;
    const leftover=rem>0?Math.round(rem*1000)/1000:0;
    await run(st,'readwrite',t=>{
      const o=t.objectStore(st);
      o.put({...c,closed:true,closedAt:now,leftover,gain,cansOut:cansUsed});
      if(!same)o.add(gas?{id:uuid(),at:now,type:'cyl',role:c.role,agent:ag,cap,cost:null,closed:false,adj:0,gain:0,log:[]}:{id:uuid(),at:now,type:'ocyl',qty:0,cap:1,closed:false,adj:0,log:[]})
    });
    await reload();return true
  }catch(e){alert('မအောင်မြင်ပါ: '+(e&&e.message||e));return false}
}

function lowList(){const L=[];['can','viss'].forEach(r=>{const l=gasEv.filter(e=>e.type==='cyl'&&!e.closed&&e.role===r).sort((a,b)=>a.at-b.at)[0];if(l){const rem=gasRemOf(l);if(rem<=cfg.low)L.push({c:l,kind:'gas',rem})}});const o=stk.filter(e=>e.type==='ocyl'&&!e.closed).sort((a,b)=>a.at-b.at)[0];if(o){const rem=o2RemOf(o);if(rem*100<=cfg.lowO2)L.push({c:o,kind:'o2',rem})}return L}
function lowBanner(){return lowList().map(x=>h('div',{class:'msg e',style:'display:flex;justify-content:space-between;align-items:center;gap:8px'},h('span',{},(x.kind==='gas'?GL[x.c.role]:'Oxygen အိုးကြီး')+(x.rem<=0?' ကုန်သွားပါပြီ':' ကျန်နည်းပြီ ('+(x.kind==='gas'?Math.round(x.rem*100)/100+' ပိဿာ':Math.round(x.rem*1000)/10+' %')+')')),h('button',{style:'padding:6px 10px',onclick:async()=>{if(await askSwap(x.c,x.kind))viewSale()}},'အိုးလဲမည်')))}
